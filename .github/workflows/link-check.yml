name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # External links in source content
      - name: Lychee — external links in posts
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 30d
            --exclude "^(https?://)?(localhost|127\\.0\\.0\\.1|www\\.example\\.com)"
            --exclude "an3.bitdoze.com"
            --exclude "an.bitdoze.com"
            --exclude-private
            --exclude-mail
            "src/content/posts/**/*.md"
            "src/content/posts/**/*.mdx"
          fail: true

      # Internal links: scan the built site so every emitted href is checked
      # against a real page (catches stale slugs, /category/ vs /categories/, etc.)
      - name: Lychee — internal links in built HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 30d
            --offline
            --exclude "^(https?://)?(localhost|127\\.0\\.0\\.1|www\\.example\\.com)"
            --exclude "an3.bitdoze.com"
            --exclude "an.bitdoze.com"
            --exclude-private
            --exclude-mail
            "dist/**/*.html"
          fail: true
