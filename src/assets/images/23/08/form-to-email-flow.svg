<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="visitorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="astroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="inboxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
    How an <tspan fill="#4F46E5">Astro contact form</tspan> works with no backend
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B" font-weight="400">The form POSTs straight to a form-to-email API — your site stays static</text>

  <!-- ==================== STEP 1: Visitor ==================== -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="220" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="220" height="44" rx="16" fill="url(#visitorGrad)"/>
    <rect y="22" width="220" height="22" fill="url(#visitorGrad)"/>
    <text x="110" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1. Visitor</text>
    <circle cx="110" cy="100" r="28" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <circle cx="110" cy="90" r="10" fill="#0891B2"/>
    <path d="M 92 118 Q 110 100 128 118" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Fills name, email,</text>
    <text x="110" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">message and hits Send</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="292" y1="210" x2="352" y2="210"/>
    <polygon points="352,200 372,210 352,220" fill="#64748B" stroke="none"/>
  </g>
  <text x="332" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">HTML POST</text>

  <!-- ==================== STEP 2: Static Astro page ==================== -->
  <g transform="translate(385, 120)" filter="url(#shadow)">
    <rect width="220" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="220" height="44" rx="16" fill="url(#astroGrad)"/>
    <rect y="22" width="220" height="22" fill="url(#astroGrad)"/>
    <text x="110" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2. Static Astro page</text>
    <rect x="55" y="70" width="110" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <line x1="70" y1="90" x2="150" y2="90" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="105" x2="150" y2="105" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="120" x2="125" y2="120" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">HTML form — no server</text>
    <text x="110" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">code runs here</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="617" y1="210" x2="677" y2="210"/>
    <polygon points="677,200 697,210 677,220" fill="#64748B" stroke="none"/>
  </g>
  <text x="657" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">forwarded</text>

  <!-- ==================== STEP 3: Form-to-email API ==================== -->
  <g transform="translate(710, 120)" filter="url(#shadow)">
    <rect width="220" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="220" height="44" rx="16" fill="url(#apiGrad)"/>
    <rect y="22" width="220" height="22" fill="url(#apiGrad)"/>
    <text x="110" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3. Form-to-email API</text>
    <rect x="60" y="72" width="100" height="58" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="110" y="97" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7C3AED">Web3Forms</text>
    <text x="110" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7C3AED">Formsubmit · OpnForm</text>
    <text x="110" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Validates, filters spam,</text>
    <text x="110" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">forwards the submission</text>
  </g>

  <!-- Arrow 3 -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="942" y1="210" x2="1002" y2="210"/>
    <polygon points="1002,200 1022,210 1002,220" fill="#64748B" stroke="none"/>
  </g>
  <text x="982" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">email</text>

  <!-- ==================== STEP 4: Inbox ==================== -->
  <g transform="translate(1035, 120)" filter="url(#shadow)">
    <rect width="110" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="110" height="44" rx="16" fill="url(#inboxGrad)"/>
    <rect y="22" width="110" height="22" fill="url(#inboxGrad)"/>
    <text x="55" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4. Inbox</text>
    <rect x="25" y="72" width="60" height="44" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <polyline points="25,78 55,100 85,78" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">You get</text>
    <text x="55" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">the email</text>
    <text x="55" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">notification</text>
  </g>

  <!-- Footer note -->
  <rect x="300" y="340" width="600" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="367" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">
    No backend, no serverless function, no database on your side — the API is the backend.
  </text>
</svg>
