<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="url(#bg)"/>

  <text x="500" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Carrd lock-in and exit paths</text>
  <text x="500" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Your domain stays in your account. Source export is the paid exit hatch.</text>

  <!-- Left: your domain -->
  <rect x="50" y="175" width="230" height="120" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="165" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Your domain</text>
  <text x="165" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">(your DNS registrar)</text>
  <text x="165" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">You keep ownership</text>

  <!-- Arrow: CNAME -->
  <line x1="285" y1="235" x2="385" y2="235" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="335" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">CNAME</text>

  <!-- Center: Carrd hosting -->
  <rect x="395" y="175" width="220" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="505" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#312E81">Carrd hosting</text>
  <text x="505" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4338CA">(they run the platform)</text>
  <text x="505" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6366F1">Their uptime is your uptime</text>

  <!-- Arrow: exit A (Pro Plus export) -->
  <line x1="620" y1="210" x2="735" y2="135" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="700" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#047857">exit A</text>

  <!-- Top-right: Download Sites -->
  <rect x="745" y="75" width="220" height="130" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="855" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857">PRO PLUS ONLY</text>
  <text x="855" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#065F46">Download Sites</text>
  <text x="855" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Unminified HTML/CSS/JS</text>
  <text x="855" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">+ images (no server code)</text>

  <!-- Arrow: exit B (repoint DNS) -->
  <line x1="620" y1="260" x2="735" y2="335" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <text x="700" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">exit B</text>

  <!-- Bottom-right: repoint DNS -->
  <rect x="745" y="275" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="855" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">ANY PLAN</text>
  <text x="855" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Repoint DNS + rebuild</text>
  <text x="855" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">One page is a short job</text>
  <text x="855" y="384" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Domain moves with you</text>

  <text x="500" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Free, Lite, and Standard have no export button. Redirects keep inbound links alive when you migrate into Carrd (Pro Plus).</text>
</svg>
