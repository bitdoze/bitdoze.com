<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="url(#bg)"/>

  <text x="550" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Screenshot share paths</text>
  <text x="550" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Copy and save stay on your Mac. Only upload (Cmd+E) leaves it — to public Shottr Cloud or to a bucket you control.</text>

  <!-- Capture -->
  <rect x="40" y="215" width="180" height="110" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="130" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#065F46">Capture</text>
  <text x="130" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Full screen, area,</text>
  <text x="130" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">window, scrolling</text>

  <!-- Arrow: capture to editor -->
  <line x1="225" y1="270" x2="278" y2="270" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Editor -->
  <rect x="285" y="215" width="180" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="375" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#312E81">Shottr editor</text>
  <text x="375" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4338CA">Annotate, measure,</text>
  <text x="375" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4338CA">OCR, crop</text>

  <!-- Editor to Copy -->
  <line x1="470" y1="245" x2="528" y2="155" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <!-- Editor to Save -->
  <line x1="470" y1="270" x2="528" y2="270" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <!-- Editor to Upload -->
  <line x1="470" y1="295" x2="528" y2="415" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Copy -->
  <rect x="535" y="110" width="185" height="88" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="627" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">Copy (Cmd+C)</text>
  <text x="627" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Goes to the clipboard</text>

  <!-- Save -->
  <rect x="535" y="226" width="185" height="88" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="627" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">Save (Cmd+S)</text>
  <text x="627" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Local file on disk</text>

  <!-- Upload -->
  <rect x="535" y="372" width="185" height="88" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="627" y="407" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Upload (Cmd+E)</text>
  <text x="627" y="432" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Needs an upload token</text>

  <!-- Dashed boundary -->
  <line x1="755" y1="95" x2="755" y2="575" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="755" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B">leaves your Mac</text>

  <!-- Upload to Shottr Cloud -->
  <line x1="722" y1="395" x2="808" y2="360" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <!-- Upload to S3 -->
  <line x1="722" y1="440" x2="808" y2="505" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

  <!-- Shottr Cloud -->
  <rect x="815" y="290" width="250" height="118" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="940" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309">PUBLIC INTERNET</text>
  <text x="940" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#78350F">Shottr Cloud</text>
  <text x="940" y="371" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7C2D12">shottr.cc/s/... short link</text>
  <text x="940" y="391" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9A3412">Moderated, no SLA</text>

  <!-- S3 -->
  <rect x="815" y="452" width="250" height="118" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="940" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4338CA">YOUR INFRASTRUCTURE</text>
  <text x="940" y="508" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#312E81">S3-compatible bucket</text>
  <text x="940" y="533" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4338CA">Your URL, your retention</text>
  <text x="940" y="553" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6366F1">AWS S3, MinIO, Tencent COS, Yandex</text>

  <!-- Legend -->
  <rect x="40" y="520" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="62" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Stays on your Mac</text>
  <rect x="200" y="520" width="14" height="14" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="222" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Public link anyone can open</text>
  <rect x="410" y="520" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="432" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Your bucket, your rules</text>
</svg>
