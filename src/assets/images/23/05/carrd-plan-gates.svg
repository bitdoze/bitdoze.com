<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arrowSlate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>

  <text x="500" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Carrd plan feature gates</text>
  <text x="500" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Custom domains start at Pro Standard ($19/yr), not Pro Lite. Pick the column that matches the job.</text>

  <!-- Column 1: Free -->
  <rect x="30" y="84" width="215" height="64" rx="12" fill="#64748B"/>
  <text x="137" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Free</text>
  <text x="137" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">$0 · 3 sites</text>
  <rect x="30" y="160" width="215" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="48" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">yoursite.carrd.co URL</text>
  <text x="48" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">"Made with Carrd" footer</text>
  <text x="48" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Core editor elements</text>
  <text x="48" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Dozens of templates</text>
  <text x="48" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Element cap on free tier</text>
  <rect x="44" y="340" width="187" height="74" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="137" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E">No custom domains</text>
  <text x="137" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309">Branding stays in place</text>

  <!-- Column 2: Pro Lite -->
  <rect x="275" y="84" width="215" height="64" rx="12" fill="#0EA5E9"/>
  <text x="382" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Pro Lite</text>
  <text x="382" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E0F2FE">$9/yr · 3 sites</text>
  <rect x="275" y="160" width="215" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="293" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Unbranded .crd.co URLs</text>
  <text x="293" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">No Carrd branding</text>
  <text x="293" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">16MB images / 64MB video</text>
  <text x="293" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Premium templates, QR codes</text>
  <text x="293" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Unlimited elements, favicons</text>
  <rect x="289" y="340" width="187" height="74" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="382" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E">No custom domains</text>
  <text x="382" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309">No forms, widgets, embeds</text>

  <!-- Column 3: Pro Standard -->
  <rect x="520" y="84" width="215" height="64" rx="12" fill="#4F46E5"/>
  <text x="627" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Pro Standard</text>
  <text x="627" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E0E7FF">$19/yr · 10 sites</text>
  <rect x="520" y="160" width="215" height="270" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="538" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Custom domains + free SSL</text>
  <text x="538" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Forms: 20+ email services</text>
  <text x="538" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Widgets: Stripe, PayPal, Gumroad</text>
  <text x="538" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Code embeds with script tags</text>
  <text x="538" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Analytics: GA, Plausible, Matomo</text>
  <rect x="534" y="340" width="187" height="74" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="627" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46">Custom domains start here</text>
  <text x="627" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">The default plan</text>

  <!-- Column 4: Pro Plus -->
  <rect x="765" y="84" width="205" height="64" rx="12" fill="#059669"/>
  <text x="867" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Pro Plus</text>
  <text x="867" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5">$49/yr · 25 sites</text>
  <rect x="765" y="160" width="205" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="783" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Everything in Standard</text>
  <text x="783" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Advanced Forms + Stripe Checkout</text>
  <text x="783" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Download Sites source export</text>
  <text x="783" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Redirects, password protection</text>
  <text x="783" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">robots.txt / ads.txt, canonical</text>
  <rect x="779" y="340" width="177" height="74" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="867" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46">Source export + webhooks</text>
  <text x="867" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">Developer exit path</text>

  <!-- Gate callout arrow -->
  <line x1="382" y1="300" x2="382" y2="336" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <text x="500" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Need more sites? Tiered upgrades run $14 to $599/yr, up to 1,000 sites per account.</text>
  <text x="500" y="508" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">7-day Pro trial, no card required. Build on Free, run the trial when you publish.</text>
</svg>
