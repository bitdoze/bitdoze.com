<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="820" height="540" fill="#F8FAFC"/>
  <text x="410" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">One COPY instruction = one image layer</text>
  <text x="410" y="64" text-anchor="middle" font-size="13" fill="#64748B">Group files that change together, or the cache breaks for the wrong reasons</text>

  <!-- ============ LEFT PANEL: separate COPYs ============ -->
  <rect x="30" y="88" width="365" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="212" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">3 separate COPY instructions</text>

  <rect x="55" y="138" width="315" height="28" rx="4" fill="#0F172A"/>
  <text x="68" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7DD3FC">COPY file1.txt /app/</text>
  <rect x="55" y="172" width="315" height="28" rx="4" fill="#0F172A"/>
  <text x="68" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7DD3FC">COPY file2.txt /app/</text>
  <rect x="55" y="206" width="315" height="28" rx="4" fill="#0F172A"/>
  <text x="68" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7DD3FC">COPY file3.txt /app/</text>

  <!-- layer stack -->
  <rect x="90" y="268" width="245" height="46" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text x="212" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">Layer 1 - file1.txt</text>
  <text x="212" y="306" text-anchor="middle" font-size="11" fill="#C2410C">rebuilt</text>

  <rect x="90" y="322" width="245" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="212" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Layer 2 - file2.txt</text>
  <text x="212" y="360" text-anchor="middle" font-size="11" fill="#15803D">CACHED</text>

  <rect x="90" y="376" width="245" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="212" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Layer 3 - file3.txt</text>
  <text x="212" y="414" text-anchor="middle" font-size="11" fill="#15803D">CACHED</text>

  <text x="212" y="452" text-anchor="middle" font-size="12" fill="#475569">Change file1.txt -&gt; only Layer 1 rebuilds.</text>
  <text x="212" y="470" text-anchor="middle" font-size="12" fill="#475569">Layers 2 and 3 stay cached.</text>

  <!-- ============ RIGHT PANEL: grouped COPY ============ -->
  <rect x="425" y="88" width="365" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="507" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">1 grouped COPY instruction</text>

  <rect x="450" y="138" width="315" height="28" rx="4" fill="#0F172A"/>
  <text x="460" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">COPY file1.txt file2.txt file3.txt /app/</text>

  <!-- one fat layer -->
  <rect x="485" y="268" width="245" height="100" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text x="607" y="308" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">1 layer - file1 + file2 + file3</text>
  <text x="607" y="328" text-anchor="middle" font-size="11" fill="#C2410C">whole layer rebuilt</text>

  <text x="607" y="452" text-anchor="middle" font-size="12" fill="#475569">Change any one file -&gt; the entire layer</text>
  <text x="607" y="470" text-anchor="middle" font-size="12" fill="#475569">invalidates. Group only what changes together.</text>

  <!-- legend -->
  <rect x="250" y="508" width="14" height="14" rx="3" fill="#FED7AA" stroke="#EA580C"/>
  <text x="272" y="520" font-size="12" fill="#475569">cache invalidated</text>
  <rect x="400" y="508" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="422" y="520" font-size="12" fill="#475569">cache hit</text>
</svg>
