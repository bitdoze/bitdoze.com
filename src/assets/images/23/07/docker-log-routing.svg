<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="820" height="560" fill="#F8FAFC"/>
  <text x="410" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">How Docker routes container logs</text>
  <text x="410" y="66" text-anchor="middle" font-size="13" fill="#64748B">stdout and stderr go through the logging driver to one file per container</text>

  <!-- Container panel -->
  <rect x="30" y="120" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="130" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Container</text>
  <rect x="55" y="162" width="150" height="30" rx="4" fill="#0F172A"/>
  <text x="130" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">app process</text>
  <rect x="55" y="206" width="70" height="26" rx="4" fill="#DBEAFE"/>
  <text x="90" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">stdout</text>
  <rect x="135" y="206" width="70" height="26" rx="4" fill="#DBEAFE"/>
  <text x="170" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">stderr</text>

  <!-- stream arrows -->
  <text x="271" y="178" text-anchor="middle" font-size="10" fill="#64748B">stdout + stderr</text>
  <path d="M234 195 h70 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94A3B8" stroke-width="2"/>

  <!-- Logging driver panel -->
  <rect x="310" y="120" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="410" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Logging driver</text>
  <rect x="330" y="158" width="160" height="26" rx="4" fill="#0F172A"/>
  <text x="342" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7DD3FC">json-file</text>
  <rect x="427" y="163" width="56" height="16" rx="8" fill="#2563EB"/>
  <text x="455" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DEFAULT</text>
  <rect x="330" y="192" width="160" height="26" rx="4" fill="#0F172A"/>
  <text x="342" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7DD3FC">local</text>
  <text x="410" y="244" text-anchor="middle" font-size="10" fill="#64748B">remote: syslog, fluentd, splunk</text>

  <!-- driver to disk arrow -->
  <text x="550" y="180" text-anchor="middle" font-size="10" fill="#64748B">writes</text>
  <path d="M512 195 h74 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94A3B8" stroke-width="2"/>

  <!-- On disk panel -->
  <rect x="590" y="100" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="690" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">On disk</text>
  <text x="690" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#64748B">/var/lib/docker/containers/&lt;id&gt;/</text>
  <rect x="610" y="158" width="160" height="26" rx="4" fill="#0F172A"/>
  <text x="690" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">&lt;id&gt;-json.log</text>
  <text x="690" y="204" text-anchor="middle" font-size="10.5" fill="#475569">one JSON object per line</text>
  <text x="690" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94A3B8">{log, stream, time}</text>
  <rect x="615" y="236" width="150" height="22" rx="11" fill="#FEE2E2"/>
  <text x="690" y="251" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">no rotation by default</text>

  <!-- Dual logging panel -->
  <rect x="30" y="320" width="760" height="215" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="410" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Remote drivers keep a local copy - dual logging</text>
  <text x="410" y="370" text-anchor="middle" font-size="11.5" fill="#64748B">syslog, fluentd, splunk and friends forward logs AND cache them on disk</text>

  <!-- remote driver box -->
  <rect x="60" y="400" width="200" height="70" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="160" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">remote driver</text>
  <text x="160" y="447" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B">syslog, fluentd, splunk</text>

  <!-- fan-out arrows -->
  <text x="330" y="408" font-size="10" fill="#64748B">forwards</text>
  <path d="M262 418 C 400 408, 460 412, 550 416" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M541 411 l9 5 l-9 5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="330" y="478" font-size="10" fill="#64748B">also caches</text>
  <path d="M262 448 C 400 470, 460 484, 550 490" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M541 485 l9 5 l-9 5" fill="none" stroke="#94A3B8" stroke-width="2"/>

  <!-- remote collector box -->
  <rect x="560" y="390" width="200" height="55" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">remote collector</text>
  <text x="660" y="430" text-anchor="middle" font-size="10" fill="#3B82F6">syslog server, aggregator</text>

  <!-- local cache box -->
  <rect x="560" y="465" width="200" height="55" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="660" y="488" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">local cache on disk</text>
  <text x="660" y="505" text-anchor="middle" font-size="10" fill="#15803D">local driver - 5 files x 20 MB</text>

  <!-- docker logs reads cache -->
  <text x="375" y="465" text-anchor="middle" font-size="10.5" fill="#475569">docker logs reads the cache</text>
  <rect x="300" y="478" width="150" height="28" rx="4" fill="#0F172A"/>
  <text x="375" y="496" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">docker logs my-app</text>
  <path d="M556 495 h-100 m6 -5 l-6 5 l6 5" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="320" y="524" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94A3B8">opt out: --log-opt cache-disabled=true</text>
</svg>
