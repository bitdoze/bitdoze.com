<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="820" height="500" fill="#F8FAFC"/>
  <text x="410" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">COPY --parents: how source paths map to the destination</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748B">The ./ marker cuts which parent directories are preserved (rsync --relative style)</text>

  <!-- Source tree -->
  <rect x="30" y="95" width="260" height="290" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="160" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Build context (source)</text>
  <text x="55" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0F172A">src/</text>
  <text x="75" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">utils/</text>
  <text x="95" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4F46E5">a.ts</text>
  <text x="75" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">x/</text>
  <text x="95" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">y/</text>
  <text x="115" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4F46E5">b.ts</text>
  <text x="55" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748B">src/utils/a.ts</text>
  <text x="55" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748B">src/x/y/b.ts</text>

  <!-- Arrow 1 -->
  <path d="M 300 190 L 365 190" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow 2 -->
  <path d="M 300 330 L 365 330" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Case 1 -->
  <rect x="375" y="95" width="415" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="395" y="112" width="375" height="28" rx="4" fill="#0F172A"/>
  <text x="407" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">COPY --parents src/**/*.ts /parents/</text>
  <text x="395" y="168" font-size="12.5" font-weight="700" fill="#334155">No ./ marker - full relative path kept</text>
  <text x="395" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#166534">/parents/src/utils/a.ts</text>
  <text x="395" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#166534">/parents/src/x/y/b.ts</text>
  <text x="395" y="256" font-size="11.5" fill="#64748B">Paths are preserved - no basename collisions.</text>

  <!-- Case 2 -->
  <rect x="375" y="300" width="415" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="395" y="317" width="375" height="28" rx="4" fill="#0F172A"/>
  <text x="407" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">COPY --parents ./src/./x/y/*.ts /parents/</text>
  <text x="395" y="373" font-size="12.5" font-weight="700" fill="#334155">./ marker - only parents after it are kept</text>
  <text x="395" y="403" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#166534">/parents/y/b.ts</text>
  <text x="395" y="437" font-size="11.5" fill="#64748B">src/ and x/ are dropped from the destination path.</text>

  <text x="410" y="485" text-anchor="middle" font-size="11.5" fill="#64748B">Needs Dockerfile syntax &gt;= 1.20 and the # syntax=docker/dockerfile:1 directive.</text>
</svg>
