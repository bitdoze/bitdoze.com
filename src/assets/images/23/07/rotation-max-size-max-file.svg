<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="820" height="400" fill="#F8FAFC"/>
  <text x="410" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">json-file rotation: max-size x max-file</text>
  <text x="410" y="66" text-anchor="middle" font-size="13" fill="#64748B">Every rotation shifts files one slot right; anything past max-file is deleted</text>

  <!-- options chip -->
  <rect x="270" y="86" width="280" height="32" rx="6" fill="#0F172A"/>
  <text x="410" y="107" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7DD3FC">max-size=10m   max-file=3</text>

  <!-- rotation arrows -->
  <path d="M173 202 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M333 202 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M493 202 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M652 202 h11 m-5 -5 l5 5 l-5 5" fill="none" stroke="#EF4444" stroke-width="2"/>

  <!-- ACTIVE card -->
  <rect x="30" y="140" width="140" height="125" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#1E3A8A">&lt;id&gt;-json.log</text>
  <text x="100" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">ACTIVE - writing</text>
  <rect x="48" y="202" width="104" height="8" rx="4" fill="#BFDBFE"/>
  <rect x="48" y="202" width="88" height="8" rx="4" fill="#2563EB"/>
  <text x="100" y="230" text-anchor="middle" font-size="10.5" fill="#1E40AF">grows to 10m</text>
  <text x="100" y="248" text-anchor="middle" font-size="10" fill="#3B82F6">then rotates out</text>

  <!-- rotated .1 -->
  <rect x="190" y="140" width="140" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="260" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#334155">&lt;id&gt;-json.log.1</text>
  <text x="260" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">ROTATED</text>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#475569">up to 10m</text>
  <text x="260" y="248" text-anchor="middle" font-size="10" fill="#94A3B8">newest rotated</text>

  <!-- rotated .2 -->
  <rect x="350" y="140" width="140" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="420" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#334155">&lt;id&gt;-json.log.2</text>
  <text x="420" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">ROTATED</text>
  <text x="420" y="230" text-anchor="middle" font-size="10.5" fill="#475569">up to 10m</text>
  <text x="420" y="248" text-anchor="middle" font-size="10" fill="#94A3B8">middle</text>

  <!-- rotated .3 -->
  <rect x="510" y="140" width="140" height="125" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="580" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#334155">&lt;id&gt;-json.log.3</text>
  <text x="580" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">ROTATED</text>
  <text x="580" y="230" text-anchor="middle" font-size="10.5" fill="#475569">up to 10m</text>
  <text x="580" y="248" text-anchor="middle" font-size="10" fill="#94A3B8">oldest kept</text>

  <!-- deleted exit -->
  <rect x="665" y="140" width="140" height="125" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="735" cy="180" r="15" fill="none" stroke="#DC2626" stroke-width="2"/>
  <path d="M725 170 l20 20 M745 170 l-20 20" stroke="#DC2626" stroke-width="2"/>
  <text x="735" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">DELETED</text>
  <text x="735" y="240" text-anchor="middle" font-size="10" fill="#B91C1C">oldest file past</text>
  <text x="735" y="254" text-anchor="middle" font-size="10" fill="#B91C1C">max-file</text>

  <!-- annotation -->
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#475569">on each rotate: active -&gt; .1, .1 -&gt; .2, .2 -&gt; .3, old .3 -&gt; gone</text>
  <rect x="275" y="316" width="270" height="30" rx="15" fill="#DBEAFE"/>
  <text x="410" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">bounded footprint: ~30 MB kept</text>

  <!-- legend -->
  <rect x="230" y="362" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="252" y="374" font-size="11.5" fill="#475569">active (writing)</text>
  <rect x="370" y="362" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="392" y="374" font-size="11.5" fill="#475569">rotated (kept)</text>
  <rect x="510" y="362" width="14" height="14" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-dasharray="3 2"/>
  <text x="532" y="374" font-size="11.5" fill="#475569">deleted</text>
</svg>
