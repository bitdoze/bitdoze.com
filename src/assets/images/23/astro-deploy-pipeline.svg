<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Astro deploy pipeline: git push triggers a deploy script that runs git pull, npm ci, and npm run build into dist, which CloudPanel Nginx serves over HTTPS through Cloudflare to the visitor">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Deploy pipeline: git push to a live Astro static site</text>
  <text x="480" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Runtime is only Nginx serving dist/ — no Node.js process at runtime. Node is needed at build time.</text>

  <!-- Stage 1: git push -->
  <rect x="15" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="15" y="120" width="140" height="40" rx="10" fill="#334155"/>
  <rect x="15" y="150" width="140" height="10" fill="#334155"/>
  <text x="85" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">git push</text>
  <text x="85" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">You commit</text>
  <text x="85" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">to the GitHub</text>
  <text x="85" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">repo</text>

  <!-- Stage 2: trigger -->
  <rect x="175" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="175" y="120" width="140" height="40" rx="10" fill="#334155"/>
  <rect x="175" y="150" width="140" height="10" fill="#334155"/>
  <text x="245" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Trigger</text>
  <text x="245" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">CloudPanel cron</text>
  <text x="245" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">GitHub webhook</text>
  <text x="245" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">or DPLOY</text>

  <!-- Stage 3: deploy.sh -->
  <rect x="335" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="335" y="120" width="140" height="40" rx="10" fill="#2563eb"/>
  <rect x="335" y="150" width="140" height="10" fill="#2563eb"/>
  <text x="405" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">deploy.sh</text>
  <text x="405" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">git pull</text>
  <text x="405" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">npm ci</text>
  <text x="405" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">npm run build</text>
  <text x="405" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">backup dist/ first</text>

  <!-- Stage 4: dist -->
  <rect x="495" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="495" y="120" width="140" height="40" rx="10" fill="#334155"/>
  <rect x="495" y="150" width="140" height="10" fill="#334155"/>
  <text x="565" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">dist/</text>
  <text x="565" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Static output</text>
  <text x="565" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Root directory</text>
  <text x="565" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">in CloudPanel</text>

  <!-- Stage 5: Nginx -->
  <rect x="655" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="655" y="120" width="140" height="40" rx="10" fill="#16a34a"/>
  <rect x="655" y="150" width="140" height="10" fill="#16a34a"/>
  <text x="725" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Nginx :443</text>
  <text x="725" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">CloudPanel</text>
  <text x="725" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Let's Encrypt</text>
  <text x="725" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">TLS</text>

  <!-- Stage 6: visitor -->
  <rect x="815" y="120" width="130" height="180" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="815" y="120" width="130" height="40" rx="10" fill="#16a34a"/>
  <rect x="815" y="150" width="130" height="10" fill="#16a34a"/>
  <text x="880" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Visitor</text>
  <text x="880" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Cloudflare</text>
  <text x="880" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">edge cache</text>
  <text x="880" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">HTTPS</text>

  <!-- arrows -->
  <line x1="155" y1="210" x2="173" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="315" y1="210" x2="333" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="475" y1="210" x2="493" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="635" y1="210" x2="653" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="795" y1="210" x2="813" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- footer note -->
  <text x="480" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Failed build? The script keeps dist.last-known-good and swaps it back — see the rollback section.</text>
  <text x="480" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Cached hard: /_astro/ hashed assets. Cached soft: HTML, so new deploys show up.</text>
</svg>
