<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Rollback swap diagram: before a rebuild move dist to dist.last-known-good, run the build which empties dist first and can fail, then on success drop the backup or on failure move the backup back so the site keeps serving">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="430" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Rollback swap: never leave dist/ empty after a failed build</text>
  <text x="480" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">npm run build clears dist/ before writing new output. A failure mid-build can leave the site broken.</text>

  <!-- Panel 1: backup -->
  <rect x="30" y="100" width="270" height="220" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="100" width="270" height="42" rx="10" fill="#334155"/>
  <rect x="30" y="132" width="270" height="10" fill="#334155"/>
  <text x="165" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1. Before the rebuild</text>
  <rect x="55" y="170" width="220" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">mv dist dist.last-known-good</text>
  <text x="165" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#166534">previous good build kept aside</text>
  <text x="165" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">The previous good build</text>
  <text x="165" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">is one mv away from</text>
  <text x="165" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">serving again.</text>

  <!-- Panel 2: build -->
  <rect x="345" y="100" width="270" height="220" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="345" y="100" width="270" height="42" rx="10" fill="#2563eb"/>
  <rect x="345" y="132" width="270" height="10" fill="#2563eb"/>
  <text x="480" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2. npm run build</text>
  <rect x="370" y="170" width="220" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#991b1b">dist/ is emptied first</text>
  <text x="480" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#991b1b">then the new output is written</text>
  <text x="480" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">If the build fails (markup error,</text>
  <text x="480" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">OOM kill, bad dependency), dist/</text>
  <text x="480" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">is left empty or half-written.</text>

  <!-- Panel 3: decide -->
  <rect x="660" y="100" width="270" height="220" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="660" y="100" width="270" height="42" rx="10" fill="#334155"/>
  <rect x="660" y="132" width="270" height="10" fill="#334155"/>
  <text x="795" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3. Decide</text>
  <rect x="685" y="160" width="220" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Success: keep dist/</text>
  <text x="795" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#166534">rm -rf dist.last-known-good</text>
  <rect x="685" y="228" width="220" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="795" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Failure: swap back</text>
  <text x="795" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#991b1b">mv dist.last-known-good dist</text>
  <text x="795" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Site keeps serving the previous</text>
  <text x="795" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">build. No downtime window.</text>

  <!-- arrows between panels -->
  <line x1="300" y1="210" x2="343" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowSlate)"/>
  <line x1="615" y1="210" x2="658" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrowSlate)"/>

  <!-- failure loop back -->
  <path d="M 795 330 L 795 375 L 165 375 L 165 330" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="480" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dc2626">Failure path: mv dist.last-known-good dist — the site is back on the previous build in seconds</text>
</svg>
