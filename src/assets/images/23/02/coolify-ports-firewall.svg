<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="fwTitle fwDesc">
  <title id="fwTitle">Coolify ports and firewall rules</title>
  <desc id="fwDesc">Network diagram: traffic from the internet passes through a provider firewall before reaching the VPS. Firewall rules: allow port 22 SSH restricted to your IP, allow ports 80 and 443 for HTTP, HTTPS and Let's Encrypt, allow port 8000 for the Coolify dashboard restricted to your IP, and verify whether ports 6001 and 6002 are still required for the realtime websocket and terminal. On the VPS, Traefik serves ports 80 and 443, the Coolify UI serves port 8000, and apps and databases stay on the internal Docker network.</desc>

  <defs>
    <linearGradient id="fwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="fwAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="fwArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <filter id="fwShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#fwBg)"/>
  <rect width="1200" height="8" fill="url(#fwAccent)"/>

  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">Coolify ports and firewall</text>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">Coolify does not manage your firewall. What you open is what gets exposed.</text>

  <!-- arrows -->
  <g stroke="#6366F1" stroke-width="3" fill="none" marker-end="url(#fwArrow)">
    <path d="M 232 380 H 302"/>
    <path d="M 772 380 H 842"/>
  </g>

  <!-- internet -->
  <g filter="url(#fwShadow)">
    <rect x="40" y="300" width="192" height="160" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  </g>
  <text x="136" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Internet</text>
  <text x="136" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Your users, your laptop,</text>
  <text x="136" y="424" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">git webhooks</text>

  <!-- firewall panel -->
  <g filter="url(#fwShadow)">
    <rect x="310" y="130" width="454" height="500" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  </g>
  <text x="537" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Provider firewall</text>

  <!-- rule rows -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 22 -->
    <rect x="336" y="196" width="402" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="356" y="224" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#92400E">22/tcp SSH</text>
    <text x="356" y="250" font-size="15" fill="#78350F">Restrict to your IP. Locking yourself out is on you.</text>

    <!-- 80/443 -->
    <rect x="336" y="284" width="402" height="72" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="356" y="312" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#166534">80 + 443/tcp HTTP(S)</text>
    <text x="356" y="338" font-size="15" fill="#14532D">Open. Apps, Let's Encrypt HTTP-01, Coolify FQDN.</text>

    <!-- 8000 -->
    <rect x="336" y="372" width="402" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="356" y="400" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#92400E">8000/tcp Coolify UI</text>
    <text x="356" y="426" font-size="15" fill="#78350F">Restrict to your IP, or close it once the FQDN works.</text>

    <!-- 6001/6002 -->
    <rect x="336" y="460" width="402" height="72" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="356" y="488" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#334155">6001 + 6002/tcp</text>
    <text x="356" y="514" font-size="15" fill="#475569">Realtime + terminal. Historically required: verify docs.</text>

    <text x="537" y="578" text-anchor="middle" font-size="15" fill="#64748B">Hetzner Cloud Firewall, DigitalOcean Firewalls, Vultr Firewalls, UFW: all free</text>
  </g>

  <!-- VPS -->
  <g filter="url(#fwShadow)">
    <rect x="850" y="180" width="310" height="420" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
  </g>
  <text x="1005" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">VPS</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="876" y="248" width="258" height="72" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="1005" y="276" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#4338CA">Coolify UI :8000</text>
    <text x="1005" y="302" text-anchor="middle" font-size="14" fill="#475569">Dashboard, API, webhooks</text>

    <rect x="876" y="340" width="258" height="72" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="1005" y="368" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#4338CA">Traefik :80 / :443</text>
    <text x="1005" y="394" text-anchor="middle" font-size="14" fill="#475569">Reverse proxy + TLS</text>

    <rect x="876" y="432" width="258" height="72" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="1005" y="460" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#0F766E">Apps and DBs</text>
    <text x="1005" y="486" text-anchor="middle" font-size="14" fill="#475569">Internal Docker network</text>

    <text x="1005" y="556" text-anchor="middle" font-size="15" fill="#64748B">Keep databases off the public</text>
    <text x="1005" y="578" text-anchor="middle" font-size="15" fill="#64748B">internet unless you really need it</text>
  </g>
</svg>
