<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="hwTitle hwDesc">
  <title id="hwTitle">How Coolify works</title>
  <desc id="hwDesc">Flow diagram of a Coolify deployment: a git push to GitHub, GitLab, Gitea, or Bitbucket triggers the Coolify control plane on port 8000, which runs a build pack (Nixpacks, Railpack, Dockerfile, or a prebuilt image), builds Docker containers for apps and databases, and exposes them through the Traefik reverse proxy with automatic Let's Encrypt certificates on ports 80 and 443.</desc>

  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="hwAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="hwArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <filter id="hwShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#hwBg)"/>
  <rect width="1200" height="8" fill="url(#hwAccent)"/>

  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">How Coolify works</text>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">Git push in, containers out: Coolify builds, Traefik routes, Let's Encrypt encrypts</text>

  <!-- arrows first so boxes sit on top -->
  <g stroke="#6366F1" stroke-width="3" fill="none" marker-end="url(#hwArrow)">
    <path d="M 388 235 H 432"/>
    <path d="M 768 235 H 812"/>
    <path d="M 980 322 V 372 H 220 V 412"/>
    <path d="M 388 500 H 432"/>
    <path d="M 768 500 H 812"/>
  </g>

  <!-- row 1 -->
  <g filter="url(#hwShadow)">
    <rect x="60" y="150" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="440" y="150" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="820" y="150" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  </g>

  <!-- row 2 -->
  <g filter="url(#hwShadow)">
    <rect x="60" y="415" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="440" y="415" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="820" y="415" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
  </g>

  <!-- badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="92" cy="182" r="17" fill="#4F46E5"/><text x="92" y="188">1</text>
    <circle cx="472" cy="182" r="17" fill="#4F46E5"/><text x="472" y="188">2</text>
    <circle cx="852" cy="182" r="17" fill="#4F46E5"/><text x="852" y="188">3</text>
    <circle cx="92" cy="447" r="17" fill="#0891B2"/><text x="92" y="453">4</text>
    <circle cx="472" cy="447" r="17" fill="#0891B2"/><text x="472" y="453">5</text>
    <circle cx="852" cy="447" r="17" fill="#0891B2"/><text x="852" y="453">6</text>
  </g>

  <!-- titles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">
    <text x="122" y="190">Git push</text>
    <text x="502" y="190">Coolify control plane</text>
    <text x="882" y="190">Build pack</text>
    <text x="122" y="455">Docker containers</text>
    <text x="502" y="455">Traefik + Let's Encrypt</text>
    <text x="882" y="455">Apps and databases</text>
  </g>

  <!-- detail -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">
    <text x="92" y="232">GitHub, GitLab, Gitea, Bitbucket</text>
    <text x="92" y="260">Webhook triggers the build</text>
    <text x="92" y="288">Push to the branch, deploy starts</text>

    <text x="472" y="232">Web UI on port 8000</text>
    <text x="472" y="260">Queues builds, runs deploys</text>
    <text x="472" y="288">Stores config under /data/coolify</text>

    <text x="852" y="232">Nixpacks, Railpack (beta)</text>
    <text x="852" y="260">Dockerfile, Compose, or image</text>
    <text x="852" y="288">Auto-detects the framework</text>

    <text x="92" y="497">Your app and database containers</text>
    <text x="92" y="525">Volumes persist data</text>
    <text x="92" y="553">Internal Docker network by default</text>

    <text x="472" y="497">Reverse proxy on ports 80 / 443</text>
    <text x="472" y="525">SSL certificates provisioned</text>
    <text x="472" y="553">and renewed automatically</text>

    <text x="852" y="497">Websites, APIs, workers</text>
    <text x="852" y="525">340+ one-click service templates</text>
    <text x="852" y="553">All on the same server</text>
  </g>

  <!-- footer note -->
  <text x="600" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748B">This is the mental model for everything that follows in the guide.</text>
</svg>
