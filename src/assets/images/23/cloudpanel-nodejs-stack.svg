<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="CloudPanel stack overview: VPS with Ubuntu or Debian, CloudPanel managing Nginx SSL and databases, and a Node.js app on port 1337 kept alive by PM2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">CloudPanel stack: where the panel stops and PM2 starts</text>

  <!-- VPS -->
  <rect x="36" y="80" width="236" height="326" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="36" y="80" width="236" height="44" rx="10" fill="#334155"/>
  <rect x="36" y="112" width="236" height="12" fill="#334155"/>
  <text x="154" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">VPS (a real VM)</text>
  <text x="154" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#334155">Ubuntu 26.04 / 24.04 / 22.04</text>
  <text x="154" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#334155">Debian 13 / 12</text>
  <text x="154" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#334155">x86 or ARM64</text>
  <text x="154" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b91c1c">No LXC / OpenVZ</text>
  <text x="154" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Min: 1 core, 2 GB RAM, 10 GB disk</text>
  <text x="154" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">4 GB if Strapi builds run here</text>
  <text x="154" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">root SSH + a domain DNS record</text>

  <!-- arrow 1 -->
  <line x1="280" y1="243" x2="344" y2="243" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="312" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">install.sh</text>

  <!-- CloudPanel -->
  <rect x="352" y="80" width="280" height="326" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="352" y="80" width="280" height="44" rx="10" fill="#2563eb"/>
  <rect x="352" y="112" width="280" height="12" fill="#2563eb"/>
  <text x="492" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CloudPanel v2.5.4</text>
  <text x="376" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Nginx 1.30 :443 (HTTP/3, SSL)</text>
  <text x="376" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">vhost templates + SSL/TLS UI</text>
  <text x="376" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">MariaDB 12.3 / MySQL 8.4</text>
  <text x="376" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Redis 8, Varnish Cache 7.7</text>
  <text x="376" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">PHP 7.1-8.5, Python 3.14</text>
  <text x="376" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Firewall, cron, Rclone backups</text>
  <text x="376" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2FA + Basic Auth on admin</text>
  <text x="492" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Panel owns Nginx, TLS, DNS wiring</text>

  <!-- arrow 2 -->
  <line x1="640" y1="243" x2="704" y2="243" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="672" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#2563eb">proxy_pass</text>
  <text x="672" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#2563eb">127.0.0.1:1337</text>

  <!-- Node app + PM2 -->
  <rect x="712" y="80" width="212" height="326" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="712" y="80" width="212" height="44" rx="10" fill="#16a34a"/>
  <rect x="712" y="112" width="212" height="12" fill="#16a34a"/>
  <text x="818" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Node.js app</text>
  <text x="818" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Strapi 5 on 127.0.0.1:1337</text>
  <text x="818" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Node 24 LTS (nvm-managed)</text>
  <line x1="732" y1="214" x2="904" y2="214" stroke="#bbf7d0" stroke-width="2"/>
  <text x="818" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">PM2 (site user)</text>
  <text x="818" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">restarts the app on crash</text>
  <text x="818" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">pm2 save</text>
  <text x="818" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">@reboot pm2 resurrect</text>
  <text x="818" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Process manager owns the port</text>

  <!-- dashed boundary -->
  <line x1="672" y1="70" x2="672" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="672" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">App port is the contract between the two</text>
</svg>
