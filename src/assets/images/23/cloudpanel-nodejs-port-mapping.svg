<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Request path and port mapping: browser to Nginx on 443 to the app on 127.0.0.1:1337, with 502 errors caused by app port mismatch and connection failures caused by DNS or firewall">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Request path and port mapping: what breaks where</text>

  <!-- Browser -->
  <rect x="330" y="70" width="300" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Browser</text>
  <text x="480" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">https://www.yourdomain.com</text>

  <!-- arrow down 1 -->
  <line x1="480" y1="140" x2="480" y2="196" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1d4ed8">DNS A record to the VPS IP, port 443 open</text>

  <!-- failure callout 1 -->
  <rect x="640" y="140" width="284" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="656" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">"Can't connect" / timeout</text>
  <text x="656" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">Wrong DNS record or firewall.</text>
  <text x="656" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">Not a port problem - Nginx never saw you.</text>
  <line x1="636" y1="176" x2="512" y2="176" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Nginx -->
  <rect x="300" y="210" width="360" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="300" y="210" width="360" height="38" rx="10" fill="#2563eb"/>
  <rect x="300" y="238" width="360" height="10" fill="#2563eb"/>
  <text x="480" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Nginx :443 (CloudPanel vhost + Let's Encrypt)</text>
  <text x="480" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">TLS terminates here, request is proxied to the app port</text>
  <text x="480" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Configured when you create the Node.js site</text>

  <!-- arrow down 2 -->
  <line x1="480" y1="306" x2="480" y2="366" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1d4ed8">proxy_pass http://127.0.0.1:1337</text>

  <!-- failure callout 2 -->
  <rect x="640" y="318" width="284" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="656" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">502 Bad Gateway</text>
  <text x="656" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">Nginx forwards to the App Port,</text>
  <text x="656" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">but the app is down or listens</text>
  <text x="656" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">somewhere else (e.g. 1337 vs 3000).</text>
  <line x1="636" y1="366" x2="512" y2="366" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowRed)"/>

  <!-- PM2 / Strapi -->
  <rect x="300" y="380" width="360" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="300" y="380" width="360" height="38" rx="10" fill="#16a34a"/>
  <rect x="300" y="408" width="360" height="10" fill="#16a34a"/>
  <text x="480" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">PM2 -> Strapi 5 listening on 127.0.0.1:1337</text>
  <text x="480" y="442" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">PORT and APP_PORT must match the CloudPanel App Port</text>
  <text x="480" y="466" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">pm2 status must show "online" for the site to answer</text>

  <!-- footer -->
  <text x="480" y="530" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Healthy check: curl -I https://www.yourdomain.com returns 200 or 302, not 502</text>
</svg>
