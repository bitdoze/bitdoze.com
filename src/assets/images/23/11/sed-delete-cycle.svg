<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="cycTitle cycDesc">
  <title id="cycTitle">The sed delete cycle</title>
  <desc id="cycDesc">Flow diagram: sed reads each line into pattern space, applies commands, and the d command skips output. Deleted lines never reach stdout, then the cycle restarts with the next line until end of file.</desc>

  <defs>
    <linearGradient id="cycBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="cycArw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="cycArwGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="url(#cycBg)"/>
  <circle cx="120" cy="50" r="160" fill="#6366F1" opacity="0.07"/>
  <circle cx="670" cy="370" r="170" fill="#06B6D4" opacity="0.07"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="40" font-size="24" font-weight="800" fill="#0F172A">The sed delete cycle</text>
    <text x="380" y="62" font-size="13" fill="#64748B">one line at a time, from input to output</text>
  </g>

  <!-- row 1: main flow -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="100" width="200" height="70" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="140" y="129" font-size="15" font-weight="700" fill="#4338CA">1 · Read next line</text>
    <text x="140" y="150" font-size="11.5" fill="#475569">from stdin or a file</text>

    <rect x="280" y="100" width="180" height="70" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="370" y="129" font-size="15" font-weight="700" fill="#0E7490">2 · Pattern space</text>
    <text x="370" y="150" font-size="11.5" fill="#475569">holds the current line</text>

    <rect x="500" y="100" width="220" height="70" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="610" y="129" font-size="15" font-weight="700" fill="#0F172A">3 · Apply commands</text>
    <text x="610" y="150" font-size="11.5" fill="#475569">address matches? run d</text>
  </g>

  <!-- arrows: read -> pattern -> commands; commands -> outcomes -->
  <g stroke="#6366F1" stroke-width="2" fill="none">
    <line x1="240" y1="135" x2="272" y2="135" marker-end="url(#cycArw)"/>
    <line x1="460" y1="135" x2="492" y2="135" marker-end="url(#cycArw)"/>
    <path d="M660 170 L660 222" marker-end="url(#cycArw)"/>
    <path d="M515 170 L515 196 L155 196 L155 222" marker-end="url(#cycArw)"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="674" y="200" font-size="12" font-weight="700" fill="#B91C1C">d ran</text>
    <text x="335" y="190" font-size="12" font-weight="700" fill="#047857">no d</text>
  </g>

  <!-- row 2: outcomes -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="490" y="230" width="230" height="70" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="605" y="259" font-size="15" font-weight="700" fill="#B91C1C">Line deleted</text>
    <text x="605" y="280" font-size="11.5" fill="#475569">no output, cycle restarts</text>

    <rect x="40" y="230" width="230" height="70" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="155" y="259" font-size="15" font-weight="700" fill="#047857">Line printed</text>
    <text x="155" y="280" font-size="11.5" fill="#475569">to stdout or the next pipe stage</text>
  </g>

  <!-- loop back to read -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="6 5">
    <path d="M605 300 L605 350 L140 350 L140 178" marker-end="url(#cycArwGray)"/>
    <path d="M155 300 L155 350"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="342" font-size="12" font-weight="700" fill="#64748B">next line · EOF ends the cycle</text>
    <text x="380" y="384" font-size="11.5" fill="#94A3B8">d never prints anything: it just empties the pattern space and jumps to the next line</text>
  </g>
</svg>
