<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="modTitle modDesc">
  <title id="modTitle">GNU sed case modifiers map</title>
  <desc id="modDesc">Table diagram showing what each GNU sed case modifier does to the sample strings hello world and HELLO WORLD: backslash L lowercases the whole replacement, backslash U uppercases it, backslash l lowercases only the next character, backslash u uppercases only the next character, and backslash E stops case conversion.</desc>

  <defs>
    <linearGradient id="modBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="480" fill="url(#modBg)"/>
  <circle cx="110" cy="60" r="150" fill="#6366F1" opacity="0.07"/>
  <circle cx="680" cy="430" r="160" fill="#06B6D4" opacity="0.07"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="40" font-size="24" font-weight="800" fill="#0F172A">GNU sed case modifiers</text>
    <text x="380" y="62" font-size="13" fill="#64748B">what each escape does inside the replacement of s///</text>
  </g>

  <!-- header row -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <rect x="40" y="88" width="680" height="36" rx="8" fill="#0F172A"/>
    <text x="120" y="111" font-size="13" font-weight="700" fill="#E2E8F0">modifier</text>
    <text x="330" y="111" font-size="13" font-weight="700" fill="#E2E8F0">effect</text>
    <text x="580" y="111" font-size="13" font-weight="700" fill="#E2E8F0">example output</text>
  </g>

  <!-- row 1: \L -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="132" width="680" height="58" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="120" y="160" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">\L</text>
    <text x="330" y="155" font-size="12.5" fill="#334155" text-anchor="middle">lowercase everything that follows</text>
    <text x="330" y="173" font-size="12.5" fill="#334155" text-anchor="middle">until \U or \E</text>
    <text x="580" y="155" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">s/.*/\LHELLO WORLD/</text>
    <text x="580" y="175" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">hello world</text>
  </g>

  <!-- row 2: \U -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="198" width="680" height="58" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="120" y="226" font-size="18" font-weight="800" fill="#0E7490" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">\U</text>
    <text x="330" y="221" font-size="12.5" fill="#334155" text-anchor="middle">uppercase everything that follows</text>
    <text x="330" y="239" font-size="12.5" fill="#334155" text-anchor="middle">until \L or \E</text>
    <text x="580" y="221" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">s/.*/\Uhello world/</text>
    <text x="580" y="241" font-size="13" font-weight="700" fill="#0E7490" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">HELLO WORLD</text>
  </g>

  <!-- row 3: \l -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="264" width="680" height="58" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="120" y="292" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">\l</text>
    <text x="330" y="287" font-size="12.5" fill="#334155" text-anchor="middle">lowercase the NEXT character only</text>
    <text x="330" y="305" font-size="12.5" fill="#334155" text-anchor="middle">rest of the text is untouched</text>
    <text x="580" y="287" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">s/.*/\lHELLO WORLD/</text>
    <text x="580" y="307" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">hELLO WORLD</text>
  </g>

  <!-- row 4: \u -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="330" width="680" height="58" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="120" y="358" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">\u</text>
    <text x="330" y="353" font-size="12.5" fill="#334155" text-anchor="middle">uppercase the NEXT character only</text>
    <text x="330" y="371" font-size="12.5" fill="#334155" text-anchor="middle">this is what title case uses</text>
    <text x="580" y="353" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">s/.*/\uhello world/</text>
    <text x="580" y="373" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Hello world</text>
  </g>

  <!-- row 5: \E -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="396" width="680" height="58" rx="10" fill="#FEE2E2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="120" y="424" font-size="18" font-weight="800" fill="#B91C1C" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">\E</text>
    <text x="330" y="419" font-size="12.5" fill="#334155" text-anchor="middle">stop case conversion started by</text>
    <text x="330" y="437" font-size="12.5" fill="#334155" text-anchor="middle">\L or \U (keeps the rest as typed)</text>
    <text x="580" y="419" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">s/.*/\Uhello\E world/</text>
    <text x="580" y="439" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">HELLO world</text>
  </g>
</svg>
