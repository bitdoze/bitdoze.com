<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="inTitle inDesc">
  <title id="inTitle">What sed -i actually does: new inode, severed links</title>
  <desc id="inDesc">Diagram: sed -i writes a temp file with a new inode and renames it over the original. file.txt ends up with a new inode, a hard link keeps pointing at the old orphaned inode, and a symlink is replaced by a regular file.</desc>

  <defs>
    <linearGradient id="inBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="inArw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="inArwRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="url(#inBg)"/>
  <circle cx="110" cy="60" r="150" fill="#6366F1" opacity="0.07"/>
  <circle cx="680" cy="400" r="160" fill="#EC4899" opacity="0.06"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="38" font-size="24" font-weight="800" fill="#0F172A">What sed -i actually does</text>
    <text x="380" y="60" font-size="13" fill="#64748B">GNU sed writes a temp file, then renames it over your original</text>
  </g>

  <!-- column headers -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="140" y="86" font-size="13" font-weight="800" fill="#475569">BEFORE</text>
    <text x="380" y="86" font-size="13" font-weight="800" fill="#475569">SED -I RUNS</text>
    <text x="620" y="86" font-size="13" font-weight="800" fill="#475569">AFTER</text>
  </g>

  <!-- row 1: file.txt -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="100" width="200" height="72" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="140" y="130" font-size="15" font-weight="700" fill="#4338CA">file.txt</text>
    <text x="140" y="151" font-size="11.5" fill="#475569">inode 123</text>

    <rect x="290" y="100" width="180" height="72" rx="14" fill="#0F172A"/>
    <text x="380" y="130" font-size="14" font-weight="700" fill="#F8FAFC">sed -i '2d' file.txt</text>
    <text x="380" y="151" font-size="11.5" fill="#CBD5E1">writes a new file first</text>

    <rect x="520" y="100" width="200" height="72" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="620" y="130" font-size="15" font-weight="700" fill="#047857">file.txt</text>
    <text x="620" y="151" font-size="11.5" fill="#475569">inode 456 · edited content</text>
  </g>

  <!-- row 2: hard link -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="210" width="200" height="72" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="140" y="240" font-size="15" font-weight="700" fill="#0F172A">hard.txt</text>
    <text x="140" y="261" font-size="11.5" fill="#475569">inode 123 · same data</text>

    <rect x="290" y="210" width="180" height="72" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="380" y="240" font-size="14" font-weight="700" fill="#0F172A">tmpABC</text>
    <text x="380" y="261" font-size="11.5" fill="#475569">new inode 456</text>

    <rect x="520" y="210" width="200" height="72" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="620" y="240" font-size="15" font-weight="700" fill="#B91C1C">hard.txt</text>
    <text x="620" y="261" font-size="11.5" fill="#B91C1C">still inode 123 · orphaned copy</text>
  </g>

  <!-- row 3: symlink -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="320" width="200" height="72" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="140" y="350" font-size="15" font-weight="700" fill="#0E7490">link.txt → file.txt</text>
    <text x="140" y="371" font-size="11.5" fill="#475569">symlink to the original</text>

    <rect x="290" y="320" width="180" height="72" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="380" y="350" font-size="14" font-weight="700" fill="#0F172A">rename(tmpABC,</text>
    <text x="380" y="371" font-size="11.5" fill="#475569">file.txt)</text>

    <rect x="520" y="320" width="200" height="72" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="620" y="350" font-size="15" font-weight="700" fill="#B91C1C">link.txt</text>
    <text x="620" y="371" font-size="11.5" fill="#B91C1C">now a regular file · link gone</text>
  </g>

  <!-- arrows -->
  <g stroke-width="2" fill="none">
    <line x1="240" y1="136" x2="284" y2="136" stroke="#6366F1" marker-end="url(#inArw)"/>
    <line x1="470" y1="136" x2="514" y2="136" stroke="#6366F1" marker-end="url(#inArw)"/>
    <line x1="240" y1="246" x2="284" y2="246" stroke="#6366F1" marker-end="url(#inArw)"/>
    <line x1="470" y1="246" x2="514" y2="246" stroke="#DC2626" marker-end="url(#inArwRed)"/>
    <line x1="240" y1="356" x2="284" y2="356" stroke="#6366F1" marker-end="url(#inArw)"/>
    <line x1="470" y1="356" x2="514" y2="356" stroke="#DC2626" marker-end="url(#inArwRed)"/>
  </g>

  <!-- footer note -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="424" font-size="11.5" fill="#94A3B8">same filename, different inode: anything that pointed at the old inode keeps the old data</text>
  </g>
</svg>
