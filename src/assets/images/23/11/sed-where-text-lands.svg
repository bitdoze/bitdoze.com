<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="wlTitle wlDesc">
  <title id="wlTitle">Where the text lands: sed i vs a vs c</title>
  <desc id="wlDesc">Diagram of a five-line sample file showing that sed i inserts text before line 3, sed a appends text after line 3, and sed c replaces line 3 with the new text.</desc>

  <defs>
    <linearGradient id="wlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="wlArw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="wlArwGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="url(#wlBg)"/>
  <circle cx="110" cy="60" r="150" fill="#6366F1" opacity="0.07"/>
  <circle cx="680" cy="480" r="160" fill="#EC4899" opacity="0.06"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="38" font-size="24" font-weight="800" fill="#0F172A">Where the text lands</text>
    <text x="380" y="60" font-size="13" fill="#64748B">i inserts before the line, a appends after it, c replaces it</text>
  </g>

  <!-- original file -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="250" y="82" width="260" height="176" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="380" y="106" font-size="13" font-weight="800" fill="#4338CA">example.txt</text>
    <rect x="262" y="162" width="236" height="22" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="380" y="132" font-size="13" fill="#475569">1&#160;&#160;alpha</text>
    <text x="380" y="154" font-size="13" fill="#475569">2&#160;&#160;beta</text>
    <text x="380" y="178" font-size="13" font-weight="700" fill="#B91C1C">3&#160;&#160;gamma&#160;&#160;← target</text>
    <text x="380" y="202" font-size="13" fill="#475569">4&#160;&#160;delta</text>
    <text x="380" y="224" font-size="13" fill="#475569">5&#160;&#160;epsilon</text>
    <text x="380" y="246" font-size="11" fill="#94A3B8">5 lines before any command</text>
  </g>

  <!-- split arrows -->
  <g stroke="#6366F1" stroke-width="2" fill="none">
    <path d="M380 258 L380 276 L145 276 L145 292" marker-end="url(#wlArw)"/>
    <path d="M380 258 L380 292" marker-end="url(#wlArw)"/>
    <path d="M380 258 L380 276 L615 276 L615 292" marker-end="url(#wlArw)"/>
  </g>

  <!-- column 1: i -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="300" width="210" height="180" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="145" y="324" font-size="13" font-weight="800" fill="#047857">sed '3i NEW'</text>
    <text x="145" y="342" font-size="11" fill="#64748B">insert before line 3</text>
    <text x="145" y="366" font-size="12" fill="#475569">1&#160;&#160;alpha</text>
    <text x="145" y="386" font-size="12" fill="#475569">2&#160;&#160;beta</text>
    <rect x="52" y="392" width="186" height="20" rx="5" fill="#A7F3D0"/>
    <text x="145" y="407" font-size="12" font-weight="700" fill="#065F46">NEW</text>
    <text x="145" y="427" font-size="12" fill="#475569">3&#160;&#160;gamma</text>
    <text x="145" y="447" font-size="12" fill="#475569">4&#160;&#160;delta</text>
    <text x="145" y="467" font-size="12" fill="#475569">5&#160;&#160;epsilon</text>
  </g>

  <!-- column 2: a -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="275" y="300" width="210" height="180" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="380" y="324" font-size="13" font-weight="800" fill="#4338CA">sed '3a NEW'</text>
    <text x="380" y="342" font-size="11" fill="#64748B">append after line 3</text>
    <text x="380" y="366" font-size="12" fill="#475569">1&#160;&#160;alpha</text>
    <text x="380" y="386" font-size="12" fill="#475569">2&#160;&#160;beta</text>
    <text x="380" y="406" font-size="12" fill="#475569">3&#160;&#160;gamma</text>
    <rect x="287" y="412" width="186" height="20" rx="5" fill="#C7D2FE"/>
    <text x="380" y="427" font-size="12" font-weight="700" fill="#3730A3">NEW</text>
    <text x="380" y="447" font-size="12" fill="#475569">4&#160;&#160;delta</text>
    <text x="380" y="467" font-size="12" fill="#475569">5&#160;&#160;epsilon</text>
  </g>

  <!-- column 3: c -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="510" y="300" width="210" height="180" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="615" y="324" font-size="13" font-weight="800" fill="#B91C1C">sed '3c NEW'</text>
    <text x="615" y="342" font-size="11" fill="#64748B">replace line 3</text>
    <text x="615" y="366" font-size="12" fill="#475569">1&#160;&#160;alpha</text>
    <text x="615" y="386" font-size="12" fill="#475569">2&#160;&#160;beta</text>
    <rect x="522" y="392" width="186" height="20" rx="5" fill="#FECACA"/>
    <text x="615" y="407" font-size="12" font-weight="700" fill="#991B1B">NEW</text>
    <text x="615" y="427" font-size="12" fill="#94A3B8">3&#160;&#160;gamma (gone)</text>
    <text x="615" y="447" font-size="12" fill="#475569">4&#160;&#160;delta</text>
    <text x="615" y="467" font-size="12" fill="#475569">5&#160;&#160;epsilon</text>
  </g>

  <!-- footer note -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="504" font-size="11.5" fill="#94A3B8">after an insert the later lines shift down by one; append and change leave their line numbers alone</text>
  </g>
</svg>
