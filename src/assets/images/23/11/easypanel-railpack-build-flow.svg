<svg viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bflowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="bflowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="bflowArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="240" fill="url(#bflowBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="16" font-weight="bold">EasyPanel deploy flow for a static Astro site (Railpack)</text>

  <!-- Node 1: GitHub repo -->
  <g transform="translate(30, 80)">
    <rect width="140" height="80" fill="#0f172a" rx="12"/>
    <rect x="8" y="8" width="124" height="64" fill="#1e293b" rx="8"/>
    <text x="70" y="36" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="13" font-weight="bold">GitHub repo</text>
    <text x="70" y="56" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="11">git push</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="170" y1="120" x2="196" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#bflowArrow)"/>

  <!-- Node 2: Source -->
  <g transform="translate(200, 80)">
    <rect width="140" height="80" fill="#0f172a" rx="12"/>
    <rect x="8" y="8" width="124" height="64" fill="#1e293b" rx="8"/>
    <text x="70" y="32" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="13" font-weight="bold">Source</text>
    <text x="70" y="50" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">owner/name</text>
    <text x="70" y="64" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">+ Build Path</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="340" y1="120" x2="366" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#bflowArrow)"/>

  <!-- Node 3: Build Railpack -->
  <g transform="translate(370, 80)">
    <rect width="150" height="80" fill="#0f172a" rx="12"/>
    <rect x="8" y="8" width="134" height="64" fill="#1e293b" rx="8"/>
    <rect x="16" y="14" width="118" height="22" fill="#3b82f6" rx="6"/>
    <text x="75" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Build: Railpack</text>
    <text x="75" y="52" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">detects Astro</text>
    <text x="75" y="66" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Caddy serves dist/</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="520" y1="120" x2="546" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#bflowArrow)"/>

  <!-- Node 4: Save then Deploy -->
  <g transform="translate(550, 80)">
    <rect width="140" height="80" fill="#0f172a" rx="12"/>
    <rect x="8" y="8" width="124" height="64" fill="#1e293b" rx="8"/>
    <text x="70" y="32" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="13" font-weight="bold">Save → Deploy</text>
    <text x="70" y="52" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="10">saving does not</text>
    <text x="70" y="66" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="10">deploy</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="690" y1="120" x2="716" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#bflowArrow)"/>

  <!-- Node 5: Live -->
  <g transform="translate(720, 80)">
    <rect width="130" height="80" fill="#0f172a" rx="12"/>
    <rect x="8" y="8" width="114" height="64" fill="#1e293b" rx="8"/>
    <rect x="16" y="14" width="98" height="22" fill="#22c55e" rx="6"/>
    <text x="65" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Live</text>
    <text x="65" y="52" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">domain + SSL</text>
    <text x="65" y="66" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">HTTP/2 200</text>
  </g>

  <!-- Footer note -->
  <text x="440" y="210" text-anchor="middle" fill="#475569" font-family="Arial" font-size="11">Zero config: leave Install / Build / Start commands empty. Pin Node with engines.node or Mise Packages (node@22).</text>
</svg>
