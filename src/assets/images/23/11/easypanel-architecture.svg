<svg viewBox="0 0 880 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="epBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="epArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="epArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="580" fill="url(#epBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Browser -->
  <g transform="translate(320, 28)">
    <rect width="240" height="56" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="220" height="36" fill="#1e293b" rx="8"/>
    <text x="120" y="33" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="13" font-weight="bold">Browser / AI client / CLI</text>
  </g>

  <!-- Arrow: browser -> Traefik -->
  <line x1="440" y1="84" x2="440" y2="118" stroke="#475569" stroke-width="3" marker-end="url(#epArrow)"/>

  <!-- Traefik -->
  <g transform="translate(200, 122)">
    <rect width="480" height="76" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="460" height="56" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="440" height="24" fill="#3b82f6" rx="6"/>
    <text x="240" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Traefik reverse proxy</text>
    <text x="240" y="59" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="11">:80 / :443, TLS via Let's Encrypt (auto-renew)</text>
  </g>

  <!-- Arrow: Traefik -> Swarm -->
  <line x1="440" y1="198" x2="440" y2="236" stroke="#475569" stroke-width="3" marker-end="url(#epArrow)"/>

  <!-- Docker Swarm zone -->
  <rect x="30" y="240" width="820" height="190" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5" rx="14"/>
  <text x="440" y="268" text-anchor="middle" fill="#334155" font-family="Arial" font-size="14" font-weight="bold">Docker Swarm services</text>

  <!-- App service -->
  <g transform="translate(55, 288)">
    <rect width="230" height="118" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="210" height="98" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="190" height="26" fill="#10b981" rx="6"/>
    <text x="115" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">App service</text>
    <text x="115" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">GitHub / Dockerfile / image</text>
    <text x="115" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Railpack, Buildpacks, Nixpacks</text>
    <text x="115" y="96" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">web terminal + scripts</text>
  </g>

  <!-- Database service -->
  <g transform="translate(325, 288)">
    <rect width="230" height="118" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="210" height="98" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="190" height="26" fill="#3b82f6" rx="6"/>
    <text x="115" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Database service</text>
    <text x="115" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">PostgreSQL 18, MySQL, Redis...</text>
    <text x="115" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">PgWeb / DbGate consoles</text>
    <text x="115" y="96" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">private or public exposure</text>
  </g>

  <!-- Template service -->
  <g transform="translate(595, 288)">
    <rect width="230" height="118" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="210" height="98" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="190" height="26" fill="#8b5cf6" rx="6"/>
    <text x="115" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Template service</text>
    <text x="115" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">750+ one-click apps</text>
    <text x="115" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">WordPress, n8n, Gitea...</text>
    <text x="115" y="96" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Compose service type for stacks</text>
  </g>

  <!-- Easypanel control plane -->
  <g transform="translate(200, 458)">
    <rect width="480" height="88" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="460" height="68" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="440" height="24" fill="#f59e0b" rx="6"/>
    <text x="240" y="35" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="13" font-weight="bold">Easypanel (control plane)</text>
    <text x="240" y="59" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">web UI :3000 (confirm in setup output), config in /etc/easypanel</text>
    <text x="240" y="73" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">manages Swarm via docker.sock (read-only)</text>
  </g>

  <!-- Arrow: Easypanel -> Swarm (control) -->
  <line x1="440" y1="458" x2="440" y2="438" stroke="#3b82f6" stroke-width="3" marker-end="url(#epArrowBlue)"/>
  <text x="455" y="452" fill="#3b82f6" font-family="Arial" font-size="10" font-weight="bold">deploy / manage</text>

  <!-- Footer note -->
  <text x="440" y="568" text-anchor="middle" fill="#475569" font-family="Arial" font-size="11">Swarm rolling updates = zero-downtime deploys</text>
</svg>
