<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="omzTreeTitle omzTreeDesc">
  <title id="omzTreeTitle">Oh My Zsh plugin install decision tree for 2026</title>
  <desc id="omzTreeDesc">Flow diagram: need a plugin? Check omz plugin list. If the plugin is listed, add its name to plugins equals and reload. Done, no git clone. If it is not listed, git clone the repo into $ZSH_CUSTOM/plugins, add the name to plugins equals, and reload. Footnote: zsh-syntax-highlighting must stay last in the array.</desc>

  <defs>
    <linearGradient id="treeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="treeArw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="treeArwGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
    <marker id="treeArwAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="760" height="570" fill="url(#treeBg)"/>
  <circle cx="110" cy="90" r="150" fill="#6366F1" opacity="0.07"/>
  <circle cx="680" cy="500" r="160" fill="#06B6D4" opacity="0.07"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="38" font-size="23" font-weight="800" fill="#0F172A">Installing a plugin in 2026</text>
    <text x="380" y="60" font-size="13" fill="#64748B">check built-ins first, clone only what is missing</text>
  </g>

  <!-- start -->
  <rect x="255" y="82" width="250" height="46" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="111" font-size="15" font-weight="700" fill="#3730A3">Need a plugin?</text>
  </g>
  <line x1="380" y1="128" x2="380" y2="162" stroke="#6366F1" stroke-width="2" marker-end="url(#treeArw)"/>

  <!-- decision -->
  <path d="M245 176 L515 176 L545 206 L515 236 L245 236 L215 206 Z" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="202" font-size="14" font-weight="700" fill="#0F172A">Is it in</text>
    <text x="380" y="221" font-size="14" font-weight="700" fill="#0F172A">omz plugin list ?</text>
  </g>

  <!-- branch labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
    <text x="272" y="256" text-anchor="middle" fill="#059669">YES</text>
    <text x="488" y="256" text-anchor="middle" fill="#B45309">NO</text>
  </g>

  <!-- forks -->
  <path d="M300 236 L300 262 L220 262 L220 282" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#treeArwGreen)"/>
  <path d="M460 236 L460 262 L540 262 L540 282" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#treeArwAmber)"/>

  <!-- YES column -->
  <rect x="90" y="286" width="260" height="58" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#065F46">
    <text x="220" y="311" font-size="13.5" font-weight="700">Add name to plugins=( )</text>
    <text x="220" y="330" font-size="12">no clone, no source lines</text>
  </g>
  <line x1="220" y1="344" x2="220" y2="372" stroke="#10B981" stroke-width="2" marker-end="url(#treeArwGreen)"/>

  <rect x="90" y="376" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#065F46">
    <text x="220" y="407" font-size="13.5" font-weight="700">exec zsh  (or omz reload)</text>
  </g>
  <line x1="220" y1="428" x2="220" y2="456" stroke="#10B981" stroke-width="2" marker-end="url(#treeArwGreen)"/>

  <rect x="90" y="460" width="260" height="48" rx="10" fill="#10B981" opacity="0.9"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="220" y="489" font-size="13.5" font-weight="700">Done: ships with Oh My Zsh</text>
  </g>

  <!-- NO column -->
  <rect x="410" y="286" width="260" height="58" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#92400E">
    <text x="540" y="311" font-size="13.5" font-weight="700">git clone into</text>
    <text x="540" y="330" font-size="11.5">${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins</text>
  </g>
  <line x1="540" y1="344" x2="540" y2="372" stroke="#F59E0B" stroke-width="2" marker-end="url(#treeArwAmber)"/>

  <rect x="410" y="376" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#92400E">
    <text x="540" y="400" font-size="13.5" font-weight="700">Add name to plugins=( )</text>
    <text x="540" y="418" font-size="12">then exec zsh</text>
  </g>
  <line x1="540" y1="428" x2="540" y2="456" stroke="#F59E0B" stroke-width="2" marker-end="url(#treeArwAmber)"/>

  <rect x="410" y="460" width="260" height="48" rx="10" fill="#F59E0B" opacity="0.9"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="540" y="489" font-size="13.5" font-weight="700">Done: third-party plugin</text>
  </g>

  <!-- footnote -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="538" font-size="12.5" font-weight="700" fill="#475569">Rule: zsh-syntax-highlighting must stay LAST in the plugins array (it wraps ZLE widgets).</text>
    <text x="380" y="556" font-size="11.5" fill="#64748B">Verify with: echo $plugins  ·  type a command and check suggestion + colors</text>
  </g>
</svg>
