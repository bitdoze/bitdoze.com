<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="toolTitle toolDesc">
  <title id="toolTitle">Choosing tr, sed, awk, or perl for case conversion</title>
  <desc id="toolDesc">Decision flow: whole-stream case flip goes to tr; line or pattern targeting and in-place editing go to sed; field and column logic goes to awk; Unicode edge cases go to perl or gawk.</desc>

  <defs>
    <linearGradient id="toolBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="toolArw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="toolArwGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="url(#toolBg)"/>
  <circle cx="120" cy="50" r="150" fill="#6366F1" opacity="0.07"/>
  <circle cx="670" cy="420" r="160" fill="#06B6D4" opacity="0.07"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="380" y="40" font-size="24" font-weight="800" fill="#0F172A">Which tool for case conversion?</text>
    <text x="380" y="62" font-size="13" fill="#64748B">pick by the shape of the job, not by habit</text>
  </g>

  <!-- start node -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="270" y="88" width="220" height="52" rx="26" fill="#0F172A"/>
    <text x="380" y="112" font-size="14" font-weight="700" fill="#F8FAFC">Need to change text case?</text>
    <text x="380" y="129" font-size="11" fill="#CBD5E1">ask what the job looks like</text>
  </g>

  <!-- arrows from start -->
  <g stroke="#6366F1" stroke-width="2" fill="none">
    <path d="M380 140 L380 168" marker-end="url(#toolArw)"/>
  </g>

  <!-- decision node -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="240" y="170" width="280" height="56" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="380" y="194" font-size="13.5" font-weight="700" fill="#4338CA">What does the transformation touch?</text>
    <text x="380" y="213" font-size="11.5" fill="#475569">whole stream / one line / fields / Unicode</text>
  </g>

  <!-- connectors to 4 branches -->
  <g stroke="#94A3B8" stroke-width="1.8" fill="none">
    <path d="M300 226 L150 268" marker-end="url(#toolArwGray)"/>
    <path d="M355 226 L285 268" marker-end="url(#toolArwGray)"/>
    <path d="M405 226 L475 268" marker-end="url(#toolArwGray)"/>
    <path d="M460 226 L610 268" marker-end="url(#toolArwGray)"/>
  </g>

  <!-- branch 1: tr -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="272" width="220" height="96" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="150" y="298" font-size="15" font-weight="800" fill="#0E7490" font-family="ui-monospace, Menlo, monospace">tr</text>
    <text x="150" y="320" font-size="11.5" fill="#334155">whole-stream flip,</text>
    <text x="150" y="337" font-size="11.5" fill="#334155">no patterns, no -i</text>
    <text x="150" y="356" font-size="10.5" fill="#64748B">fastest: ~0.05 s on 77 MB</text>
  </g>

  <!-- branch 2: sed -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="180" y="388" width="220" height="0" rx="0" fill="none"/>
    <rect x="280" y="272" width="220" height="96" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="390" y="298" font-size="15" font-weight="800" fill="#4338CA" font-family="ui-monospace, Menlo, monospace">sed</text>
    <text x="390" y="320" font-size="11.5" fill="#334155">line/pattern targeting,</text>
    <text x="390" y="337" font-size="11.5" fill="#334155">in-place editing</text>
    <text x="390" y="356" font-size="10.5" fill="#64748B">y is fast, \L is convenient</text>
  </g>

  <!-- branch 3: awk -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="500" y="272" width="220" height="96" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="610" y="298" font-size="15" font-weight="800" fill="#0F172A" font-family="ui-monospace, Menlo, monospace">awk</text>
    <text x="610" y="320" font-size="11.5" fill="#334155">field/column logic,</text>
    <text x="610" y="337" font-size="11.5" fill="#334155">case per field</text>
    <text x="610" y="356" font-size="10.5" fill="#64748B">tolower() / toupper()</text>
  </g>

  <!-- bottom recommendation bar -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="40" y="388" width="680" height="52" rx="12" fill="#0F172A"/>
    <text x="380" y="410" font-size="12.5" font-weight="700" fill="#F8FAFC">Unicode edge cases: GNU sed \L/\U under a UTF-8 locale, or perl/gawk. tr is byte-oriented.</text>
    <text x="380" y="428" font-size="11" fill="#94A3B8">Rule of thumb: one stream -&gt; tr · addresses or -i -&gt; sed · fields -&gt; awk</text>
  </g>
</svg>
