<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Which image-to-SVG path fits?</text>

  <!-- Start box -->
  <rect x="270" y="60" width="320" height="52" rx="26" fill="#2563eb"/>
  <text x="430" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">You need a raster image as SVG</text>

  <!-- Spine -->
  <path d="M430 112 v22" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="40" y="134" width="360" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Just a one-off logo or icon?</text>
  <path d="M404 162 h48" stroke="#2563eb" stroke-width="2"/>
  <path d="M448 156 l10 6 l-10 6 z" fill="#2563eb"/>
  <rect x="462" y="134" width="358" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="641" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Free preview + SVGcode or VTracer</text>
  <text x="641" y="176" text-anchor="middle" font-size="12" fill="#64748b">no payment needed</text>
  <path d="M430 190 v22" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="40" y="212" width="360" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Batch jobs or a CI pipeline?</text>
  <path d="M404 240 h48" stroke="#2563eb" stroke-width="2"/>
  <path d="M448 234 l10 6 l-10 6 z" fill="#2563eb"/>
  <rect x="462" y="212" width="358" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="641" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">VTracer CLI (local) or Vectorizer.ai API</text>
  <text x="641" y="254" text-anchor="middle" font-size="12" fill="#64748b">scriptable, from 50 credits/month</text>
  <path d="M430 268 v22" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="40" y="290" width="360" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Privacy-sensitive artwork?</text>
  <path d="M404 318 h48" stroke="#2563eb" stroke-width="2"/>
  <path d="M448 312 l10 6 l-10 6 z" fill="#2563eb"/>
  <rect x="462" y="290" width="358" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="641" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">SVGcode or VTracer (nothing uploaded)</text>
  <text x="641" y="332" text-anchor="middle" font-size="12" fill="#64748b">runs in the browser or on your machine</text>
  <path d="M430 346 v22" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 4 -->
  <rect x="40" y="368" width="360" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Cleanest result on complex art?</text>
  <path d="M404 396 h48" stroke="#2563eb" stroke-width="2"/>
  <path d="M448 390 l10 6 l-10 6 z" fill="#2563eb"/>
  <rect x="462" y="368" width="358" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="641" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Vectorizer.ai Web App (8.99 EUR / 9.99 USD mo)</text>
  <text x="641" y="410" text-anchor="middle" font-size="12" fill="#64748b">free preview to test quality first</text>
  <path d="M430 424 v22" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 5 -->
  <rect x="40" y="446" width="360" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="480" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Need to edit the vector afterwards?</text>
  <path d="M404 474 h48" stroke="#2563eb" stroke-width="2"/>
  <path d="M448 468 l10 6 l-10 6 z" fill="#2563eb"/>
  <rect x="462" y="446" width="358" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="641" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Inkscape 1.4.4 + VTracer</text>
  <text x="641" y="488" text-anchor="middle" font-size="12" fill="#64748b">free, desktop, full editor</text>

  <text x="430" y="542" text-anchor="middle" font-size="13" fill="#475569">Default path for most people: try the free preview once, keep VTracer or SVGcode on hand for the rest.</text>
</svg>
