<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="860" height="380" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Vectorizer.ai API flow: image in, SVG out</text>

  <!-- Row 1 -->
  <!-- Box A -->
  <rect x="30" y="80" width="170" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Your script</text>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#64748b">or CI job</text>

  <!-- Arrow A->B -->
  <path d="M204 123 h36" stroke="#2563eb" stroke-width="2"/>
  <path d="M236 117 l10 6 l-10 6 z" fill="#2563eb"/>

  <!-- Box B -->
  <rect x="250" y="80" width="270" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">POST /api/v1/vectorize</text>
  <text x="385" y="132" text-anchor="middle" font-size="12" fill="#475569">Basic auth id:secret</text>
  <text x="385" y="150" text-anchor="middle" font-size="12" fill="#475569">-F image=@logo.png</text>
  <rect x="470" y="62" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="508" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1 credit</text>

  <!-- Arrow B->C -->
  <path d="M524 123 h36" stroke="#2563eb" stroke-width="2"/>
  <path d="M556 117 l10 6 l-10 6 z" fill="#2563eb"/>

  <!-- Box C -->
  <rect x="570" y="80" width="180" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Result token</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#64748b">retained image id</text>

  <!-- Curve C down to D -->
  <path d="M660 166 v28 h-190" stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M462 188 l-10 6 l10 6 z" fill="#2563eb"/>

  <!-- Box D -->
  <rect x="250" y="210" width="270" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">POST /api/v1/download</text>
  <text x="385" y="262" text-anchor="middle" font-size="12" fill="#475569">format=svg (or eps, dxf, pdf)</text>
  <text x="385" y="280" text-anchor="middle" font-size="12" fill="#475569">uses the result token</text>

  <!-- Arrow D->E -->
  <path d="M246 253 h-36" stroke="#2563eb" stroke-width="2"/>
  <path d="M214 247 l-10 6 l10 6 z" fill="#2563eb"/>

  <!-- Box E -->
  <rect x="30" y="210" width="170" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="115" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">result.svg</text>
  <text x="115" y="268" text-anchor="middle" font-size="12" fill="#64748b">on disk</text>

  <!-- Note box -->
  <rect x="570" y="210" width="260" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Preview results</text>
  <text x="700" y="258" text-anchor="middle" font-size="12" fill="#78350f">0.2 credits each,</text>
  <text x="700" y="276" text-anchor="middle" font-size="12" fill="#78350f">watermarked PNG at 4x</text>
  <text x="700" y="294" text-anchor="middle" font-size="12" fill="#78350f">input resolution</text>

  <text x="430" y="352" text-anchor="middle" font-size="13" fill="#475569">Test mode is free and needs no subscription. Out of credits returns HTTP 402.</text>
</svg>
