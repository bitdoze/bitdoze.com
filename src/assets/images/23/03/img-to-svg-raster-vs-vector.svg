<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="860" height="440" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Same logo in raster and vector form</text>
  <text x="430" y="64" text-anchor="middle" font-size="13" fill="#64748b">Left: pixel grid breaks apart when scaled. Right: paths stay sharp at any size.</text>

  <!-- Left panel: raster -->
  <rect x="28" y="88" width="388" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="222" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PNG / JPEG (raster)</text>
  <text x="222" y="138" text-anchor="middle" font-size="12" fill="#64748b">made of pixels</text>

  <!-- small raster icon -->
  <text x="222" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">AT 16 PX</text>
  <circle cx="222" cy="204" r="14" fill="#2563eb"/>
  <path d="M215 204 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- zoom arrow -->
  <path d="M222 226 v14" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M218 236 l4 6 l4 -6" fill="#94a3b8"/>
  <text x="222" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">SCALED UP</text>

  <!-- pixelated circle -->
  <g fill="#2563eb">
    <rect x="186" y="270" width="18" height="18"/><rect x="204" y="270" width="18" height="18"/><rect x="222" y="270" width="18" height="18"/><rect x="240" y="270" width="18" height="18"/>
    <rect x="168" y="288" width="18" height="18"/><rect x="186" y="288" width="18" height="18"/><rect x="204" y="288" width="18" height="18"/><rect x="222" y="288" width="18" height="18"/><rect x="240" y="288" width="18" height="18"/><rect x="258" y="288" width="18" height="18"/>
    <rect x="150" y="306" width="18" height="18"/><rect x="168" y="306" width="18" height="18"/><rect x="186" y="306" width="18" height="18"/><rect x="204" y="306" width="18" height="18"/><rect x="222" y="306" width="18" height="18"/><rect x="240" y="306" width="18" height="18"/><rect x="258" y="306" width="18" height="18"/><rect x="276" y="306" width="18" height="18"/>
    <rect x="150" y="324" width="18" height="18"/><rect x="168" y="324" width="18" height="18"/><rect x="186" y="324" width="18" height="18"/><rect x="204" y="324" width="18" height="18"/><rect x="222" y="324" width="18" height="18"/><rect x="240" y="324" width="18" height="18"/><rect x="258" y="324" width="18" height="18"/><rect x="276" y="324" width="18" height="18"/>
    <rect x="168" y="342" width="18" height="18"/><rect x="186" y="342" width="18" height="18"/><rect x="204" y="342" width="18" height="18"/><rect x="222" y="342" width="18" height="18"/><rect x="240" y="342" width="18" height="18"/><rect x="258" y="342" width="18" height="18"/>
    <rect x="186" y="360" width="18" height="18"/><rect x="204" y="360" width="18" height="18"/><rect x="222" y="360" width="18" height="18"/><rect x="240" y="360" width="18" height="18"/>
  </g>

  <!-- Right panel: vector -->
  <rect x="444" y="88" width="388" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="638" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">SVG (vector)</text>
  <text x="638" y="138" text-anchor="middle" font-size="12" fill="#64748b">made of paths and shapes</text>

  <!-- small vector icon -->
  <text x="638" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">AT 16 PX</text>
  <circle cx="638" cy="204" r="14" fill="#2563eb"/>
  <path d="M631 204 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- zoom arrow -->
  <path d="M638 226 v14" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M634 236 l4 6 l4 -6" fill="#94a3b8"/>
  <text x="638" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">SCALED UP</text>

  <!-- smooth circle with path nodes -->
  <circle cx="638" cy="324" r="60" fill="#2563eb"/>
  <rect x="632" y="258" width="12" height="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="692" y="318" width="12" height="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="632" y="378" width="12" height="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="572" y="318" width="12" height="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>

  <text x="430" y="418" text-anchor="middle" font-size="13" fill="#475569">The raster shows blocks. The SVG recomputes the curve, so there is nothing to blur.</text>
</svg>
