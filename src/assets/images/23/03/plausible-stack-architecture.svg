<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Self-hosted Plausible Analytics stack on Coolify</title>
  <desc id="stackDesc">Visitors hit your domain where Coolify's Traefik reverse proxy terminates Let's Encrypt TLS and forwards to the Plausible CE v3.2.1 container. Plausible writes accounts and site config to PostgreSQL 16 and analytics events to ClickHouse 24.12. Both databases keep data in persistent Docker volumes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="240" fill="url(#blobIndigo)"/>
  <circle cx="1100" cy="600" r="260" fill="url(#blobCyan)"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="52" font-size="29" font-weight="800" fill="#0F172A">What "one click" actually deploys</text>
    <text x="600" y="82" font-size="15" fill="#64748B">One Coolify service · three containers · two persistent volumes</text>
  </g>

  <!-- pipeline row -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- visitors -->
    <rect x="55" y="165" width="200" height="110" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="155" y="203" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">Visitors</text>
    <text x="155" y="228" font-size="12.5" fill="#475569" text-anchor="middle">any browser or device</text>
    <text x="155" y="250" font-size="12.5" fill="#475569" text-anchor="middle">script under 1 KB</text>

    <!-- domain / proxy -->
    <rect x="345" y="165" width="310" height="110" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="500" y="197" font-size="18" font-weight="800" fill="#0E7490" text-anchor="middle">Your domain</text>
    <text x="500" y="221" font-size="12.5" fill="#475569" text-anchor="middle">Coolify Traefik reverse proxy</text>
    <text x="500" y="243" font-size="12.5" fill="#475569" text-anchor="middle">Let's Encrypt TLS, issued and renewed</text>

    <!-- plausible app -->
    <rect x="745" y="165" width="310" height="110" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="900" y="197" font-size="18" font-weight="800" fill="#6D28D9" text-anchor="middle">Plausible CE v3.2.1</text>
    <text x="900" y="221" font-size="12.5" fill="#475569" text-anchor="middle">Elixir/Phoenix app on :8000</text>
    <text x="900" y="243" font-size="12.5" fill="#475569" text-anchor="middle">healthcheck: /api/health</text>

    <!-- arrows in pipeline -->
    <line x1="258" y1="220" x2="338" y2="220" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arw)"/>
    <text x="298" y="208" font-size="11" fill="#64748B" text-anchor="middle">HTTPS</text>

    <line x1="658" y1="220" x2="738" y2="220" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arw)"/>
    <text x="698" y="208" font-size="11" fill="#64748B" text-anchor="middle">proxy</text>
  </g>

  <!-- arrows to databases -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none">
    <path d="M860 278 C 800 330, 730 360, 700 412" marker-end="url(#arw)"/>
    <path d="M945 278 C 985 330, 1015 360, 1035 412" marker-end="url(#arw)"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="720" y="350" font-size="11" fill="#64748B">accounts and config</text>
    <text x="1035" y="350" font-size="11" fill="#64748B" text-anchor="middle">analytics events</text>
  </g>

  <!-- database boxes -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="530" y="415" width="330" height="145" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="695" y="452" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">PostgreSQL 16</text>
    <text x="695" y="478" font-size="12.5" fill="#475569" text-anchor="middle">accounts · sites · goals</text>
    <text x="695" y="500" font-size="12.5" fill="#475569" text-anchor="middle">small dataset</text>
    <rect x="585" y="515" width="220" height="28" rx="14" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="695" y="534" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">volume: plausible-db-data</text>

    <rect x="895" y="415" width="265" height="145" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="1027" y="452" font-size="18" font-weight="800" fill="#C2410C" text-anchor="middle">ClickHouse 24.12</text>
    <text x="1027" y="478" font-size="12.5" fill="#475569" text-anchor="middle">pageviews and events</text>
    <text x="1027" y="500" font-size="12.5" fill="#475569" text-anchor="middle">the bulk of your data</text>
    <rect x="915" y="515" width="225" height="28" rx="14" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="1027" y="534" font-size="11.5" font-weight="700" fill="#9A3412" text-anchor="middle">volume: plausible-events-data</text>
  </g>

  <!-- footer note -->
  <rect x="200" y="600" width="800" height="44" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="628" font-size="13.5" fill="#475569" text-anchor="middle">Redeploys keep both volumes. Back up Postgres with Coolify S3 backups, ClickHouse with snapshots or clickhouse-backup.</text>
</svg>
