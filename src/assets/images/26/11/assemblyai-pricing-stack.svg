<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Stacked bars showing how AssemblyAI add-ons stack on the base rate for meeting notes at $0.25, support call analysis at $0.33, and a voice agent session at $0.57 per hour">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <clipPath id="row1"><rect x="300" y="170" width="190" height="50" rx="8"/></clipPath>
    <clipPath id="row2"><rect x="300" y="280" width="258.8" height="50" rx="8"/></clipPath>
    <clipPath id="row3"><rect x="300" y="390" width="433.2" height="50" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="538" y="22" width="124" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">PRICING</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">How add-ons stack on the hourly rate</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Three common bundles at list price, in US dollars per audio or session hour</text>

  <!-- Gridlines: $0.10 steps -->
  <path d="M 300 140 L 300 470 M 376 140 L 376 470 M 452 140 L 452 470 M 528 140 L 528 470 M 604 140 L 604 470 M 680 140 L 680 470 M 756 140 L 756 470" stroke="#E2E8F0" stroke-width="1" fill="none"/>
  <path d="M 300 470 L 790 470" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <text x="300" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0</text>
  <text x="376" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.10</text>
  <text x="452" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.20</text>
  <text x="528" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.30</text>
  <text x="604" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.40</text>
  <text x="680" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.50</text>
  <text x="756" y="492" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="middle">$0.60</text>

  <!-- Row 1: meeting notes -->
  <text x="40" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Meeting notes</text>
  <text x="40" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748B">file, speaker labels, summary</text>
  <g clip-path="url(#row1)">
    <rect x="300" y="170" width="159.6" height="50" fill="#0F172A"/>
    <rect x="459.6" y="170" width="15.2" height="50" fill="#2563EB"/>
    <rect x="474.8" y="170" width="15.2" height="50" fill="#93C5FD"/>
  </g>
  <text x="312" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$0.21</text>
  <text x="506" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A">$0.25</text>
  <text x="506" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">$0.21 base + $0.02 labels + $0.02 summary</text>

  <!-- Row 2: support call analysis -->
  <text x="40" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Support call analysis</text>
  <text x="40" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748B">file, labels, entities, sentiment</text>
  <g clip-path="url(#row2)">
    <rect x="300" y="280" width="159.6" height="50" fill="#0F172A"/>
    <rect x="459.6" y="280" width="15.2" height="50" fill="#2563EB"/>
    <rect x="474.8" y="280" width="68.8" height="50" fill="#93C5FD"/>
    <rect x="543.6" y="280" width="15.2" height="50" fill="#93C5FD"/>
  </g>
  <text x="312" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$0.21</text>
  <text x="575" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A">$0.33</text>
  <text x="575" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">$0.21 base + $0.02 labels + $0.08 entities + $0.02 sentiment</text>

  <!-- Row 3: voice agent session -->
  <text x="40" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Voice agent session</text>
  <text x="40" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748B">live stream, speaker labels on</text>
  <g clip-path="url(#row3)">
    <rect x="300" y="390" width="342" height="50" fill="#0F172A"/>
    <rect x="642" y="390" width="91.2" height="50" fill="#2563EB"/>
  </g>
  <text x="312" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$0.45</text>
  <text x="687.6" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">+$0.12</text>
  <text x="749" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A">$0.57</text>
  <text x="749" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">$0.45 Realtime-Agent + $0.12 streaming labels</text>

  <!-- Legend -->
  <rect x="300" y="524" width="15" height="15" rx="3" fill="#0F172A"/>
  <text x="323" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">Base model rate</text>
  <rect x="500" y="524" width="15" height="15" rx="3" fill="#2563EB"/>
  <text x="523" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">Speaker labels</text>
  <rect x="680" y="524" width="15" height="15" rx="3" fill="#93C5FD"/>
  <text x="703" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">Other add-ons</text>

  <text x="600" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">List prices from assemblyai.com/pricing, checked November 23, 2026. Streaming hours are session time.</text>
</svg>
