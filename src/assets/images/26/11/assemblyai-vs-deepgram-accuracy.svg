<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Grouped bar chart of word error rate for AssemblyAI against Deepgram on four leaderboards: Artificial Analysis streaming 3.22 versus 5.91 percent, Artificial Analysis files 2.5 versus 5.2, Pipecat 0.80 versus 1.37, Coval 2.2 versus 5.2">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <clipPath id="plot"><rect x="70" y="160" width="1105" height="320"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="496" y="22" width="208" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">WORD ERROR RATE</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">Lower is better: four leaderboards, one direction</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Percent of words transcribed incorrectly. Blue bars are AssemblyAI, dark bars are Deepgram.</text>

  <!-- Gridlines -->
  <path d="M 70 434.3 L 1175 434.3 M 70 388.6 L 1175 388.6 M 70 342.9 L 1175 342.9 M 70 297.1 L 1175 297.1 M 70 251.4 L 1175 251.4 M 70 205.7 L 1175 205.7 M 70 160 L 1175 160" stroke="#E2E8F0" stroke-width="1" fill="none"/>
  <text x="62" y="484" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">0%</text>
  <text x="62" y="438" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">1%</text>
  <text x="62" y="393" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">2%</text>
  <text x="62" y="347" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">3%</text>
  <text x="62" y="301" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">4%</text>
  <text x="62" y="255" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">5%</text>
  <text x="62" y="210" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">6%</text>
  <text x="62" y="164" font-family="ui-monospace, monospace" font-size="12.5" fill="#64748B" text-anchor="end">7%</text>

  <!-- Bars -->
  <g clip-path="url(#plot)">
    <rect x="97" y="332.8" width="84" height="147.2" rx="6" fill="#2563EB"/>
    <rect x="201" y="209.8" width="84" height="270.2" rx="6" fill="#0F172A"/>
    <rect x="381" y="365.7" width="84" height="114.3" rx="6" fill="#2563EB"/>
    <rect x="485" y="242.3" width="84" height="237.7" rx="6" fill="#0F172A"/>
    <rect x="665" y="443.4" width="84" height="36.6" rx="6" fill="#2563EB"/>
    <rect x="769" y="417.4" width="84" height="62.6" rx="6" fill="#0F172A"/>
    <rect x="949" y="379.4" width="84" height="100.6" rx="6" fill="#2563EB"/>
    <rect x="1053" y="242.3" width="84" height="237.7" rx="6" fill="#0F172A"/>
  </g>
  <path d="M 70 480 L 1175 480" stroke="#94A3B8" stroke-width="1.5" fill="none"/>

  <!-- Values -->
  <text x="139" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">3.22%</text>
  <text x="243" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">5.91%</text>
  <text x="423" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">2.5%</text>
  <text x="527" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">5.2%</text>
  <text x="707" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">0.80%</text>
  <text x="811" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">1.37%</text>
  <text x="991" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">2.2%</text>
  <text x="1095" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle">5.2%</text>

  <!-- Group labels -->
  <text x="191" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Artificial Analysis</text>
  <text x="191" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">streaming index</text>
  <text x="191" y="546" font-family="ui-monospace, monospace" font-size="11.5" fill="#1D4ED8" text-anchor="middle">assemblyai: stt-3-7-realtime-agent</text>
  <text x="191" y="563" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569" text-anchor="middle">deepgram: flux 5.91%, nova-3 6.59%</text>

  <text x="475" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Artificial Analysis</text>
  <text x="475" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">file index</text>
  <text x="475" y="546" font-family="ui-monospace, monospace" font-size="11.5" fill="#1D4ED8" text-anchor="middle">assemblyai: stt-3-7</text>
  <text x="475" y="563" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569" text-anchor="middle">deepgram: nova-3</text>

  <text x="759" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Pipecat</text>
  <text x="759" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">STT benchmark</text>
  <text x="759" y="546" font-family="ui-monospace, monospace" font-size="11.5" fill="#1D4ED8" text-anchor="middle">assemblyai: universal-3-6-pro</text>
  <text x="759" y="563" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569" text-anchor="middle">deepgram: nova-3-general</text>

  <text x="1043" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Coval</text>
  <text x="1043" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">live leaderboard, Oct 28</text>
  <text x="1043" y="546" font-family="ui-monospace, monospace" font-size="11.5" fill="#1D4ED8" text-anchor="middle">assemblyai: universal-3.6-pro</text>
  <text x="1043" y="563" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569" text-anchor="middle">deepgram: nova-3 (flux 5.7%)</text>

  <text x="600" y="589" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Read November 23, 2026. Coval and Pipecat scored Universal-3.6 Pro, the streaming model that STT-3.7 replaced.</text>
</svg>
