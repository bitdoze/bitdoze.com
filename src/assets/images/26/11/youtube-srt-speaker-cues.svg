<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Comparison of two subtitle outputs for the same two speaker turns: the character-count SRT shows one cue reading 'staging? Yes, but the smoke' that mixes speaker A and speaker B, while the speaker-labelled SRT shows one cue per turn, each with an A or B prefix">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="#F8FAFC"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="492" y="20" width="216" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">SPEAKER CUES</text>
  <text x="600" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">A character count is not a subtitle</text>
  <text x="600" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">The same two turns from a test clip, as the two SRT files render them</text>

  <!-- Left: character-count SRT -->
  <rect x="40" y="146" width="548" height="340" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="64" y="184" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#0F172A">subtitles.srt</text>
  <text x="64" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">one cue every 32 characters</text>

  <rect x="64" y="232" width="176" height="34" rx="8" fill="#2563EB"/>
  <text x="152" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speaker A</text>
  <rect x="282" y="232" width="262" height="34" rx="8" fill="#0F172A"/>
  <text x="413" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speaker B</text>

  <rect x="64" y="300" width="480" height="66" rx="10" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <text x="304" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">staging? Yes, but the smoke</text>

  <text x="64" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">One cue, two speakers</text>
  <text x="64" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">The first word belongs to A, the rest to B.</text>
  <text x="64" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Nothing in the file tells the player where the turn ends.</text>

  <!-- Right: speaker-labelled SRT -->
  <rect x="612" y="146" width="548" height="340" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="636" y="184" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#0F172A">speakers.srt</text>
  <text x="636" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">a cue ends at every speaker turn</text>

  <rect x="636" y="232" width="176" height="34" rx="8" fill="#2563EB"/>
  <text x="724" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speaker A</text>
  <rect x="854" y="232" width="262" height="34" rx="8" fill="#0F172A"/>
  <text x="985" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speaker B</text>

  <rect x="636" y="290" width="480" height="40" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="876" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A" text-anchor="middle">[A] Did the deploy finish on staging?</text>
  <rect x="636" y="338" width="480" height="40" rx="10" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <text x="876" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A" text-anchor="middle">[B] Yes, but the smoke tests failed</text>

  <text x="636" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">One cue per turn</text>
  <text x="636" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Each cue carries the letter from the transcript words,</text>
  <text x="636" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">so viewers can follow who is speaking.</text>
</svg>
