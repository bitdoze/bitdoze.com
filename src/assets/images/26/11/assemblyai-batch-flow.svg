<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="The AssemblyAI pre-recorded request flow in four steps: upload, submit, wait, and read, each with a note on auth, polling, webhooks, and deletion">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="490" y="22" width="220" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">PRE-RECORDED API</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">One file, four steps, one transcript ID</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">The upload, submit, and poll steps from the script, with timings from my 56-second test clip</text>

  <!-- Row 1 -->
  <path d="M 125 237 L 125 249" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="40" y="145" width="560" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="145" width="170" height="92" rx="12" fill="#0F172A"/>
  <rect x="198" y="145" width="12" height="92" fill="#0F172A"/>
  <text x="125" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Upload</text>
  <text x="125" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">STEP 1</text>
  <text x="228" y="183" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">POST /v2/upload</text>
  <text x="228" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">returns an upload URL</text>
  <rect x="624" y="145" width="536" height="92" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="648" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1D4ED8">Send raw bytes</text>
  <text x="648" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">Use --data-binary @file. Plain -d sends the filename</text>
  <text x="648" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">as text and the job fails. About 1.6 s for a 56 s WAV.</text>

  <!-- Row 2 -->
  <path d="M 125 345 L 125 357" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="40" y="253" width="560" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="253" width="170" height="92" rx="12" fill="#0F172A"/>
  <rect x="198" y="253" width="12" height="92" fill="#0F172A"/>
  <text x="125" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Submit</text>
  <text x="125" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">STEP 2</text>
  <text x="228" y="291" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">POST /v2/transcript</text>
  <text x="228" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">returns the transcript ID</text>
  <rect x="624" y="253" width="536" height="92" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="648" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1D4ED8">Set the model and the auth header</text>
  <text x="648" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">Body: speech_models, speaker_labels. The authorization</text>
  <text x="648" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">header takes the raw key, with no Bearer prefix.</text>

  <!-- Row 3 -->
  <path d="M 125 453 L 125 465" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="40" y="361" width="560" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="361" width="170" height="92" rx="12" fill="#0F172A"/>
  <rect x="198" y="361" width="12" height="92" fill="#0F172A"/>
  <text x="125" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Wait</text>
  <text x="125" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">STEP 3</text>
  <text x="228" y="399" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">GET /v2/transcript/{id}</text>
  <text x="228" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">poll once a second, or use a webhook</text>
  <rect x="624" y="361" width="536" height="92" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="648" y="397" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1D4ED8">4.7 to 7.7 s end to end on my clips</text>
  <text x="648" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">At most 60 polling requests per minute per transcript.</text>
  <text x="648" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">A 429 response carries a Retry-After header.</text>

  <!-- Row 4 -->
  <rect x="40" y="469" width="560" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="469" width="170" height="92" rx="12" fill="#0F172A"/>
  <rect x="198" y="469" width="12" height="92" fill="#0F172A"/>
  <text x="125" y="509" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Read</text>
  <text x="125" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">STEP 4</text>
  <text x="228" y="507" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">GET /v2/transcript/{id}/srt</text>
  <text x="228" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">text, utterances, words, SRT, VTT</text>
  <rect x="624" y="469" width="536" height="92" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="648" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1D4ED8">Webhooks and cleanup</text>
  <text x="648" y="531" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">A webhook sends only the ID and a status, so fetch the text.</text>
  <text x="648" y="551" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#334155">DELETE /v2/transcript/{id} removes the transcript early.</text>
</svg>
