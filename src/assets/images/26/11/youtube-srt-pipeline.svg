<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Video to SRT pipeline: yt-dlp downloads the video, ffmpeg extracts a mono audio track, the script uploads it to AssemblyAI and starts one job, waits for it, then writes a transcript, an SRT, a VTT, a speaker-labelled SRT, and a chapter list">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="474" y="22" width="252" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">VIDEO TO SRT PIPELINE</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">One script, five steps, eight files</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Each step is a command you can run by hand. The script only chains them</text>

  <!-- Arrows -->
  <path d="M 252 225 L 272 225" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 484 225 L 504 225" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 716 225 L 736 225" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 948 225 L 968 225" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="40" y="150" width="208" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="150" width="208" height="42" rx="12" fill="#0F172A"/>
  <rect x="40" y="180" width="208" height="12" fill="#0F172A"/>
  <text x="56" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1. Download</text>
  <text x="56" y="222" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">yt-dlp</text>
  <text x="56" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">video up to 720p</text>
  <text x="56" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">into its own folder</text>

  <!-- Step 2 -->
  <rect x="272" y="150" width="208" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="272" y="150" width="208" height="42" rx="12" fill="#0F172A"/>
  <rect x="272" y="180" width="208" height="12" fill="#0F172A"/>
  <text x="288" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2. Extract</text>
  <text x="288" y="222" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1D4ED8">ffmpeg</text>
  <text x="288" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">mono 16 kHz MP3</text>
  <text x="288" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">58 MB down to 4.4 MB</text>

  <!-- Step 3 -->
  <rect x="504" y="150" width="208" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="504" y="150" width="208" height="42" rx="12" fill="#0F172A"/>
  <rect x="504" y="180" width="208" height="12" fill="#0F172A"/>
  <text x="520" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3. Upload</text>
  <text x="520" y="222" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#1D4ED8">POST /v2/upload</text>
  <text x="520" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">audio.mp3 as raw</text>
  <text x="520" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">bytes, about 2 s</text>

  <!-- Step 4 -->
  <rect x="736" y="150" width="208" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="736" y="150" width="208" height="42" rx="12" fill="#0F172A"/>
  <rect x="736" y="180" width="208" height="12" fill="#0F172A"/>
  <text x="752" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4. Job</text>
  <text x="752" y="222" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1D4ED8">POST /v2/transcript</text>
  <text x="752" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">speaker labels and</text>
  <text x="752" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">chapters, about 12 s</text>

  <!-- Step 5 -->
  <rect x="968" y="150" width="208" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="968" y="150" width="208" height="42" rx="12" fill="#0F172A"/>
  <rect x="968" y="180" width="208" height="12" fill="#0F172A"/>
  <text x="984" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5. Collect</text>
  <text x="984" y="222" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1D4ED8">GET .../srt</text>
  <text x="984" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">poll until done,</text>
  <text x="984" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155">then write the files</text>

  <!-- Outputs panel -->
  <rect x="40" y="334" width="1136" height="200" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="64" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">What lands in the video folder</text>

  <text x="64" y="404" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">VIDEO_ID.mp4</text>
  <text x="64" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">the downloaded video</text>
  <text x="64" y="456" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">audio.mp3</text>
  <text x="64" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">the track that was uploaded</text>
  <text x="64" y="508" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">transcript.json</text>
  <text x="64" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">words, timings, speakers, summary</text>

  <text x="450" y="404" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">transcript.txt</text>
  <text x="450" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">plain text</text>
  <text x="450" y="456" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">subtitles.srt / .vtt</text>
  <text x="450" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">cues of up to 32 characters</text>
  <text x="450" y="508" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">speakers.srt</text>
  <text x="450" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">cues that break at speaker turns</text>

  <text x="850" y="404" font-family="ui-monospace, monospace" font-size="14.5" font-weight="700" fill="#1D4ED8">chapters.txt</text>
  <text x="850" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">timestamps and headlines</text>
  <text x="850" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">9-minute test film</text>
  <text x="850" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">2 s upload, 12 s job, 4 cents</text>

  <text x="600" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Timings from a 9:15 public-domain film run with yt-dlp 2026.08.19, ffmpeg 6.1.1, and AssemblyAI STT-3.7</text>
</svg>
