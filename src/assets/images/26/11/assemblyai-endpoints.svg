<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="The four AssemblyAI endpoints: pre-recorded, realtime, realtime-agent, and dictation, with model ids, prices, and best uses">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#F8FAFC"/>
  <rect width="1200" height="700" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="452" y="24" width="296" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">ASSEMBLYAI ENDPOINTS</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">Which endpoint handles which audio</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Four entry points, four prices. Pick by who is listening: nobody, a meeting, an agent, or a person typing</text>

  <!-- Card 1: recorded file -->
  <rect x="40" y="142" width="548" height="226" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="142" width="548" height="46" rx="12" fill="#0F172A"/>
  <rect x="40" y="176" width="548" height="12" fill="#0F172A"/>
  <text x="64" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Recorded file</text>
  <text x="64" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563EB" letter-spacing="0.8">PRE-RECORDED API</text>
  <text x="564" y="218" font-family="ui-monospace, monospace" font-size="14" fill="#1D4ED8" text-anchor="end">assemblyai-stt-3-7</text>
  <text x="64" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#0F172A">$0.21</text>
  <text x="174" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">per audio hour</text>
  <circle cx="68" cy="298" r="3.5" fill="#2563EB"/>
  <text x="84" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">Upload, submit, poll or webhook</text>
  <circle cx="68" cy="324" r="3.5" fill="#2563EB"/>
  <text x="84" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">Files up to 10 hours and 5 GB, speaker labels +$0.02/hr</text>
  <circle cx="68" cy="350" r="3.5" fill="#2563EB"/>
  <text x="84" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">Best for meetings, podcasts, and call archives</text>

  <!-- Card 2: live meeting -->
  <rect x="612" y="142" width="548" height="226" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="612" y="142" width="548" height="46" rx="12" fill="#0F172A"/>
  <rect x="612" y="176" width="548" height="12" fill="#0F172A"/>
  <text x="636" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Live meeting</text>
  <text x="636" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563EB" letter-spacing="0.8">STREAMING API</text>
  <text x="1136" y="218" font-family="ui-monospace, monospace" font-size="14" fill="#1D4ED8" text-anchor="end">assemblyai-stt-3-7-realtime</text>
  <text x="636" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#0F172A">$0.30</text>
  <text x="746" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">per session hour</text>
  <circle cx="640" cy="298" r="3.5" fill="#2563EB"/>
  <text x="656" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">Billed by session time, so idle sockets cost money</text>
  <circle cx="640" cy="324" r="3.5" fill="#2563EB"/>
  <text x="656" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">32 languages in one stream, speaker labels +$0.12/hr</text>
  <circle cx="640" cy="350" r="3.5" fill="#2563EB"/>
  <text x="656" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">Best for captions, notetakers, and agent assist</text>

  <!-- Card 3: voice agent -->
  <rect x="40" y="382" width="548" height="226" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="382" width="548" height="46" rx="12" fill="#0F172A"/>
  <rect x="40" y="416" width="548" height="12" fill="#0F172A"/>
  <text x="64" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Voice agent</text>
  <text x="64" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563EB" letter-spacing="0.8">STREAMING API</text>
  <text x="564" y="458" font-family="ui-monospace, monospace" font-size="14" fill="#1D4ED8" text-anchor="end">assemblyai-stt-3-7-realtime-agent</text>
  <text x="64" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#0F172A">$0.45</text>
  <text x="174" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">per session hour</text>
  <circle cx="68" cy="538" r="3.5" fill="#2563EB"/>
  <text x="84" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">End-of-turn decisions built into the model</text>
  <circle cx="68" cy="564" r="3.5" fill="#2563EB"/>
  <text x="84" y="569" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">Keyterms included, speaker labels +$0.12/hr</text>
  <circle cx="68" cy="590" r="3.5" fill="#2563EB"/>
  <text x="84" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">Best for phone and web voice agents</text>

  <!-- Card 4: voice typing -->
  <rect x="612" y="382" width="548" height="226" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="612" y="382" width="548" height="46" rx="12" fill="#0F172A"/>
  <rect x="612" y="416" width="548" height="12" fill="#0F172A"/>
  <text x="636" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Voice typing</text>
  <text x="636" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563EB" letter-spacing="0.8">DICTATION API</text>
  <text x="1136" y="458" font-family="ui-monospace, monospace" font-size="14" fill="#1D4ED8" text-anchor="end">universal-3-6-pro + LLM cleanup</text>
  <text x="636" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#0F172A">$0.62</text>
  <text x="746" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">per audio hour</text>
  <circle cx="640" cy="538" r="3.5" fill="#2563EB"/>
  <text x="656" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">One HTTPS request, cleaned text in under 2 s on my clip</text>
  <circle cx="640" cy="564" r="3.5" fill="#2563EB"/>
  <text x="656" y="569" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#334155">Recordings up to 20 minutes, no second LLM bill</text>
  <circle cx="640" cy="590" r="3.5" fill="#2563EB"/>
  <text x="656" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">Best for push-to-talk and dictation apps</text>

  <!-- Note -->
  <rect x="40" y="628" width="1120" height="58" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="654" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">A file nobody waits on is the cheapest input. A person waiting costs the most.</text>
  <text x="600" y="676" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Set the model in every request: AssemblyAI's docs say the default model can differ between free and paid accounts</text>
</svg>
