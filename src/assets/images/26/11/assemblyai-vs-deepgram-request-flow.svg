<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Request flow comparison: Deepgram takes one HTTP POST and returns the transcript in the same response, while AssemblyAI uploads the file, submits a transcript job, waits by polling or webhook, and then fetches the result">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="513" y="22" width="174" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">REQUEST FLOW</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">One request or four steps</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">The same WAV file sent to each pre-recorded API</text>

  <!-- Lane 1: Deepgram -->
  <rect x="40" y="142" width="1120" height="36" rx="10" fill="#0F172A"/>
  <text x="60" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Deepgram: one HTTP request returns the transcript</text>

  <rect x="40" y="192" width="536" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">POST /v1/listen</text>
  <text x="60" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#334155">Audio bytes in the request body</text>
  <text x="60" y="284" font-family="ui-monospace, monospace" font-size="13.5" fill="#1D4ED8">?model=nova-3&amp;smart_format=true&amp;diarize_model=latest</text>

  <path d="M 588 250 L 646 250" fill="none" stroke="#64748B" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="664" y="192" width="496" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="684" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Same request, transcript in the response</text>
  <text x="684" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#334155">JSON with text, word timings, and speakers</text>
  <text x="684" y="284" font-family="ui-monospace, monospace" font-size="13.5" fill="#1D4ED8">results.channels[0].alternatives[0]</text>

  <!-- Lane 2: AssemblyAI -->
  <rect x="40" y="330" width="1120" height="36" rx="10" fill="#2563EB"/>
  <text x="60" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">AssemblyAI: four steps, one transcript ID</text>

  <path d="M 297 438 L 323 438" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M 586 438 L 612 438" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M 875 438 L 901 438" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="380" width="253" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="58" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">1. Upload</text>
  <text x="58" y="444" font-family="ui-monospace, monospace" font-size="12.5" fill="#1D4ED8">POST /v2/upload</text>
  <text x="58" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">returns a URL</text>

  <rect x="329" y="380" width="253" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="347" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">2. Submit</text>
  <text x="347" y="444" font-family="ui-monospace, monospace" font-size="12.5" fill="#1D4ED8">POST /v2/transcript</text>
  <text x="347" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">returns an ID</text>

  <rect x="618" y="380" width="253" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="636" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">3. Wait</text>
  <text x="636" y="444" font-family="ui-monospace, monospace" font-size="12.5" fill="#1D4ED8">GET /v2/transcript/{id}</text>
  <text x="636" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">poll or webhook</text>

  <rect x="907" y="380" width="253" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="925" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">4. Fetch the result</text>
  <text x="925" y="444" font-family="ui-monospace, monospace" font-size="12.5" fill="#1D4ED8">GET /v2/transcript/{id}/srt</text>
  <text x="925" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">text, SRT, VTT</text>

  <!-- Footer -->
  <text x="600" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569" text-anchor="middle">Deepgram: 2 GB file cap and a 504 if processing runs past 10 minutes. About 455x real time on files.</text>
  <text x="600" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569" text-anchor="middle">AssemblyAI: 5 GB and 10-hour files, 200 parallel jobs when paid. About 109x real time plus the queue.</text>
</svg>
