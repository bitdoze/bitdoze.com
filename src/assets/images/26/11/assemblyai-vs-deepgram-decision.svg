<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Decision diagram: exact names and numbers, a BAA without a sales call, or files over 2 GB point to AssemblyAI; big backlogs, many live streams, own GPUs, or Australia and India regions point to Deepgram">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="534" y="22" width="132" height="32" rx="16" fill="#DBEAFE"/>
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">DECISION</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">Start from the constraint, not the brand</text>
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Read the questions top to bottom and stop at the first one that is true</text>

  <!-- Row 1 -->
  <rect x="40" y="146" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Must names, numbers, and product terms come out exact?</text>
  <text x="60" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Support calls, dictation, anything a person will copy</text>
  <path d="M 648 186 L 730 186" fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="740" y="146" width="420" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="760" y="159" width="124" height="28" rx="14" fill="#2563EB"/>
  <text x="822" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AssemblyAI</text>
  <text x="896" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Leads all four leaderboards</text>
  <text x="760" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">2.5% against 5.2% word error rate on files</text>

  <!-- Row 2 -->
  <rect x="40" y="246" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Need a BAA without a sales call, or files over 2 GB?</text>
  <text x="60" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Meetings, podcasts, long interviews</text>
  <path d="M 648 286 L 730 286" fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="740" y="246" width="420" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="760" y="259" width="124" height="28" rx="14" fill="#2563EB"/>
  <text x="822" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AssemblyAI</text>
  <text x="896" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">BAA without a sales call</text>
  <text x="760" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">10-hour and 5 GB files at $0.21 an hour</text>

  <!-- Row 3 -->
  <rect x="40" y="346" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Do big backlogs or many live streams set your cost?</text>
  <text x="60" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Nightly batch jobs, high-volume streaming</text>
  <path d="M 648 386 L 730 386" fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="740" y="346" width="420" height="80" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <rect x="760" y="359" width="124" height="28" rx="14" fill="#0F172A"/>
  <text x="822" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Deepgram</text>
  <text x="896" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">About 4x faster on files</text>
  <text x="760" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">One-call API, $200 credit, speaker labels included</text>

  <!-- Row 4 -->
  <rect x="40" y="446" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Must the audio run on your own GPUs or in AU or IN?</text>
  <text x="60" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Regulated or air-gapped deployments</text>
  <path d="M 648 486 L 730 486" fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="740" y="446" width="420" height="80" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <rect x="760" y="459" width="124" height="28" rx="14" fill="#0F172A"/>
  <text x="822" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Deepgram</text>
  <text x="896" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Runs on your own GPUs</text>
  <text x="760" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#475569">Enterprise self-hosting, US, EU, AU, and IN endpoints</text>

  <text x="600" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#475569" text-anchor="middle">Tie-breaker: send one real file through both and score the transcripts. Jargon decides it.</text>
</svg>
