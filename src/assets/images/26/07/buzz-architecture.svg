<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">BUZZ RELAY ARCHITECTURE</text>

  <!-- Desktop App (left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="170" width="180" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="170" width="180" height="36" rx="12" fill="url(#appGrad)"/>
    <rect x="40" y="194" width="180" height="12" fill="url(#appGrad)"/>
    <text x="130" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">DESKTOP APP</text>
    <text x="130" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Tauri 2 (React)</text>
    <text x="130" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Mac / Win / Linux</text>
    <text x="130" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Nostr Keypair</text>
    <!-- Screen icon -->
    <rect x="108" y="274" width="44" height="4" rx="2" fill="#C7D2FE"/>
  </g>

  <!-- WebSocket arrow from Desktop App to Relay -->
  <line x1="220" y1="230" x2="350" y2="230" stroke="#6366F1" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="345,225 355,230 345,235" fill="#6366F1"/>
  <text x="285" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#6366F1" text-anchor="middle">WebSocket</text>
  <text x="285" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6366F1" text-anchor="middle">NIP-01</text>

  <!-- Relay (center) -->
  <g filter="url(#shadow)">
    <rect x="370" y="140" width="220" height="180" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="370" y="140" width="220" height="42" rx="14" fill="url(#relayGrad)"/>
    <rect x="370" y="168" width="220" height="14" fill="url(#relayGrad)"/>
    <text x="480" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">BUZZ RELAY</text>
    <text x="480" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Rust / Axum</text>
    <text x="480" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">WebSocket + REST</text>
    <text x="480" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Schnorr Signatures</text>
    <text x="480" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Nostr Event Processing</text>
    <text x="480" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">ACP Agent Protocol</text>
    <!-- Gear icon -->
    <circle cx="480" cy="305" r="8" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="480" cy="305" r="3" fill="#C7D2FE"/>
  </g>

  <!-- Postgres (top right) -->
  <g filter="url(#shadow)">
    <rect x="680" y="60" width="220" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="680" y="60" width="220" height="34" rx="12" fill="url(#dbGrad)"/>
    <rect x="680" y="82" width="220" height="12" fill="url(#dbGrad)"/>
    <text x="790" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">POSTGRES 17</text>
    <text x="790" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Event Store</text>
    <text x="790" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Full-Text Search (GIN)</text>
    <text x="790" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Channels · Members · Workflows</text>
    <!-- Cylinder icon -->
    <ellipse cx="880" cy="165" rx="14" ry="4" fill="none" stroke="#A5F3FC" stroke-width="1"/>
  </g>

  <!-- Arrow Relay -> Postgres -->
  <line x1="570" y1="190" x2="680" y2="130" stroke="#0891B2" stroke-width="2"/>
  <polygon points="674,126 684,128 677,135" fill="#0891B2"/>
  <text x="635" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0891B2" text-anchor="middle">SQL</text>

  <!-- Redis (right middle) -->
  <g filter="url(#shadow)">
    <rect x="680" y="210" width="220" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="680" y="210" width="220" height="34" rx="12" fill="url(#redisGrad)"/>
    <rect x="680" y="232" width="220" height="12" fill="url(#redisGrad)"/>
    <text x="790" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">REDIS 7</text>
    <text x="790" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Pub/Sub Fan-out</text>
    <text x="790" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Presence (90s TTL)</text>
    <text x="790" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Typing Indicators</text>
  </g>

  <!-- Arrow Relay -> Redis -->
  <line x1="590" y1="250" x2="680" y2="260" stroke="#DC2626" stroke-width="2"/>
  <polygon points="675,256 684,260 675,265" fill="#DC2626"/>
  <text x="640" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#DC2626" text-anchor="middle">Pub/Sub</text>

  <!-- MinIO (bottom right) -->
  <g filter="url(#shadow)">
    <rect x="680" y="350" width="220" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="680" y="350" width="220" height="34" rx="12" fill="url(#s3Grad)"/>
    <rect x="680" y="372" width="220" height="12" fill="url(#s3Grad)"/>
    <text x="790" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">MINIO (S3)</text>
    <text x="790" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Media Storage (Blossom)</text>
    <text x="790" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Git Packfiles</text>
    <text x="790" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">buzz-media Bucket</text>
  </g>

  <!-- Arrow Relay -> MinIO -->
  <line x1="570" y1="310" x2="680" y2="390" stroke="#059669" stroke-width="2"/>
  <polygon points="674,386 684,390 677,397" fill="#059669"/>
  <text x="635" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#059669" text-anchor="middle">S3 API</text>

  <!-- AI Agents (bottom left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="180" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="340" width="180" height="34" rx="12" fill="#7C3AED"/>
    <rect x="40" y="362" width="180" height="12" fill="#7C3AED"/>
    <text x="130" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">AI AGENTS</text>
    <text x="130" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Claude Code · Codex</text>
    <text x="130" y="413" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Goose · Custom</text>
    <text x="130" y="431" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Own Nostr Keypair</text>
  </g>

  <!-- Arrow Agents -> Relay -->
  <line x1="220" y1="395" x2="370" y2="290" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="365,286 374,290 366,297" fill="#7C3AED"/>
  <text x="290" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">ACP</text>

  <!-- Legend -->
  <g transform="translate(40, 490)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">SIGNED NOSTR EVENTS</text>
    <circle cx="190" cy="-3" r="3" fill="#6366F1" opacity="0.4"/>
    <circle cx="210" cy="-3" r="3" fill="#06B6D4" opacity="0.4"/>
    <circle cx="230" cy="-3" r="3" fill="#EC4899" opacity="0.4"/>
  </g>
</svg>