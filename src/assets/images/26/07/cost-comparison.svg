<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="buzzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="saasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="barBuzz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="barSaas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" fill="url(#bgGrad)"/>
  <rect width="960" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">COST COMPARISON: 10-PERSON TEAM</text>
  <text x="480" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Monthly cost for chat + git + workflows + AI workspace</text>

  <!-- Buzz Card (left) -->
  <g filter="url(#shadow)">
    <rect x="60" y="95" width="400" height="360" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="95" width="400" height="50" rx="16" fill="url(#buzzGrad)"/>
    <rect x="60" y="130" width="400" height="15" fill="url(#buzzGrad)"/>
    <!-- Checkmark -->
    <circle cx="100" cy="120" r="14" fill="white" opacity="0.2"/>
    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" text-anchor="middle">✓</text>
    <text x="125" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white">BUZZ SELF-HOSTED</text>
  </g>

  <!-- Buzz price -->
  <text x="260" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#buzzGrad)" text-anchor="middle">€4</text>
  <text x="260" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">/month total</text>

  <!-- Buzz features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">
    <text x="100" y="255">✓ Chat, threads, DMs, voice huddles</text>
    <text x="100" y="278">✓ Git hosting + PR review</text>
    <text x="100" y="301">✓ Workflow automation</text>
    <text x="100" y="324">✓ AI agents (first-class members)</text>
    <text x="100" y="347">✓ Full data ownership</text>
    <text x="100" y="370">✓ Unlimited members</text>
  </g>

  <text x="260" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Hetzner CX22 VPS · No per-user fees</text>
  <text x="260" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">+ LLM API costs (bring your own keys)</text>

  <!-- SaaS Card (right) -->
  <g filter="url(#shadow)">
    <rect x="500" y="95" width="400" height="360" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="500" y="95" width="400" height="50" rx="16" fill="url(#saasGrad)"/>
    <rect x="500" y="130" width="400" height="15" fill="url(#saasGrad)"/>
    <circle cx="540" cy="120" r="14" fill="white" opacity="0.2"/>
    <text x="540" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" text-anchor="middle">✗</text>
    <text x="565" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white">SAAS STACK</text>
  </g>

  <!-- SaaS price -->
  <text x="700" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#EF4444" text-anchor="middle">$200+</text>
  <text x="700" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">/month (10 users)</text>

  <!-- SaaS breakdown -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">
    <text x="540" y="250">Slack Pro</text>
    <text x="790" y="250" text-anchor="end" fill="#EF4444" font-weight="600">$87.50/mo</text>
    <text x="540" y="273">GitHub Team</text>
    <text x="790" y="273" text-anchor="end" fill="#EF4444" font-weight="600">$40.00/mo</text>
    <text x="540" y="296">Linear</text>
    <text x="790" y="296" text-anchor="end" fill="#EF4444" font-weight="600">$80.00/mo</text>
    <text x="540" y="319">AI coding tools</text>
    <text x="790" y="319" text-anchor="end" fill="#EF4444" font-weight="600">$200+/mo</text>
  </g>

  <!-- Divider line -->
  <line x1="540" y1="335" x2="860" y2="335" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Total</text>
  <text x="860" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EF4444" text-anchor="end">~$407+/mo</text>

  <text x="700" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Per-user pricing · Data on their servers</text>
  <text x="700" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">+ Context switching between tools</text>

  <!-- Savings callout -->
  <g transform="translate(480, 468)">
    <rect x="-180" y="-18" width="360" height="32" rx="16" fill="#4F46E5" opacity="0.08"/>
    <rect x="-180" y="-18" width="360" height="32" rx="16" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="middle">Save $4,800+/year with Buzz self-hosted</text>
  </g>
</svg>