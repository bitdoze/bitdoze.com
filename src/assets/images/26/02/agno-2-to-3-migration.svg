<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="56" text-anchor="middle" fill="white" font-size="36" font-family="system-ui, sans-serif" font-weight="bold">Agno 2 → 3 migration flow</text>
  <text x="640" y="90" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="17" font-family="system-ui, sans-serif">Backup first. Verify before you clean anything up.</text>

  <!-- Step 1 -->
  <rect x="30" y="200" width="340" height="150" rx="12" fill="#334155"/>
  <circle cx="70" cy="240" r="22" fill="#f59e0b"/>
  <text x="70" y="248" text-anchor="middle" fill="#1a1a2e" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">1</text>
  <text x="210" y="275" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Stop the bot</text>
  <text x="210" y="308" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">systemctl --user stop bitdoze-bot</text>
  <text x="210" y="330" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">no writers during migration</text>

  <line x1="370" y1="275" x2="428" y2="275" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="430" y="200" width="340" height="150" rx="12" fill="#334155"/>
  <circle cx="470" cy="240" r="22" fill="#f59e0b"/>
  <text x="470" y="248" text-anchor="middle" fill="#1a1a2e" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">2</text>
  <text x="610" y="275" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Restorable backup</text>
  <text x="610" y="308" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">data/bitdoze.db</text>
  <text x="610" y="330" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">+ data/lancedb + cognee data</text>

  <line x1="770" y1="275" x2="828" y2="275" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="830" y="200" width="420" height="150" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="870" cy="240" r="22" fill="#f59e0b"/>
  <text x="870" y="248" text-anchor="middle" fill="#1a1a2e" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">3</text>
  <text x="1050" y="275" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Run MigrationManager(db).up()</text>
  <text x="1050" y="308" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">runs move from a JSON blob</text>
  <text x="1050" y="330" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">into the agno_runs table</text>

  <!-- Row 2 -->
  <line x1="1050" y1="350" x2="1050" y2="428" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="830" y="430" width="420" height="150" rx="12" fill="#14532d"/>
  <circle cx="870" cy="470" r="22" fill="#22c55e"/>
  <text x="870" y="478" text-anchor="middle" fill="#1a1a2e" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">4</text>
  <text x="1050" y="505" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Verify db.get_runs()</text>
  <text x="1050" y="538" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">inspect history — do not assume</text>
  <text x="1050" y="560" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">the migration succeeded</text>

  <line x1="830" y1="505" x2="772" y2="505" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="430" y="430" width="340" height="150" rx="12" fill="#14532d"/>
  <circle cx="470" cy="470" r="22" fill="#22c55e"/>
  <text x="470" y="478" text-anchor="middle" fill="#1a1a2e" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">5</text>
  <text x="610" y="505" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Resume the bot</text>
  <text x="610" y="538" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">systemctl --user start bitdoze-bot</text>
  <text x="610" y="560" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">run uv run pytest -q</text>

  <line x1="430" y1="505" x2="372" y2="505" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 6 (optional, last) -->
  <rect x="30" y="430" width="340" height="150" rx="12" fill="#1c1916" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="70" cy="470" r="22" fill="#ef4444"/>
  <text x="70" y="478" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">6</text>
  <text x="210" y="505" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Optional cleanup (last)</text>
  <text x="210" y="538" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">cleanup_legacy_runs_column(force=True)</text>
  <text x="210" y="560" text-anchor="middle" fill="#ef4444" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">permanently drops legacy history</text>

  <text x="640" y="660" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="15" font-family="system-ui, sans-serif">Steps 1–2 are mandatory. Skip step 6 until the bot has run cleanly on Agno 3 for a while.</text>
</svg>
