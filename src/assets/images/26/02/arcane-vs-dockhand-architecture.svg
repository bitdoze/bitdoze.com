<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#f8fafc"/>

  <!-- ===================== Arcane panel ===================== -->
  <rect x="20" y="20" width="420" height="440" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <path d="M20 32 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v36 h-420 z" fill="#6366f1"/>
  <rect x="20" y="56" width="420" height="12" fill="#6366f1"/>
  <text x="230" y="52" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Arcane</text>

  <!-- Arcane main app box -->
  <rect x="50" y="92" width="360" height="118" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="230" y="118" text-anchor="middle" fill="#312e81" font-size="15" font-weight="600">manager container (Go) :3552</text>
  <text x="230" y="142" text-anchor="middle" fill="#4338ca" font-size="12.5">SvelteKit frontend + REST API + CLI</text>
  <text x="230" y="164" text-anchor="middle" fill="#4338ca" font-size="12.5">SQLite data volume, Rustic backups</text>
  <text x="230" y="186" text-anchor="middle" fill="#4338ca" font-size="12.5">ML-DSA-87 session and edge signing</text>

  <!-- arrows down -->
  <line x1="150" y1="210" x2="150" y2="248" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <line x1="310" y1="210" x2="310" y2="248" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- Docker socket -->
  <rect x="55" y="254" width="175" height="72" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="142" y="283" text-anchor="middle" fill="#312e81" font-size="13" font-weight="600">Docker socket</text>
  <text x="142" y="305" text-anchor="middle" fill="#6b7280" font-size="11">/var/run/docker.sock</text>

  <!-- arcane-agent -->
  <rect x="250" y="254" width="155" height="72" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="327" y="278" text-anchor="middle" fill="#312e81" font-size="13" font-weight="600">arcane-agent</text>
  <text x="327" y="298" text-anchor="middle" fill="#6b7280" font-size="11">multiplexed edge tunnel</text>
  <text x="327" y="315" text-anchor="middle" fill="#6b7280" font-size="11">self-upgrading binary</text>

  <!-- Arcane remote hosts -->
  <rect x="55" y="358" width="350" height="76" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="230" y="386" text-anchor="middle" fill="#3730a3" font-size="13" font-weight="600">Remote hosts</text>
  <text x="230" y="408" text-anchor="middle" fill="#4338ca" font-size="11">linux / darwin &#183; amd64 &#183; arm64 &#183; armv7 &#183; riscv64</text>

  <!-- ===================== Dockhand panel ===================== -->
  <rect x="480" y="20" width="420" height="440" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <path d="M480 32 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v36 h-420 z" fill="#10b981"/>
  <rect x="480" y="56" width="420" height="12" fill="#10b981"/>
  <text x="690" y="52" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Dockhand</text>

  <!-- Dockhand main app box -->
  <rect x="510" y="92" width="360" height="118" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="690" y="118" text-anchor="middle" fill="#064e3b" font-size="15" font-weight="600">container (Bun + SvelteKit) :3000</text>
  <text x="690" y="142" text-anchor="middle" fill="#047857" font-size="12.5">SQLite default / PostgreSQL 14+ optional</text>
  <text x="690" y="164" text-anchor="middle" fill="#047857" font-size="12.5">Wolfi / apko image, small attack surface</text>
  <text x="690" y="186" text-anchor="middle" fill="#047857" font-size="12.5">auto-generated ENCRYPTION_KEY (AES-256)</text>

  <!-- arrows down -->
  <line x1="610" y1="210" x2="610" y2="248" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="770" y1="210" x2="770" y2="248" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Docker socket -->
  <rect x="515" y="254" width="175" height="72" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="602" y="283" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="600">Docker socket</text>
  <text x="602" y="305" text-anchor="middle" fill="#6b7280" font-size="11">/var/run/docker.sock</text>

  <!-- Hawser -->
  <rect x="710" y="254" width="155" height="72" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="787" y="278" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="600">Hawser</text>
  <text x="787" y="298" text-anchor="middle" fill="#6b7280" font-size="11">outbound WebSocket</text>
  <text x="787" y="315" text-anchor="middle" fill="#6b7280" font-size="11">NAT / firewall traversal</text>

  <!-- Dockhand remote hosts -->
  <rect x="515" y="358" width="350" height="76" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="690" y="386" text-anchor="middle" fill="#065f46" font-size="13" font-weight="600">Remote hosts behind NAT / firewall</text>
  <text x="690" y="408" text-anchor="middle" fill="#047857" font-size="11">no inbound ports needed (Edge mode)</text>
</svg>
