<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="400" fill="#1a1a2e" rx="12"/>
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Pick your shell: decision flow</text>

  <!-- Q1 -->
  <rect x="260" y="60" width="280" height="44" rx="8" fill="#2d2d44" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="87" text-anchor="middle" fill="#e0e0e0" font-size="13">Do you write portable shell scripts?</text>

  <!-- Q1 Yes arrow -->
  <line x1="330" y1="104" x2="160" y2="168" stroke="#4ec9b0" stroke-width="2"/>
  <polygon points="160,168 172,162 168,175" fill="#4ec9b0"/>
  <text x="230" y="138" fill="#4ec9b0" font-size="11" font-weight="600">Yes</text>

  <!-- Q1 No arrow to Q2 -->
  <line x1="470" y1="104" x2="520" y2="148" stroke="#888" stroke-width="2"/>
  <polygon points="520,148 508,142 512,154" fill="#888"/>
  <text x="510" y="130" fill="#888" font-size="11" font-weight="600">No</text>

  <!-- Bash result -->
  <rect x="70" y="172" width="180" height="56" rx="10" fill="#e06c75" opacity="0.15" stroke="#e06c75" stroke-width="2"/>
  <text x="160" y="196" text-anchor="middle" fill="#e06c75" font-size="16" font-weight="700">Bash</text>
  <text x="160" y="214" text-anchor="middle" fill="#e06c75" font-size="10">Portable scripts, servers, CI</text>

  <!-- Q2 -->
  <rect x="390" y="152" width="280" height="44" rx="8" fill="#2d2d44" stroke="#555" stroke-width="1.5"/>
  <text x="530" y="179" text-anchor="middle" fill="#e0e0e0" font-size="13">Want zero-config interactive UX?</text>

  <!-- Q2 Yes arrow -->
  <line x1="460" y1="196" x2="300" y2="268" stroke="#4ec9b0" stroke-width="2"/>
  <polygon points="300,268 312,262 308,275" fill="#4ec9b0"/>
  <text x="355" y="232" fill="#4ec9b0" font-size="11" font-weight="600">Yes</text>

  <!-- Q2 No arrow -->
  <line x1="600" y1="196" x2="660" y2="248" stroke="#888" stroke-width="2"/>
  <polygon points="660,248 648,242 652,254" fill="#888"/>
  <text x="645" y="222" fill="#888" font-size="11" font-weight="600">No</text>

  <!-- Fish result -->
  <rect x="200" y="272" width="190" height="56" rx="10" fill="#4ec9b0" opacity="0.15" stroke="#4ec9b0" stroke-width="2"/>
  <text x="295" y="296" text-anchor="middle" fill="#4ec9b0" font-size="16" font-weight="700">Fish</text>
  <text x="295" y="314" text-anchor="middle" fill="#4ec9b0" font-size="10">Autocomplete &amp; highlighting built in</text>

  <!-- Zsh result -->
  <rect x="560" y="272" width="190" height="56" rx="10" fill="#e8a838" opacity="0.15" stroke="#e8a838" stroke-width="2"/>
  <text x="655" y="296" text-anchor="middle" fill="#e8a838" font-size="16" font-weight="700">Zsh</text>
  <text x="655" y="314" text-anchor="middle" fill="#e8a838" font-size="10">Oh My Zsh, themes, Bash-like syntax</text>

  <!-- Legend -->
  <text x="400" y="370" text-anchor="middle" fill="#666" font-size="10">Login shell is separate from script shell. Keep automation scripts #!/bin/bash regardless.</text>
</svg>
