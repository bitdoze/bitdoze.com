<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="56" text-anchor="middle" fill="white" font-size="36" font-family="system-ui, sans-serif" font-weight="bold">bitdoze_bot architecture</text>
  <text x="640" y="90" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="17" font-family="system-ui, sans-serif">Discord mention → Agno runtime → agents, teams, stores, tools</text>

  <!-- Discord -->
  <rect x="30" y="200" width="190" height="130" rx="12" fill="#5865F2"/>
  <text x="125" y="250" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Discord</text>
  <text x="125" y="282" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">@mentions</text>
  <text x="125" y="304" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">agent: / team: prefixes</text>

  <line x1="220" y1="265" x2="288" y2="265" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- discord_bot.py -->
  <rect x="290" y="185" width="210" height="160" rx="12" fill="#334155"/>
  <text x="395" y="225" text-anchor="middle" fill="white" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">discord_bot.py</text>
  <text x="395" y="258" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">streaming message edits</text>
  <text x="395" y="280" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">routing rules + aliases</text>
  <text x="395" y="302" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">tool permissions</text>
  <text x="395" y="324" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">access control</text>

  <line x1="500" y1="265" x2="548" y2="265" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agno agents and teams -->
  <rect x="550" y="120" width="280" height="300" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="690" y="152" text-anchor="middle" fill="#a5b4fc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">Agno agents &amp; teams</text>

  <rect x="572" y="172" width="236" height="44" rx="8" fill="#4f46e5"/>
  <text x="690" y="200" text-anchor="middle" fill="white" font-size="13" font-family="system-ui, sans-serif">main · research agents</text>

  <rect x="572" y="228" width="236" height="44" rx="8" fill="#4f46e5"/>
  <text x="690" y="256" text-anchor="middle" fill="white" font-size="13" font-family="system-ui, sans-serif">delivery-team (architect, engineer)</text>

  <rect x="572" y="284" width="236" height="44" rx="8" fill="#4f46e5"/>
  <text x="690" y="312" text-anchor="middle" fill="white" font-size="13" font-family="system-ui, sans-serif">general-subagents (fan-out)</text>

  <rect x="572" y="340" width="236" height="44" rx="8" fill="#312e81"/>
  <text x="690" y="368" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">heartbeat agent (HEARTBEAT_OK)</text>

  <!-- Stores -->
  <line x1="830" y1="200" x2="908" y2="160" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="265" x2="908" y2="265" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="330" x2="908" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="910" y="115" width="340" height="90" rx="12" fill="#14532d"/>
  <text x="1080" y="150" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Memory</text>
  <text x="1080" y="178" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">SQLite (default) or PostgreSQL</text>

  <rect x="910" y="220" width="340" height="90" rx="12" fill="#1e3a8a"/>
  <text x="1080" y="255" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Knowledge base</text>
  <text x="1080" y="283" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">LanceDb or PgVector</text>

  <rect x="910" y="325" width="340" height="90" rx="12" fill="#7c2d12"/>
  <text x="1080" y="360" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Long-term memory</text>
  <text x="1080" y="388" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">Cognee or Hindsight (optional)</text>

  <!-- Bottom row -->
  <rect x="110" y="520" width="320" height="110" rx="12" fill="#334155"/>
  <text x="270" y="558" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Tools</text>
  <text x="270" y="588" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">web_search · website · github</text>
  <text x="270" y="610" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">file · shell · discord · discoveries</text>

  <rect x="480" y="520" width="320" height="110" rx="12" fill="#334155"/>
  <text x="640" y="558" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Automation</text>
  <text x="640" y="588" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">cron jobs (workspace/CRON.yaml)</text>
  <text x="640" y="610" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">heartbeat every 30 minutes</text>

  <rect x="850" y="520" width="320" height="110" rx="12" fill="#334155"/>
  <text x="1010" y="558" text-anchor="middle" fill="white" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Monitoring</text>
  <text x="1010" y="588" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">run telemetry JSONL + watchdog</text>
  <text x="1010" y="610" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">tool audit log · rotating logs</text>

  <line x1="270" y1="520" x2="270" y2="420" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
  <line x1="640" y1="520" x2="640" y2="422" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
  <line x1="1010" y1="520" x2="860" y2="422" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
</svg>
