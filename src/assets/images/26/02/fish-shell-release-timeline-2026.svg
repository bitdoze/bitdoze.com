<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="320" fill="#1a1a2e" rx="12"/>
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Shell release timeline 2022–2026</text>

  <!-- Timeline axis -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#444" stroke-width="3"/>

  <!-- Year markers -->
  <line x1="60" y1="152" x2="60" y2="168" stroke="#666" stroke-width="2"/>
  <text x="60" y="188" text-anchor="middle" fill="#888" font-size="12">2022</text>

  <line x1="230" y1="152" x2="230" y2="168" stroke="#666" stroke-width="2"/>
  <text x="230" y="188" text-anchor="middle" fill="#888" font-size="12">2023</text>

  <line x1="400" y1="152" x2="400" y2="168" stroke="#666" stroke-width="2"/>
  <text x="400" y="188" text-anchor="middle" fill="#888" font-size="12">2024</text>

  <line x1="570" y1="152" x2="570" y2="168" stroke="#666" stroke-width="2"/>
  <text x="570" y="188" text-anchor="middle" fill="#888" font-size="12">2025</text>

  <line x1="740" y1="152" x2="740" y2="168" stroke="#666" stroke-width="2"/>
  <text x="740" y="188" text-anchor="middle" fill="#888" font-size="12">2026</text>

  <!-- zsh 5.9 - May 2022 -->
  <circle cx="95" cy="160" r="8" fill="#e8a838" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="95" y1="152" x2="95" y2="100" stroke="#e8a838" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="25" y="70" width="140" height="32" rx="6" fill="#e8a838" opacity="0.15"/>
  <text x="95" y="83" text-anchor="middle" fill="#e8a838" font-size="11" font-weight="600">Zsh 5.9</text>
  <text x="95" y="96" text-anchor="middle" fill="#e8a838" font-size="10">May 2022 (latest)</text>

  <!-- fish 4.0 Rust - Feb 2025 -->
  <circle cx="553" cy="160" r="8" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="553" y1="152" x2="553" y2="100" stroke="#4ec9b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="480" y="70" width="148" height="32" rx="6" fill="#4ec9b0" opacity="0.15"/>
  <text x="553" y="83" text-anchor="middle" fill="#4ec9b0" font-size="11" font-weight="600">Fish 4.0 (Rust rewrite)</text>
  <text x="553" y="96" text-anchor="middle" fill="#4ec9b0" font-size="10">Feb 2025</text>

  <!-- bash 5.3 - Jul 2025 -->
  <circle cx="610" cy="160" r="8" fill="#e06c75" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="610" y1="168" x2="610" y2="218" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="545" y="218" width="130" height="32" rx="6" fill="#e06c75" opacity="0.15"/>
  <text x="610" y="231" text-anchor="middle" fill="#e06c75" font-size="11" font-weight="600">Bash 5.3</text>
  <text x="610" y="244" text-anchor="middle" fill="#e06c75" font-size="10">Jul 2025</text>

  <!-- fish 4.5-4.9.3 cluster - Feb-Sep 2026 -->
  <circle cx="680" cy="160" r="8" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="700" cy="160" r="6" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="715" cy="160" r="5" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="727" cy="160" r="4" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="700" y1="152" x2="700" y2="100" stroke="#4ec9b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="632" y="70" width="138" height="32" rx="6" fill="#4ec9b0" opacity="0.15"/>
  <text x="700" y="83" text-anchor="middle" fill="#4ec9b0" font-size="11" font-weight="600">Fish 4.5 → 4.9.3</text>
  <text x="700" y="96" text-anchor="middle" fill="#4ec9b0" font-size="10">Feb–Sep 2026 (6 releases)</text>

  <!-- Legend -->
  <rect x="60" y="275" width="12" height="12" rx="3" fill="#4ec9b0"/>
  <text x="78" y="285" fill="#aaa" font-size="11">Fish</text>
  <rect x="130" y="275" width="12" height="12" rx="3" fill="#e06c75"/>
  <text x="148" y="285" fill="#aaa" font-size="11">Bash</text>
  <rect x="195" y="275" width="12" height="12" rx="3" fill="#e8a838"/>
  <text x="213" y="285" fill="#aaa" font-size="11">Zsh</text>
</svg>
