<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Goal Mode iteration loop</text>

  <!-- Set objective -->
  <rect x="250" y="52" width="220" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="79" text-anchor="middle" fill="#1e40af" font-weight="600">Set objective  (/goal …)</text>

  <!-- Arrow down -->
  <line x1="360" y1="96" x2="360" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent round -->
  <rect x="250" y="128" width="220" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" fill="#3730a3" font-weight="600">Agent iteration round</text>

  <!-- Arrow down -->
  <line x1="360" y1="172" x2="360" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evidence check -->
  <rect x="205" y="204" width="310" height="56" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="360" y="226" text-anchor="middle" fill="#854d0e" font-weight="600">Evidence check</text>
  <text x="360" y="246" text-anchor="middle" fill="#854d0e" font-size="12">changed files &#183; command output &#183; test results</text>

  <!-- Arrow right to Complete -->
  <line x1="515" y1="232" x2="580" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="548" y="222" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">verified</text>

  <!-- Complete -->
  <rect x="582" y="210" width="110" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="637" y="237" text-anchor="middle" fill="#166534" font-weight="600">Complete &#10003;</text>

  <!-- Arrow down-left to Next round -->
  <line x1="360" y1="260" x2="360" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="284" fill="#475569" font-size="12">not met</text>

  <!-- Next round -->
  <rect x="250" y="298" width="220" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" fill="#3730a3" font-weight="600">Next round &#10227;</text>

  <!-- Loop back arrow -->
  <path d="M 250 320 L 180 320 L 180 150 L 248 150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="172" y="240" text-anchor="middle" fill="#6366f1" font-size="12" transform="rotate(-90 172 240)">continue iterating</text>

  <!-- Stop branch -->
  <line x1="250" y1="150" x2="120" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="140" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="600">stop task</text>

  <!-- Auto-pause -->
  <rect x="18" y="128" width="100" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="68" y="148" text-anchor="middle" fill="#991b1b" font-weight="600" font-size="12">Goal</text>
  <text x="68" y="163" text-anchor="middle" fill="#991b1b" font-weight="600" font-size="12">auto-paused</text>

  <!-- Unfinished to-do note -->
  <rect x="480" y="310" width="220" height="52" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="590" y="331" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="600">Any unfinished to-do item</text>
  <text x="590" y="349" text-anchor="middle" fill="#9a3412" font-size="12">blocks the "complete" verdict</text>
</svg>
