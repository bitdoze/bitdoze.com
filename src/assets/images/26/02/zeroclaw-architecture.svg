<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Channels -->
  <rect x="30" y="30" width="180" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Channels</text>
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#3b82f6">Discord · Telegram · Slack</text>
  <text x="120" y="95" text-anchor="middle" font-size="11" fill="#3b82f6">Matrix · Email · Webhook</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#3b82f6">30+ total</text>

  <!-- Gateway / ACP -->
  <rect x="30" y="160" width="180" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Gateway / ACP</text>
  <text x="120" y="210" text-anchor="middle" font-size="11" fill="#6366f1">127.0.0.1:42617</text>
  <text x="120" y="227" text-anchor="middle" font-size="11" fill="#6366f1">Pairing required</text>

  <!-- Arrow: channels -> runtime -->
  <line x1="210" y1="80" x2="310" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: gateway -> runtime -->
  <line x1="210" y1="200" x2="310" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Runtime -->
  <rect x="310" y="100" width="200" height="220" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ZeroClaw Runtime</text>
  <rect x="330" y="150" width="160" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="410" y="175" text-anchor="middle" font-size="11" fill="#92400e">Agents (multi-agent)</text>
  <rect x="330" y="200" width="160" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#92400e">Risk Profiles</text>
  <rect x="330" y="250" width="160" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="410" y="275" text-anchor="middle" font-size="11" fill="#92400e">Tool Dispatch + Receipts</text>

  <!-- Arrow: runtime -> providers -->
  <line x1="510" y1="150" x2="590" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: runtime -> tools -->
  <line x1="510" y1="210" x2="590" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: runtime -> memory -->
  <line x1="510" y1="280" x2="590" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Providers -->
  <rect x="590" y="50" width="180" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="680" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Providers</text>
  <text x="680" y="98" text-anchor="middle" font-size="11" fill="#22c55e">MiniMax · Z.AI · OpenRouter</text>
  <text x="680" y="115" text-anchor="middle" font-size="11" fill="#22c55e">Ollama · Anthropic · 20+</text>

  <!-- Tools -->
  <rect x="590" y="170" width="180" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="680" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">Tools</text>
  <text x="680" y="218" text-anchor="middle" font-size="11" fill="#ec4899">Web Search · Shell · Browser</text>
  <text x="680" y="235" text-anchor="middle" font-size="11" fill="#ec4899">Skills · Plugins (WASM)</text>

  <!-- Memory -->
  <rect x="590" y="290" width="180" height="80" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="680" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Memory</text>
  <text x="680" y="338" text-anchor="middle" font-size="11" fill="#0ea5e9">SQLite · Postgres · Qdrant</text>
  <text x="680" y="355" text-anchor="middle" font-size="11" fill="#0ea5e9">Hybrid search (FTS5 + vectors)</text>
</svg>
