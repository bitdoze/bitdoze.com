<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="720" height="680" fill="#111827" rx="10"/>
  <text x="360" y="32" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">How fish resolves a function call</text>

  <!-- start -->
  <rect x="110" y="58" width="240" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="81" fill="#e2e8f0" font-size="12" text-anchor="middle">you run: weather</text>
  <line x1="230" y1="94" x2="230" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="118" fill="#94a3b8" font-size="10">search $fish_function_path</text>

  <!-- search 1 -->
  <rect x="30" y="132" width="400" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="155" fill="#e2e8f0" font-size="11" text-anchor="middle">1. ~/.config/fish/functions/weather.fish</text>
  <text x="230" y="172" fill="#94a3b8" font-size="10" text-anchor="middle">your functions (XDG_CONFIG_HOME)</text>

  <!-- search 2 -->
  <rect x="30" y="240" width="400" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="263" fill="#e2e8f0" font-size="11" text-anchor="middle">2. /etc/fish/functions/weather.fish</text>
  <text x="230" y="280" fill="#94a3b8" font-size="10" text-anchor="middle">system-wide functions</text>

  <!-- search 3 -->
  <rect x="30" y="348" width="400" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="371" fill="#e2e8f0" font-size="11" text-anchor="middle">3. vendor_functions.d/weather.fish</text>
  <text x="230" y="388" fill="#94a3b8" font-size="10" text-anchor="middle">~/.local/share + $XDG_DATA_DIRS entries</text>

  <!-- search 4 -->
  <rect x="30" y="456" width="400" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="479" fill="#e2e8f0" font-size="11" text-anchor="middle">4. external command named weather</text>
  <text x="230" y="496" fill="#94a3b8" font-size="10" text-anchor="middle">searched on $PATH</text>

  <!-- green outcome -->
  <rect x="480" y="185" width="210" height="130" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="585" y="212" fill="#86efac" font-size="12" font-weight="600" text-anchor="middle">load and run it</text>
  <text x="585" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">(lazy autoload)</text>
  <text x="585" y="254" fill="#e2e8f0" font-size="10" text-anchor="middle">first match wins:</text>
  <text x="585" y="270" fill="#e2e8f0" font-size="10" text-anchor="middle">later paths in</text>
  <text x="585" y="286" fill="#e2e8f0" font-size="10" text-anchor="middle">$fish_function_path</text>
  <text x="585" y="302" fill="#e2e8f0" font-size="10" text-anchor="middle">are never read</text>

  <!-- blue outcome -->
  <rect x="480" y="462" width="210" height="44" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="585" y="481" fill="#93c5fd" font-size="11" text-anchor="middle">run the external</text>
  <text x="585" y="497" fill="#93c5fd" font-size="11" text-anchor="middle">command</text>

  <!-- error outcome -->
  <rect x="60" y="576" width="340" height="36" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="230" y="599" fill="#fca5a5" font-size="11" text-anchor="middle">fish: Unknown command: weather</text>

  <!-- arrows: no-path down -->
  <line x1="230" y1="188" x2="230" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="218" fill="#94a3b8" font-size="10">no</text>
  <line x1="230" y1="296" x2="230" y2="344" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="326" fill="#94a3b8" font-size="10">no</text>
  <line x1="230" y1="404" x2="230" y2="452" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="434" fill="#94a3b8" font-size="10">no</text>
  <line x1="230" y1="512" x2="230" y2="572" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="242" y="548" fill="#94a3b8" font-size="10">no</text>

  <!-- arrows: yes to green -->
  <line x1="430" y1="160" x2="476" y2="205" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="446" y="176" fill="#86efac" font-size="10">yes</text>
  <line x1="430" y1="268" x2="476" y2="252" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="446" y="254" fill="#86efac" font-size="10">yes</text>
  <line x1="430" y1="376" x2="476" y2="298" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="446" y="330" fill="#86efac" font-size="10">yes</text>

  <!-- arrow: yes to blue -->
  <line x1="430" y1="484" x2="476" y2="484" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="446" y="478" fill="#93c5fd" font-size="10">yes</text>

  <!-- footer note -->
  <text x="360" y="645" fill="#94a3b8" font-size="10" text-anchor="middle">debug tip: functions --details NAME shows which file fish would load</text>
</svg>
