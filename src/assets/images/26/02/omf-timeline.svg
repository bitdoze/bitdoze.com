<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="320" fill="#1a1a2e" rx="12"/>
  <text x="430" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Oh My Fish release timeline: dormancy and the v8 revival</text>

  <!-- Timeline axis -->
  <line x1="60" y1="160" x2="747" y2="160" stroke="#444" stroke-width="3"/>

  <!-- Year markers -->
  <line x1="60" y1="152" x2="60" y2="168" stroke="#666" stroke-width="2"/>
  <text x="60" y="188" text-anchor="middle" fill="#888" font-size="12">2016</text>

  <line x1="185" y1="152" x2="185" y2="168" stroke="#666" stroke-width="2"/>
  <text x="185" y="188" text-anchor="middle" fill="#888" font-size="12">2018</text>

  <line x1="310" y1="152" x2="310" y2="168" stroke="#666" stroke-width="2"/>
  <text x="310" y="188" text-anchor="middle" fill="#888" font-size="12">2020</text>

  <line x1="435" y1="152" x2="435" y2="168" stroke="#666" stroke-width="2"/>
  <text x="435" y="188" text-anchor="middle" fill="#888" font-size="12">2022</text>

  <line x1="560" y1="152" x2="560" y2="168" stroke="#666" stroke-width="2"/>
  <text x="560" y="188" text-anchor="middle" fill="#888" font-size="12">2024</text>

  <line x1="685" y1="152" x2="685" y2="168" stroke="#666" stroke-width="2"/>
  <text x="685" y="188" text-anchor="middle" fill="#888" font-size="12">2026</text>

  <!-- Early releases 2016 -->
  <circle cx="92" cy="160" r="8" fill="#e8a838" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="92" y1="152" x2="92" y2="100" stroke="#e8a838" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="22" y="70" width="140" height="32" rx="6" fill="#e8a838" opacity="0.15"/>
  <text x="92" y="83" text-anchor="middle" fill="#e8a838" font-size="11" font-weight="600">Early releases (v2+)</text>
  <text x="92" y="96" text-anchor="middle" fill="#e8a838" font-size="10">2016</text>

  <!-- v7 April 2020 -->
  <circle cx="328" cy="160" r="8" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="328" y1="152" x2="328" y2="100" stroke="#4ec9b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="256" y="70" width="144" height="32" rx="6" fill="#4ec9b0" opacity="0.15"/>
  <text x="328" y="83" text-anchor="middle" fill="#4ec9b0" font-size="11" font-weight="600">OMF v7</text>
  <text x="328" y="96" text-anchor="middle" fill="#4ec9b0" font-size="10">11 Apr 2020</text>

  <!-- Dormancy bar 2020-2026 -->
  <rect x="342" y="118" width="302" height="24" rx="6" fill="#e8a838" opacity="0.12" stroke="#e8a838" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="493" y="134" text-anchor="middle" fill="#e8a838" font-size="10">Dormant: no releases for ~6 years</text>

  <!-- v8 April 2026 -->
  <circle cx="689" cy="160" r="8" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="689" y1="152" x2="689" y2="100" stroke="#4ec9b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="614" y="70" width="150" height="32" rx="6" fill="#4ec9b0" opacity="0.15"/>
  <text x="689" y="83" text-anchor="middle" fill="#4ec9b0" font-size="11" font-weight="600">OMF v8 (fish 4+)</text>
  <text x="689" y="96" text-anchor="middle" fill="#4ec9b0" font-size="10">7 Apr 2026</text>

  <!-- Commits cluster through Sep 2026 -->
  <circle cx="716" cy="160" r="5" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="730" cy="160" r="4" fill="#4ec9b0" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="722" y1="168" x2="722" y2="212" stroke="#4ec9b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="626" y="212" width="192" height="48" rx="6" fill="#4ec9b0" opacity="0.15"/>
  <text x="722" y="230" text-anchor="middle" fill="#4ec9b0" font-size="10" font-weight="600">Fixes through 30 Sep 2026</text>
  <text x="722" y="247" text-anchor="middle" fill="#e06c75" font-size="10" font-weight="600">README warning still up</text>

  <!-- README warning flag at end of axis -->
  <line x1="747" y1="160" x2="747" y2="128" stroke="#e06c75" stroke-width="2"/>
  <polygon points="747,128 777,136 747,144" fill="#e06c75"/>

  <!-- Legend -->
  <rect x="60" y="275" width="12" height="12" rx="3" fill="#4ec9b0"/>
  <text x="78" y="285" fill="#aaa" font-size="11">Releases and fixes</text>
  <rect x="205" y="275" width="12" height="12" rx="3" fill="#e8a838"/>
  <text x="223" y="285" fill="#aaa" font-size="11">Dormancy</text>
  <line x1="320" y1="272" x2="320" y2="288" stroke="#e06c75" stroke-width="2"/>
  <polygon points="320,272 336,277 320,282" fill="#e06c75"/>
  <text x="345" y="285" fill="#aaa" font-size="11">README warning about broken packages (still up, Nov 2026)</text>
</svg>
