<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#f8fafc"/>

  <!-- title -->
  <text x="460" y="36" text-anchor="middle" fill="#111827" font-size="19" font-weight="700">UsulNet Docker Compose stack (v26.5.x): 5 services</text>

  <!-- browser -->
  <rect x="30" y="66" width="150" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="105" y="94" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">Browser</text>
  <text x="105" y="114" text-anchor="middle" fill="#6b7280" font-size="11">https://ip:7443</text>

  <!-- arrow browser -> usulnet -->
  <line x1="180" y1="98" x2="236" y2="98" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="208" y="88" text-anchor="middle" fill="#6b7280" font-size="10.5">usulnet-frontend</text>

  <!-- usulnet main box -->
  <rect x="240" y="60" width="330" height="170" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <path d="M240 72 a10 10 0 0 1 10 -10 h310 a10 10 0 0 1 10 10 v22 h-330 z" fill="#6366f1"/>
  <rect x="240" y="84" width="330" height="10" fill="#6366f1"/>
  <text x="405" y="80" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">usulnet (usulnet/usulnet)</text>
  <text x="405" y="112" text-anchor="middle" fill="#312e81" font-size="12">:7443 HTTPS auto-TLS (published) &#183; :8080 internal</text>
  <text x="405" y="134" text-anchor="middle" fill="#4338ca" font-size="11.5">config.yaml mounted :ro at /app/config &#183; /app/data volume</text>
  <text x="405" y="156" text-anchor="middle" fill="#4338ca" font-size="11.5">docker.sock read-write &#183; pid: host</text>
  <text x="405" y="178" text-anchor="middle" fill="#4338ca" font-size="11.5">cap_add: SYS_PTRACE, SYS_ADMIN</text>
  <text x="405" y="202" text-anchor="middle" fill="#6b7280" font-size="11">healthcheck: curl http://localhost:8080/health</text>

  <!-- arrow usulnet -> guacd -->
  <line x1="570" y1="110" x2="624" y2="110" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- guacd box -->
  <rect x="628" y="60" width="262" height="112" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="759" y="90" text-anchor="middle" fill="#312e81" font-size="13.5" font-weight="600">guacd (guacamole/guacd:1.5.5)</text>
  <text x="759" y="114" text-anchor="middle" fill="#6b7280" font-size="11">RDP and VNC sessions in the browser</text>
  <text x="759" y="134" text-anchor="middle" fill="#6b7280" font-size="11">default service since v26.2.2</text>
  <text x="759" y="154" text-anchor="middle" fill="#6b7280" font-size="11">volume guacd_data</text>

  <!-- bus line from usulnet down -->
  <line x1="405" y1="230" x2="405" y2="258" stroke="#6366f1" stroke-width="2"/>
  <line x1="195" y1="258" x2="720" y2="258" stroke="#6366f1" stroke-width="2"/>
  <line x1="195" y1="258" x2="195" y2="292" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <line x1="405" y1="258" x2="405" y2="292" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <line x1="720" y1="258" x2="720" y2="292" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- backend network panel -->
  <rect x="30" y="296" width="860" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="320" text-anchor="middle" fill="#6d28d9" font-size="12.5" font-weight="600">usulnet-backend network (internal: true, no internet egress)</text>

  <!-- postgres -->
  <rect x="75" y="334" width="240" height="94" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="195" y="360" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="600">postgres (postgres:16-alpine)</text>
  <text x="195" y="382" text-anchor="middle" fill="#6b7280" font-size="11">usulnet database &#183; --data-checksums</text>
  <text x="195" y="402" text-anchor="middle" fill="#6b7280" font-size="11">volume postgres_data &#183; limit 512 MB</text>

  <!-- redis -->
  <rect x="330" y="334" width="210" height="94" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="435" y="360" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="600">redis (redis:8-alpine)</text>
  <text x="435" y="382" text-anchor="middle" fill="#6b7280" font-size="11">sessions + cache &#183; AOF persistence</text>
  <text x="435" y="402" text-anchor="middle" fill="#6b7280" font-size="11">volume redis_data &#183; limit 300 MB</text>

  <!-- nats -->
  <rect x="555" y="334" width="255" height="94" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="682" y="360" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="600">nats (nats:2.12-alpine)</text>
  <text x="682" y="382" text-anchor="middle" fill="#6b7280" font-size="11">JetStream &#183; nats-server.conf &#183; health :8222</text>
  <text x="682" y="402" text-anchor="middle" fill="#6b7280" font-size="11">volume nats_data &#183; limit 256 MB</text>

  <!-- footnotes -->
  <text x="460" y="478" text-anchor="middle" fill="#374151" font-size="12">Volumes: usulnet_data &#183; trivy_cache &#183; postgres_data &#183; redis_data &#183; nats_data</text>
  <text x="460" y="500" text-anchor="middle" fill="#374151" font-size="12">Only port 7443 is published by default (the 8080 publish line is commented out) &#183; usulnet limit 1 GB RAM / 2 CPU</text>
  <text x="460" y="522" text-anchor="middle" fill="#6b7280" font-size="11">usulnet-recon network (added v26.5.0) is not shown</text>
</svg>
