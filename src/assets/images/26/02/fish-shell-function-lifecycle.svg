<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#111827" rx="10"/>
  <text x="360" y="32" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">Function lifecycle: session-only vs saved vs config.fish</text>

  <!-- lane labels -->
  <text x="24" y="96" fill="#94a3b8" font-size="11" font-weight="600">session only</text>
  <text x="24" y="111" fill="#94a3b8" font-size="11" font-weight="600">(typed at the prompt)</text>
  <text x="24" y="222" fill="#94a3b8" font-size="11" font-weight="600">funcsave /</text>
  <text x="24" y="237" fill="#94a3b8" font-size="11" font-weight="600">function file</text>
  <text x="24" y="342" fill="#94a3b8" font-size="11" font-weight="600">config.fish</text>

  <!-- lane A: session only -->
  <rect x="150" y="70" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="232" y="92" fill="#e2e8f0" font-size="10" text-anchor="middle">function weather</text>
  <text x="232" y="107" fill="#94a3b8" font-size="10" text-anchor="middle">... end typed in the shell</text>
  <line x1="315" y1="96" x2="341" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="345" y="70" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="427" y="92" fill="#e2e8f0" font-size="10" text-anchor="middle">works in this</text>
  <text x="427" y="107" fill="#e2e8f0" font-size="10" text-anchor="middle">session only</text>
  <line x1="510" y1="96" x2="536" y2="96" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="540" y="70" width="165" height="52" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="622" y="92" fill="#fca5a5" font-size="10" text-anchor="middle">gone when the</text>
  <text x="622" y="107" fill="#fca5a5" font-size="10" text-anchor="middle">terminal closes</text>

  <!-- lane B: funcsave -->
  <rect x="150" y="196" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="232" y="222" fill="#e2e8f0" font-size="10" text-anchor="middle">funcsave weather</text>
  <line x1="315" y1="222" x2="341" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="345" y="196" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="427" y="216" fill="#e2e8f0" font-size="9" text-anchor="middle">~/.config/fish/functions/</text>
  <text x="427" y="231" fill="#e2e8f0" font-size="9" text-anchor="middle">weather.fish</text>
  <line x1="510" y1="222" x2="536" y2="222" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="540" y="196" width="165" height="52" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="622" y="216" fill="#86efac" font-size="10" text-anchor="middle">lazy-loads on the</text>
  <text x="622" y="231" fill="#86efac" font-size="10" text-anchor="middle">first call, any session</text>

  <!-- lane C: config.fish -->
  <rect x="150" y="316" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="232" y="342" fill="#e2e8f0" font-size="10" text-anchor="middle">function in config.fish</text>
  <line x1="315" y1="342" x2="341" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="345" y="316" width="165" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="427" y="336" fill="#e2e8f0" font-size="10" text-anchor="middle">sourced eagerly at</text>
  <text x="427" y="351" fill="#e2e8f0" font-size="10" text-anchor="middle">every startup</text>
  <line x1="510" y1="342" x2="536" y2="342" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="540" y="316" width="165" height="52" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="622" y="336" fill="#93c5fd" font-size="10" text-anchor="middle">always loaded,</text>
  <text x="622" y="351" fill="#93c5fd" font-size="10" text-anchor="middle">even if unused</text>

  <text x="360" y="405" fill="#94a3b8" font-size="10" text-anchor="middle">funcsave writes the file; fish autoloads it on demand, so startup stays fast</text>
</svg>
