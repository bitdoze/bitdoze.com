<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'JetBrains Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #cdd6f4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #a6adc8; }
      .var { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #b4befe; }
      .cmd { font-size: 19px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="340" fill="#1e1e2e" rx="10"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" class="title">Anatomy of a fish command line (fish 4.x defaults)</text>

  <!-- Terminal box -->
  <rect x="30" y="52" width="800" height="100" rx="8" fill="#181825"/>
  <rect x="30" y="52" width="800" height="24" rx="8" fill="#313244"/>
  <circle cx="48" cy="64" r="5" fill="#f38ba8"/>
  <circle cx="64" cy="64" r="5" fill="#f9e2af"/>
  <circle cx="80" cy="64" r="5" fill="#a6e3a1"/>
  <text x="430" y="68" text-anchor="middle" fill="#6c7086" font-size="10" font-family="sans-serif">fish — syntax highlighting</text>

  <!-- Command line: grep -r "TODO" ~/src/ > out.txt -->
  <text x="50" y="110" class="cmd" fill="#6c7086">❯</text>
  <text x="72" y="110" class="cmd" fill="#cdd6f4">grep</text>
  <text x="136" y="110" class="cmd" fill="#89dceb"> -r</text>
  <text x="180" y="110" class="cmd" fill="#f9e2af"> "TODO"</text>
  <text x="272" y="110" class="cmd" fill="#89dceb" text-decoration="underline"> ~/src/</text>
  <text x="362" y="110" class="cmd" fill="#89b4fa" font-weight="bold"> &gt;</text>
  <text x="392" y="110" class="cmd" fill="#89dceb" text-decoration="underline"> out.txt</text>

  <!-- Error line -->
  <text x="50" y="140" class="cmd" fill="#6c7086">❯</text>
  <text x="72" y="140" class="cmd" fill="#f38ba8">gti</text>
  <text x="112" y="140" class="cmd" fill="#cdd6f4"> status</text>

  <!-- Connecting lines and labels -->
  <!-- grep → fish_color_command -->
  <line x1="96" y1="118" x2="96" y2="172" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="20" y="175" width="160" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="100" y="188" text-anchor="middle" class="label">commands</text>
  <text x="100" y="201" text-anchor="middle" class="var">fish_color_command</text>

  <!-- -r → fish_color_option -->
  <line x1="152" y1="118" x2="152" y2="172" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="140" y="212" width="152" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="216" y="225" text-anchor="middle" class="label">options</text>
  <text x="216" y="238" text-anchor="middle" class="var">fish_color_option</text>
  <line x1="152" y1="207" x2="190" y2="212" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- "TODO" → fish_color_quote -->
  <line x1="246" y1="118" x2="246" y2="172" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="282" y="175" width="160" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="362" y="188" text-anchor="middle" class="label">quoted strings</text>
  <text x="362" y="201" text-anchor="middle" class="var">fish_color_quote</text>
  <line x1="246" y1="172" x2="300" y2="175" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- ~/src/ → fish_color_valid_path -->
  <line x1="318" y1="118" x2="318" y2="212" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="290" y="212" width="172" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="376" y="225" text-anchor="middle" class="label">valid paths (underline)</text>
  <text x="376" y="238" text-anchor="middle" class="var">fish_color_valid_path</text>
  <line x1="318" y1="212" x2="340" y2="212" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- > → fish_color_redirection -->
  <line x1="382" y1="118" x2="382" y2="172" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="440" y="175" width="172" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="526" y="188" text-anchor="middle" class="label">redirections</text>
  <text x="526" y="201" text-anchor="middle" class="var">fish_color_redirection</text>
  <line x1="382" y1="172" x2="448" y2="175" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- gti → fish_color_error -->
  <line x1="88" y1="148" x2="88" y2="252" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="622" y="175" width="180" height="32" rx="5" fill="#313244" stroke="#45475a" stroke-width="0.8"/>
  <text x="712" y="188" text-anchor="middle" class="label">invalid commands</text>
  <text x="712" y="201" text-anchor="middle" class="var">fish_color_error</text>
  <line x1="88" y1="252" x2="622" y2="191" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="30" y="262" width="800" height="62" rx="6" fill="#181825"/>
  <text x="50" y="282" class="label" fill="#6c7086">fish 4.x default colors — commands use the terminal foreground color, not blue (pre-4.0 installs may differ)</text>
  <rect x="50" y="292" width="12" height="12" rx="2" fill="#cdd6f4"/>
  <text x="68" y="302" class="label">command</text>
  <rect x="140" y="292" width="12" height="12" rx="2" fill="#89dceb"/>
  <text x="158" y="302" class="label">param/option/path</text>
  <rect x="280" y="292" width="12" height="12" rx="2" fill="#f9e2af"/>
  <text x="298" y="302" class="label">quoted string</text>
  <rect x="410" y="292" width="12" height="12" rx="2" fill="#89b4fa"/>
  <text x="428" y="302" class="label">redirection</text>
  <rect x="520" y="292" width="12" height="12" rx="2" fill="#f38ba8"/>
  <text x="538" y="302" class="label">error</text>
  <text x="620" y="302" class="label" fill="#6c7086">underline = valid path</text>
</svg>
