<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <rect width="720" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">GLM Coding Plan: credit pools &amp; peak window</text>

  <!-- Weekly cap bar -->
  <text x="40" y="72" fill="#334155" font-weight="600">Weekly cap</text>
  <rect x="140" y="56" width="540" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="140" y="56" width="340" height="26" rx="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="310" y="74" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="600">consumed</text>
  <text x="560" y="74" text-anchor="middle" fill="#475569" font-size="12">remaining</text>
  <text x="680" y="74" text-anchor="end" fill="#334155" font-size="11">resets every 7 days</text>

  <!-- 5-hour rolling pool -->
  <text x="40" y="122" fill="#334155" font-weight="600">5-h pool</text>
  <rect x="140" y="106" width="540" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="140" y="106" width="160" height="26" rx="6" fill="#86efac" stroke="#22c55e" stroke-width="1"/>
  <text x="220" y="124" text-anchor="middle" fill="#14532d" font-size="12" font-weight="600">in use</text>
  <text x="500" y="124" text-anchor="middle" fill="#475569" font-size="12">refills on a rolling 5-hour cycle</text>

  <!-- Timeline axis -->
  <line x1="60" y1="196" x2="680" y2="196" stroke="#64748b" stroke-width="1.5"/>
  <!-- Day ticks: Mon..Fri -->
  <g fill="#475569" font-size="11" text-anchor="middle">
    <line x1="120" y1="190" x2="120" y2="202" stroke="#64748b" stroke-width="1"/><text x="120" y="218">Mon</text>
    <line x1="230" y1="190" x2="230" y2="202" stroke="#64748b" stroke-width="1"/><text x="230" y="218">Tue</text>
    <line x1="340" y1="190" x2="340" y2="202" stroke="#64748b" stroke-width="1"/><text x="340" y="218">Wed</text>
    <line x1="450" y1="190" x2="450" y2="202" stroke="#64748b" stroke-width="1"/><text x="450" y="218">Thu</text>
    <line x1="560" y1="190" x2="560" y2="202" stroke="#64748b" stroke-width="1"/><text x="560" y="218">Fri</text>
    <line x1="660" y1="190" x2="660" y2="202" stroke="#64748b" stroke-width="1"/><text x="660" y="218">Sat</text>
  </g>

  <!-- Peak band -->
  <rect x="98" y="172" width="44" height="24" rx="4" fill="#fdba74" stroke="#f97316" stroke-width="1" opacity="0.85"/>
  <rect x="208" y="172" width="44" height="24" rx="4" fill="#fdba74" stroke="#f97316" stroke-width="1" opacity="0.85"/>
  <rect x="318" y="172" width="44" height="24" rx="4" fill="#fdba74" stroke="#f97316" stroke-width="1" opacity="0.85"/>
  <rect x="428" y="172" width="44" height="24" rx="4" fill="#fdba74" stroke="#f97316" stroke-width="1" opacity="0.85"/>
  <rect x="538" y="172" width="44" height="24" rx="4" fill="#fdba74" stroke="#f97316" stroke-width="1" opacity="0.85"/>

  <!-- Legend -->
  <rect x="60" y="248" width="16" height="16" rx="3" fill="#fdba74" stroke="#f97316" stroke-width="1"/>
  <text x="84" y="261" fill="#334155">Peak window: 1&#215; credit rate</text>
  <rect x="300" y="248" width="16" height="16" rx="3" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="324" y="261" fill="#334155">Off-peak: 0.5&#215; credit rate</text>

  <!-- Peak window times -->
  <rect x="60" y="284" width="620" height="76" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <text x="370" y="308" text-anchor="middle" fill="#9a3412" font-weight="600">Peak = Mon&#8211;Fri 14:00&#8211;18:00 SGT (UTC+8)</text>
  <text x="370" y="330" text-anchor="middle" fill="#9a3412" font-size="12">Europe/Bucharest: 08:00&#8211;12:00 in winter (EET) &#183; 09:00&#8211;13:00 in summer (EEST)</text>
  <text x="370" y="350" text-anchor="middle" fill="#9a3412" font-size="12">Everything outside the peak band charges 0.5&#215; &#8212; schedule heavy sessions off-peak to double your effective plan.</text>
</svg>
