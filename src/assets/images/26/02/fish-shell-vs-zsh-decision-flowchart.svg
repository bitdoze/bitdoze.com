<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="520" fill="#111827" rx="10"/>
  <text x="360" y="32" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">Fish vs Zsh: which should you pick?</text>

  <!-- Q1 -->
  <rect x="210" y="55" width="300" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="81" fill="#e2e8f0" font-size="12" text-anchor="middle">Need POSIX/Bash compat or portable scripts?</text>

  <!-- Q1 arrows -->
  <line x1="310" y1="97" x2="180" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="218" y="122" fill="#94a3b8" font-size="10">yes</text>
  <line x1="410" y1="97" x2="540" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="122" fill="#94a3b8" font-size="10">no</text>

  <!-- Q2 -->
  <rect x="390" y="138" width="300" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="164" fill="#e2e8f0" font-size="12" text-anchor="middle">Want polished UX with zero config?</text>

  <!-- Q2 arrows -->
  <line x1="490" y1="180" x2="310" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="368" y="206" fill="#94a3b8" font-size="10">yes</text>
  <line x1="590" y1="180" x2="590" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="206" fill="#94a3b8" font-size="10">no</text>

  <!-- Q3 -->
  <rect x="390" y="222" width="300" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="248" fill="#e2e8f0" font-size="12" text-anchor="middle">Bothered by behavior changing between releases?</text>

  <!-- Q3 arrows -->
  <line x1="490" y1="264" x2="310" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="368" y="290" fill="#94a3b8" font-size="10">yes</text>
  <line x1="590" y1="264" x2="440" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="538" y="290" fill="#94a3b8" font-size="10">no</text>

  <!-- Q4 -->
  <rect x="30" y="222" width="310" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="185" y="241" fill="#e2e8f0" font-size="11" text-anchor="middle">Server login shell for automation,</text>
  <text x="185" y="256" fill="#e2e8f0" font-size="11" text-anchor="middle">scp, rsync, or CI?</text>

  <!-- Q4 arrows -->
  <line x1="135" y1="264" x2="135" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="145" y="290" fill="#94a3b8" font-size="10">yes</text>

  <!-- Result: Zsh (from Q1 yes) -->
  <rect x="60" y="138" width="240" height="42" rx="21" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="180" y="164" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">→ Zsh</text>

  <!-- Result: Zsh (from Q4 yes) -->
  <rect x="45" y="306" width="200" height="42" rx="21" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="145" y="332" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">→ Zsh (or keep Bash)</text>

  <!-- Result: Fish (from Q2 yes) -->
  <rect x="170" y="306" width="200" height="42" rx="21" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="270" y="332" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">→ Fish</text>

  <!-- Result: Fish (from Q3 no) -->
  <rect x="370" y="306" width="200" height="42" rx="21" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="470" y="332" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">→ Try Fish for a day</text>

  <!-- Result: Zsh (from Q3 yes) -->
  <rect x="400" y="222" width="0" height="0" rx="0" fill="none"/>

  <!-- Q3 yes goes to Zsh result -->
  <line x1="490" y1="264" x2="200" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend / note -->
  <rect x="80" y="385" width="560" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="360" y="407" fill="#94a3b8" font-size="11" text-anchor="middle">Q3 "yes" leads to Zsh (stable behavior). If none of the pain points apply,</text>
  <text x="360" y="424" fill="#94a3b8" font-size="11" text-anchor="middle">try Fish for a day — you can always switch back.</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
