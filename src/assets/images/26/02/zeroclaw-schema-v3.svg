<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Schema V3 config map</text>

  <!-- Providers -->
  <rect x="30" y="60" width="220" height="120" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">providers.models.&lt;type&gt;.&lt;alias&gt;</text>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#15803d">[providers.models.openrouter.default]</text>
  <text x="140" y="125" text-anchor="middle" font-size="11" fill="#15803d">[providers.models.minimax.intl]</text>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#15803d">[providers.models.zai.main]</text>
  <text x="140" y="162" text-anchor="middle" font-size="10" fill="#16a34a">model · api_key · endpoint · temperature</text>

  <!-- Arrow: providers -> agents -->
  <line x1="250" y1="120" x2="320" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Agents -->
  <rect x="320" y="60" width="200" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">agents.&lt;alias&gt;</text>
  <text x="420" y="108" text-anchor="middle" font-size="11" fill="#b45309">[agents.assistant]</text>
  <text x="420" y="128" text-anchor="middle" font-size="10" fill="#b45309">model_provider = "openrouter.default"</text>
  <text x="420" y="145" text-anchor="middle" font-size="10" fill="#b45309">risk_profile = "standard"</text>
  <text x="420" y="165" text-anchor="middle" font-size="10" fill="#d97706">One daemon, many named agents</text>

  <!-- Arrow: agents -> risk_profiles -->
  <line x1="520" y1="90" x2="590" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow: agents -> channels -->
  <line x1="520" y1="150" x2="590" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Risk Profiles -->
  <rect x="590" y="40" width="180" height="100" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="680" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">risk_profiles.&lt;alias&gt;</text>
  <text x="680" y="85" text-anchor="middle" font-size="10" fill="#4f46e5">level = "supervised"</text>
  <text x="680" y="102" text-anchor="middle" font-size="10" fill="#4f46e5">auto_approve · always_ask</text>
  <text x="680" y="119" text-anchor="middle" font-size="10" fill="#4f46e5">excluded_tools</text>

  <!-- Channels -->
  <rect x="590" y="180" width="180" height="100" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="680" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">channels.&lt;type&gt;.&lt;alias&gt;</text>
  <text x="680" y="225" text-anchor="middle" font-size="10" fill="#be185d">[channels.discord.main]</text>
  <text x="680" y="242" text-anchor="middle" font-size="10" fill="#be185d">bot_token (encrypted)</text>
  <text x="680" y="259" text-anchor="middle" font-size="10" fill="#be185d">guild_ids · mention_only</text>

  <!-- Web search -->
  <rect x="30" y="230" width="220" height="80" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="140" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">web_search</text>
  <text x="140" y="275" text-anchor="middle" font-size="10" fill="#0284c7">search_provider = "duckduckgo"</text>
  <text x="140" y="292" text-anchor="middle" font-size="10" fill="#0284c7">brave · tavily · searxng · ...</text>

  <!-- Memory -->
  <rect x="320" y="230" width="200" height="80" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="420" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">memory</text>
  <text x="420" y="275" text-anchor="middle" font-size="10" fill="#9333ea">backend = "sqlite"</text>
  <text x="420" y="292" text-anchor="middle" font-size="10" fill="#9333ea">markdown · postgres · qdrant · lucid</text>

  <!-- Footer note -->
  <text x="400" y="355" text-anchor="middle" font-size="11" fill="#64748b">Old configs auto-migrate on first load · zeroclaw config migrate for explicit conversion</text>
</svg>
