<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #cdd6f4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #a6adc8; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #cdd6f4; }
      .code-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #6c7086; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #f9e2af; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="#1e1e2e" rx="10"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" class="title">Where fish gets your colors (fish 4.3+)</text>

  <!-- Main flow: config.fish -->
  <rect x="220" y="52" width="380" height="52" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="410" y="73" text-anchor="middle" class="code" font-weight="bold">~/.config/fish/config.fish</text>
  <text x="410" y="92" text-anchor="middle" class="code-dim">your permanent color settings live here</text>

  <!-- Arrow down -->
  <line x1="410" y1="104" x2="410" y2="128" stroke="#89b4fa" stroke-width="1.5"/>
  <polygon points="410,134 404,124 416,124" fill="#89b4fa"/>

  <!-- Step 1: theme choose -->
  <rect x="160" y="138" width="500" height="48" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="410" y="158" text-anchor="middle" class="code">1. fish_config theme choose THEME</text>
  <text x="410" y="176" text-anchor="middle" class="code-dim">loads all colors from a .theme file</text>

  <!-- Arrow down -->
  <line x1="410" y1="186" x2="410" y2="210" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="410,216 404,206 416,206" fill="#585b70"/>

  <!-- Step 2: set -g overrides -->
  <rect x="160" y="220" width="500" height="48" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="1.2"/>
  <text x="410" y="240" text-anchor="middle" class="code">2. set -g fish_color_*  (after theme line)</text>
  <text x="410" y="258" text-anchor="middle" class="code-dim">per-variable tweaks — order matters</text>

  <!-- Arrow down -->
  <line x1="410" y1="268" x2="410" y2="292" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="410,298 404,288 416,288" fill="#585b70"/>

  <!-- Step 3: defaults -->
  <rect x="220" y="302" width="380" height="42" rx="8" fill="#313244" stroke="#6c7086" stroke-width="1.2"/>
  <text x="410" y="320" text-anchor="middle" class="code" fill="#a6adc8">3. Built-in defaults (default.theme)</text>
  <text x="410" y="336" text-anchor="middle" class="code-dim">fallback when nothing else sets the variable</text>

  <!-- Legacy branch -->
  <rect x="40" y="138" width="100" height="28" rx="4" fill="#45475a"/>
  <text x="90" y="157" text-anchor="middle" class="section-label">LEGACY</text>

  <!-- Legacy box -->
  <rect x="20" y="180" width="140" height="42" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="197" text-anchor="middle" class="code" fill="#f38ba8" font-size="11">set -U fish_color_*</text>
  <text x="90" y="213" text-anchor="middle" class="code-dim" font-size="10">universal vars (fish &lt; 4.3)</text>

  <!-- Arrow down from legacy -->
  <line x1="90" y1="222" x2="90" y2="252" stroke="#f38ba8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="90,258 84,248 96,248" fill="#f38ba8"/>

  <!-- Frozen theme box -->
  <rect x="14" y="262" width="152" height="52" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="90" y="280" text-anchor="middle" class="code" fill="#f38ba8" font-size="10">conf.d/fish_frozen_theme.fish</text>
  <text x="90" y="296" text-anchor="middle" class="code-dim" font-size="10">created on 4.3+ upgrade</text>

  <!-- Arrow down from frozen -->
  <line x1="90" y1="314" x2="90" y2="344" stroke="#f38ba8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="90,350 84,340 96,340" fill="#f38ba8"/>

  <!-- Delete instruction -->
  <rect x="14" y="354" width="152" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.2"/>
  <text x="90" y="371" text-anchor="middle" class="code" fill="#a6e3a1" font-size="10">delete this file</text>
  <text x="90" y="386" text-anchor="middle" class="code-dim" font-size="10">move settings to config.fish</text>

  <!-- Side note -->
  <rect x="640" y="138" width="160" height="100" rx="6" fill="#181825" stroke="#45475a" stroke-width="0.8"/>
  <text x="720" y="160" text-anchor="middle" class="section-label">TIP</text>
  <text x="720" y="180" text-anchor="middle" class="code-dim" font-size="10">theme lines go first,</text>
  <text x="720" y="195" text-anchor="middle" class="code-dim" font-size="10">set -g overrides after.</text>
  <text x="720" y="215" text-anchor="middle" class="code-dim" font-size="10">Later lines win.</text>
</svg>
