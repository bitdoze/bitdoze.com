<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#64748b"/>
    </marker>
    <marker id="arrow2b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Internet -->
  <rect x="30" y="150" width="170" height="110" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Internet</text>
  <text x="115" y="208" text-anchor="middle" font-size="11" fill="#3b82f6">Discord / LINE webhooks</text>
  <text x="115" y="225" text-anchor="middle" font-size="11" fill="#3b82f6">your browser (WebUI)</text>

  <!-- Reverse proxy -->
  <rect x="270" y="150" width="190" height="110" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="365" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Reverse proxy (TLS)</text>
  <text x="365" y="208" text-anchor="middle" font-size="11" fill="#6366f1">Caddy / Traefik / Nginx</text>
  <text x="365" y="225" text-anchor="middle" font-size="11" fill="#6366f1">public :443 only</text>

  <!-- Your box -->
  <rect x="520" y="30" width="250" height="330" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="645" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">your VPS / SBC</text>

  <!-- gateway HTTP -->
  <rect x="545" y="80" width="200" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">PicoClaw gateway</text>
  <text x="645" y="130" text-anchor="middle" font-size="11" fill="#b45309">127.0.0.1:18790</text>
  <text x="645" y="150" text-anchor="middle" font-size="11" fill="#b45309">webhook channels share it</text>

  <!-- WebUI -->
  <rect x="545" y="205" width="200" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="233" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">WebUI launcher</text>
  <text x="645" y="255" text-anchor="middle" font-size="11" fill="#b45309">127.0.0.1:18800</text>
  <text x="645" y="275" text-anchor="middle" font-size="11" fill="#b45309">set PICOCLAW_LAUNCHER_TOKEN</text>

  <!-- LLM egress -->
  <rect x="270" y="330" width="190" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="365" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">LLM providers</text>
  <text x="365" y="382" text-anchor="middle" font-size="11" fill="#15803d">HTTPS egress (api_keys)</text>

  <!-- arrows -->
  <line x1="200" y1="205" x2="268" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="460" y1="185" x2="543" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="460" y1="225" x2="543" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="645" y1="300" x2="462" y2="358" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2b)"/>
  <text x="590" y="348" text-anchor="middle" font-size="10" fill="#dc2626">outbound only</text>

  <!-- caption -->
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#475569">Keep the gateway on 127.0.0.1, terminate TLS in front, and never expose :18800 without a launcher token.</text>
</svg>
