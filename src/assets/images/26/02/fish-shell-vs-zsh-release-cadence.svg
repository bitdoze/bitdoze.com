<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="310" fill="#111827" rx="10"/>
  <text x="400" y="30" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">Release cadence: Fish 4.x vs Zsh 5.9 (2022–2026)</text>

  <!-- axis -->
  <line x1="90" y1="260" x2="760" y2="260" stroke="#4b5563" stroke-width="1.5"/>
  <!-- year ticks -->
  <line x1="130" y1="255" x2="130" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="282" fill="#9ca3af" font-size="11" text-anchor="middle">2022</text>
  <line x1="280" y1="255" x2="280" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="280" y="282" fill="#9ca3af" font-size="11" text-anchor="middle">2023</text>
  <line x1="430" y1="255" x2="430" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="430" y="282" fill="#9ca3af" font-size="11" text-anchor="middle">2024</text>
  <line x1="570" y1="255" x2="570" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="570" y="282" fill="#9ca3af" font-size="11" text-anchor="middle">2025</text>
  <line x1="710" y1="255" x2="710" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="710" y="282" fill="#9ca3af" font-size="11" text-anchor="middle">2026</text>

  <!-- Zsh row -->
  <text x="80" y="175" fill="#818cf8" font-size="13" font-weight="600" text-anchor="end">Zsh</text>
  <line x1="90" y1="170" x2="760" y2="170" stroke="#312e81" stroke-width="2"/>

  <!-- Zsh 5.9 May 2022 -->
  <circle cx="135" cy="170" r="7" fill="#818cf8"/>
  <text x="135" y="152" fill="#818cf8" font-size="10" text-anchor="middle" font-weight="600">5.9</text>
  <text x="135" y="141" fill="#6b7280" font-size="8" text-anchor="middle">May 2022</text>

  <!-- Zsh 5.9.1 May 2026 -->
  <circle cx="668" cy="170" r="7" fill="#818cf8"/>
  <text x="668" y="152" fill="#818cf8" font-size="10" text-anchor="middle" font-weight="600">5.9.1</text>
  <text x="668" y="141" fill="#6b7280" font-size="8" text-anchor="middle">May 2026</text>

  <!-- Zsh 5.9.2 Jul 2026 -->
  <circle cx="710" cy="170" r="7" fill="#818cf8"/>
  <text x="732" y="175" fill="#818cf8" font-size="10" text-anchor="middle" font-weight="600">5.9.2</text>
  <text x="742" y="188" fill="#6b7280" font-size="8" text-anchor="middle">Jul 2026</text>

  <!-- gap annotation -->
  <line x1="145" y1="170" x2="658" y2="170" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="400" y="192" fill="#6b7280" font-size="9" text-anchor="middle" font-style="italic">no stable releases for ~4 years</text>

  <!-- Fish row -->
  <text x="80" y="100" fill="#34d399" font-size="13" font-weight="600" text-anchor="end">Fish</text>
  <line x1="90" y1="95" x2="760" y2="95" stroke="#064e3b" stroke-width="2"/>

  <!-- Fish 4.0.0 Feb 2025 -->
  <circle cx="552" cy="95" r="7" fill="#34d399"/>
  <text x="552" y="78" fill="#34d399" font-size="10" text-anchor="middle" font-weight="600">4.0.0</text>
  <text x="552" y="67" fill="#6b7280" font-size="8" text-anchor="middle">Feb 2025</text>
  <text x="552" y="56" fill="#6b7280" font-size="7" text-anchor="middle">Rust port</text>

  <!-- Fish 4.5.0 Feb 2026 -->
  <circle cx="672" cy="95" r="7" fill="#34d399"/>
  <text x="672" y="78" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600">4.5</text>
  <text x="672" y="67" fill="#6b7280" font-size="7" text-anchor="middle">Feb</text>

  <!-- Fish 4.6.0 Mar 2026 -->
  <circle cx="685" cy="95" r="7" fill="#34d399"/>
  <text x="685" y="115" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600">4.6</text>
  <text x="685" y="126" fill="#6b7280" font-size="7" text-anchor="middle">Mar</text>

  <!-- Fish 4.7.0 May 2026 -->
  <circle cx="700" cy="95" r="7" fill="#34d399"/>
  <text x="700" y="78" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600">4.7</text>
  <text x="700" y="67" fill="#6b7280" font-size="7" text-anchor="middle">May</text>

  <!-- Fish 4.8.0 Jun 2026 -->
  <circle cx="712" cy="95" r="7" fill="#34d399"/>
  <text x="712" y="115" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600">4.8</text>
  <text x="712" y="126" fill="#6b7280" font-size="7" text-anchor="middle">Jun</text>

  <!-- Fish 4.9.x Sep 2026 -->
  <circle cx="730" cy="95" r="8" fill="#34d399" stroke="#fff" stroke-width="1.5"/>
  <text x="738" y="78" fill="#34d399" font-size="10" text-anchor="middle" font-weight="700">4.9.3</text>
  <text x="742" y="67" fill="#6b7280" font-size="8" text-anchor="middle">Sep 2026</text>

  <!-- caption -->
  <text x="400" y="302" fill="#9ca3af" font-size="10" text-anchor="middle" font-style="italic">Fish ships fast with occasional regressions; Zsh barely moves — pick your maintenance temperament.</text>
</svg>
