<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="52" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">Docker deploy architecture</text>
  <text x="640" y="86" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">Wildcard DNS → VPS :80/:443 → Caddy → app containers on the external caddy network</text>

  <!-- Browser -->
  <rect x="30" y="185" width="180" height="110" rx="12" fill="#334155"/>
  <text x="120" y="228" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Browser / chat</text>
  <text x="120" y="258" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">Telegram, phone, laptop</text>

  <line x1="212" y1="240" x2="276" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Wildcard DNS -->
  <rect x="280" y="185" width="200" height="110" rx="12" fill="#334155"/>
  <text x="380" y="222" text-anchor="middle" fill="white" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">Wildcard DNS</text>
  <text x="380" y="250" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="ui-monospace, monospace">*.yourdomain.com</text>
  <text x="380" y="274" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="13" font-family="system-ui, sans-serif">A record → VPS IP</text>

  <line x1="482" y1="240" x2="546" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- VPS -->
  <rect x="550" y="145" width="300" height="200" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="178" text-anchor="middle" fill="#a5b4fc" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">VPS :80 / :443</text>
  <rect x="580" y="198" width="140" height="118" rx="10" fill="#4f46e5"/>
  <text x="650" y="238" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Caddy</text>
  <text x="650" y="266" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12" font-family="ui-monospace, monospace">caddy:2-alpine</text>
  <text x="650" y="290" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12" font-family="system-ui, sans-serif">HTTPS + routing</text>

  <line x1="722" y1="240" x2="914" y2="240" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-g)"/>

  <!-- caddy network -->
  <rect x="920" y="145" width="330" height="200" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="1085" y="178" text-anchor="middle" fill="#86efac" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">network: caddy (external)</text>
  <rect x="945" y="196" width="280" height="40" rx="8" fill="#334155"/>
  <text x="1085" y="222" text-anchor="middle" fill="white" font-size="13" font-family="ui-monospace, monospace">uptime-kuma:3001</text>
  <rect x="945" y="244" width="280" height="40" rx="8" fill="#334155"/>
  <text x="1085" y="270" text-anchor="middle" fill="white" font-size="13" font-family="ui-monospace, monospace">plausible:8000</text>
  <rect x="945" y="292" width="280" height="40" rx="8" fill="#334155"/>
  <text x="1085" y="318" text-anchor="middle" fill="white" font-size="13" font-family="ui-monospace, monospace">app:PORT</text>

  <!-- folder tree -->
  <rect x="140" y="415" width="1000" height="265" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="640" y="452" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Server folders: one folder per app</text>
  <text x="200" y="495" fill="#e2e8f0" font-size="15" font-family="ui-monospace, monospace">/home/user/docker-apps/</text>
  <text x="220" y="527" fill="#e2e8f0" font-size="15" font-family="ui-monospace, monospace">├── caddy/        Caddyfile + docker-compose.yml   → caddy container</text>
  <text x="220" y="559" fill="#e2e8f0" font-size="15" font-family="ui-monospace, monospace">├── uptime-kuma/  docker-compose.yml + .env        → uptime-kuma</text>
  <text x="220" y="591" fill="#e2e8f0" font-size="15" font-family="ui-monospace, monospace">└── plausible/    docker-compose.yml + .env        → plausible</text>
  <text x="640" y="642" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui, sans-serif">Bind mounts (./data) keep backups a simple tar. The skill only writes inside this tree.</text>
</svg>
