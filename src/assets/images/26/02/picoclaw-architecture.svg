<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- You / channels -->
  <rect x="30" y="60" width="200" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">You</text>
  <text x="130" y="115" text-anchor="middle" font-size="11" fill="#3b82f6">Discord · Telegram · Slack</text>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#3b82f6">WhatsApp · LINE · QQ · Matrix</text>
  <text x="130" y="149" text-anchor="middle" font-size="11" fill="#3b82f6">18+ channels · CLI · WebUI</text>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#1e40af">messages in</text>

  <!-- Gateway -->
  <rect x="300" y="40" width="220" height="190" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">PicoClaw gateway</text>
  <rect x="320" y="90" width="180" height="36" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="410" y="113" text-anchor="middle" font-size="11" fill="#3730a3">single Go binary</text>
  <rect x="320" y="134" width="180" height="36" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="410" y="157" text-anchor="middle" font-size="11" fill="#3730a3">your VPS or $10 SBC</text>
  <rect x="320" y="178" width="180" height="36" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="410" y="201" text-anchor="middle" font-size="11" fill="#3730a3">10-20MB RAM · &lt;1s boot</text>

  <!-- Providers -->
  <rect x="580" y="30" width="190" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="675" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">LLM providers</text>
  <text x="675" y="80" text-anchor="middle" font-size="11" fill="#b45309">OpenRouter · Z.AI · MiniMax</text>
  <text x="675" y="97" text-anchor="middle" font-size="11" fill="#b45309">Anthropic · OpenAI · Gemini</text>
  <text x="675" y="114" text-anchor="middle" font-size="11" fill="#b45309">local Ollama · 30+ total</text>

  <!-- Tools -->
  <rect x="580" y="190" width="190" height="120" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="675" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Tools</text>
  <text x="675" y="240" text-anchor="middle" font-size="11" fill="#15803d">shell · files · web search</text>
  <text x="675" y="257" text-anchor="middle" font-size="11" fill="#15803d">memory · cron · MCP</text>
  <text x="675" y="274" text-anchor="middle" font-size="11" fill="#15803d">skills · voice · vision</text>

  <!-- arrows -->
  <line x1="230" y1="135" x2="298" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="110" x2="578" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="180" x2="578" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- captions -->
  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#475569">Everything except the LLM API call stays on your hardware.</text>
  <text x="400" y="394" text-anchor="middle" font-size="11" fill="#94a3b8">PicoClaw v0.3.1 architecture: 18+ channels in, 30+ LLM providers out, tools on-box</text>
</svg>
