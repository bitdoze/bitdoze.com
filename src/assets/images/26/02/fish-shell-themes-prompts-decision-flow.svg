<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 1.5; }
      .label { text-anchor: middle; dominant-baseline: central; }
      .small { font-size: 12px; fill: #666; text-anchor: middle; }
      .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 12px; fill: #555; }
    </style>
  </defs>

  <!-- Start node -->
  <rect x="310" y="10" width="180" height="40" class="box" fill="#e8e8e8" stroke="#999"/>
  <text x="400" y="30" class="label" fill="#222">Which Fish prompt?</text>

  <!-- Q1: Multiple shells? -->
  <rect x="295" y="90" width="210" height="40" class="box" fill="#fff" stroke="#555"/>
  <text x="400" y="110" class="label" fill="#222">Do you use multiple shells?</text>

  <!-- Arrow: Start → Q1 -->
  <line x1="400" y1="50" x2="400" y2="90" class="edge"/>

  <!-- Q2: Max features? -->
  <rect x="295" y="190" width="210" height="40" class="box" fill="#fff" stroke="#555"/>
  <text x="400" y="210" class="label" fill="#222">Want maximum features?</text>

  <!-- Arrow: Q1 → Q2 (No) -->
  <line x1="400" y1="130" x2="400" y2="190" class="edge"/>
  <text x="412" y="162" class="edge-label">No (Fish only)</text>

  <!-- Q3: How minimal? -->
  <rect x="295" y="290" width="210" height="40" class="box" fill="#fff" stroke="#555"/>
  <text x="400" y="310" class="label" fill="#222">How minimal do you want it?</text>

  <!-- Arrow: Q2 → Q3 (No) -->
  <line x1="400" y1="230" x2="400" y2="290" class="edge"/>
  <text x="412" y="262" class="edge-label">No</text>

  <!-- Starship (right of Q1) -->
  <rect x="580" y="90" width="150" height="40" class="box" fill="#c6e4ff" stroke="#2b6cb0"/>
  <text x="655" y="110" class="label" fill="#1a365d">Starship</text>
  <text x="655" y="142" class="small">TOML config, cross-shell</text>

  <!-- Arrow: Q1 → Starship (Yes) -->
  <line x1="505" y1="110" x2="580" y2="110" class="edge"/>
  <text x="530" y="100" class="edge-label">Yes</text>

  <!-- Tide (right of Q2) -->
  <rect x="580" y="190" width="150" height="40" class="box" fill="#d4edda" stroke="#28a745"/>
  <text x="655" y="210" class="label" fill="#155724">Tide</text>
  <text x="655" y="222" class="small">Powerful Fish-native prompt</text>

  <!-- Arrow: Q2 → Tide (Yes) -->
  <line x1="505" y1="210" x2="580" y2="210" class="edge"/>
  <text x="530" y="200" class="edge-label">Yes</text>

  <!-- Pure (right of Q3) -->
  <rect x="580" y="290" width="150" height="40" class="box" fill="#fff3cd" stroke="#ffc107"/>
  <text x="655" y="310" class="label" fill="#856404">Pure</text>
  <text x="655" y="322" class="small">Clean and quiet</text>

  <!-- Arrow: Q3 → Pure (Clean) -->
  <line x1="505" y1="310" x2="580" y2="310" class="edge"/>
  <text x="530" y="300" class="edge-label">Clean</text>

  <!-- Hydro (below Q3) -->
  <rect x="295" y="390" width="210" height="40" class="box" fill="#f8d7da" stroke="#dc3545"/>
  <text x="400" y="410" class="label" fill="#721c24">Hydro</text>
  <text x="400" y="422" class="small">Absolute minimum, async git status</text>

  <!-- Arrow: Q3 → Hydro (Bare) -->
  <line x1="400" y1="330" x2="400" y2="390" class="edge"/>
  <text x="412" y="362" class="edge-label">Bare</text>

  <!-- Built-in (below Hydro) -->
  <rect x="295" y="465" width="210" height="40" class="box" fill="#e2e3e5" stroke="#6c757d"/>
  <text x="400" y="485" class="label" fill="#383d41">Built-in themes</text>
  <text x="400" y="497" class="small">No install needed</text>

  <!-- Arrow: Hydro → Built-in -->
  <line x1="400" y1="430" x2="400" y2="465" class="edge"/>
  <text x="412" y="450" class="edge-label">Or skip installs</text>
</svg>
