<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="52" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">Deploy workflow: chat message to live app</text>
  <text x="640" y="86" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">Two validation gates catch config errors before they break anything</text>

  <!-- Row 1 -->
  <rect x="30" y="150" width="200" height="115" rx="12" fill="#334155"/>
  <text x="130" y="192" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">1. Chat message</text>
  <text x="130" y="222" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">"install X on my server"</text>

  <line x1="232" y1="207" x2="276" y2="207" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="280" y="150" width="200" height="115" rx="12" fill="#334155"/>
  <text x="380" y="192" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">2. Create folder</text>
  <text x="380" y="222" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-monospace, monospace">docker-apps/&lt;app&gt;/</text>

  <line x1="482" y1="207" x2="526" y2="207" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="530" y="150" width="200" height="115" rx="12" fill="#334155"/>
  <text x="630" y="192" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">3. Write files</text>
  <text x="630" y="222" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-monospace, monospace">compose + .env</text>

  <line x1="732" y1="207" x2="776" y2="207" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="780" y="150" width="200" height="115" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="880" y="182" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">GATE 1</text>
  <text x="880" y="208" text-anchor="middle" fill="white" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">compose config -q</text>
  <text x="880" y="234" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="12" font-family="system-ui, sans-serif">valid compose file?</text>

  <line x1="982" y1="207" x2="1026" y2="207" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1030" y="150" width="200" height="115" rx="12" fill="#334155"/>
  <text x="1130" y="192" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">5. Start</text>
  <text x="1130" y="222" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-monospace, monospace">docker compose up -d</text>

  <!-- connector row1 -> row2 -->
  <polyline points="1130,267 1130,360 130,360 130,426" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-down)"/>

  <!-- Row 2 -->
  <rect x="30" y="430" width="200" height="115" rx="12" fill="#334155"/>
  <text x="130" y="472" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">6. Edit Caddyfile</text>
  <text x="130" y="502" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">app.domain → service:port</text>

  <line x1="232" y1="487" x2="276" y2="487" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="280" y="430" width="200" height="115" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="462" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">GATE 2</text>
  <text x="380" y="488" text-anchor="middle" fill="white" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">caddy validate</text>
  <text x="380" y="514" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="12" font-family="system-ui, sans-serif">syntax OK? all sites safe</text>

  <line x1="482" y1="487" x2="526" y2="487" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="530" y="430" width="200" height="115" rx="12" fill="#334155"/>
  <text x="630" y="472" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">8. Reload Caddy</text>
  <text x="630" y="502" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-monospace, monospace">caddy reload</text>

  <line x1="732" y1="487" x2="776" y2="487" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="780" y="430" width="200" height="115" rx="12" fill="#334155"/>
  <text x="880" y="472" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">9. Retry curl</text>
  <text x="880" y="502" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">report HTTP status</text>

  <line x1="982" y1="487" x2="1026" y2="487" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1030" y="430" width="200" height="115" rx="12" fill="#334155"/>
  <text x="1130" y="472" text-anchor="middle" fill="white" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">10. Verify</text>
  <text x="1130" y="502" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="system-ui, sans-serif">compose ps + clean logs</text>

  <!-- legend -->
  <rect x="360" y="620" width="26" height="26" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="639" fill="rgba(255,255,255,0.85)" font-size="15" font-family="system-ui, sans-serif">Validation gate: stop here and fix the config. Never push forward on a failed gate.</text>
</svg>
