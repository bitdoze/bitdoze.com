<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" role="img" aria-label="The Nous Portal as one account for Hermes Agent, the Inference API, and Hermes Cloud" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Account -->
  <rect x="312" y="30" width="400" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="512" y="60" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">portal.nousresearch.com</text>
  <text x="512" y="86" text-anchor="middle" font-size="13" fill="#475569">one account - Free / Plus / Super / Ultra</text>

  <!-- Arrows down -->
  <line x1="230" y1="160" x2="400" y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="512" y1="160" x2="512" y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="794" y1="160" x2="624" y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Hermes Agent -->
  <rect x="90" y="160" width="280" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="200" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Hermes Agent</text>
  <text x="230" y="232" text-anchor="middle" font-size="13" fill="#475569">open-source CLI agent</text>
  <text x="230" y="256" text-anchor="middle" font-size="13" fill="#475569">runs on your own server</text>
  <text x="230" y="284" text-anchor="middle" font-size="12" fill="#64748b">Free plan: :free models</text>

  <!-- Inference API -->
  <rect x="372" y="160" width="280" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="512" y="200" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Inference API</text>
  <text x="512" y="232" text-anchor="middle" font-size="13" fill="#475569">OpenAI-compatible endpoint</text>
  <text x="512" y="256" text-anchor="middle" font-size="13" fill="#475569">point any app at it</text>
  <text x="512" y="284" text-anchor="middle" font-size="12" fill="#64748b">paid catalog + credits</text>

  <!-- Hermes Cloud -->
  <rect x="654" y="160" width="280" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="794" y="200" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Hermes Cloud</text>
  <text x="794" y="232" text-anchor="middle" font-size="13" fill="#475569">hosted, always-on agent</text>
  <text x="794" y="256" text-anchor="middle" font-size="13" fill="#475569">cron jobs 24/7</text>
  <text x="794" y="284" text-anchor="middle" font-size="12" fill="#64748b">included with paid plans</text>
</svg>
