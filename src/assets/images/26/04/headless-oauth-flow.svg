<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 380" role="img" aria-label="Headless OAuth flow for Hermes on a VPS using SSH port forwarding on port 8642" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Portal -->
  <rect x="372" y="30" width="280" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="512" y="60" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">portal.nousresearch.com</text>
  <text x="512" y="84" text-anchor="middle" font-size="13" fill="#475569">OAuth authorize</text>

  <!-- Laptop -> Portal -->
  <line x1="245" y1="205" x2="430" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="285" y="140" text-anchor="middle" font-size="12" fill="#64748b">1. open URL</text>
  <text x="285" y="158" text-anchor="middle" font-size="12" fill="#64748b">+ authorize</text>

  <!-- Portal -> Laptop (redirect) -->
  <line x1="460" y1="105" x2="300" y2="205" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="425" y="185" text-anchor="middle" font-size="12" fill="#3b82f6">2. redirect to localhost:8642</text>

  <!-- Laptop -->
  <rect x="60" y="210" width="300" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="248" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Local machine</text>
  <text x="210" y="278" text-anchor="middle" font-size="13" fill="#475569">browser opens OAuth URL</text>
  <text x="210" y="302" text-anchor="middle" font-size="13" fill="#475569">callback hits localhost:8642</text>

  <!-- SSH tunnel -->
  <line x1="366" y1="270" x2="658" y2="270" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
  <text x="512" y="252" text-anchor="middle" font-size="12" fill="#3b82f6">3. ssh -N -L 8642:127.0.0.1:8642 user@vps</text>
  <text x="512" y="296" text-anchor="middle" font-size="12" fill="#3b82f6">tunnel forwards to VPS :8642</text>

  <!-- VPS -->
  <rect x="664" y="210" width="300" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="814" y="248" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">VPS</text>
  <text x="814" y="278" text-anchor="middle" font-size="13" fill="#475569">Hermes listens on :8642</text>
  <text x="814" y="302" text-anchor="middle" font-size="13" fill="#475569">writes ~/.hermes/auth.json</text>
</svg>
