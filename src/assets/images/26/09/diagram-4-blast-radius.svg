<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d4Title d4Desc">
  <title id="d4Title">Blast radius comparison between a static Astro site and WordPress</title>
  <desc id="d4Desc">Concentric rings: a small Astro core of static files surrounded by five expanding WordPress rings numbered one to five — database, admin and REST API, plugins (where 91 percent of vulnerabilities live), themes, and the host layer. The legend explains each ring.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="150" cy="600" r="260" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="120" r="250" fill="url(#blobCyan)"/>
  <circle cx="430" cy="350" r="300" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="48" font-size="29" font-weight="800" fill="#0F172A">Blast radius, not slogans</text>
    <text x="60" y="76" font-size="15" fill="#64748B">After one bug in each stack, how far does an attacker get?</text>
  </g>

  <!-- concentric rings, largest first -->
  <g>
    <circle cx="430" cy="350" r="235" fill="#EC4899" fill-opacity="0.05" stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7 6"/>
    <circle cx="430" cy="350" r="190" fill="#EC4899" fill-opacity="0.05" stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="430" cy="350" r="145" fill="#EC4899" fill-opacity="0.06" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="430" cy="350" r="100" fill="#EC4899" fill-opacity="0.07" stroke="#EC4899" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="430" cy="350" r="58" fill="#EC4899" fill-opacity="0.08" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="430" cy="350" r="32" fill="url(#accent)" stroke="#4338CA" stroke-width="2"/>
  </g>
  <text x="430" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Astro</text>

  <!-- ring labels on the left edge of the ring stack -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#BE185D" text-anchor="end">
    <text x="180" y="392">Host layer</text>
    <text x="252" y="232">Themes</text>
    <text x="292" y="412">Plugins</text>
    <text x="344" y="292">Admin + API</text>
  </g>

  <!-- numbered badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <circle cx="388" cy="365" r="16" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="388" y="370" fill="#BE185D">1</text>
    <circle cx="356" cy="323" r="16" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="356" y="328" fill="#BE185D">2</text>
    <circle cx="308" cy="361" r="16" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="308" y="366" fill="#BE185D">3</text>
    <circle cx="285" cy="266" r="16" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="285" y="271" fill="#BE185D">4</text>
    <circle cx="219" cy="331" r="16" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="219" y="336" fill="#BE185D">5</text>
  </g>

  <!-- legend panel -->
  <rect x="700" y="104" width="460" height="448" rx="22" fill="#FFFFFF" fill-opacity="0.75" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="722" y="126" width="416" height="80" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="740" y="152" font-size="14.5" font-weight="800" fill="#4338CA">Astro: static files — the whole surface</text>
    <text x="740" y="174" font-size="11.5" fill="#475569">No database, no login, no PHP to inject into.</text>
    <text x="740" y="192" font-size="11.5" fill="#475569">Residual risk: npm supply chain, deploy tokens, SSR code.</text>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="722" y="230" font-size="12" font-weight="800" letter-spacing="1.6" fill="#94A3B8">THE WORDPRESS STACK</text>

    <circle cx="736" cy="262" r="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.6"/>
    <text x="736" y="267" text-anchor="middle" font-size="12" font-weight="800" fill="#BE185D">1</text>
    <text x="762" y="267" font-size="13.5" font-weight="700" fill="#0F172A">Database</text>
    <text x="762" y="284" font-size="11.5" fill="#64748B">MySQL / MariaDB you now have to back up</text>

    <circle cx="736" cy="320" r="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.6"/>
    <text x="736" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#BE185D">2</text>
    <text x="762" y="325" font-size="13.5" font-weight="700" fill="#0F172A">Admin + REST API</text>
    <text x="762" y="342" font-size="11.5" fill="#64748B">/batch/v1 was the route for the 2026 core RCE</text>

    <rect x="716" y="356" width="428" height="56" rx="14" fill="#FDF2F8"/>
    <circle cx="736" cy="378" r="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.6"/>
    <text x="736" y="383" text-anchor="middle" font-size="12" font-weight="800" fill="#BE185D">3</text>
    <text x="762" y="383" font-size="13.5" font-weight="800" fill="#BE185D">Plugins — 91% of vulnerabilities</text>
    <text x="762" y="400" font-size="11.5" fill="#64748B">46% had no patch at disclosure · 5h median to mass exploit</text>

    <circle cx="736" cy="436" r="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.6"/>
    <text x="736" y="441" text-anchor="middle" font-size="12" font-weight="800" fill="#BE185D">4</text>
    <text x="762" y="441" font-size="13.5" font-weight="700" fill="#0F172A">Themes</text>
    <text x="762" y="458" font-size="11.5" fill="#64748B">Third-party code shipped straight to production</text>

    <circle cx="736" cy="494" r="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.6"/>
    <text x="736" y="499" text-anchor="middle" font-size="12" font-weight="800" fill="#BE185D">5</text>
    <text x="762" y="499" font-size="13.5" font-weight="700" fill="#0F172A">Host layer</text>
    <text x="762" y="516" font-size="11.5" fill="#64748B">WAF / CDN configs blocked only 26% of attempts</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Static hosting shrinks the blast radius rather than deleting it — the surface moves to the build pipeline.</text>
  <text x="600" y="628" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Sources: Patchstack 2025 data via 2026 reporting, swif.ai (4 August 2026), Wiz (22 July 2026)</text>
</svg>
