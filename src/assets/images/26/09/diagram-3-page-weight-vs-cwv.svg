<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d3Title d3Desc">
  <title id="d3Title">Page weight versus percentage of sites passing Core Web Vitals</title>
  <desc id="d3Desc">Two charts. Left: median page weight in megabytes (Astro 1.65 lowest, Duda 1.87, Drupal 2.39, Joomla 2.65, Wix 2.67, WordPress 2.76). Right: percentage of sites passing Core Web Vitals (Duda 85, Wix 80, Shopify 79, Astro 67, Drupal 64, Joomla 58, WordPress 49), with Shopify marked as an outlier because it has the heaviest pages yet still passes on about 79 percent of sites.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="250" fill="url(#blobIndigo)"/>
  <circle cx="1090" cy="150" r="240" fill="url(#blobCyan)"/>
  <circle cx="620" cy="660" r="260" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="29" font-weight="800" fill="#0F172A">Page weight vs. Core Web Vitals</text>
    <text x="600" y="76" font-size="15" fill="#64748B">Field data across the top 10M sites — these averages describe populations, not your site</text>
  </g>

  <!-- panels -->
  <rect x="60" y="104" width="530" height="470" rx="22" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="610" y="104" width="530" height="470" rx="22" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1" stroke-width="1.5"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="90" y="140" font-size="16.5" font-weight="800" fill="#0F172A">Median page weight</text>
    <text x="90" y="160" font-size="12" fill="#64748B">megabytes, lower is better</text>
    <text x="640" y="140" font-size="16.5" font-weight="800" fill="#0F172A">Sites passing Core Web Vitals</text>
    <text x="640" y="160" font-size="12" fill="#64748B">percent of sites, higher is better</text>
  </g>

  <!-- LEFT CHART: baseline y=545, scale 3.0MB -> 330px -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 5" opacity="0.7">
    <line x1="100" y1="545" x2="570" y2="545"/>
    <line x1="100" y1="435" x2="570" y2="435"/>
    <line x1="100" y1="325" x2="570" y2="325"/>
    <line x1="100" y1="215" x2="570" y2="215"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">
    <text x="92" y="549">0</text>
    <text x="92" y="439">1</text>
    <text x="92" y="329">2</text>
    <text x="92" y="219">3</text>
  </g>

  <!-- labels: 6 slots of 78 starting x=110, bar width 46 -->
  <g>
    <!-- Astro 1.65 -> h=182 -->
    <rect x="110" y="363" width="46" height="182" rx="8" fill="url(#accent)"/>
    <!-- Duda 1.87 -> h=206 -->
    <rect x="188" y="339" width="46" height="206" rx="8" fill="#CBD5E1"/>
    <!-- Drupal 2.39 -> h=263 -->
    <rect x="266" y="282" width="46" height="263" rx="8" fill="#CBD5E1"/>
    <!-- Joomla 2.65 -> h=292 -->
    <rect x="344" y="253" width="46" height="292" rx="8" fill="#CBD5E1"/>
    <!-- Wix 2.67 -> h=294 -->
    <rect x="422" y="251" width="46" height="294" rx="8" fill="#CBD5E1"/>
    <!-- WordPress 2.76 -> h=304 -->
    <rect x="500" y="241" width="46" height="304" rx="8" fill="#EC4899" fill-opacity="0.85"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="133" y="353" fill="#4338CA">1.65</text>
    <text x="211" y="329" fill="#475569">1.87</text>
    <text x="289" y="272" fill="#475569">2.39</text>
    <text x="367" y="243" fill="#475569">2.65</text>
    <text x="445" y="241" fill="#475569">2.67</text>
    <text x="523" y="231" fill="#BE185D">2.76</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">
    <text x="133" y="566">Astro</text>
    <text x="211" y="566">Duda</text>
    <text x="289" y="566">Drupal</text>
    <text x="367" y="566">Joomla</text>
    <text x="445" y="566">Wix</text>
    <text x="523" y="566">WordPress</text>
  </g>
  <text x="133" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4338CA">lightest</text>
  <text x="523" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#BE185D">heaviest</text>

  <!-- RIGHT CHART: baseline y=545, scale 100% -> 330px ; slots 67.14 from x=655, bar width 40 -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 5" opacity="0.7">
    <line x1="655" y1="545" x2="1125" y2="545"/>
    <line x1="655" y1="479" x2="1125" y2="479"/>
    <line x1="655" y1="413" x2="1125" y2="413"/>
    <line x1="655" y1="347" x2="1125" y2="347"/>
    <line x1="655" y1="281" x2="1125" y2="281"/>
    <line x1="655" y1="215" x2="1125" y2="215"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">
    <text x="647" y="549">0%</text>
    <text x="647" y="483">20%</text>
    <text x="647" y="417">40%</text>
    <text x="647" y="351">60%</text>
    <text x="647" y="285">80%</text>
    <text x="647" y="219">100%</text>
  </g>

  <g>
    <!-- Duda 85 -> 280.5 -->
    <rect x="669" y="265" width="40" height="280" rx="8" fill="#CBD5E1"/>
    <!-- Wix 80 -> 264 -->
    <rect x="736" y="281" width="40" height="264" rx="8" fill="#CBD5E1"/>
    <!-- Shopify 79 -> 260.7 -->
    <rect x="803" y="285" width="40" height="260" rx="8" fill="#06B6D4" fill-opacity="0.75"/>
    <!-- Astro 67 -> 221 -->
    <rect x="870" y="324" width="40" height="221" rx="8" fill="url(#accent)"/>
    <!-- Drupal 64 -> 211 -->
    <rect x="937" y="334" width="40" height="211" rx="8" fill="#CBD5E1"/>
    <!-- Joomla 58 -> 191 -->
    <rect x="1004" y="354" width="40" height="191" rx="8" fill="#CBD5E1"/>
    <!-- WordPress 49 -> 162 -->
    <rect x="1071" y="383" width="40" height="162" rx="8" fill="#EC4899" fill-opacity="0.85"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="689" y="255" fill="#475569">85%</text>
    <text x="756" y="271" fill="#475569">80%</text>
    <text x="823" y="275" fill="#0E7490">79%</text>
    <text x="890" y="314" fill="#4338CA">67%</text>
    <text x="957" y="324" fill="#475569">64%</text>
    <text x="1024" y="344" fill="#475569">58%</text>
    <text x="1091" y="373" fill="#BE185D">49%</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">
    <text x="689" y="566">Duda</text>
    <text x="756" y="566">Wix</text>
    <text x="823" y="566">Shopify</text>
    <text x="890" y="566">Astro</text>
    <text x="957" y="566">Drupal</text>
    <text x="1024" y="566">Joomla</text>
    <text x="1091" y="566">WP</text>
  </g>
  <text x="890" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4338CA">lightest · best score</text>
  <text x="1091" y="586" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#BE185D">last</text>

  <!-- outlier callout on Shopify -->
  <rect x="751" y="176" width="146" height="30" rx="15" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="824" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0E7490">3.77 MB but 79%</text>
  <line x1="824" y1="208" x2="824" y2="279" stroke="#06B6D4" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="834" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0E7490">page weight alone</text>
  <text x="834" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0E7490">does not predict CWV</text>

  <text x="600" y="616" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Source: HTTP Archive Core Web Vitals Technology Report, April 2026 dataset (via Search Engine Journal, 27 May 2026)</text>
  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">A tuned WordPress beats an untuned Astro. The delta is the effort to stay tuned.</text>
</svg>
