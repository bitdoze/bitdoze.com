<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t2 d2">
  <title id="t2">Jellyfin Docker Compose deployment topology</title>
  <desc id="d2">A VPS host runs Docker with a bridge network containing the jellyfin container on image jellyfin/jellyfin:12.1. Three bind mounts attach: ./config for the database and metadata (the one to back up), ./cache for disposable transcode scratch, and /mnt/media mounted read-only as /media. Port 8096 is published for the first-run check; 7359/udp discovery stays unpublished on a VPS.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="260" fill="url(#blobIndigo)"/>
  <circle cx="1100" cy="600" r="280" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="56" font-size="29" font-weight="800" fill="#0F172A">The Docker Compose deployment</text>
    <text x="60" y="84" font-size="15" fill="#64748B">One container, three bind mounts, one published port</text>
  </g>

  <!-- host boundary -->
  <rect x="150" y="118" width="900" height="478" rx="20" fill="#FFFFFF" fill-opacity="0.45" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="182" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1.5">HOST · UBUNTU 24.04 VPS (OR A MINI PC AT HOME)</text>

  <!-- docker network -->
  <rect x="200" y="172" width="480" height="180" rx="16" fill="#EEF2FF" fill-opacity="0.6" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="224" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4F46E5" letter-spacing="1.2">DOCKER NETWORK (BRIDGE)</text>

  <!-- jellyfin container -->
  <g filter="url(#shadow)">
    <rect x="248" y="218" width="380" height="112" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="248" y="218" width="380" height="34" rx="14" fill="url(#gMain)"/>
    <rect x="248" y="240" width="380" height="12" fill="url(#gMain)"/>
    <text x="438" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JELLYFIN CONTAINER</text>
    <text x="438" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">image: jellyfin/jellyfin:12.1 (pinned)</text>
    <text x="438" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">web UI + API on :8096 · restart: unless-stopped</text>
  </g>

  <!-- published port arrow -->
  <line x1="40" y1="274" x2="238" y2="274" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">publish 8096:8096</text>
  <text x="140" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">first-run check only</text>
  <text x="140" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">TLS comes later, on the proxy</text>

  <!-- 7359 warning -->
  <g>
    <rect x="720" y="190" width="300" height="86" rx="14" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="744" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#BE123C">7359/udp · client discovery</text>
    <text x="744" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#9F1239">LAN-only feature. Do not publish</text>
    <text x="744" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#9F1239">the mapping on a VPS.</text>
  </g>

  <!-- volume mounts -->
  <g filter="url(#shadow)">
    <rect x="200" y="420" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="200" y="420" width="250" height="32" rx="14" fill="url(#gIndigo)"/>
    <rect x="200" y="442" width="250" height="10" fill="url(#gIndigo)"/>
    <text x="325" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">./config → /config</text>
    <text x="325" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">DB, metadata, images</text>
    <text x="325" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">the only irreplaceable mount</text>
    <rect x="245" y="516" width="160" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="325" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle">BACK THIS UP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="420" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="475" y="420" width="250" height="32" rx="14" fill="url(#gSlate)"/>
    <rect x="475" y="442" width="250" height="10" fill="url(#gSlate)"/>
    <text x="600" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">./cache → /cache</text>
    <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">transcode scratch space</text>
    <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">regenerates on demand</text>
    <rect x="520" y="516" width="160" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="600" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">DISPOSABLE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="420" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="750" y="420" width="250" height="32" rx="14" fill="url(#gGreen)"/>
    <rect x="750" y="442" width="250" height="10" fill="url(#gGreen)"/>
    <text x="875" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">/mnt/media → /media:ro</text>
    <text x="875" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">your library, mounted read-only</text>
    <text x="875" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">multiple mounts allowed</text>
    <rect x="795" y="516" width="160" height="26" rx="13" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="875" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">READ-ONLY IS FINE</text>
  </g>

  <!-- mount arrows -->
  <g stroke="#64748B" stroke-width="2" stroke-dasharray="5 4">
    <line x1="330" y1="330" x2="325" y2="410" marker-end="url(#arr)"/>
    <line x1="438" y1="330" x2="600" y2="410" marker-end="url(#arr)"/>
    <line x1="546" y1="330" x2="875" y2="410" marker-end="url(#arr)"/>
  </g>
  <text x="490" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B">bind mounts</text>

  <text x="60" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Host directories bind-mounted into the container. Ports 8920 (internal TLS) and 7359/udp stay unpublished.</text>
</svg>
