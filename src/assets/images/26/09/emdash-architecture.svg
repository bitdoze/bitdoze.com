<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="EmDash CMS architecture: Astro site with admin panel, REST API, and MCP server querying a database and S3-compatible media storage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowIndigo">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>
  <ellipse cx="180" cy="90" rx="300" ry="180" fill="url(#glowIndigo)"/>
  <ellipse cx="1060" cy="600" rx="300" ry="200" fill="url(#glowCyan)"/>
  <circle cx="1160" cy="60" r="4" fill="#6366F1" opacity="0.16"/>
  <circle cx="40" cy="640" r="5" fill="#EC4899" opacity="0.15"/>
  <circle cx="1180" cy="380" r="3" fill="#06B6D4" opacity="0.2"/>

  <!-- header -->
  <text x="60" y="54" font-size="27" font-weight="700" fill="#0F172A">EmDash CMS Architecture</text>
  <text x="60" y="80" font-size="15" fill="#64748B">One Astro integration: site, admin, REST API and MCP server in a single deployment</text>

  <!-- clients (left) -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="180" width="232" height="76" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="64" y="288" width="232" height="76" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="64" y="396" width="232" height="76" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  </g>
  <text x="88" y="212" font-size="17" font-weight="600" fill="#0F172A">Browsers</text>
  <text x="88" y="236" font-size="14" fill="#64748B">public site visitors</text>
  <text x="88" y="320" font-size="17" font-weight="600" fill="#0F172A">Editors</text>
  <text x="88" y="344" font-size="14" fill="#64748B">admin panel users</text>
  <text x="88" y="428" font-size="17" font-weight="600" fill="#0F172A">AI Agents</text>
  <text x="88" y="452" font-size="14" fill="#64748B">MCP clients</text>

  <!-- arrows: clients -> container -->
  <path d="M 296 218 L 376 235" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 296 326 L 376 303" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 296 434 L 376 439" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- container -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="124" width="430" height="510" rx="20" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  </g>
  <text x="595" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">EmDash — One Deployment</text>
  <text x="595" y="178" text-anchor="middle" font-size="14" fill="#64748B">Astro integration · astro.config.mjs</text>
  <path d="M 400 192 H 790" stroke="#E2E8F0" stroke-width="2"/>

  <!-- modules -->
  <g filter="url(#cardShadow)">
    <rect x="400" y="206" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="400" y="274" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="400" y="342" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="400" y="410" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="400" y="478" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="400" y="546" width="390" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  </g>
  <circle cx="424" cy="235" r="5" fill="#6366F1"/>
  <circle cx="424" cy="303" r="5" fill="#EC4899"/>
  <circle cx="424" cy="371" r="5" fill="#6366F1"/>
  <circle cx="424" cy="439" r="5" fill="#06B6D4"/>
  <circle cx="424" cy="507" r="5" fill="#6366F1"/>
  <circle cx="424" cy="575" r="5" fill="#EC4899"/>
  <text x="444" y="230" font-size="16" font-weight="600" fill="#0F172A">Astro Site</text>
  <text x="444" y="251" font-size="14" fill="#64748B">Live Content Collections — request-time reads</text>
  <text x="444" y="298" font-size="16" font-weight="600" fill="#0F172A">Admin Panel</text>
  <text x="444" y="319" font-size="14" fill="#64748B">React app · /_emdash/admin</text>
  <text x="444" y="366" font-size="16" font-weight="600" fill="#0F172A">REST API</text>
  <text x="444" y="387" font-size="14" fill="#64748B">content · media · taxonomies · scheduling</text>
  <text x="444" y="434" font-size="16" font-weight="600" fill="#0F172A">MCP Server</text>
  <text x="444" y="455" font-size="14" fill="#64748B">~60 agent tools · /_emdash/api/mcp</text>
  <text x="444" y="502" font-size="16" font-weight="600" fill="#0F172A">Auth</text>
  <text x="444" y="523" font-size="14" fill="#64748B">passkeys-first · RBAC · optional SSO</text>
  <text x="444" y="570" font-size="16" font-weight="600" fill="#0F172A">Plugin Sandbox</text>
  <text x="444" y="591" font-size="14" fill="#64748B">capability manifests · workerd isolation</text>

  <!-- storage (right) -->
  <g filter="url(#cardShadow)">
    <rect x="884" y="206" width="252" height="76" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="884" y="312" width="252" height="76" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="884" y="418" width="252" height="76" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="884" y="524" width="252" height="76" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="904" y="238" font-size="17" font-weight="600" fill="#0F172A">Database</text>
  <text x="904" y="262" font-size="14" fill="#64748B">D1 · SQLite · libSQL · Postgres</text>
  <text x="904" y="344" font-size="17" font-weight="600" fill="#0F172A">Media Storage</text>
  <text x="904" y="368" font-size="14" fill="#64748B">R2 · S3 API · local disk</text>
  <text x="904" y="450" font-size="17" font-weight="600" fill="#0F172A">Object Cache (optional)</text>
  <text x="904" y="474" font-size="14" fill="#64748B">Workers KV · Workers Cache</text>
  <text x="904" y="556" font-size="17" font-weight="600" fill="#0F172A">Cron Triggers</text>
  <text x="904" y="580" font-size="14" fill="#64748B">publishing · plugins · backups</text>

  <!-- arrows: container -> storage -->
  <path d="M 810 244 H 878" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 810 350 H 878" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 810 456 H 878" stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <path d="M 810 562 H 878" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- caption -->
  <text x="600" y="656" text-anchor="middle" font-size="15" fill="#64748B">Not a visual page builder — Astro components own the HTML · edits go live on the next request, no rebuild</text>
</svg>
