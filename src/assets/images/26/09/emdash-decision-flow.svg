<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Decision flowchart for adopting EmDash CMS: Astro requirement, editor needs, database operations willingness, and Cloudflare versus VPS deploy choice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowIndigo">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fitStroke" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="fitText" gradientUnits="userSpaceOnUse" x1="714" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>
  <ellipse cx="150" cy="110" rx="300" ry="190" fill="url(#glowIndigo)"/>
  <ellipse cx="1080" cy="590" rx="300" ry="180" fill="url(#glowPink)"/>
  <circle cx="1156" cy="80" r="4" fill="#06B6D4" opacity="0.18"/>
  <circle cx="60" cy="620" r="4" fill="#6366F1" opacity="0.18"/>
  <circle cx="1180" cy="300" r="3" fill="#EC4899" opacity="0.2"/>

  <!-- header -->
  <text x="60" y="52" font-size="27" font-weight="700" fill="#0F172A">Should You Use EmDash?</text>
  <text x="60" y="78" font-size="15" fill="#64748B">Four gates — all must be true (adapted from the project's own docs)</text>

  <!-- flow arrows -->
  <path d="M 340 218 V 251" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 340 353 V 386" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 340 488 V 521" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 520 170 H 684" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 520 305 H 684" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 520 440 H 684" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 520 575 H 684" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- yes / no / either labels -->
  <rect x="352" y="226" width="46" height="22" rx="11" fill="#06B6D4" opacity="0.14"/>
  <text x="375" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7490">Yes</text>
  <rect x="352" y="361" width="46" height="22" rx="11" fill="#06B6D4" opacity="0.14"/>
  <text x="375" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7490">Yes</text>
  <rect x="352" y="496" width="46" height="22" rx="11" fill="#06B6D4" opacity="0.14"/>
  <text x="375" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7490">Yes</text>
  <rect x="583" y="141" width="44" height="22" rx="11" fill="#EC4899" opacity="0.12"/>
  <text x="605" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#BE185D">No</text>
  <rect x="583" y="276" width="44" height="22" rx="11" fill="#EC4899" opacity="0.12"/>
  <text x="605" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#BE185D">No</text>
  <rect x="583" y="411" width="44" height="22" rx="11" fill="#EC4899" opacity="0.12"/>
  <text x="605" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#BE185D">No</text>
  <rect x="576" y="546" width="58" height="22" rx="11" fill="#6366F1" opacity="0.10"/>
  <text x="605" y="562" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5">either</text>

  <!-- decision diamonds -->
  <g filter="url(#cardShadow)">
    <polygon points="160,170 340,122 520,170 340,218" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <polygon points="160,305 340,257 520,305 340,353" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <polygon points="160,440 340,392 520,440 340,488" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  </g>
  <text x="340" y="163" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Built with</text>
  <text x="340" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Astro?</text>
  <text x="340" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Editors need a</text>
  <text x="340" y="320" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">non-repo workplace?</text>
  <text x="340" y="433" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Can you operate the</text>
  <text x="340" y="455" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">database + backups?</text>

  <!-- decision 4: deploy choice -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="527" width="360" height="96" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
  </g>
  <text x="340" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Pick your deploy path</text>
  <rect x="176" y="568" width="160" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="256" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#4F46E5">Cloudflare · D1 + R2</text>
  <rect x="344" y="568" width="160" height="30" rx="15" fill="#ECFEFF" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1"/>
  <text x="424" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#0E7490">VPS · Node + SQLite</text>

  <!-- number badges -->
  <circle cx="160" cy="170" r="14" fill="#6366F1"/>
  <text x="160" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="160" cy="305" r="14" fill="#6366F1"/>
  <text x="160" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="160" cy="440" r="14" fill="#6366F1"/>
  <text x="160" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="160" cy="575" r="14" fill="#0891B2"/>
  <text x="160" y="580" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>

  <!-- outcome boxes -->
  <g filter="url(#cardShadow)">
    <rect x="690" y="122" width="450" height="96" rx="16" fill="#FFFFFF" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="690" y="257" width="450" height="96" rx="16" fill="#FFFFFF" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="690" y="392" width="450" height="96" rx="16" fill="#FFFFFF" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <text x="714" y="158" font-size="16" font-weight="600" fill="#0F172A">Not your tool — EmDash is Astro-only</text>
  <text x="714" y="184" font-size="14" fill="#64748B">non-Astro stacks need a different CMS</text>
  <text x="714" y="293" font-size="16" font-weight="600" fill="#0F172A">Markdown in git may be simpler</text>
  <text x="714" y="319" font-size="14" fill="#64748B">static Astro collections — no DB, no admin, no workerd</text>
  <text x="714" y="428" font-size="16" font-weight="600" fill="#0F172A">Pick a managed platform instead</text>
  <text x="714" y="454" font-size="14" fill="#64748B">you'd own DB, backups and upgrades you don't want</text>

  <!-- fit box -->
  <g filter="url(#cardShadow)">
    <rect x="690" y="527" width="450" height="96" rx="16" fill="#FFFFFF" stroke="url(#fitStroke)" stroke-width="2"/>
  </g>
  <text x="714" y="563" font-size="18" font-weight="700" fill="url(#fitText)">EmDash is a fit</text>
  <text x="714" y="590" font-size="14" fill="#64748B">Agency · Astro dev · blogger past the markdown threshold</text>
  <circle cx="1092" cy="575" r="22" fill="#06B6D4" opacity="0.15"/>
  <path d="M 1082 575 l 7 7 l 14 -14" stroke="#0891B2" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- footer -->
  <text x="600" y="658" text-anchor="middle" font-size="14" fill="#94A3B8">All four gates pass? Then the only question left is where to run it.</text>
</svg>
