<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
  <circle cx="110" cy="110" r="200" fill="url(#blobI)"/>
  <circle cx="1100" cy="620" r="220" fill="url(#blobC)"/>

  <text x="600" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Security baseline for any Docker management UI</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748B">Never expose the raw socket — gate every hop between the internet and Docker</text>

  <!-- Blocked direct exposure -->
  <text x="367" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#EF4444">direct 0.0.0.0 exposure — never</text>
  <path d="M 600 150 V 122 H 135 V 143" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <circle cx="367" cy="122" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
  <path d="M 359 114 L 375 130 M 375 114 L 359 130" stroke="#EF4444" stroke-width="2.5"/>

  <!-- Flow nodes -->
  <g>
    <rect x="40" y="150" width="190" height="166" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="41" y="151" width="188" height="4" rx="2" fill="#94A3B8"/>
    <circle cx="135" cy="185" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
    <path d="M 124 206 a 11 9 0 0 1 22 0" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="135" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">You / Internet</text>
    <text x="135" y="262" text-anchor="middle" font-size="14" fill="#475569">admin or CI</text>
    <text x="135" y="283" text-anchor="middle" font-size="14" fill="#475569">over TLS 443</text>

    <rect x="272" y="150" width="190" height="166" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="273" y="151" width="188" height="4" rx="2" fill="#06B6D4"/>
    <path d="M 367 176 l 14 6 v 9 c 0 10 -7 15 -14 18 c -7 -3 -14 -8 -14 -18 v -9 z" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="367" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Reverse proxy</text>
    <text x="367" y="262" text-anchor="middle" font-size="14" fill="#475569">TLS + auth gate —</text>
    <text x="367" y="283" text-anchor="middle" font-size="14" fill="#475569">forward-auth / SSO</text>
    <text x="367" y="304" text-anchor="middle" font-size="14" fill="#475569">the only public door</text>

    <rect x="505" y="150" width="190" height="166" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="506" y="151" width="188" height="4" rx="2" fill="#4F46E5"/>
    <rect x="584" y="180" width="32" height="24" rx="4" fill="none" stroke="#64748B" stroke-width="2"/>
    <path d="M 584 188 H 616" stroke="#64748B" stroke-width="2"/>
    <circle cx="592" cy="184" r="1.5" fill="#64748B"/>
    <circle cx="599" cy="184" r="1.5" fill="#64748B"/>
    <text x="600" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Management UI</text>
    <text x="600" y="262" text-anchor="middle" font-size="14" fill="#475569">Arcane · Dockhand ·</text>
    <text x="600" y="283" text-anchor="middle" font-size="14" fill="#475569">Dockge · Komodo · any</text>
    <text x="600" y="304" text-anchor="middle" font-size="14" fill="#475569">no docker.sock mount</text>

    <rect x="737" y="150" width="190" height="166" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="738" y="151" width="188" height="4" rx="2" fill="#EC4899"/>
    <path d="M 818 180 h 28 l -11 13 v 12 l -6 4 v -16 z" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="832" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Socket proxy</text>
    <text x="832" y="262" text-anchor="middle" font-size="14" fill="#475569">docker-socket-proxy</text>
    <text x="832" y="283" text-anchor="middle" font-size="14" fill="#475569">internal tcp :2375</text>
    <text x="832" y="304" text-anchor="middle" font-size="14" fill="#475569">minimal allowlist</text>

    <rect x="970" y="150" width="190" height="166" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="971" y="151" width="188" height="4" rx="2" fill="#EF4444"/>
    <rect x="1052" y="179" width="26" height="26" rx="7" fill="none" stroke="#64748B" stroke-width="2"/>
    <circle cx="1060" cy="192" r="2.5" fill="#64748B"/>
    <circle cx="1070" cy="192" r="2.5" fill="#64748B"/>
    <text x="1065" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">Docker socket</text>
    <text x="1065" y="262" text-anchor="middle" font-size="14" fill="#475569">/var/run/docker.sock</text>
    <text x="1065" y="283" text-anchor="middle" font-size="14" fill="#475569">= root on the host</text>
    <text x="1065" y="304" text-anchor="middle" font-size="14" fill="#475569">treat as root</text>
  </g>

  <!-- Flow arrows -->
  <path d="M 236 233 H 264" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 468 233 H 497" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 701 233 H 729" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 933 233 H 962" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>

  <!-- Allowlist panel -->
  <rect x="40" y="352" width="540" height="250" rx="16" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
  <rect x="64" y="368" width="96" height="26" rx="13" fill="#06B6D4"/>
  <text x="112" y="386" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#FFFFFF">ALLOW = 1</text>
  <text x="172" y="386" font-size="15" font-weight="700" fill="#155E75">Only what the UI needs</text>
  <text x="64" y="414" font-size="14" fill="#0E7490">verify env names against the repo before deploying</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="64" y="424" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="179" y="443" fill="#0E7490">EVENTS = 1</text>
    <rect x="64" y="456" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="179" y="475" fill="#0E7490">PING = 1</text>
    <rect x="64" y="488" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="179" y="507" fill="#0E7490">VERSION = 1</text>
    <rect x="64" y="520" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="179" y="539" fill="#0E7490">POST = 1</text>
    <rect x="64" y="552" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="179" y="571" fill="#0E7490">CONTAINERS = 1</text>
    <rect x="326" y="424" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="441" y="443" fill="#0E7490">EXEC = 1</text>
    <rect x="326" y="456" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="441" y="475" fill="#0E7490">IMAGES = 1</text>
    <rect x="326" y="488" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="441" y="507" fill="#0E7490">INFO = 1</text>
    <rect x="326" y="520" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="441" y="539" fill="#0E7490">NETWORKS = 1</text>
    <rect x="326" y="552" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
    <text x="441" y="571" fill="#0E7490">VOLUMES = 1</text>
  </g>

  <!-- Deny panel -->
  <rect x="620" y="352" width="540" height="250" rx="16" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <rect x="644" y="368" width="90" height="26" rx="13" fill="#DB2777"/>
  <text x="689" y="386" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#FFFFFF">DENY = 0</text>
  <text x="746" y="386" font-size="15" font-weight="700" fill="#9D174D">Root-level verbs stay off</text>
  <text x="644" y="414" font-size="14" fill="#BE185D">POST + CONTAINERS ≈ 'create a root container'</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="644" y="424" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="759" y="443" fill="#BE185D">AUTH = 0</text>
    <rect x="644" y="456" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="759" y="475" fill="#BE185D">SECRETS = 0</text>
    <rect x="644" y="488" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="759" y="507" fill="#BE185D">BUILD = 0</text>
    <rect x="644" y="520" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="759" y="539" fill="#BE185D">NODES = 0</text>
    <rect x="644" y="552" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="759" y="571" fill="#BE185D">PLUGINS = 0</text>
    <rect x="906" y="424" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="1021" y="443" fill="#BE185D">SERVICES = 0</text>
    <rect x="906" y="456" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="1021" y="475" fill="#BE185D">SESSION = 0</text>
    <rect x="906" y="488" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="1021" y="507" fill="#BE185D">SWARM = 0</text>
    <rect x="906" y="520" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="1021" y="539" fill="#BE185D">SYSTEM = 0</text>
    <rect x="906" y="552" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="1021" y="571" fill="#BE185D">TASKS = 0</text>
  </g>

  <!-- Warning strip -->
  <rect x="40" y="618" width="1120" height="44" rx="22" fill="#FEF2F2" stroke="#FECACA"/>
  <circle cx="72" cy="640" r="11" fill="#EF4444"/>
  <text x="72" y="645" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
  <text x="96" y="645" font-size="14" font-weight="600" fill="#B91C1C">docker.sock = root on the host — a UI with the raw socket is a root web panel · exec/terminal off · keep the UI updated</text>
</svg>
