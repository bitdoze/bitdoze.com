<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Composio MCP: one tool layer connecting Codex, Claude Code and Mastra agents to 1,500+ apps">
  <title>Composio MCP: One Tool Layer</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="blobIndigo">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 L 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="180" cy="110" r="270" fill="url(#blobIndigo)"/>
  <circle cx="1050" cy="140" r="300" fill="url(#blobCyan)"/>
  <circle cx="920" cy="600" r="280" fill="url(#blobPink)"/>

  <!-- Central hub-and-spoke icon: one tool layer connecting agents and apps -->
  <circle cx="600" cy="186" r="100" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.35"/>
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 7" opacity="0.75">
    <line x1="600" y1="186" x2="540" y2="64"/>
    <line x1="600" y1="186" x2="660" y2="64"/>
    <line x1="600" y1="186" x2="462" y2="110"/>
    <line x1="600" y1="186" x2="738" y2="110"/>
    <line x1="600" y1="186" x2="420" y2="208"/>
    <line x1="600" y1="186" x2="780" y2="208"/>
  </g>

  <!-- Hub with layers glyph -->
  <rect x="552" y="138" width="96" height="96" rx="26" fill="url(#hubGrad)"/>
  <path d="M600 150 L632 168 L600 186 L568 168 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M568 192 L600 210 L632 192" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M568 212 L600 230 L632 212" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Satellite nodes (agents + apps) -->
  <g>
    <circle cx="540" cy="64" r="22" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="540" cy="64" r="6" fill="#06B6D4"/>
    <circle cx="660" cy="64" r="22" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.5"/>
    <circle cx="660" cy="64" r="6" fill="#EC4899"/>
    <circle cx="462" cy="110" r="22" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="462" cy="110" r="6" fill="#4F46E5"/>
    <circle cx="738" cy="110" r="22" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="738" cy="110" r="6" fill="#06B6D4"/>
    <circle cx="420" cy="208" r="22" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.5"/>
    <circle cx="420" cy="208" r="6" fill="#EC4899"/>
    <circle cx="780" cy="208" r="22" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="780" cy="208" r="6" fill="#4F46E5"/>
  </g>

  <!-- Category badge -->
  <rect x="496" y="306" width="208" height="38" rx="19" fill="#FFFFFF" stroke="url(#titleGrad)" stroke-width="1.5"/>
  <text x="600" y="330" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#4F46E5">AI · DEV TOOLS</text>

  <!-- Title -->
  <text x="600" y="414" text-anchor="middle" font-size="62" font-weight="800" fill="url(#titleGrad)">Composio MCP</text>
  <text x="600" y="484" text-anchor="middle" font-size="62" font-weight="800" fill="#0F172A">One Tool Layer</text>
  <rect x="540" y="508" width="120" height="6" rx="3" fill="url(#titleGrad)"/>

  <!-- Decorative dots -->
  <g fill="#6366F1">
    <circle cx="90" cy="120" r="4" opacity="0.18"/>
    <circle cx="60" cy="170" r="3" opacity="0.15"/>
    <circle cx="1100" cy="540" r="4" opacity="0.16"/>
    <circle cx="130" cy="620" r="3" opacity="0.14"/>
  </g>
  <g fill="#06B6D4">
    <circle cx="140" cy="90" r="2.5" opacity="0.2"/>
    <circle cx="1110" cy="130" r="4" opacity="0.18"/>
    <circle cx="1150" cy="180" r="2.5" opacity="0.2"/>
    <circle cx="1060" cy="610" r="2.5" opacity="0.15"/>
  </g>
  <g fill="#EC4899">
    <circle cx="100" cy="560" r="4" opacity="0.16"/>
    <circle cx="70" cy="600" r="2.5" opacity="0.18"/>
    <circle cx="1140" cy="590" r="3" opacity="0.18"/>
  </g>
</svg>
