<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d2Title d2Desc">
  <title id="d2Title">Three architectures compared</title>
  <desc id="d2Desc">Side by side: static Astro (browser to CDN to static files, no database, no PHP, no login), classic WordPress (browser to PHP runtime and wp-admin to MySQL, with a highlighted attack surface covering plugins, themes and /batch/v1), and headless WordPress plus Astro (browser to static Astro output on a CDN, built by a build step fetching the WordPress REST API and MySQL).</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="150" cy="130" r="250" fill="url(#blobIndigo)"/>
  <circle cx="620" cy="640" r="260" fill="url(#blobPink)"/>
  <circle cx="1080" cy="580" r="250" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="50" font-size="29" font-weight="800" fill="#0F172A">Three ways to serve the same blog</text>
    <text x="600" y="78" font-size="15" fill="#64748B">The third path is usually the honest answer when you need an editor GUI and cheap hosting</text>
  </g>

  <!-- column headers -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="50" y="110" width="300" height="56" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="70" y="136" font-size="16" font-weight="800" fill="#4338CA">01 · Astro static</text>
    <text x="70" y="155" font-size="11.5" fill="#475569">plain files · ~$0-6/mo</text>

    <rect x="450" y="110" width="300" height="56" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="470" y="136" font-size="16" font-weight="800" fill="#BE185D">02 · Classic WordPress</text>
    <text x="470" y="155" font-size="11.5" fill="#475569">PHP + MySQL · $20-50/mo managed</text>

    <rect x="850" y="110" width="300" height="56" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="870" y="136" font-size="16" font-weight="800" fill="#0E7490">03 · Headless WP + Astro</text>
    <text x="870" y="155" font-size="11.5" fill="#475569">editor GUI + static frontend</text>
  </g>

  <!-- attack surface halo (column 2) -->
  <rect x="428" y="256" width="344" height="190" rx="24" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="8 6" opacity="0.55"/>
  <rect x="470" y="243" width="196" height="26" rx="13" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.2"/>
  <text x="568" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#BE185D">attack surface</text>

  <!-- column 1 flow -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">
    <rect x="50" y="184" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="200" y="219">Browser</text>

    <rect x="50" y="276" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="200" y="311">CDN or nginx</text>

    <rect x="50" y="368" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="200" y="403">Static files (dist/)</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="50" y="460" width="300" height="58" rx="14" fill="#EEF2FF" fill-opacity="0.9" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="200" y="487" font-size="13.5" font-weight="700" fill="#4338CA">No database · no PHP</text>
    <text x="200" y="506" font-size="13.5" font-weight="700" fill="#4338CA">no login · nothing to reach</text>
  </g>

  <!-- column 2 flow -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">
    <rect x="450" y="184" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="600" y="219">Browser</text>

    <rect x="450" y="276" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="600" y="311">PHP runtime + wp-admin</text>

    <rect x="450" y="368" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="600" y="403">MySQL / MariaDB</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="450" y="460" width="300" height="58" rx="14" fill="#FDF2F8" fill-opacity="0.9" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="600" y="487" font-size="13.5" font-weight="700" fill="#BE185D">Plugins · themes · /batch/v1</text>
    <text x="600" y="506" font-size="13.5" font-weight="700" fill="#BE185D">91% of vulns in plugins</text>
  </g>

  <!-- column 3 flow -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">
    <rect x="850" y="184" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1000" y="219">Browser</text>

    <rect x="850" y="276" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="1000" y="311">Static Astro output (CDN)</text>

    <rect x="850" y="368" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="1000" y="395" font-size="14">Build step · WP REST API</text>
    <text x="1000" y="414" font-size="14">+ MySQL</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="850" y="460" width="300" height="58" rx="14" fill="#ECFEFF" fill-opacity="0.9" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1000" y="487" font-size="13.5" font-weight="700" fill="#0E7490">wp-admin stays for editors</text>
    <text x="1000" y="506" font-size="13.5" font-weight="700" fill="#0E7490">the API is a build dependency</text>
  </g>

  <!-- arrows -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <line x1="200" y1="248" x2="200" y2="270"/>
    <line x1="200" y1="340" x2="200" y2="362"/>
    <line x1="600" y1="248" x2="600" y2="270"/>
    <line x1="600" y1="340" x2="600" y2="362"/>
    <line x1="1000" y1="248" x2="1000" y2="270"/>
    <line x1="1000" y1="340" x2="1000" y2="362"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#6366F1">
    <text x="210" y="262">request</text>
    <text x="210" y="354">build</text>
    <text x="610" y="262">request</text>
    <text x="610" y="354">query</text>
    <text x="1010" y="262">request</text>
    <text x="1010" y="354">build · fetch</text>
  </g>

  <text x="600" y="608" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Astro is a folder you deploy · WordPress is a stateful application you operate · headless WP + Astro is both, plus a pipeline</text>
  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Illustrative architecture, not a network diagram</text>
</svg>
