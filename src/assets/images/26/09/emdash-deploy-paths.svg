<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="EmDash CMS deploy paths compared: Cloudflare Workers with D1 and R2 versus self-hosted Node.js with SQLite and S3 backups on a VPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowIndigo">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vsStroke" gradientUnits="userSpaceOnUse" x1="564" y1="0" x2="636" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>
  <ellipse cx="170" cy="100" rx="300" ry="190" fill="url(#glowIndigo)"/>
  <ellipse cx="1040" cy="580" rx="300" ry="190" fill="url(#glowCyan)"/>
  <circle cx="1150" cy="70" r="4" fill="#06B6D4" opacity="0.18"/>
  <circle cx="56" cy="360" r="4" fill="#EC4899" opacity="0.16"/>
  <circle cx="1180" cy="330" r="3" fill="#6366F1" opacity="0.2"/>

  <!-- header -->
  <text x="60" y="52" font-size="27" font-weight="700" fill="#0F172A">EmDash Deploy Paths</text>
  <text x="60" y="78" font-size="15" fill="#64748B">Two officially documented routes — same admin, REST API and MCP server in one unit</text>

  <!-- left panel: Cloudflare -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="104" width="520" height="520" rx="20" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  </g>
  <text x="84" y="140" font-size="20" font-weight="700" fill="#4F46E5">Cloudflare Workers</text>
  <text x="84" y="162" font-size="14" fill="#64748B">Least servers · most platform coupling</text>
  <path d="M 84 176 H 556" stroke="#E2E8F0" stroke-width="2"/>

  <!-- left items -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="192" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="88" y="258" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="88" y="324" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="88" y="390" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="88" y="456" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="88" y="522" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <rect x="88" y="192" width="5" height="56" rx="2.5" fill="#6366F1"/>
  <rect x="88" y="258" width="5" height="56" rx="2.5" fill="#06B6D4"/>
  <rect x="88" y="324" width="5" height="56" rx="2.5" fill="#06B6D4"/>
  <rect x="88" y="390" width="5" height="56" rx="2.5" fill="#6366F1"/>
  <rect x="88" y="456" width="5" height="56" rx="2.5" fill="#EC4899"/>
  <rect x="88" y="522" width="5" height="56" rx="2.5" fill="#6366F1"/>
  <text x="112" y="214" font-size="16" font-weight="600" fill="#0F172A">Astro site on a Worker</text>
  <text x="112" y="237" font-size="14" fill="#64748B">serverless runtime · targeted placement near D1</text>
  <text x="112" y="280" font-size="16" font-weight="600" fill="#0F172A">D1 database (SQL)</text>
  <text x="112" y="303" font-size="14" fill="#64748B">created on first deploy · migrations auto-apply</text>
  <text x="112" y="346" font-size="16" font-weight="600" fill="#0F172A">R2 bucket</text>
  <text x="112" y="369" font-size="14" fill="#64748B">S3-compatible media storage</text>
  <text x="112" y="412" font-size="16" font-weight="600" fill="#0F172A">Workers Cache / KV</text>
  <text x="112" y="435" font-size="14" fill="#64748B">optional object cache · cacheCloudflare()</text>
  <text x="112" y="478" font-size="16" font-weight="600" fill="#0F172A">Worker Loader</text>
  <text x="112" y="501" font-size="14" fill="#64748B">sandboxed plugins — requires Workers Paid</text>
  <rect x="496" y="473" width="52" height="22" rx="11" fill="#EC4899" opacity="0.12"/>
  <text x="522" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#BE185D">PAID</text>
  <text x="112" y="544" font-size="16" font-weight="600" fill="#0F172A">Cron trigger</text>
  <text x="112" y="567" font-size="14" fill="#64748B">* * * * * — publishing · plugins · backups</text>

  <!-- right panel: VPS -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="104" width="520" height="520" rx="20" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
  </g>
  <text x="644" y="140" font-size="20" font-weight="700" fill="#0891B2">Self-Hosted VPS (Node.js)</text>
  <text x="644" y="162" font-size="14" fill="#64748B">Boring ownership · a box you control</text>
  <path d="M 644 176 H 1116" stroke="#E2E8F0" stroke-width="2"/>

  <!-- right items -->
  <g filter="url(#cardShadow)">
    <rect x="648" y="192" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="648" y="258" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="648" y="324" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="648" y="390" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="648" y="456" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="648" y="522" width="464" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <rect x="648" y="192" width="5" height="56" rx="2.5" fill="#06B6D4"/>
  <rect x="648" y="258" width="5" height="56" rx="2.5" fill="#6366F1"/>
  <rect x="648" y="324" width="5" height="56" rx="2.5" fill="#06B6D4"/>
  <rect x="648" y="390" width="5" height="56" rx="2.5" fill="#EC4899"/>
  <rect x="648" y="456" width="5" height="56" rx="2.5" fill="#6366F1"/>
  <rect x="648" y="522" width="5" height="56" rx="2.5" fill="#06B6D4"/>
  <text x="672" y="214" font-size="16" font-weight="600" fill="#0F172A">Node.js standalone (&gt;= 22.16)</text>
  <text x="672" y="237" font-size="14" fill="#64748B">or Docker with a node:22 image</text>
  <text x="672" y="280" font-size="16" font-weight="600" fill="#0F172A">SQLite on a volume</text>
  <text x="672" y="303" font-size="14" fill="#64748B">libSQL and Postgres adapters also work</text>
  <text x="672" y="346" font-size="16" font-weight="600" fill="#0F172A">Local disk or S3 media</text>
  <text x="672" y="369" font-size="14" fill="#64748B">R2 · Backblaze B2 · MinIO buckets</text>
  <text x="672" y="412" font-size="16" font-weight="600" fill="#0F172A">workerd child process</text>
  <text x="672" y="435" font-size="14" fill="#64748B">sandboxed plugins on Cloudflare's own runtime</text>
  <text x="672" y="478" font-size="16" font-weight="600" fill="#0F172A">systemd + system cron</text>
  <text x="672" y="501" font-size="14" fill="#64748B">publishing · upgrades and maintenance are yours</text>
  <text x="672" y="544" font-size="16" font-weight="600" fill="#0F172A">S3 backups</text>
  <text x="672" y="567" font-size="14" fill="#64748B">restore anywhere with your normal routine</text>

  <!-- VS badge -->
  <circle cx="600" cy="364" r="36" fill="#FFFFFF" stroke="url(#vsStroke)" stroke-width="2.5"/>
  <text x="600" y="371" text-anchor="middle" font-size="17" font-weight="800" fill="#0F172A">VS</text>

  <!-- footer -->
  <text x="600" y="656" text-anchor="middle" font-size="15" fill="#64748B">MIT · one deployable unit · portable adapters — D1 / SQLite / libSQL / Postgres · R2 / S3 / local media</text>
</svg>
