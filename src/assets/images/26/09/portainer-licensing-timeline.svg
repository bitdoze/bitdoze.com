<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
  <circle cx="140" cy="620" r="240" fill="url(#blobI)"/>
  <circle cx="1080" cy="80" r="220" fill="url(#blobP)"/>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Portainer Business Edition pricing — September 2026</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748B">Every free path comes with strings · portainer.io/pricing fetched 2026-09-23</text>

  <!-- Timeline axis -->
  <path d="M 70 360 H 1104" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#as)"/>

  <!-- Stems -->
  <path d="M 130 318 V 351" stroke="#64748B" stroke-width="2"/>
  <path d="M 365 369 V 402" stroke="#0891B2" stroke-width="2"/>
  <path d="M 600 318 V 351" stroke="#DB2777" stroke-width="2"/>
  <path d="M 835 369 V 402" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 1070 318 V 351" stroke="#334155" stroke-width="2"/>

  <!-- Milestone dots -->
  <circle cx="130" cy="360" r="7" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
  <circle cx="365" cy="360" r="7" fill="#FFFFFF" stroke="#0891B2" stroke-width="3"/>
  <circle cx="600" cy="360" r="7" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/>
  <circle cx="835" cy="360" r="7" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="1070" cy="360" r="7" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>

  <!-- Card 1: above — 5NF change -->
  <rect x="28" y="168" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <rect x="78" y="182" width="104" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="130" y="200" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#475569">JUL 2024</text>
  <text x="130" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">5 Nodes Free shift</text>
  <text x="130" y="262" text-anchor="middle" font-size="14" fill="#475569">At renewal, business use</text>
  <text x="130" y="282" text-anchor="middle" font-size="14" fill="#475569">was pushed to paid tiers</text>

  <!-- Card 2: below — 3NF -->
  <rect x="263" y="402" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
  <rect x="297" y="416" width="136" height="26" rx="13" fill="#ECFEFF" stroke="#A5F3FC"/>
  <text x="365" y="434" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#155E75">$0 · ≤3 NODES</text>
  <text x="365" y="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">3 Nodes Free</text>
  <text x="365" y="496" text-anchor="middle" font-size="14" fill="#475569">Free, but the key must</text>
  <text x="365" y="516" text-anchor="middle" font-size="14" fill="#475569">renew annually — new key</text>
  <text x="365" y="536" text-anchor="middle" font-size="14" fill="#475569">emailed 14 days out</text>

  <!-- Card 3: above — Home & Student -->
  <rect x="498" y="168" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5"/>
  <rect x="540" y="182" width="120" height="26" rx="13" fill="#FDF2F8" stroke="#FBCFE8"/>
  <text x="600" y="200" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#9D174D">$155 / YEAR</text>
  <text x="600" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Home &amp; Student</text>
  <text x="600" y="262" text-anchor="middle" font-size="14" fill="#475569">Non-commercial only</text>
  <text x="600" y="282" text-anchor="middle" font-size="14" fill="#475569">keys revoked for any</text>
  <text x="600" y="302" text-anchor="middle" font-size="14" fill="#475569">business use — any size</text>

  <!-- Card 4: below — Starter -->
  <rect x="733" y="402" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="755" y="416" width="160" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="835" y="434" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#3730A3">FROM $1,045 / YR</text>
  <text x="835" y="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Starter</text>
  <text x="835" y="496" text-anchor="middle" font-size="14" fill="#475569">≤16 vCPU per node</text>
  <text x="835" y="516" text-anchor="middle" font-size="14" fill="#475569">orgs under $50M revenue</text>
  <text x="835" y="536" text-anchor="middle" font-size="14" fill="#475569">community support</text>

  <!-- Card 5: above — Scale -->
  <rect x="968" y="168" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <rect x="990" y="182" width="160" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="1070" y="200" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#334155">FROM $2,095 / YR</text>
  <text x="1070" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Scale</text>
  <text x="1070" y="262" text-anchor="middle" font-size="14" fill="#475569">≤24 vCPU per node</text>
  <text x="1070" y="282" text-anchor="middle" font-size="14" fill="#475569">orgs under $100M revenue</text>
  <text x="1070" y="302" text-anchor="middle" font-size="14" fill="#475569">9×5 NBD support</text>

  <!-- CE note bar -->
  <rect x="100" y="600" width="1000" height="52" rx="26" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="600" y="632" text-anchor="middle" font-size="15" font-weight="600" fill="#3730A3">Portainer CE is still $0 — but SSO/OIDC, RBAC, audit logs, registry mgmt and HA live in Business Edition</text>
</svg>
