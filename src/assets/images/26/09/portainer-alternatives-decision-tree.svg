<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="220" fill="url(#blobI)"/>
  <circle cx="1080" cy="610" r="240" fill="url(#blobC)"/>

  <text x="600" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Which Portainer alternative do you need?</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#64748B">Decision tree · re-tested September 2026 · every pick $0 to self-host</text>

  <!-- Root node -->
  <rect x="440" y="88" width="320" height="48" rx="24" fill="url(#accent)"/>
  <text x="600" y="117" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Leaving Portainer — what next?</text>

  <!-- Trunk and bus -->
  <path d="M 600 136 V 158" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M 172 158 H 1027" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M 172 158 V 184" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 457 158 V 184" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 742 158 V 184" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 1027 158 V 184" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>

  <!-- Question nodes -->
  <g>
    <rect x="43" y="190" width="258" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="172" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Need a like-for-like</text>
    <text x="172" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Docker management UI?</text>

    <rect x="328" y="190" width="258" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="457" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Compose-first</text>
    <text x="457" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">workflow?</text>

    <rect x="613" y="190" width="258" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="742" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">You actually want</text>
    <text x="742" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">a PaaS?</text>

    <rect x="898" y="190" width="258" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1027" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">K8s, edge fleet,</text>
    <text x="1027" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">or already paid?</text>
  </g>

  <!-- Question to leaf connectors -->
  <path d="M 172 254 V 288" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 457 254 V 288" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 742 254 V 288" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M 1027 254 V 288" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#as)"/>

  <!-- Leaf cards row A (recommended) -->
  <g>
    <rect x="37" y="294" width="270" height="88" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="172" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#3730A3">Arcane</text>
    <text x="172" y="346" text-anchor="middle" font-size="14" fill="#475569">The default swap — BSD-3</text>
    <text x="172" y="366" text-anchor="middle" font-size="14" fill="#64748B">OIDC + passkeys · Trivy scan</text>

    <rect x="322" y="294" width="270" height="88" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="457" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#155E75">Dockge</text>
    <text x="457" y="346" text-anchor="middle" font-size="14" fill="#475569">One host, files on disk — MIT</text>
    <text x="457" y="366" text-anchor="middle" font-size="14" fill="#64748B">pin :1.5 · check repo pulse</text>

    <rect x="607" y="294" width="270" height="88" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="742" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#155E75">Dokploy</text>
    <text x="742" y="346" text-anchor="middle" font-size="14" fill="#475569">Traefik-based PaaS — Apache-2.0</text>
    <text x="742" y="366" text-anchor="middle" font-size="14" fill="#64748B">multi-server app deploys</text>

    <rect x="892" y="294" width="270" height="88" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1027" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Portainer BE</text>
    <text x="1027" y="346" text-anchor="middle" font-size="14" fill="#475569">Still right for K8s + edge</text>
    <text x="1027" y="366" text-anchor="middle" font-size="14" fill="#64748B">3NF: ≤3 nodes · renew yearly</text>
  </g>

  <!-- or dividers -->
  <g font-size="14" font-style="italic" fill="#94A3B8" text-anchor="middle">
    <text x="172" y="403">or</text>
    <text x="457" y="403">or</text>
    <text x="742" y="403">or</text>
    <text x="1027" y="403">or</text>
  </g>

  <!-- Leaf cards row B (secondary) -->
  <g>
    <rect x="37" y="408" width="270" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="172" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Dockhand</text>
    <text x="172" y="460" text-anchor="middle" font-size="14" fill="#475569">Security-first — BSL 1.1</text>
    <text x="172" y="480" text-anchor="middle" font-size="14" fill="#64748B">Grype scan-before-swap · LDAP</text>

    <rect x="322" y="408" width="270" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="457" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Komodo</text>
    <text x="457" y="460" text-anchor="middle" font-size="14" fill="#475569">Multi-server fleets — GPL-3</text>
    <text x="457" y="480" text-anchor="middle" font-size="14" fill="#64748B">Periphery agents · builds</text>

    <rect x="607" y="408" width="270" height="88" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
    <text x="742" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#9D174D">Coolify</text>
    <text x="742" y="460" text-anchor="middle" font-size="14" fill="#475569">PaaS, one-click — Apache-2.0</text>
    <text x="742" y="480" text-anchor="middle" font-size="14" fill="#64748B">biggest template catalog</text>

    <rect x="892" y="408" width="270" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1027" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Rancher</text>
    <text x="1027" y="460" text-anchor="middle" font-size="14" fill="#475569">Full Kubernetes management</text>
    <text x="1027" y="480" text-anchor="middle" font-size="14" fill="#64748B">different animal — plan first</text>
  </g>

  <!-- Bottom strip -->
  <rect x="170" y="528" width="860" height="52" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="325" y="541" width="26" height="26" rx="6" fill="#0F172A"/>
  <path d="M 331 548 l 6 6 -6 6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 341 560 h 7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="363" y="559" font-size="15"><tspan font-weight="700" fill="#0F172A">No dashboard needed?</tspan><tspan fill="#475569">  →  lazydocker · Dozzle · plain Docker CLI</tspan></text>

  <text x="600" y="624" text-anchor="middle" font-size="14" fill="#94A3B8">Dockhand is BSL 1.1 — free for personal &amp; internal business use · Portainer stays right for Kubernetes &amp; edge fleets</text>
</svg>
