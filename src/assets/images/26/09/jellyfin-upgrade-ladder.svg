<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t5 d5">
  <title id="t5">Jellyfin upgrade ladder to 12.x</title>
  <desc id="d5">Horizontal upgrade ladder: versions at or below 10.10.6 must walk to 10.10.7 first; 10.10.7 is the minimum supported jump-off; 10.11.x already ran the EF Core database migration and has built-in backup; 12.1 is the current stable pin. Gates between hops require a config backup and the release notes. A warning strip notes that first 12.x boot runs long migrations, repository plugins should be removed before upgrading, and a full rescan is required after.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="140" cy="620" r="280" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="90" r="260" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="56" font-size="29" font-weight="800" fill="#0F172A">The upgrade ladder to 12.x</text>
    <text x="60" y="84" font-size="15" fill="#64748B">New versioning: first digit is major, second is minor. Never skip a hop.</text>
  </g>

  <!-- axis -->
  <rect x="90" y="336" width="1020" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>

  <!-- gates -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#92400E">
    <rect x="228" y="322" width="164" height="34" rx="17" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="310" y="343" text-anchor="middle">backup /config + notes</text>
    <rect x="508" y="322" width="164" height="34" rx="17" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="590" y="343" text-anchor="middle">backup /config + notes</text>
    <rect x="788" y="322" width="164" height="34" rx="17" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="870" y="343" text-anchor="middle">backup /config + notes</text>
  </g>

  <!-- nodes -->
  <g stroke-width="4" fill="#FFFFFF">
    <circle cx="170" cy="339" r="11" stroke="#94A3B8"/>
    <circle cx="450" cy="339" r="11" stroke="#6366F1"/>
    <circle cx="730" cy="339" r="11" stroke="#6366F1"/>
    <circle cx="1010" cy="339" r="13" stroke="#06B6D4"/>
  </g>
  <circle cx="1010" cy="339" r="5" fill="#06B6D4"/>

  <!-- connectors -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5">
    <line x1="170" y1="352" x2="170" y2="440"/>
    <line x1="450" y1="212" x2="450" y2="328"/>
    <line x1="730" y1="352" x2="730" y2="440"/>
    <line x1="1010" y1="212" x2="1010" y2="326"/>
  </g>

  <!-- cards -->
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="75" y="440" width="190" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="170" y="468" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">≤ 10.10.6</text>
    <text x="170" y="492" font-size="11.5" fill="#64748B" text-anchor="middle">too old for a direct jump</text>
    <text x="170" y="510" font-size="11.5" fill="#64748B" text-anchor="middle">walk up to 10.10.7 first</text>
    <text x="170" y="528" font-size="11.5" fill="#64748B" text-anchor="middle">then keep climbing</text>

    <rect x="355" y="116" width="190" height="104" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="450" y="144" font-size="14" font-weight="800" fill="#4F46E5" text-anchor="middle">10.10.7</text>
    <text x="450" y="168" font-size="11.5" fill="#64748B" text-anchor="middle">minimum supported</text>
    <text x="450" y="186" font-size="11.5" fill="#64748B" text-anchor="middle">jump-off point for 12.x</text>
    <text x="450" y="204" font-size="11.5" fill="#64748B" text-anchor="middle">(per 12.0 release notes)</text>

    <rect x="635" y="440" width="190" height="104" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="730" y="468" font-size="14" font-weight="800" fill="#4F46E5" text-anchor="middle">10.11.x</text>
    <text x="730" y="492" font-size="11.5" fill="#64748B" text-anchor="middle">EF Core migration done</text>
    <text x="730" y="510" font-size="11.5" fill="#64748B" text-anchor="middle">(library.db → jellyfin.db)</text>
    <text x="730" y="528" font-size="11.5" fill="#64748B" text-anchor="middle">built-in Backup &amp; Restore</text>

    <rect x="890" y="116" width="240" height="104" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <rect x="890" y="116" width="240" height="6" rx="3" fill="url(#gMain)"/>
    <text x="1010" y="148" font-size="14" font-weight="800" fill="#0E7490" text-anchor="middle">12.1 · current stable</text>
    <text x="1010" y="172" font-size="11.5" fill="#64748B" text-anchor="middle">pin jellyfin/jellyfin:12.1</text>
    <text x="1010" y="190" font-size="11.5" fill="#64748B" text-anchor="middle">12.0 GA Sep 8 · 12.1 Sep 15, 2026</text>
    <text x="1010" y="208" font-size="11.5" fill="#64748B" text-anchor="middle">minors are safe to automate</text>
  </g>

  <!-- warning strip -->
  <rect x="60" y="588" width="1080" height="50" rx="14" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="600" y="611" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#BE123C" text-anchor="middle">First 12.x boot runs long migrations: do not interrupt. Remove repository plugins before upgrading,</text>
  <text x="600" y="629" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#BE123C" text-anchor="middle">then run a full library rescan after. DB changes block rollback without a full restore.</text>
</svg>
