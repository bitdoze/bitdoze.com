<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t4 d4">
  <title id="t4">Jellyfin playback modes: Direct Play, Direct Stream, Transcode</title>
  <desc id="d4">A play request resolves to one of three modes depending on codec, container, and client support. Direct Play sends the file untouched at roughly zero CPU and is the goal on a GPU-less VPS. Direct Stream remuxes audio or container only, still cheap. Transcode re-encodes video and costs about one 1080p stream per 2 vCPU, or a whole 4-8 vCPU box for a single 4K stream.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gSrc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="900" cy="140" r="260" fill="url(#blobGreen)"/>
  <circle cx="900" cy="560" r="260" fill="url(#blobRed)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="56" font-size="29" font-weight="800" fill="#0F172A">Direct Play first</text>
    <text x="60" y="84" font-size="15" fill="#64748B">What the dashboard means by each playback mode, and what it costs a VPS</text>
  </g>

  <!-- source -->
  <g filter="url(#shadow)">
    <rect x="60" y="265" width="280" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="265" width="280" height="36" rx="16" fill="url(#gSrc)"/>
    <rect x="60" y="289" width="280" height="12" fill="url(#gSrc)"/>
    <text x="200" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PLAY REQUEST</text>
    <text x="200" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">file codec + container</text>
    <text x="200" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">client codec support</text>
    <text x="200" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">bitrate cap set on client</text>
    <text x="200" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">subtitle burn-in needed?</text>
  </g>

  <!-- fan arrows -->
  <g stroke="#64748B" stroke-width="2">
    <line x1="340" y1="330" x2="538" y2="160" marker-end="url(#arr)"/>
    <line x1="340" y1="340" x2="538" y2="340" marker-end="url(#arr)"/>
    <line x1="340" y1="352" x2="538" y2="522" marker-end="url(#arr)"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">
    <text x="368" y="212">client plays it as-is</text>
    <text x="372" y="330">audio / container mismatch</text>
    <text x="360" y="478">unsupported codec or cap</text>
  </g>

  <!-- direct play lane -->
  <g filter="url(#shadow)">
    <rect x="545" y="100" width="595" height="118" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="545" y="100" width="595" height="36" rx="16" fill="url(#gGreen)"/>
    <rect x="545" y="124" width="595" height="12" fill="url(#gGreen)"/>
    <text x="575" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">DIRECT PLAY</text>
    <text x="575" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">File streams untouched. Near-zero CPU.</text>
    <text x="575" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">The goal on a GPU-less VPS: pre-encode for your clients.</text>
    <text x="1058" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">CPU</text>
    <rect x="990" y="184" width="136" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="990" y="184" width="12" height="10" rx="5" fill="#10B981"/>
  </g>

  <!-- direct stream lane -->
  <g filter="url(#shadow)">
    <rect x="545" y="280" width="595" height="118" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="545" y="280" width="595" height="36" rx="16" fill="url(#gAmber)"/>
    <rect x="545" y="304" width="595" height="12" fill="url(#gAmber)"/>
    <text x="575" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">DIRECT STREAM</text>
    <text x="575" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Video untouched; audio or container remuxed on the fly.</text>
    <text x="575" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Cheap. Fine on any VPS.</text>
    <text x="1058" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">CPU</text>
    <rect x="990" y="364" width="136" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="990" y="364" width="38" height="10" rx="5" fill="#F59E0B"/>
  </g>

  <!-- transcode lane -->
  <g filter="url(#shadow)">
    <rect x="545" y="460" width="595" height="118" rx="16" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="545" y="460" width="595" height="36" rx="16" fill="url(#gRed)"/>
    <rect x="545" y="484" width="595" height="12" fill="url(#gRed)"/>
    <text x="575" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">TRANSCODE</text>
    <text x="575" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Video re-encoded live. ~1x 1080p stream per 2 vCPU;</text>
    <text x="575" y="544" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">one 4K software transcode saturates a 4-8 vCPU box.</text>
    <text x="1058" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">CPU</text>
    <rect x="990" y="544" width="136" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="990" y="544" width="136" height="10" rx="5" fill="#EF4444"/>
  </g>

  <text x="60" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Check Dashboard → Playback during a stream. Community rules of thumb, not benchmarks. Hi10P files are always software.</text>
</svg>
