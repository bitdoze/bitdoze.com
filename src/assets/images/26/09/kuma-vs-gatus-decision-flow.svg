<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Decision flowchart: keep infra in git, pick Gatus; need a public client-facing status page, pick Uptime Kuma; otherwise either works, and running both is a legitimate end state">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bothGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1120" cy="110" r="260" fill="url(#blobCyan)"/>
  <circle cx="90" cy="120" r="240" fill="url(#blobIndigo)"/>
  <circle cx="600" cy="660" r="280" fill="url(#blobPink)"/>

  <!-- decorative dots -->
  <circle cx="70" cy="600" r="4" fill="#6366F1" opacity="0.18"/>
  <circle cx="124" cy="640" r="3" fill="#06B6D4" opacity="0.16"/>
  <circle cx="1136" cy="590" r="4" fill="#EC4899" opacity="0.16"/>
  <circle cx="1084" cy="628" r="3" fill="#6366F1" opacity="0.14"/>

  <!-- heading -->
  <text x="600" y="64" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">Pick by workflow</text>

  <!-- start -->
  <rect x="440" y="88" width="320" height="40" rx="20" fill="#0F172A"/>
  <text x="600" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Start: pick your workflow</text>
  <path d="M 600 128 L 600 158" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- question 1 -->
  <rect x="360" y="164" width="480" height="64" rx="32" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="600" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Do you keep infra in git?</text>

  <path d="M 840 196 L 942 196" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="866" y="184" width="54" height="24" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="893" y="200" text-anchor="middle" font-size="12" font-weight="800" fill="#0E7490">YES</text>

  <rect x="950" y="164" width="210" height="64" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="1055" y="192" text-anchor="middle" font-size="20" font-weight="800" fill="#0891B2">Gatus</text>
  <text x="1055" y="214" text-anchor="middle" font-size="12.5" fill="#64748B">YAML in git · PR reviews</text>

  <path d="M 600 228 L 600 258" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="573" y="231" width="54" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="247" text-anchor="middle" font-size="12" font-weight="800" fill="#64748B">NO</text>

  <!-- question 2 -->
  <rect x="340" y="264" width="520" height="64" rx="32" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="600" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Need a public client-facing status page?</text>

  <path d="M 860 296 L 942 296" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="876" y="284" width="54" height="24" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="903" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#0E7490">YES</text>

  <rect x="950" y="264" width="210" height="64" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="1055" y="292" text-anchor="middle" font-size="19" font-weight="800" fill="#4F46E5">Uptime Kuma</text>
  <text x="1055" y="314" text-anchor="middle" font-size="12" fill="#64748B">click-ops · status pages</text>

  <path d="M 600 328 L 600 358" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="573" y="331" width="54" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="347" text-anchor="middle" font-size="12" font-weight="800" fill="#64748B">NO</text>

  <!-- either result -->
  <rect x="370" y="364" width="460" height="64" rx="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="402" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Either works — try both in an afternoon</text>

  <path d="M 600 428 L 600 458" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- run both -->
  <rect x="230" y="464" width="740" height="88" rx="18" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
  <text x="600" y="500" text-anchor="middle" font-size="18" font-weight="800">
    <tspan fill="#0F172A">Power move: </tspan><tspan fill="url(#bothGrad)">run both</tspan>
  </text>
  <text x="600" y="528" text-anchor="middle" font-size="14" fill="#64748B">Gatus for internal deep checks · Uptime Kuma for the public page</text>
</svg>
