<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d5Title d5Desc">
  <title id="d5Title">All-in cost per year for a solo operator</title>
  <desc id="d5Desc">Horizontal bar chart on a log scale. Managed WordPress costs about 1500 to 4000 dollars a year, self-hosted WordPress on a VPS about 1000 to 3000, static Astro roughly 10 to 15 dollars (domain only), and Astro with server rendering on a VPS about 50 to 100 dollars.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="130" cy="130" r="250" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="560" r="250" fill="url(#blobCyan)"/>
  <circle cx="700" cy="120" r="230" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="48" font-size="29" font-weight="800" fill="#0F172A">All-in cost per year, solo operator</text>
    <text x="60" y="76" font-size="15" fill="#64748B">Log scale — each gridline is roughly 3x, so a short bar is a very different order of magnitude</text>
  </g>

  <rect x="40" y="104" width="1120" height="474" rx="22" fill="#FFFFFF" fill-opacity="0.7" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- gridlines (log decades) -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6" opacity="0.8">
    <line x1="200" y1="140" x2="200" y2="556"/>
    <line x1="363" y1="140" x2="363" y2="556"/>
    <line x1="541" y1="140" x2="541" y2="556"/>
    <line x1="703" y1="140" x2="703" y2="556"/>
    <line x1="882" y1="140" x2="882" y2="556"/>
    <line x1="1045" y1="140" x2="1045" y2="556"/>
  </g>

  <!-- bars -->
  <g>
    <rect x="942" y="182" width="145" height="36" rx="10" fill="#EC4899" fill-opacity="0.8"/>
    <rect x="882" y="282" width="163" height="36" rx="10" fill="#6366F1" fill-opacity="0.8"/>
    <rect x="200" y="382" width="60" height="36" rx="10" fill="url(#accent)"/>
    <rect x="438" y="482" width="103" height="36" rx="10" fill="#06B6D4" fill-opacity="0.85"/>
  </g>

  <!-- bar labels (left) -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="end">
    <text x="185" y="196" font-size="13.5" font-weight="700" fill="#0F172A">Managed WordPress</text>
    <text x="185" y="213" font-size="11" fill="#64748B">$20–50/mo hosting + plugins</text>

    <text x="185" y="296" font-size="13.5" font-weight="700" fill="#0F172A">Self-hosted WordPress</text>
    <text x="185" y="313" font-size="11" fill="#64748B">$4–20/mo VPS, you run it all</text>

    <text x="185" y="396" font-size="13.5" font-weight="700" fill="#0F172A">Astro static</text>
    <text x="185" y="413" font-size="11" fill="#64748B">Cloudflare Pages free tier</text>

    <text x="185" y="496" font-size="13.5" font-weight="700" fill="#0F172A">Astro SSR on a VPS</text>
    <text x="185" y="513" font-size="11" fill="#64748B">~€4–6/mo, Node you patch</text>
  </g>

  <!-- value labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800">
    <text x="1077" y="205" fill="#FFFFFF" text-anchor="end">$1,500–4,000</text>
    <text x="1035" y="305" fill="#FFFFFF" text-anchor="end">$1,000–3,000</text>
    <text x="272" y="405" fill="#4338CA">~$10–15</text>
    <text x="553" y="505" fill="#0E7490">~$50–100</text>
  </g>

  <!-- axis -->
  <line x1="200" y1="556" x2="1140" y2="556" stroke="#94A3B8" stroke-width="1.5"/>
  <g stroke="#94A3B8" stroke-width="1.5">
    <line x1="200" y1="556" x2="200" y2="564"/>
    <line x1="363" y1="556" x2="363" y2="564"/>
    <line x1="541" y1="556" x2="541" y2="564"/>
    <line x1="703" y1="556" x2="703" y2="564"/>
    <line x1="882" y1="556" x2="882" y2="564"/>
    <line x1="1045" y1="556" x2="1045" y2="564"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">
    <text x="200" y="586">$10</text>
    <text x="363" y="586">$30</text>
    <text x="541" y="586">$100</text>
    <text x="703" y="586">$300</text>
    <text x="882" y="586">$1,000</text>
    <text x="1045" y="586">$3,000</text>
  </g>

  <!-- annotations -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="1080" y="486" font-size="11.5" fill="#94A3B8" text-anchor="end">the expensive part was never the licence</text>
    <text x="1080" y="504" font-size="11.5" fill="#94A3B8" text-anchor="end">it was the update treadmill</text>
  </g>

  <text x="600" y="620" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Maintenance hours (2–5 hrs/mo on WordPress) are excluded — that is where the real difference compounds.</text>
  <text x="600" y="646" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Ranges are vendor and agency estimates plus current list prices, not audited invoices.</text>
</svg>
