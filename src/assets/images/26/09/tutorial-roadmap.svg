<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <title>Tutorial roadmap: scaffold, dev server, setup wizard, admin tour, publish an edit, config anatomy, first query</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect width="1200" height="675" fill="url(#bg)"/>
    <circle cx="150" cy="90" r="240" fill="url(#blobI)"/>
    <circle cx="1070" cy="600" r="260" fill="url(#blobC)"/>
    <rect width="1200" height="675" fill="url(#grid)" opacity="0.25"/>
    <g opacity="0.16">
      <circle cx="70" cy="330" r="4" fill="#6366F1"/>
      <circle cx="1135" cy="330" r="4" fill="#06B6D4"/>
      <circle cx="1108" cy="52" r="3.5" fill="#EC4899"/>
      <circle cx="86" cy="636" r="3.5" fill="#6366F1"/>
    </g>

    <!-- header -->
    <rect x="487" y="30" width="226" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="600" y="52" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#4F46E5">TUTORIAL ROADMAP</text>
    <text x="600" y="106" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">From terminal to published post</text>

    <!-- connectors -->
    <g stroke="#94A3B8" stroke-width="2" fill="none">
      <line x1="315" y1="206" x2="338" y2="206" marker-end="url(#arrow)"/>
      <line x1="585" y1="206" x2="608" y2="206" marker-end="url(#arrow)"/>
      <line x1="855" y1="206" x2="878" y2="206" marker-end="url(#arrow)"/>
      <path d="M1005 272V325Q1005 331 999 331H336Q330 331 330 337V383" marker-end="url(#arrow)"/>
      <line x1="450" y1="456" x2="473" y2="456" marker-end="url(#arrow)"/>
      <line x1="720" y1="456" x2="743" y2="456" marker-end="url(#arrow)"/>
    </g>

    <!-- step 1 -->
    <g filter="url(#soft)"><rect x="75" y="140" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="91" y="156" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="108" y="179" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <rect x="259" y="154" width="40" height="40" rx="12" fill="#EEF2FF"/>
    <g fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="293" y="166" width="22" height="16" rx="3"/>
      <path d="M298 171l4 3-4 3M304 176.4h5"/>
    </g>
    <text x="91" y="230" font-size="19" font-weight="700" fill="#0F172A">Scaffold</text>
    <text x="91" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">bun create emdash</text>

    <!-- step 2 -->
    <g filter="url(#soft)"><rect x="345" y="140" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="361" y="156" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="378" y="179" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <rect x="529" y="154" width="40" height="40" rx="12" fill="#ECFEFF"/>
    <circle cx="549" cy="174" r="11" fill="none" stroke="#0891B2" stroke-width="1.8"/>
    <path d="M545.5 169l7 5-7 5z" fill="#0891B2"/>
    <text x="361" y="230" font-size="19" font-weight="700" fill="#0F172A">Dev server</text>
    <text x="361" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">localhost:4321</text>

    <!-- step 3 -->
    <g filter="url(#soft)"><rect x="615" y="140" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="631" y="156" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="648" y="179" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <rect x="799" y="154" width="40" height="40" rx="12" fill="#EEF2FF"/>
    <g stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round">
      <line x1="810" y1="183" x2="821" y2="172"/>
      <path d="M827 165v8M823 169h8" fill="none"/>
    </g>
    <circle cx="815" cy="164" r="1.6" fill="#4F46E5"/>
    <circle cx="832" cy="180" r="1.6" fill="#4F46E5"/>
    <text x="631" y="230" font-size="19" font-weight="700" fill="#0F172A">Setup wizard</text>
    <text x="631" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">title + passkey</text>

    <!-- step 4 -->
    <g filter="url(#soft)"><rect x="885" y="140" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="901" y="156" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="918" y="179" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">4</text>
    <rect x="1069" y="154" width="40" height="40" rx="12" fill="#ECFEFF"/>
    <g fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round">
      <rect x="1082" y="166" width="22" height="16" rx="3"/>
      <line x1="1090" y1="166" x2="1090" y2="182"/>
      <line x1="1094" y1="171" x2="1100" y2="171"/>
      <line x1="1094" y1="177" x2="1098" y2="177"/>
    </g>
    <text x="901" y="230" font-size="19" font-weight="700" fill="#0F172A">Admin tour</text>
    <text x="901" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">posts · pages · media</text>

    <!-- step 5 -->
    <g filter="url(#soft)"><rect x="210" y="390" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="226" y="406" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="243" y="429" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">5</text>
    <rect x="394" y="404" width="40" height="40" rx="12" fill="#FDF2F8"/>
    <path d="M424 414l-21 17 8 1 3 8 10-26z" fill="#DB2777"/>
    <line x1="411" y1="432" x2="424" y2="414" stroke="#FDF2F8" stroke-width="1.6"/>
    <text x="226" y="480" font-size="19" font-weight="700" fill="#0F172A">Publish an edit</text>
    <text x="226" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">Save → Publish</text>

    <!-- step 6 -->
    <g filter="url(#soft)"><rect x="480" y="390" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="496" y="406" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="513" y="429" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">6</text>
    <rect x="664" y="404" width="40" height="40" rx="12" fill="#EEF2FF"/>
    <text x="684" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#4F46E5">{ }</text>
    <text x="496" y="480" font-size="19" font-weight="700" fill="#0F172A">Config anatomy</text>
    <text x="496" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">the four files</text>

    <!-- step 7 -->
    <g filter="url(#soft)"><rect x="750" y="390" width="240" height="132" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="766" y="406" width="34" height="34" rx="10" fill="url(#chip)"/>
    <text x="783" y="429" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">7</text>
    <rect x="934" y="404" width="40" height="40" rx="12" fill="#ECFEFF"/>
    <g fill="none" stroke="#0891B2" stroke-width="1.8">
      <ellipse cx="954" cy="415" rx="10" ry="4"/>
      <path d="M944 415v10a10 4 0 0 0 20 0v-10M944 420a10 4 0 0 0 20 0"/>
    </g>
    <text x="766" y="480" font-size="19" font-weight="700" fill="#0F172A">First query</text>
    <text x="766" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">getEmDashCollection</text>

    <!-- footer pill -->
    <g filter="url(#soft)"><rect x="405" y="566" width="390" height="46" rx="23" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <circle cx="440" cy="589" r="5" fill="#10B981"/>
    <text x="600" y="595" text-anchor="middle" font-size="14.5" font-weight="600" fill="#475569">≈ 15–30 minutes · $0 · no cloud account</text>
  </g>
</svg>
