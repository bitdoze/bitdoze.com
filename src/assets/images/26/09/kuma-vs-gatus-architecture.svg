<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Architecture diagram: Uptime Kuma flows from browser to web UI to SQLite to prober; Gatus flows from git repo to config.yaml to the Go binary to a results store; both probe the same monitored targets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrowInd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="260" fill="url(#blobCyan)"/>
  <circle cx="120" cy="600" r="260" fill="url(#blobIndigo)"/>

  <!-- decorative dots -->
  <circle cx="60" cy="150" r="4" fill="#6366F1" opacity="0.18"/>
  <circle cx="96" cy="196" r="3" fill="#06B6D4" opacity="0.16"/>
  <circle cx="1146" cy="580" r="4" fill="#EC4899" opacity="0.16"/>
  <circle cx="1102" cy="620" r="3" fill="#6366F1" opacity="0.14"/>

  <!-- heading -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">Two ways to run the same checks</text>

  <!-- column badges -->
  <rect x="190" y="64" width="260" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="320" y="86" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2.5" fill="#4338CA">UPTIME KUMA</text>
  <rect x="750" y="64" width="260" height="34" rx="17" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="880" y="86" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2.5" fill="#0E7490">GATUS</text>

  <!-- center divider -->
  <line x1="600" y1="118" x2="600" y2="460" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 7"/>
  <circle cx="600" cy="283" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="289" text-anchor="middle" font-size="15" font-weight="800" fill="#64748B">vs</text>

  <!-- left column: Uptime Kuma -->
  <rect x="130" y="122" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="320" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Browser</text>
  <text x="320" y="166" text-anchor="middle" font-size="13" fill="#64748B">operator clicks · no YAML anywhere</text>

  <rect x="130" y="210" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="320" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Kuma Web UI</text>
  <text x="320" y="254" text-anchor="middle" font-size="13" fill="#64748B">monitors created by clicking · Socket.IO</text>

  <rect x="130" y="298" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="320" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">SQLite — /app/data</text>
  <text x="320" y="342" text-anchor="middle" font-size="13" fill="#64748B">monitors + heartbeats live here</text>

  <rect x="130" y="386" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="320" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Blackbox prober</text>
  <text x="320" y="430" text-anchor="middle" font-size="13" fill="#64748B">HTTP(s) · TCP · DNS · push</text>

  <path d="M 320 180 L 320 204" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrowInd)"/>
  <path d="M 320 268 L 320 292" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrowInd)"/>
  <path d="M 320 356 L 320 380" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrowInd)"/>

  <!-- right column: Gatus -->
  <rect x="690" y="122" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.8"/>
  <text x="880" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Git repo</text>
  <text x="880" y="166" text-anchor="middle" font-size="13" fill="#64748B">monitor changes reviewed in PRs</text>

  <rect x="690" y="210" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.8"/>
  <text x="880" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">config.yaml</text>
  <text x="880" y="254" text-anchor="middle" font-size="13" fill="#64748B">hot-reloaded on every commit</text>

  <rect x="690" y="298" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.8"/>
  <text x="880" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Gatus — Go binary</text>
  <text x="880" y="342" text-anchor="middle" font-size="13" fill="#64748B">conditions · alerts · read-only dashboard</text>

  <rect x="690" y="386" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.8"/>
  <text x="880" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Results store</text>
  <text x="880" y="430" text-anchor="middle" font-size="13" fill="#64748B">postgres · sqlite · memory (default)</text>

  <path d="M 880 180 L 880 204" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M 880 268 L 880 292" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M 880 356 L 880 380" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- both probers point at the same targets -->
  <path d="M 320 444 L 320 488" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrowInd)"/>
  <path d="M 880 444 L 880 488" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- shared targets -->
  <rect x="250" y="496" width="700" height="92" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Monitored targets</text>
  <g font-size="13" fill="#475569" text-anchor="middle">
    <rect x="377" y="538" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="416" y="556">HTTP(s)</text>
    <rect x="469" y="538" width="52" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="495" y="556">TCP</text>
    <rect x="535" y="538" width="54" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="562" y="556">DNS</text>
    <rect x="603" y="538" width="62" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="634" y="556">ICMP</text>
    <rect x="679" y="538" width="72" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="715" y="556">Docker</text>
    <rect x="765" y="538" width="58" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="794" y="556">Push</text>
  </g>
</svg>
