<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="yaTitle yaDesc">
  <title id="yaTitle">Anatomy of YABS output</title>
  <desc id="yaDesc">Three annotated regions of a YABS benchmark run: the fio disk table where 4k random IOPS matter for databases and 1m sequential matters for backups, the iperf3 network table where speeds to user regions and dual-stack support matter, and the Geekbench row where single-core score drives web workloads and multi-core drives parallel work.</desc>

  <defs>
    <linearGradient id="yaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="yaAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="yaShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#yaBg)"/>
  <rect width="1200" height="8" fill="url(#yaAccent)"/>

  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">Anatomy of YABS output</text>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">Three blocks, three questions — what to read in each</text>

  <!-- Panel 1: fio -->
  <g filter="url(#yaShadow)">
    <rect x="55" y="125" width="1090" height="155" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="55" y="125" width="10" height="155" rx="5" fill="#4F46E5"/>
  </g>
  <text x="95" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">fio — disk speed</text>
  <text x="95" y="198" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">4k (IOPS) | 64k | 512k | 1m</text>
  <text x="95" y="228" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">Read / Write / Total, mixed R/W 50/50</text>
  <line x1="560" y1="150" x2="560" y2="255" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4F46E5" font-weight="700">What to read</text>
  <text x="600" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">4k random IOPS → databases and web apps</text>
  <text x="600" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">1m sequential → backups and large copies</text>

  <!-- Panel 2: iperf3 -->
  <g filter="url(#yaShadow)">
    <rect x="55" y="305" width="1090" height="155" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="55" y="305" width="10" height="155" rx="5" fill="#0891B2"/>
  </g>
  <text x="95" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">iperf3 — network speed</text>
  <text x="95" y="378" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">Provider | Location | Send | Recv | Ping</text>
  <text x="95" y="408" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">IPv4 table, then the IPv6 table</text>
  <line x1="560" y1="330" x2="560" y2="435" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0891B2" font-weight="700">What to read</text>
  <text x="600" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">Speeds to the regions your users are in</text>
  <text x="600" y="423" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">Distance shapes the numbers; check both stacks</text>

  <!-- Panel 3: Geekbench -->
  <g filter="url(#yaShadow)">
    <rect x="55" y="485" width="1090" height="155" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="55" y="485" width="10" height="155" rx="5" fill="#7C3AED"/>
  </g>
  <text x="95" y="525" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Geekbench — CPU score</text>
  <text x="95" y="558" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">Single Core | Multi Core | Full Test URL</text>
  <text x="95" y="588" font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">Geekbench 6 by default (not GB7-comparable)</text>
  <line x1="560" y1="510" x2="560" y2="615" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="545" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#7C3AED" font-weight="700">What to read</text>
  <text x="600" y="575" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">Single-core → typical web request handling</text>
  <text x="600" y="603" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">Multi-core → builds, encoding, parallel work</text>
</svg>
