<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Composio alternatives by architecture slot: proxy MCP, self-hosted gateway, workflow MCP, unified API, warehouse-first, curated tool store">
  <title>Composio alternatives by architecture slot</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 L 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="600" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">Composio alternatives by architecture slot</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#64748B">Picking by architecture slot beats picking by logo</text>

  <!-- Cell 1: Proxy MCP (managed) — Composio -->
  <rect x="51" y="112" width="346" height="252" rx="16" fill="#F5F7FF" stroke="#6366F1" stroke-width="2"/>
  <circle cx="87" cy="152" r="17" fill="#4F46E5"/>
  <text x="87" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">01</text>
  <text x="115" y="158" font-size="19" font-weight="700" fill="#0F172A">Proxy MCP (managed)</text>
  <text x="77" y="214" font-size="17" font-weight="700" fill="#4F46E5">Composio</text>
  <line x1="77" y1="234" x2="371" y2="234" stroke="#E2E8F0" stroke-width="1"/>
  <text x="77" y="264" font-size="14" fill="#475569">1,500+ toolkits behind managed OAuth</text>
  <text x="77" y="286" font-size="14" fill="#475569">Tool Router, sessions, triggers</text>
  <text x="77" y="324" font-size="13" font-style="italic" fill="#94A3B8">Choose when: SaaS auth is the hard part</text>
  <rect x="285" y="128" width="96" height="22" rx="11" fill="url(#titleGrad)"/>
  <text x="333" y="143" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#FFFFFF">THIS GUIDE</text>

  <!-- Cell 2: Self-hosted gateway -->
  <rect x="427" y="112" width="346" height="252" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="463" cy="152" r="17" fill="#0891B2"/>
  <text x="463" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">02</text>
  <text x="491" y="158" font-size="19" font-weight="700" fill="#0F172A">Self-hosted gateway</text>
  <text x="453" y="214" font-size="17" font-weight="700" fill="#0891B2">Executor.sh · ACI.dev</text>
  <line x1="453" y1="234" x2="747" y2="234" stroke="#E2E8F0" stroke-width="1"/>
  <text x="453" y="264" font-size="14" fill="#475569">MIT / Apache-2.0 · MCP, OpenAPI, GraphQL</text>
  <text x="453" y="286" font-size="14" fill="#475569">credentials never leave your host</text>
  <text x="453" y="324" font-size="13" font-style="italic" fill="#94A3B8">Choose when: own APIs, EU residency,</text>
  <text x="453" y="344" font-size="13" font-style="italic" fill="#94A3B8">or credential control</text>

  <!-- Cell 3: Workflow MCP -->
  <rect x="803" y="112" width="346" height="252" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="839" cy="152" r="17" fill="#DB2777"/>
  <text x="839" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">03</text>
  <text x="867" y="158" font-size="19" font-weight="700" fill="#0F172A">Workflow MCP</text>
  <text x="829" y="214" font-size="17" font-weight="700" fill="#DB2777">Pipedream · Zapier MCP · n8n</text>
  <line x1="829" y1="234" x2="1123" y2="234" stroke="#E2E8F0" stroke-width="1"/>
  <text x="829" y="264" font-size="14" fill="#475569">10K+ tools across 2,700+ apps</text>
  <text x="829" y="286" font-size="14" fill="#475569">human-in-the-loop approvals, flows</text>
  <text x="829" y="324" font-size="13" font-style="italic" fill="#94A3B8">Choose when: event-driven automations</text>
  <text x="829" y="344" font-size="13" font-style="italic" fill="#94A3B8">beat per-call agent tools</text>

  <!-- Cell 4: Unified API -->
  <rect x="51" y="390" width="346" height="252" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="87" cy="430" r="17" fill="#4F46E5"/>
  <text x="87" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">04</text>
  <text x="115" y="436" font-size="19" font-weight="700" fill="#0F172A">Unified API</text>
  <text x="77" y="492" font-size="17" font-weight="700" fill="#4F46E5">Apideck MCP</text>
  <line x1="77" y1="512" x2="371" y2="512" stroke="#E2E8F0" stroke-width="1"/>
  <text x="77" y="542" font-size="14" fill="#475569">229 auto-generated tools, 9 categories</text>
  <text x="77" y="564" font-size="14" fill="#475569">launched May 2026</text>
  <text x="77" y="602" font-size="13" font-style="italic" fill="#94A3B8">Choose when: provider portability</text>
  <text x="77" y="622" font-size="13" font-style="italic" fill="#94A3B8">matters more than depth</text>

  <!-- Cell 5: Warehouse-first -->
  <rect x="427" y="390" width="346" height="252" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="463" cy="430" r="17" fill="#0891B2"/>
  <text x="463" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">05</text>
  <text x="491" y="436" font-size="19" font-weight="700" fill="#0F172A">Warehouse-first</text>
  <text x="453" y="492" font-size="17" font-weight="700" fill="#0891B2">Peliqan</text>
  <line x1="453" y1="512" x2="747" y2="512" stroke="#E2E8F0" stroke-width="1"/>
  <text x="453" y="542" font-size="14" fill="#475569">EU-hosted · 250+ connectors</text>
  <text x="453" y="564" font-size="14" fill="#475569">cross-source SQL, audit-grade writeback</text>
  <text x="453" y="602" font-size="13" font-style="italic" fill="#94A3B8">Choose when: data residency and</text>
  <text x="453" y="622" font-size="13" font-style="italic" fill="#94A3B8">analytics-first access</text>

  <!-- Cell 6: Curated tool store -->
  <rect x="803" y="390" width="346" height="252" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="839" cy="430" r="17" fill="#DB2777"/>
  <text x="839" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">06</text>
  <text x="867" y="436" font-size="19" font-weight="700" fill="#0F172A">Curated tool store</text>
  <text x="829" y="492" font-size="17" font-weight="700" fill="#DB2777">Toolhouse · MintMCP · Smithery</text>
  <line x1="829" y1="512" x2="1123" y2="512" stroke="#E2E8F0" stroke-width="1"/>
  <text x="829" y="542" font-size="14" fill="#475569">~150 integrations, edge execution</text>
  <text x="829" y="564" font-size="14" fill="#475569">enterprise gateway · MCP registry</text>
  <text x="829" y="602" font-size="13" font-style="italic" fill="#94A3B8">Choose when: fewer, sharper tools or</text>
  <text x="829" y="622" font-size="13" font-style="italic" fill="#94A3B8">an enterprise front door</text>
</svg>
