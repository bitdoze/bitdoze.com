<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t1 d1">
  <title id="t1">Where to run Jellyfin: home mini PC, VPS, or hybrid</title>
  <desc id="d1">Decision flowchart. Needing hardware transcoding leads to a home mini PC with an Intel iGPU. CGNAT or weak home upload leads to a VPS running a Direct Play strategy. Otherwise the hybrid setup wins: library at home or on a storage box, remote access through a VPS or Tailscale.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="150" cy="620" r="280" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="80" r="260" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="56" font-size="29" font-weight="800" fill="#0F172A">Where should Jellyfin run?</text>
    <text x="60" y="84" font-size="15" fill="#64748B">Two honest questions, three sane outcomes</text>
  </g>

  <!-- Q1 -->
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="440" height="92" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="330" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Need hardware transcoding?</text>
    <text x="330" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">HEVC 10-bit and up wants an Intel 7th-gen+ iGPU</text>
  </g>

  <!-- Q2 -->
  <g filter="url(#shadow)">
    <rect x="110" y="310" width="440" height="92" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="330" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">CGNAT or upload under ~20 Mbps?</text>
    <text x="330" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">No public IP, or you need it always-on tonight</text>
  </g>

  <!-- HOME outcome -->
  <g filter="url(#shadow)">
    <rect x="740" y="115" width="400" height="112" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="740" y="115" width="400" height="36" rx="16" fill="url(#gIndigo)"/>
    <rect x="740" y="139" width="400" height="12" fill="url(#gIndigo)"/>
    <text x="940" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HOME MINI PC</text>
    <text x="940" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">N100-class box, Intel Quick Sync included</text>
    <text x="940" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Cheapest storage per TB, needs decent upload</text>
  </g>

  <!-- VPS outcome -->
  <g filter="url(#shadow)">
    <rect x="740" y="300" width="400" height="112" rx="16" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <rect x="740" y="300" width="400" height="36" rx="16" fill="url(#gCyan)"/>
    <rect x="740" y="324" width="400" height="12" fill="url(#gCyan)"/>
    <text x="940" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VPS</text>
    <text x="940" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">CX23-class: 2 vCPU / 4 GB, public IP, ~20 TB egress</text>
    <text x="940" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">No GPU, so plan around Direct Play</text>
  </g>

  <!-- HYBRID outcome -->
  <g filter="url(#shadow)">
    <rect x="740" y="485" width="400" height="112" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="740" y="485" width="400" height="36" rx="16" fill="url(#gViolet)"/>
    <rect x="740" y="509" width="400" height="12" fill="url(#gViolet)"/>
    <text x="940" y="509" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HYBRID</text>
    <text x="940" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Library at home or on a Storage Box</text>
    <text x="940" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Remote access via VPS or Tailscale, the default pick</text>
  </g>

  <!-- arrows -->
  <line x1="550" y1="166" x2="730" y2="166" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="588" y="146" width="52" height="24" rx="12" fill="#4F46E5"/>
  <text x="614" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">YES</text>

  <line x1="330" y1="212" x2="330" y2="300" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="344" y="248" width="42" height="24" rx="12" fill="#94A3B8"/>
  <text x="365" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">NO</text>

  <line x1="550" y1="356" x2="730" y2="356" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="588" y="336" width="52" height="24" rx="12" fill="#0891B2"/>
  <text x="614" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">YES</text>

  <path d="M490 402 L490 541 L730 541" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="540" y="517" width="100" height="24" rx="12" fill="#7C3AED"/>
  <text x="590" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EITHER WORKS</text>

  <!-- storage note -->
  <g filter="url(#shadow)">
    <rect x="110" y="455" width="330" height="135" rx="16" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="132" y="487" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#BE185D" letter-spacing="0.5">STORAGE IS THE REAL COST</text>
    <text x="132" y="513" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Bandwidth rarely is: ~1 TB/month per</text>
    <text x="132" y="531" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">heavy 4K viewer, and VPS egress covers</text>
    <text x="132" y="549" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">a family. Cheap TBs live at home or on</text>
    <text x="132" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">a Storage Box, not on VPS block storage.</text>
  </g>

  <text x="60" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Pick the smallest thing that works. The playback strategy matters more than the box it runs on.</text>
</svg>
