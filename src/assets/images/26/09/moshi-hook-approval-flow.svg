<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="flowTitle">
  <title id="flowTitle">Approval flow: agent permission prompt to moshi-hook to Moshi gateway to push notification to lock-screen Approve or Deny, with the decision routing back to the agent; expired approvals fall back to the local prompt and nothing auto-approves</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 H 0 V 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="fI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="fC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#06B6D4"/>
    </marker>
    <marker id="fA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="130" cy="100" r="240" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="580" r="260" fill="url(#blobCyan)"/>
  <circle cx="1160" cy="150" r="200" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#gridPat)"/>

  <!-- heading -->
  <text x="60" y="50" font-size="21" font-weight="800" fill="#0F172A">From permission prompt to lock screen — and back</text>
  <text x="60" y="76" font-size="13.5" fill="#64748B">moshi-hook turns agent prompts into push notifications</text>

  <!-- node 1: agent -->
  <rect x="63" y="146" width="210" height="120" rx="16" fill="#0F172A" opacity="0.05"/>
  <rect x="63" y="140" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="168" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">Agent</text>
  <text x="168" y="208" text-anchor="middle" font-size="12.5" fill="#64748B">permission prompt</text>
  <rect x="138" y="222" width="60" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="168" y="242" text-anchor="middle" font-size="13" font-weight="800" fill="#F59E0B">?</text>

  <!-- node 2: moshi-hook -->
  <rect x="351" y="146" width="210" height="120" rx="16" fill="#0F172A" opacity="0.05"/>
  <rect x="351" y="140" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="456" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#4338CA">moshi-hook</text>
  <text x="456" y="208" text-anchor="middle" font-size="12.5" fill="#64748B">local Unix socket</text>
  <rect x="396" y="220" width="120" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="456" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4F46E5">≤256 chars</text>

  <!-- node 3: gateway -->
  <rect x="639" y="146" width="210" height="120" rx="16" fill="#0F172A" opacity="0.05"/>
  <rect x="639" y="140" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="744" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#4F46E5">Moshi gateway</text>
  <text x="744" y="208" text-anchor="middle" font-size="12.5" fill="#64748B">WebSocket relay</text>
  <circle cx="722" cy="240" r="11" fill="#E0E7FF"/>
  <circle cx="744" cy="232" r="15" fill="#E0E7FF"/>
  <circle cx="766" cy="240" r="11" fill="#E0E7FF"/>
  <rect x="710" y="238" width="68" height="13" rx="6.5" fill="#E0E7FF"/>

  <!-- node 4: lock screen -->
  <rect x="927" y="146" width="210" height="120" rx="16" fill="#0F172A" opacity="0.05"/>
  <rect x="927" y="140" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1032" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">Lock screen</text>
  <text x="1032" y="208" text-anchor="middle" font-size="12.5" fill="#64748B">one tap, 5 seconds</text>
  <rect x="940" y="220" width="68" height="24" rx="12" fill="#4F46E5"/>
  <text x="974" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Approve</text>
  <rect x="1024" y="220" width="68" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1058" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Deny</text>

  <!-- top row arrows -->
  <line x1="279" y1="200" x2="341" y2="200" stroke="#6366F1" stroke-width="2.5" marker-end="url(#fI)"/>
  <text x="312" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4F46E5">hook event</text>
  <line x1="567" y1="200" x2="629" y2="200" stroke="#6366F1" stroke-width="2.5" marker-end="url(#fI)"/>
  <text x="600" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4F46E5">WebSocket</text>
  <line x1="855" y1="200" x2="917" y2="200" stroke="#EC4899" stroke-width="2.5" marker-end="url(#fI)"/>
  <text x="888" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#DB2777">push</text>

  <!-- return lane -->
  <path d="M 1032 266 L 1032 306 Q 1032 340 998 340 L 242 340 Q 208 340 208 306 L 208 272" fill="none" stroke="#06B6D4" stroke-width="2.5" marker-end="url(#fC)"/>
  <rect x="700" y="326" width="88" height="28" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="744" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E7490">via gateway</text>
  <rect x="404" y="326" width="104" height="28" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="456" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E7490">unix socket</text>
  <text x="240" y="304" font-size="12" font-weight="700" fill="#0E7490">agent resumes</text>

  <!-- expired branch -->
  <line x1="880" y1="346" x2="880" y2="420" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fA)"/>
  <text x="894" y="390" font-size="11.5" font-weight="700" fill="#B45309">expired</text>

  <!-- safety callout -->
  <rect x="140" y="430" width="920" height="150" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="7 5"/>
  <path d="M 186 452 l 16 7 v 12 c 0 11 -7 17 -16 21 c -9 -4 -16 -10 -16 -21 v -12 z" fill="#F59E0B"/>
  <text x="216" y="468" font-size="16" font-weight="800" fill="#92400E">Nothing auto-approves</text>
  <text x="216" y="496" font-size="13.5" fill="#78350F">Approval expired before you tapped? The agent falls back to its own local prompt in the terminal.</text>
  <text x="216" y="520" font-size="13.5" fill="#78350F">Events are capped at 256 characters, so no secrets ride the push notification.</text>
  <text x="216" y="544" font-size="13.5" fill="#78350F">The only way back to the agent is an explicit Approve or Deny.</text>

  <!-- decorative corner dots -->
  <circle cx="45" cy="636" r="5" fill="#6366F1" opacity="0.16"/>
  <circle cx="72" cy="610" r="3" fill="#06B6D4" opacity="0.18"/>
  <circle cx="1175" cy="320" r="4" fill="#EC4899" opacity="0.14"/>
  <circle cx="1150" cy="628" r="4" fill="#6366F1" opacity="0.15"/>
  <circle cx="1118" cy="650" r="2.5" fill="#06B6D4" opacity="0.16"/>
</svg>
