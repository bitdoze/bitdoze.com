<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <title>Request flow: browser, Astro render, getEmDashCollection, SQLite, HTML response with no rebuild on publish</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect width="1200" height="675" fill="url(#bg)"/>
    <circle cx="140" cy="110" r="250" fill="url(#blobI)"/>
    <circle cx="1080" cy="620" r="260" fill="url(#blobC)"/>
    <rect width="1200" height="675" fill="url(#grid)" opacity="0.25"/>
    <g opacity="0.16">
      <circle cx="70" cy="620" r="4" fill="#EC4899"/>
      <circle cx="1140" cy="120" r="4" fill="#6366F1"/>
      <circle cx="1160" cy="360" r="3" fill="#06B6D4"/>
      <circle cx="46" cy="380" r="3" fill="#06B6D4"/>
    </g>

    <!-- header -->
    <rect x="466" y="30" width="268" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="600" y="52" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#4F46E5">STEP 7 · LIVE DATA FLOW</text>
    <text x="600" y="106" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">Publish lands on the next request</text>

    <!-- arrows -->
    <g stroke="#64748B" stroke-width="2" fill="none">
      <line x1="300" y1="220" x2="342" y2="220" marker-end="url(#arrow)"/>
      <line x1="580" y1="220" x2="622" y2="220" marker-end="url(#arrow)"/>
      <line x1="860" y1="220" x2="902" y2="220" marker-end="url(#arrow)"/>
      <path d="M1025 290V344Q1025 350 1019 350H191Q185 350 185 344V298" marker-end="url(#arrow)"/>
    </g>
    <g font-size="11.5" fill="#64748B">
      <text x="323" y="206" text-anchor="middle">request</text>
      <text x="603" y="206" text-anchor="middle">query</text>
      <text x="883" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SELECT published</text>
      <text x="605" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">HTML response — rendered fresh on every request</text>
    </g>

    <!-- node 1: browser -->
    <g filter="url(#soft)"><rect x="70" y="150" width="230" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="163" y="166" width="44" height="44" rx="12" fill="#EEF2FF"/>
    <g fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round">
      <rect x="174" y="178" width="22" height="18" rx="3"/>
      <line x1="174" y1="184" x2="196" y2="184"/>
    </g>
    <circle cx="177.5" cy="181" r="1" fill="#4F46E5"/>
    <circle cx="181.5" cy="181" r="1" fill="#4F46E5"/>
    <text x="185" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Browser</text>
    <text x="185" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748B">GET /</text>

    <!-- node 2: astro render -->
    <g filter="url(#soft)"><rect x="350" y="150" width="230" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="443" y="166" width="44" height="44" rx="12" fill="#ECFEFF"/>
    <g fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="454" y="177" width="22" height="9" rx="2.5"/>
      <rect x="454" y="190" width="22" height="9" rx="2.5"/>
    </g>
    <circle cx="460" cy="181.5" r="1.2" fill="#0891B2"/>
    <circle cx="460" cy="194.5" r="1.2" fill="#0891B2"/>
    <text x="465" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Astro render</text>
    <text x="465" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748B">output: "server"</text>

    <!-- node 3: query -->
    <g filter="url(#soft)"><rect x="630" y="150" width="230" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="723" y="166" width="44" height="44" rx="12" fill="#EEF2FF"/>
    <text x="745" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#4F46E5">{ }</text>
    <text x="745" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#0F172A">getEmDashCollection</text>
    <text x="745" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748B">status: published</text>

    <!-- node 4: sqlite -->
    <g filter="url(#soft)"><rect x="910" y="150" width="230" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <rect x="1003" y="166" width="44" height="44" rx="12" fill="#ECFEFF"/>
    <g fill="none" stroke="#0891B2" stroke-width="1.8">
      <ellipse cx="1025" cy="178" rx="10" ry="4"/>
      <path d="M1015 178v10a10 4 0 0 0 20 0v-10M1015 183a10 4 0 0 0 20 0"/>
    </g>
    <text x="1025" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0F172A">data.db</text>
    <text x="1025" y="264" text-anchor="middle" font-size="12.5" fill="#64748B">SQLite · published rows</text>

    <!-- annotation -->
    <g filter="url(#soft)"><rect x="200" y="410" width="800" height="124" rx="18" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="1.5"/></g>
    <rect x="224" y="398" width="152" height="24" rx="12" fill="#FDF2F8" stroke="#F9A8D4"/>
    <text x="300" y="414" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#DB2777">WHY IT'S INSTANT</text>
    <rect x="226" y="438" width="168" height="38" rx="19" fill="url(#btnGrad)"/>
    <text x="310" y="462" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Save → Publish</text>
    <text x="418" y="456" font-size="16.5" font-weight="700" fill="#0F172A">visible on the NEXT request</text>
    <text x="418" y="480" font-size="13" fill="#64748B">no rebuild · no redeploy · SQLite is read live</text>
    <circle cx="242" cy="511" r="4" fill="#EC4899"/>
    <text x="256" y="516" font-size="12.5" fill="#9D174D">Prerendered pages are the exception — frozen at build time until you rebuild.</text>
  </g>
</svg>
