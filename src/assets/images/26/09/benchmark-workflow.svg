<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">VPS benchmark workflow</title>
  <desc id="wfDesc">Six-step flowchart of the VPS benchmark process: step 1 prerequisites, step 2 run YABS, step 3 read the output, step 4 share and compare results, step 5 pick a provider, step 6 monitor the server.</desc>

  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <filter id="wfShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#wfBg)"/>
  <rect width="1200" height="8" fill="url(#wfAccent)"/>

  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">The VPS benchmark workflow</text>
  <text x="600" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">Test before you commit, then keep watching after you deploy</text>

  <!-- Row 1 -->
  <g filter="url(#wfShadow)">
    <rect x="60" y="150" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="440" y="150" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="820" y="150" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="60" y="415" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="440" y="415" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="820" y="415" width="320" height="180" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
  </g>

  <!-- badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="92" cy="182" r="17" fill="#4F46E5"/><text x="92" y="188">1</text>
    <circle cx="472" cy="182" r="17" fill="#4F46E5"/><text x="472" y="188">2</text>
    <circle cx="852" cy="182" r="17" fill="#4F46E5"/><text x="852" y="188">3</text>
    <circle cx="92" cy="447" r="17" fill="#0891B2"/><text x="92" y="453">4</text>
    <circle cx="472" cy="447" r="17" fill="#0891B2"/><text x="472" y="453">5</text>
    <circle cx="852" cy="447" r="17" fill="#0891B2"/><text x="852" y="453">6</text>
  </g>

  <!-- step titles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">
    <text x="122" y="190">Prerequisites</text>
    <text x="502" y="190">Run YABS</text>
    <text x="882" y="190">Read the output</text>
    <text x="122" y="455">Share and compare</text>
    <text x="502" y="455">Pick a provider</text>
    <text x="882" y="455">Monitor</text>
  </g>

  <!-- step detail -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#475569">
    <text x="92" y="232">SSH access to the VPS</text>
    <text x="92" y="260">Idle box, not production peak</text>
    <text x="92" y="288">~15 minutes, bandwidth headroom</text>

    <text x="472" y="232" font-family="Consolas, Menlo, monospace" font-size="15" fill="#4F46E5">curl -sL https://yabs.sh | bash</text>
    <text x="472" y="262">fio + iperf3 + Geekbench 6</text>
    <text x="472" y="290">10-15 min full run</text>

    <text x="852" y="232">Disk: 4k IOPS and 1m sequential</text>
    <text x="852" y="260">Network: speeds to your regions</text>
    <text x="852" y="288">CPU: single-core and multi-core</text>

    <text x="92" y="497">JSON to YABSdb, VPSBenchmarks</text>
    <text x="92" y="525">or serverlist.dev with -s</text>
    <text x="92" y="553">Save the Geekbench Full Test URL</text>

    <text x="472" y="497">Compare same-tier plans only</text>
    <text x="472" y="525">Weight what your workload hits:</text>
    <text x="472" y="553">disk for DBs, network for edge</text>

    <text x="852" y="497">A benchmark is a snapshot</text>
    <text x="852" y="525">Monitoring is the trend</text>
    <text x="852" y="553">Beszel + Uptime Kuma</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#6366F1" stroke-width="3" fill="none" marker-end="url(#wfArrow)">
    <line x1="385" y1="240" x2="432" y2="240"/>
    <line x1="765" y1="240" x2="812" y2="240"/>
    <line x1="385" y1="505" x2="432" y2="505"/>
    <line x1="765" y1="505" x2="812" y2="505"/>
  </g>
  <!-- wrap arrow from step 3 down to step 4 -->
  <path d="M 980 335 L 980 375 Q 980 395 960 395 L 240 395 Q 220 395 220 415" stroke="#6366F1" stroke-width="3" fill="none" marker-end="url(#wfArrow)"/>

  <text x="600" y="645" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Run it during the trial or credit window — before the invoice starts</text>
</svg>
