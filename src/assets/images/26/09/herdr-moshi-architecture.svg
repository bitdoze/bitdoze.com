<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="archTitle">
  <title id="archTitle">Architecture: Herdr server on a VPS owns agent terminals; Moshi phone client attaches over SSH and Mosh; moshi-hook pushes approval notifications through the Moshi gateway; the laptop is just another client</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 H 0 V 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#06B6D4"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#EC4899"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="140" cy="110" r="240" fill="url(#blobIndigo)"/>
  <circle cx="1080" cy="570" r="260" fill="url(#blobCyan)"/>
  <circle cx="1150" cy="140" r="200" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#gridPat)"/>

  <!-- heading -->
  <text x="60" y="54" font-size="21" font-weight="800" fill="#0F172A">The stack: Herdr, Moshi, moshi-hook</text>
  <text x="60" y="80" font-size="13.5" fill="#64748B">agents live on the host; screens are just clients</text>

  <!-- phone client card -->
  <rect x="70" y="146" width="240" height="170" rx="18" fill="#0F172A" opacity="0.05"/>
  <rect x="70" y="140" width="240" height="170" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="86" y="168" font-size="11" font-weight="800" letter-spacing="2" fill="#64748B">PHONE</text>
  <text x="86" y="196" font-size="20" font-weight="800" fill="#0F172A">Moshi</text>
  <text x="86" y="224" font-size="12.5" fill="#475569">SSH terminal + agent inbox</text>
  <text x="86" y="248" font-size="12.5" fill="#475569">lock-screen approvals</text>
  <text x="86" y="272" font-size="12.5" fill="#475569">dictation + inbox triage</text>
  <rect x="252" y="162" width="42" height="84" rx="11" fill="#0F172A"/>
  <rect x="256" y="170" width="34" height="68" rx="7" fill="#F8FAFC"/>
  <circle cx="273" cy="186" r="7" fill="#6366F1"/>
  <rect x="261" y="200" width="24" height="9" rx="4" fill="#C7D2FE"/>
  <rect x="261" y="216" width="24" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="261" y="226" width="18" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="265" y="234" width="16" height="3.5" rx="1.75" fill="#CBD5E1"/>

  <!-- laptop client card -->
  <rect x="70" y="356" width="240" height="150" rx="18" fill="#0F172A" opacity="0.05"/>
  <rect x="70" y="350" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="86" y="378" font-size="11" font-weight="800" letter-spacing="2" fill="#64748B">LAPTOP</text>
  <text x="86" y="406" font-size="19" font-weight="800" fill="#0F172A">another client</text>
  <text x="86" y="432" font-size="12.5" fill="#475569">attaches / detaches at will</text>
  <rect x="246" y="372" width="52" height="36" rx="4" fill="#EEF2FF" stroke="#94A3B8"/>
  <rect x="238" y="410" width="68" height="7" rx="3.5" fill="#94A3B8"/>

  <!-- VPS container -->
  <rect x="470" y="126" width="460" height="440" rx="20" fill="#0F172A" opacity="0.05"/>
  <rect x="470" y="120" width="460" height="440" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="492" cy="147" r="4" fill="#10B981"/>
  <text x="504" y="151" font-size="12" font-weight="800" letter-spacing="1.5" fill="#334155">VPS · ALWAYS-ON HOST</text>
  <rect x="802" y="132" width="112" height="27" rx="13.5" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="858" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">€4–5 / mo</text>

  <!-- moshi-hook box -->
  <rect x="494" y="176" width="196" height="160" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="510" y="202" font-size="15" font-weight="800" fill="#4338CA">moshi-hook</text>
  <path d="M660 190 c-3.5 0 -5.5 2.6 -5.5 6 v3.5 l-2.5 3.5 h16 l-2.5 -3.5 V196 c0 -3.4 -2 -6 -5.5 -6 z" fill="#6366F1"/>
  <circle cx="660" cy="205.5" r="1.7" fill="#6366F1"/>
  <text x="510" y="232" font-size="12.5" fill="#475569">hooks in agent configs</text>
  <text x="510" y="256" font-size="12.5" fill="#475569">local Unix socket</text>
  <text x="510" y="280" font-size="12.5" fill="#475569">WebSocket up to gateway</text>
  <rect x="510" y="298" width="104" height="26" rx="13" fill="#4F46E5"/>
  <text x="562" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">the doorbell</text>

  <!-- mosh-server box -->
  <rect x="710" y="176" width="196" height="160" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="726" y="202" font-size="15" font-weight="800" fill="#0E7490">mosh-server</text>
  <rect x="858" y="210" width="5" height="12" rx="2" fill="#06B6D4"/>
  <rect x="866" y="204" width="5" height="18" rx="2" fill="#06B6D4"/>
  <rect x="874" y="198" width="5" height="24" rx="2" fill="#06B6D4"/>
  <text x="726" y="232" font-size="12.5" fill="#475569">UDP 60000-61000</text>
  <text x="726" y="256" font-size="12.5" fill="#475569">roams wifi to LTE</text>
  <text x="726" y="280" font-size="12.5" fill="#475569">sessions never drop</text>
  <rect x="726" y="298" width="110" height="26" rx="13" fill="#CFFAFE" stroke="#67E8F9"/>
  <text x="781" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E7490">roaming transport</text>

  <!-- herdr server box -->
  <rect x="494" y="372" width="412" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="510" y="386" width="14" height="14" rx="4" fill="#4F46E5"/>
  <text x="532" y="398" font-size="16" font-weight="800" fill="#0F172A">herdr server</text>
  <text x="510" y="420" font-size="12.5" fill="#64748B">owns the PTYs — panes live through disconnects</text>
  <rect x="510" y="434" width="380" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="528" cy="450" r="5" fill="#10B981"/>
  <text x="542" y="454" font-size="13" font-weight="600" fill="#0F172A">claude code</text>
  <text x="874" y="454" text-anchor="end" font-size="11.5" font-weight="700" fill="#10B981">working</text>
  <rect x="510" y="472" width="380" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="528" cy="488" r="5" fill="#F59E0B"/>
  <text x="542" y="492" font-size="13" font-weight="600" fill="#0F172A">codex</text>
  <text x="874" y="492" text-anchor="end" font-size="11.5" font-weight="700" fill="#D97706">blocked</text>
  <rect x="510" y="510" width="380" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="528" cy="526" r="5" fill="#94A3B8"/>
  <text x="542" y="530" font-size="13" font-weight="600" fill="#0F172A">opencode</text>
  <text x="874" y="530" text-anchor="end" font-size="11.5" font-weight="700" fill="#64748B">idle</text>

  <!-- gateway cloud -->
  <rect x="985" y="61" width="185" height="95" rx="28" fill="#0F172A" opacity="0.05"/>
  <rect x="985" y="55" width="185" height="95" rx="28" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="1063" cy="76" r="7" fill="#C7D2FE"/>
  <circle cx="1077" cy="71" r="9" fill="#C7D2FE"/>
  <circle cx="1091" cy="76" r="7" fill="#C7D2FE"/>
  <rect x="1056" y="74" width="42" height="9" rx="4.5" fill="#C7D2FE"/>
  <text x="1077" y="112" text-anchor="middle" font-size="15" font-weight="800" fill="#4F46E5">Moshi gateway</text>
  <text x="1077" y="132" text-anchor="middle" font-size="12" fill="#64748B">push relay</text>

  <!-- transport arrows: phone -->
  <line x1="314" y1="215" x2="458" y2="215" stroke="#6366F1" stroke-width="2.5" marker-end="url(#aI)"/>
  <text x="386" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">SSH · key only</text>
  <line x1="314" y1="255" x2="458" y2="255" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#aC)"/>
  <text x="386" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#0E7490">Mosh · UDP 60000-61000</text>

  <!-- transport arrow: laptop -->
  <line x1="314" y1="430" x2="458" y2="430" stroke="#64748B" stroke-width="2.5" marker-end="url(#aS)"/>
  <text x="386" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">SSH · attach / detach</text>

  <!-- websocket: moshi-hook to gateway -->
  <path d="M 585 176 C 585 138, 900 130, 1010 146" fill="none" stroke="#6366F1" stroke-width="2.5" marker-end="url(#aI)"/>
  <text x="795" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">WebSocket</text>

  <!-- push: gateway to phone -->
  <path d="M 985 92 C 760 40, 470 45, 292 128" fill="none" stroke="#EC4899" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="640" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#DB2777">push: agent needs you</text>

  <!-- return: phone to gateway -->
  <path d="M 280 134 C 520 92, 800 84, 1000 132" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#aC)"/>
  <text x="640" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0E7490">tap: approve / deny</text>

  <!-- decorative corner dots -->
  <circle cx="40" cy="640" r="5" fill="#6366F1" opacity="0.16"/>
  <circle cx="66" cy="614" r="3" fill="#06B6D4" opacity="0.18"/>
  <circle cx="1178" cy="330" r="4" fill="#EC4899" opacity="0.14"/>
  <circle cx="1150" cy="620" r="4" fill="#6366F1" opacity="0.15"/>
  <circle cx="1120" cy="648" r="2.5" fill="#06B6D4" opacity="0.16"/>
</svg>
