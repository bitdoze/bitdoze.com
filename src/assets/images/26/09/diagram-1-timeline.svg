<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d1Title d1Desc">
  <title id="d1Title">2025 to 2026 timeline of WordPress and Astro milestones</title>
  <desc id="d1Desc">Horizontal timeline: WordPress peak in early 2025, WordPress 6.9 in December 2025, Cloudflare acquiring the Astro Technology Company on 16 January 2026, WordPress 7.0 Armstrong on 20 May 2026, the wp2shell core RCE patch on 17 July 2026, WordPress 7.1 Mary Lou on 19 August 2026, and Astro 7.3.2 on 8 September 2026.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="180" cy="640" r="280" fill="url(#blobIndigo)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#blobCyan)"/>
  <circle cx="640" cy="500" r="240" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="52" font-size="29" font-weight="800" fill="#0F172A">The 2025 → 2026 timeline</text>
    <text x="60" y="80" font-size="15" fill="#64748B">Milestones that moved the build-vs-maintain tradeoff</text>
  </g>

  <!-- legend -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <rect x="826" y="34" width="14" height="14" rx="4" fill="#4F46E5"/>
    <text x="848" y="46" fill="#334155">WordPress</text>
    <rect x="948" y="34" width="14" height="14" rx="4" fill="#06B6D4"/>
    <text x="970" y="46" fill="#334155">Astro</text>
    <rect x="1040" y="34" width="14" height="14" rx="4" fill="#EC4899"/>
    <text x="1062" y="46" fill="#334155">Security</text>
  </g>

  <!-- axis -->
  <rect x="90" y="346" width="1020" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>

  <!-- connectors (above) -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5">
    <line x1="110" y1="212" x2="110" y2="340"/>
    <line x1="440" y1="212" x2="440" y2="340"/>
    <line x1="770" y1="212" x2="770" y2="340"/>
    <line x1="1100" y1="212" x2="1100" y2="340"/>
    <line x1="275" y1="352" x2="275" y2="436"/>
    <line x1="605" y1="352" x2="605" y2="436"/>
    <line x1="935" y1="352" x2="935" y2="436"/>
  </g>

  <!-- milestone dots -->
  <g stroke-width="4" fill="#FFFFFF">
    <circle cx="110" cy="349" r="9" stroke="#4F46E5"/>
    <circle cx="275" cy="349" r="9" stroke="#4F46E5"/>
    <circle cx="440" cy="349" r="9" stroke="#06B6D4"/>
    <circle cx="605" cy="349" r="9" stroke="#4F46E5"/>
    <circle cx="770" cy="349" r="9" stroke="#EC4899"/>
    <circle cx="935" cy="349" r="9" stroke="#4F46E5"/>
    <circle cx="1100" cy="349" r="9" stroke="#06B6D4"/>
  </g>

  <!-- cards above axis -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="15" y="116" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="31" y="144" font-size="13" font-weight="800" fill="#4F46E5">Early 2025</text>
    <text x="31" y="168" font-size="12.5" fill="#334155">WordPress peaks at</text>
    <text x="31" y="186" font-size="12.5" fill="#334155">~43.6% of all sites</text>

    <rect x="345" y="116" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="361" y="144" font-size="13" font-weight="800" fill="#0E7490">16 Jan 2026</text>
    <text x="361" y="168" font-size="12.5" fill="#334155">Cloudflare acquires</text>
    <text x="361" y="186" font-size="12.5" fill="#334155">The Astro Technology Co.</text>

    <rect x="675" y="116" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="691" y="144" font-size="13" font-weight="800" fill="#BE185D">17 Jul 2026</text>
    <text x="691" y="168" font-size="12.5" fill="#334155">wp2shell core RCE</text>
    <text x="691" y="186" font-size="12.5" fill="#334155">patched by auto-update</text>

    <rect x="1005" y="116" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="1021" y="144" font-size="13" font-weight="800" fill="#0E7490">8 Sep 2026</text>
    <text x="1021" y="168" font-size="12.5" fill="#334155">Astro 7.3.2 ships</text>
    <text x="1021" y="186" font-size="12.5" fill="#334155">(Rust compiler)</text>
  </g>

  <!-- cards below axis -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="180" y="436" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="196" y="464" font-size="13" font-weight="800" fill="#4F46E5">2 Dec 2025</text>
    <text x="196" y="488" font-size="12.5" fill="#334155">WordPress 6.9</text>
    <text x="196" y="506" font-size="12.5" fill="#334155">share starts sliding</text>

    <rect x="510" y="436" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="526" y="464" font-size="13" font-weight="800" fill="#4F46E5">20 May 2026</text>
    <text x="526" y="488" font-size="12.5" fill="#334155">WordPress 7.0</text>
    <text x="526" y="506" font-size="12.5" fill="#334155">"Armstrong"</text>

    <rect x="840" y="436" width="190" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="856" y="464" font-size="13" font-weight="800" fill="#4F46E5">19 Aug 2026</text>
    <text x="856" y="488" font-size="12.5" fill="#334155">WordPress 7.1</text>
    <text x="856" y="506" font-size="12.5" fill="#334155">"Mary Lou"</text>
  </g>

  <!-- year band labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">
    <text x="100" y="578">2025</text>
    <text x="368" y="578">2026</text>
  </g>
  <line x1="248" y1="564" x2="248" y2="588" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="60" y="632" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Sources: W3Techs, Search Engine Journal (27 May 2026), Astro and WordPress release notes. 2025 figures are historical.</text>
</svg>
