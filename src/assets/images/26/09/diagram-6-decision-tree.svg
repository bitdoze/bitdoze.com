<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="d6Title d6Desc">
  <title id="d6Title">Decision tree for choosing Astro, WordPress, or headless WordPress plus Astro</title>
  <desc id="d6Desc">Flowchart: start with who publishes after launch. A non-technical editor publishing daily leads to WordPress, or headless WordPress plus Astro if performance matters. A developer leads to the question of whether a store or user accounts are needed: yes leads to WooCommerce or Shopify, no leads to the question of whether an editor GUI is needed, where no means Astro static and yes means headless WordPress plus Astro.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="140" cy="580" r="250" fill="url(#blobIndigo)"/>
  <circle cx="1060" cy="140" r="250" fill="url(#blobCyan)"/>
  <circle cx="600" cy="330" r="220" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.18"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="44" font-size="28" font-weight="800" fill="#0F172A">Which should you run?</text>
    <text x="60" y="70" font-size="15" fill="#64748B">Three questions, in this order, cover almost every real case</text>
  </g>

  <!-- root question -->
  <rect x="390" y="88" width="420" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.95" stroke="#4F46E5" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Who publishes after launch?</text>

  <!-- level 2 -->
  <rect x="100" y="210" width="340" height="64" rx="18" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.6"/>
  <text x="270" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#BE185D">Non-technical editor, daily</text>
  <text x="270" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B">wants a dashboard and a Publish button</text>

  <rect x="770" y="210" width="320" height="64" rx="18" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.6"/>
  <text x="930" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0E7490">Developer / you</text>
  <text x="930" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B">edits files, runs the build</text>

  <!-- level 3 questions -->
  <rect x="605" y="330" width="280" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.95" stroke="#4F46E5" stroke-width="2"/>
  <text x="745" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Store or user accounts?</text>

  <rect x="930" y="330" width="250" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.95" stroke="#4F46E5" stroke-width="2"/>
  <text x="1055" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Editor GUI needed?</text>

  <!-- outcome cards -->
  <g>
    <rect x="30" y="470" width="280" height="104" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.6"/>
    <rect x="30" y="470" width="6" height="104" rx="3" fill="#6366F1"/>
    <text x="56" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">WordPress</text>
    <text x="56" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">non-technical publishers daily</text>
    <text x="56" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">$20–50/mo managed, or a VPS</text>
    <text x="56" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">headless WP + Astro if speed matters</text>

    <rect x="350" y="470" width="240" height="104" rx="18" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.6"/>
    <rect x="350" y="470" width="6" height="104" rx="3" fill="#EC4899"/>
    <text x="376" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#BE185D">WooCommerce / Shopify</text>
    <text x="376" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">a store or logins are the product</text>
    <text x="376" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">not Astro-only — the plugin does</text>
    <text x="376" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">months of work you would own</text>

    <rect x="630" y="470" width="230" height="104" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.6"/>
    <rect x="630" y="470" width="6" height="104" rx="3" fill="url(#accent)"/>
    <text x="656" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#4338CA">Astro static</text>
    <text x="656" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">you publish, no GUI needed</text>
    <text x="656" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">$0 on a free tier, ~€4–6/mo VPS</text>
    <text x="656" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">fewest moving parts to wake you</text>

    <rect x="940" y="470" width="240" height="104" rx="18" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.6"/>
    <rect x="940" y="470" width="6" height="104" rx="3" fill="#06B6D4"/>
    <text x="966" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0E7490">Headless WP + Astro</text>
    <text x="966" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">editor GUI plus static speed</text>
    <text x="966" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">WordPress becomes a build-time</text>
    <text x="966" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">dependency — cache last good fetch</text>
  </g>

  <!-- arrows -->
  <g stroke="#6366F1" stroke-width="2.2" fill="none">
    <path d="M600 152 V180 H270 V204" marker-end="url(#arw)"/>
    <path d="M600 152 V180 H930 V204" marker-end="url(#arw)"/>
    <path d="M930 274 V302 H745 V324" marker-end="url(#arw)"/>
    <line x1="885" y1="362" x2="924" y2="362" marker-end="url(#arw)"/>
    <path d="M270 274 V420 H170 V464" marker-end="url(#arw)"/>
    <path d="M655 394 V430 H470 V464" marker-end="url(#arw)"/>
    <path d="M975 394 V430 H745 V464" marker-end="url(#arw)"/>
    <path d="M1140 394 V464" marker-end="url(#arw)"/>
  </g>

  <!-- branch labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4F46E5" text-anchor="middle" paint-order="stroke" stroke="#F8FAFC" stroke-width="5">
    <text x="907" y="354">No</text>
    <text x="562" y="422">Yes</text>
    <text x="860" y="422">No</text>
    <text x="1128" y="424">Yes</text>
  </g>

  <text x="600" y="628" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Shopify and a real backend are the honest answers when the site is really an application.</text>
</svg>
