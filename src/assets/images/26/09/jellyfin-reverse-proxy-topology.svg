<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t3 d3">
  <title id="t3">Jellyfin remote access behind a reverse proxy</title>
  <desc id="d3">Clients (browser, TV, phone) reach the server through the internet, hitting a reverse proxy (Traefik or Caddy) that terminates TLS on 443 and passes WebSockets to Jellyfin on internal port 8096. Known Proxies must contain the proxy IP so Jellyfin sees real client IPs. A dashed Tailscale/WireGuard path bypasses the public internet entirely. Ports 8096, 8920, and 7359/udp are marked never to expose.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gProxy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="120" cy="600" r="280" fill="url(#blobIndigo)"/>
  <circle cx="1100" cy="90" r="260" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="60" y="56" font-size="29" font-weight="800" fill="#0F172A">Remote access, the safe shape</text>
    <text x="60" y="84" font-size="15" fill="#64748B">TLS lives on the proxy. Jellyfin stays on the internal network.</text>
  </g>

  <!-- clients -->
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="140" width="180" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="140" width="8" height="64" rx="4" fill="url(#gClient)"/>
    <text x="156" y="166" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Browser</text>
    <text x="156" y="188" font-size="11" fill="#64748B" text-anchor="middle">web client</text>

    <rect x="60" y="250" width="180" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="250" width="8" height="64" rx="4" fill="url(#gClient)"/>
    <text x="156" y="276" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">TV app</text>
    <text x="156" y="298" font-size="11" fill="#64748B" text-anchor="middle">Android TV / Roku</text>

    <rect x="60" y="360" width="180" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="360" width="8" height="64" rx="4" fill="url(#gClient)"/>
    <text x="156" y="386" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Phone</text>
    <text x="156" y="408" font-size="11" fill="#64748B" text-anchor="middle">cellular test device</text>
  </g>

  <!-- internet pill -->
  <ellipse cx="350" cy="282" rx="86" ry="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">internet</text>
  <text x="350" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">jellyfin.example.com</text>

  <!-- client arrows to internet -->
  <g stroke="#64748B" stroke-width="2">
    <line x1="240" y1="172" x2="286" y2="252" marker-end="url(#arr)"/>
    <line x1="240" y1="282" x2="264" y2="282" marker-end="url(#arr)"/>
    <line x1="240" y1="392" x2="286" y2="312" marker-end="url(#arr)"/>
  </g>

  <!-- reverse proxy -->
  <g filter="url(#shadow)">
    <rect x="500" y="180" width="270" height="210" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="500" y="180" width="270" height="38" rx="16" fill="url(#gProxy)"/>
    <rect x="500" y="204" width="270" height="14" fill="url(#gProxy)"/>
    <text x="635" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">REVERSE PROXY</text>
    <text x="635" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Traefik (via Dokploy)</text>
    <text x="635" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">or a two-line Caddyfile</text>
    <text x="635" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">TLS :443 · Let's Encrypt</text>
    <text x="635" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">WebSockets pass through</text>
    <text x="635" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">subdomain, never a subpath</text>
    <rect x="545" y="352" width="180" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="635" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle">THE ONLY PUBLIC PORTS: 80/443</text>
  </g>

  <!-- jellyfin -->
  <g filter="url(#shadow)">
    <rect x="860" y="215" width="280" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="860" y="215" width="280" height="36" rx="16" fill="url(#gMain)"/>
    <rect x="860" y="239" width="280" height="12" fill="url(#gMain)"/>
    <text x="1000" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JELLYFIN :8096</text>
    <text x="1000" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">bound to the internal network</text>
    <text x="1000" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">sees real client IPs once</text>
    <text x="1000" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Known Proxies is set</text>
  </g>

  <!-- internet -> proxy -> jellyfin -->
  <line x1="436" y1="282" x2="492" y2="282" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="464" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">443</text>
  <line x1="770" y1="282" x2="852" y2="282" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="811" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">8096</text>

  <!-- known proxies callout -->
  <g filter="url(#shadow)">
    <rect x="420" y="410" width="340" height="86" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="440" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#92400E">Known Proxies = the proxy's IP</text>
    <text x="440" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#92400E">Dashboard → Networking. Skip it and every</text>
    <text x="440" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#92400E">remote user looks "local" to Jellyfin.</text>
  </g>

  <!-- tailscale alternative path -->
  <path d="M150 424 L150 540 L1000 540 L1000 363" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrV)"/>
  <rect x="380" y="522" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="570" y="544" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="middle">or Tailscale / WireGuard: zero public exposure</text>

  <!-- never expose -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="590" width="1080" height="46" rx="14" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <text x="600" y="619" font-size="13" font-weight="600" fill="#BE123C" text-anchor="middle">Never publish :8096 or :8920 directly. 7359/udp discovery is LAN-only. No proxy, no TLS, no exceptions.</text>
  </g>
</svg>
