<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Decision flow: Composio for OAuth-heavy SaaS, self-hosted gateway for own APIs, hybrid when both apply">
  <title>Composio or self-host: decision flow</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 L 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrowSlate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="600" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">Which tool layer should your agents run?</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#64748B">Managed where auth is hard — self-hosted where volume is high</text>

  <!-- Start -->
  <rect x="420" y="108" width="360" height="48" rx="24" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="600" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#3730A3">Your agents need app tools</text>

  <!-- Flow arrows -->
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M600 156 L600 176" marker-end="url(#arrowSlate)"/>
    <path d="M790 252 L874 252" marker-end="url(#arrowSlate)"/>
    <path d="M600 322 L600 376" marker-end="url(#arrowSlate)"/>
    <path d="M790 452 L874 452" marker-end="url(#arrowSlate)"/>
    <path d="M600 522 L600 564" marker-end="url(#arrowSlate)"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="833" y="240" text-anchor="middle" fill="#059669">YES</text>
    <text x="618" y="354" fill="#DC2626">NO</text>
    <text x="833" y="440" text-anchor="middle" fill="#059669">YES</text>
    <text x="618" y="550" fill="#DC2626">NO</text>
  </g>

  <!-- Decision 1 -->
  <polygon points="600,182 790,252 600,322 410,252" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="600" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Do agents call OAuth-heavy</text>
  <text x="600" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">SaaS apps like Gmail &amp; GitHub?</text>

  <!-- Outcome 1: Composio -->
  <rect x="880" y="190" width="280" height="124" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="896" y="204" width="88" height="22" rx="11" fill="#EEF2FF"/>
  <text x="940" y="219" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#4F46E5">MANAGED</text>
  <text x="896" y="254" font-size="18" font-weight="700" fill="#0F172A">Composio (hosted)</text>
  <text x="896" y="278" font-size="14" fill="#64748B">Free until the hard cap,</text>
  <text x="896" y="298" font-size="14" fill="#64748B">then $29/mo + usage</text>

  <!-- Decision 2 -->
  <polygon points="600,382 790,452 600,522 410,452" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <text x="600" y="446" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">EU residency, own APIs or</text>
  <text x="600" y="468" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">predictable billing first?</text>

  <!-- Outcome 2: Self-hosted -->
  <rect x="880" y="390" width="280" height="124" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <rect x="896" y="404" width="110" height="22" rx="11" fill="#ECFEFF"/>
  <text x="951" y="419" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#0891B2">SELF-HOSTED</text>
  <text x="896" y="454" font-size="18" font-weight="700" fill="#0F172A">Self-hosted gateway</text>
  <text x="896" y="478" font-size="14" font-weight="600" fill="#4F46E5">Executor.sh · ACI.dev</text>
  <text x="896" y="498" font-size="14" fill="#64748B">credentials stay on your host</text>

  <!-- Outcome 3: Hybrid -->
  <rect x="290" y="570" width="620" height="76" rx="16" fill="#FFFFFF" stroke="url(#titleGrad)" stroke-width="2.5"/>
  <text x="600" y="602" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Hybrid — the setup I actually run</text>
  <text x="600" y="628" text-anchor="middle" font-size="14" fill="#64748B">Managed Composio for auth-heavy SaaS · self-hosted gateway for your own APIs</text>
</svg>
