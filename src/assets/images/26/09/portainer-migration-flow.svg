<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EC4899"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="220" fill="url(#blobC)"/>
  <circle cx="100" cy="600" r="220" fill="url(#blobI)"/>

  <text x="600" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Migrate off Portainer without downtime</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748B">One stack at a time — keep the old path alive until the new one verifies</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="112" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="210" cy="112" r="15" fill="url(#accent)"/>
    <text x="210" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="210" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Inventory</text>
    <text x="210" y="184" text-anchor="middle" font-size="14" fill="#475569">List every stack: name, images,</text>
    <text x="210" y="206" text-anchor="middle" font-size="14" fill="#475569">env vars, volumes, networks,</text>
    <text x="210" y="228" text-anchor="middle" font-size="14" fill="#475569">published ports</text>

    <rect x="430" y="112" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="600" cy="112" r="15" fill="url(#accent)"/>
    <text x="600" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="600" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Export</text>
    <text x="600" y="184" text-anchor="middle" font-size="14" fill="#475569">Pull compose.yaml + .env for</text>
    <text x="600" y="206" text-anchor="middle" font-size="14" fill="#475569">each stack — don't trust</text>
    <text x="600" y="228" text-anchor="middle" font-size="14" fill="#475569">unseen portainer_data paths</text>

    <rect x="820" y="112" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="990" cy="112" r="15" fill="url(#accent)"/>
    <text x="990" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="990" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Recreate on disk</text>
    <text x="990" y="184" text-anchor="middle" font-size="14" fill="#475569">/opt/stacks/&lt;name&gt;/ + .env</text>
    <text x="990" y="206" text-anchor="middle" font-size="14" fill="#475569">docker compose up -d by hand</text>
    <text x="990" y="228" text-anchor="middle" font-size="14" fill="#475569">prove parity before any UI</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="820" y="372" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="990" cy="372" r="15" fill="url(#accent)"/>
    <text x="990" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="990" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Adopt in new tool</text>
    <text x="990" y="444" text-anchor="middle" font-size="14" fill="#475569">Dockge: DOCKGE_STACKS_DIR=/opt/stacks</text>
    <text x="990" y="466" text-anchor="middle" font-size="14" fill="#475569">Komodo: Periphery → stack dirs</text>
    <text x="990" y="488" text-anchor="middle" font-size="14" fill="#475569">Arcane: matching PROJECTS_DIRECTORY</text>

    <rect x="430" y="372" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="600" cy="372" r="15" fill="url(#accent)"/>
    <text x="600" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
    <text x="600" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Verify</text>
    <text x="600" y="444" text-anchor="middle" font-size="14" fill="#475569">docker compose ps · health endpoints</text>
    <text x="600" y="466" text-anchor="middle" font-size="14" fill="#475569">logs + a full host reboot test</text>
    <text x="600" y="488" text-anchor="middle" font-size="14" fill="#475569">UI removed → stacks keep running</text>

    <rect x="40" y="372" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="210" cy="372" r="15" fill="url(#accent)"/>
    <text x="210" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
    <text x="210" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Decommission Portainer</text>
    <text x="210" y="444" text-anchor="middle" font-size="14" fill="#475569">Stop Portainer — don't delete it</text>
    <text x="210" y="466" text-anchor="middle" font-size="14" fill="#475569">keep portainer_data one cycle</text>
    <text x="210" y="488" text-anchor="middle" font-size="14" fill="#475569">delete after a clean reboot</text>
  </g>

  <!-- Flow connectors -->
  <path d="M 384 182 H 424" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 774 182 H 816" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 990 256 V 366" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 816 442 H 776" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>
  <path d="M 426 442 H 386" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#as)"/>

  <!-- Rollback branch -->
  <path d="M 600 516 V 550" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ap)"/>
  <rect x="360" y="556" width="480" height="56" rx="28" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
  <path d="M 396 584 a 8 8 0 1 0 -8 10" fill="none" stroke="#DB2777" stroke-width="2.5"/>
  <path d="M 388 596 l 7 1.5 -0.5 -6 z" fill="#DB2777"/>
  <text x="608" y="580" text-anchor="middle" font-size="14" font-weight="600" fill="#9D174D">Rollback: if verify fails, start Portainer again</text>
  <text x="608" y="600" text-anchor="middle" font-size="14" fill="#BE185D">portainer_data untouched for one release cycle</text>

  <text x="600" y="648" text-anchor="middle" font-size="14" fill="#64748B">Files-on-disk tools (Dockge, Arcane projects, Komodo stacks) survive UI removal — what you clicked together in a UI does not</text>
</svg>
