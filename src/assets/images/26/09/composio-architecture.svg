<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Composio architecture: one tool layer connecting Codex CLI, omp, pi and Mastra agents to connected apps and custom MCP servers">
  <title>Composio one-tool-layer architecture</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 L 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrowIndigo" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6366F1"/>
    </marker>
    <marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0891B2"/>
    </marker>
    <marker id="arrowSlate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="600" y="56" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">One tool layer for every agent</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#64748B">CLI agents reach it over MCP, framework agents via the @composio/mastra SDK</text>

  <!-- Column labels -->
  <g font-size="13" font-weight="700" letter-spacing="2" fill="#94A3B8" text-anchor="middle">
    <text x="200" y="136">AGENTS</text>
    <text x="600" y="136">COMPOSIO</text>
    <text x="1000" y="136">APPS + CUSTOM MCPS</text>
  </g>

  <!-- Agent boxes (left) -->
  <g>
    <rect x="60" y="150" width="280" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="76" y="176" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <text x="96" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#4F46E5">&gt;_</text>
    <text x="132" y="192" font-size="18" font-weight="700" fill="#0F172A">Codex CLI</text>
    <text x="132" y="216" font-size="14" fill="#64748B">MCP + Agent Skill</text>

    <rect x="60" y="264" width="280" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="76" y="290" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <text x="96" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#4F46E5">&gt;_</text>
    <text x="132" y="306" font-size="18" font-weight="700" fill="#0F172A">Claude Code</text>
    <text x="132" y="330" font-size="14" fill="#64748B">MCP</text>

    <rect x="60" y="378" width="280" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="76" y="404" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <text x="96" y="430" text-anchor="middle" font-size="15" font-weight="800" fill="#4F46E5">&gt;_</text>
    <text x="132" y="420" font-size="18" font-weight="700" fill="#0F172A">omp · pi</text>
    <text x="132" y="444" font-size="14" fill="#64748B">generic MCP clients</text>

    <rect x="60" y="492" width="280" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="76" y="518" width="40" height="40" rx="10" fill="#ECFEFF"/>
    <text x="96" y="544" text-anchor="middle" font-size="17" font-weight="800" fill="#0891B2">@</text>
    <text x="132" y="534" font-size="18" font-weight="700" fill="#0F172A">Mastra agent</text>
    <text x="132" y="558" font-size="14" fill="#64748B">@composio/mastra SDK</text>
  </g>

  <!-- Arrows: agents to Composio -->
  <g fill="none" stroke="#6366F1" stroke-width="2.5" opacity="0.85">
    <path d="M340 196 C 395 196 395 260 434 260" marker-end="url(#arrowIndigo)"/>
    <path d="M340 310 C 395 310 395 322 434 322" marker-end="url(#arrowIndigo)"/>
    <path d="M340 424 C 395 424 395 402 434 402" marker-end="url(#arrowIndigo)"/>
    <path d="M340 538 C 395 538 395 464 434 464" marker-end="url(#arrowIndigo)"/>
  </g>
  <text x="390" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">MCP</text>
  <text x="390" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">SDK</text>

  <!-- Composio center box -->
  <rect x="440" y="150" width="320" height="434" rx="18" fill="#FFFFFF" stroke="url(#titleGrad)" stroke-width="2.5"/>
  <text x="600" y="214" text-anchor="middle" font-size="26" font-weight="800" fill="url(#titleGrad)">Composio</text>
  <text x="600" y="240" text-anchor="middle" font-size="14" fill="#64748B">one managed tool layer</text>
  <rect x="525" y="254" width="150" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="600" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">1,500+ toolkits</text>

  <g>
    <rect x="464" y="298" width="272" height="40" rx="10" fill="#F1F5F9"/>
    <circle cx="488" cy="318" r="4" fill="#4F46E5"/>
    <text x="600" y="323" text-anchor="middle" font-size="14" fill="#334155">Managed OAuth + refresh</text>

    <rect x="464" y="350" width="272" height="40" rx="10" fill="#F1F5F9"/>
    <circle cx="488" cy="370" r="4" fill="#06B6D4"/>
    <text x="600" y="375" text-anchor="middle" font-size="14" fill="#334155">Tool Router — intent search</text>

    <rect x="464" y="402" width="272" height="40" rx="10" fill="#F1F5F9"/>
    <circle cx="488" cy="422" r="4" fill="#EC4899"/>
    <text x="600" y="427" text-anchor="middle" font-size="14" fill="#334155">Sessions &amp; per-user auth</text>

    <rect x="464" y="454" width="272" height="40" rx="10" fill="#F1F5F9"/>
    <circle cx="488" cy="474" r="4" fill="#4F46E5"/>
    <text x="600" y="479" text-anchor="middle" font-size="14" fill="#334155">Triggers &amp; webhooks</text>

    <rect x="464" y="506" width="272" height="40" rx="10" fill="#F1F5F9"/>
    <circle cx="488" cy="526" r="4" fill="#06B6D4"/>
    <text x="600" y="531" text-anchor="middle" font-size="14" fill="#334155">Custom MCP registry</text>
  </g>

  <!-- Arrows: Composio to apps -->
  <g fill="none" stroke="#0891B2" stroke-width="2.5" opacity="0.85">
    <path d="M760 250 L 854 250" marker-end="url(#arrowCyan)"/>
    <path d="M760 482 L 854 482" marker-end="url(#arrowCyan)"/>
  </g>
  <text x="808" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0891B2">tool calls</text>
  <text x="808" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#0891B2">custom tools</text>

  <!-- Right group 1: connected apps -->
  <rect x="860" y="150" width="280" height="200" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="876" y="186" font-size="16" font-weight="700" fill="#0F172A">Connected apps</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="876" y="206" width="120" height="32" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1"/>
    <text x="936" y="227" fill="#0E7490">GitHub</text>
    <rect x="1004" y="206" width="120" height="32" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1"/>
    <text x="1064" y="227" fill="#0E7490">Gmail</text>
    <rect x="876" y="248" width="120" height="32" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1"/>
    <text x="936" y="269" fill="#0E7490">Google Cloud</text>
    <rect x="1004" y="248" width="120" height="32" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1"/>
    <text x="1064" y="269" fill="#0E7490">YouTube</text>
    <rect x="876" y="290" width="248" height="32" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1000" y="311" fill="#64748B">…and 1,490 more</text>
  </g>

  <!-- Right group 2: custom MCPs -->
  <rect x="860" y="380" width="280" height="204" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="876" y="416" font-size="16" font-weight="700" fill="#0F172A">Custom MCPs</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="876" y="434" width="120" height="32" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1"/>
    <text x="936" y="455" fill="#BE185D">Plausible</text>
    <rect x="1004" y="434" width="120" height="32" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1"/>
    <text x="1064" y="455" fill="#BE185D">Ubersuggest</text>
    <rect x="876" y="476" width="120" height="32" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1"/>
    <text x="936" y="497" fill="#BE185D">Fish Audio</text>
    <rect x="1004" y="476" width="120" height="32" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1"/>
    <text x="1064" y="497" fill="#BE185D">+ your own</text>
  </g>
  <text x="1000" y="548" text-anchor="middle" font-size="13" font-style="italic" fill="#94A3B8">register any MCP server, free</text>

  <!-- Caption -->
  <text x="600" y="646" text-anchor="middle" font-size="15" font-style="italic" fill="#64748B">One GitHub connection, reused by Codex in the terminal and by a Mastra worker in production.</text>
</svg>
