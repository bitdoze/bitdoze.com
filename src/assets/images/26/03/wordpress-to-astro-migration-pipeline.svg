<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="920" height="310" fill="#f8fafc" rx="10"/>
  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">WordPress to Astro migration pipeline</text>

  <!-- Row 1 -->
  <!-- 1: WP Export -->
  <rect x="18" y="55" width="135" height="58" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">WP Admin</text>
  <text x="85" y="95" text-anchor="middle" font-size="10" fill="#1e40af">Tools &#8594; Export</text>
  <line x1="153" y1="84" x2="181" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2: XML -->
  <rect x="181" y="55" width="105" height="58" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="233" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">export.xml</text>
  <text x="233" y="97" text-anchor="middle" font-size="9" fill="#4338ca">all content</text>
  <line x1="286" y1="84" x2="314" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3: Converter -->
  <rect x="314" y="55" width="162" height="58" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="395" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">npx wordpress-</text>
  <text x="395" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">export-to-markdown</text>
  <text x="395" y="104" text-anchor="middle" font-size="9" fill="#92400e">v3.0.6</text>
  <line x1="476" y1="84" x2="504" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4: MD + images -->
  <rect x="504" y="55" width="115" height="58" rx="7" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="561" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">.md files</text>
  <text x="561" y="96" text-anchor="middle" font-size="10" fill="#065f46">+ images/</text>
  <line x1="619" y1="84" x2="647" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5: Codex CLI -->
  <rect x="647" y="55" width="135" height="58" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="714" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Codex CLI</text>
  <text x="714" y="91" text-anchor="middle" font-size="9" fill="#5b21b6">frontmatter, WebP,</text>
  <text x="714" y="104" text-anchor="middle" font-size="9" fill="#5b21b6">image references</text>

  <!-- Arrow down to row 2 -->
  <line x1="714" y1="113" x2="714" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2 (right to left visually) -->
  <!-- 6: src/content + src/assets -->
  <rect x="620" y="155" width="155" height="58" rx="7" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="697" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">src/content/posts/</text>
  <text x="697" y="196" text-anchor="middle" font-size="10" fill="#9d174d">src/assets/images/</text>
  <line x1="620" y1="184" x2="580" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 7: Build -->
  <rect x="455" y="155" width="125" height="58" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="517" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">bun run build</text>
  <text x="517" y="197" text-anchor="middle" font-size="9" fill="#991b1b">fix what breaks</text>
  <line x1="455" y1="184" x2="415" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 8: Deploy -->
  <rect x="275" y="155" width="140" height="58" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="345" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Cloudflare Pages</text>
  <text x="345" y="196" text-anchor="middle" font-size="9" fill="#1e40af">deploy static output</text>
  <line x1="275" y1="184" x2="235" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 9: 301 -->
  <rect x="30" y="155" width="205" height="58" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="132" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">301 redirects</text>
  <text x="132" y="196" text-anchor="middle" font-size="9" fill="#92400e">wpdoze.com/* &#8594; bitdoze.com/$1</text>

  <!-- Labels -->
  <text x="460" y="252" text-anchor="middle" font-size="10" fill="#64748b">Each stage is a checkpoint: run the build and verify output before moving on.</text>
  <text x="460" y="272" text-anchor="middle" font-size="10" fill="#64748b">The Codex CLI pass is optional but saves hours on 50+ posts.</text>
</svg>
