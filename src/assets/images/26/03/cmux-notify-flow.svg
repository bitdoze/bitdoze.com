<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="52" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">cmux notification flow</text>
  <text x="640" y="86" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">agent hook / OSC escape / cmux notify &#8594; ring + badge + panel + desktop alert</text>

  <!-- Sources column -->
  <rect x="80" y="140" width="380" height="110" rx="12" fill="#334155"/>
  <text x="270" y="182" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Agent hooks</text>
  <text x="270" y="214" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">cmux hooks setup</text>

  <rect x="80" y="290" width="380" height="110" rx="12" fill="#334155"/>
  <text x="270" y="332" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">OSC escapes</text>
  <text x="270" y="364" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">OSC 9 &#183; OSC 99 &#183; OSC 777</text>

  <rect x="80" y="440" width="380" height="110" rx="12" fill="#334155"/>
  <text x="270" y="482" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">CLI</text>
  <text x="270" y="514" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">cmux notify --title ... --body ...</text>

  <!-- arrows into router -->
  <line x1="460" y1="195" x2="560" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="345" x2="560" y2="355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="495" x2="560" y2="385" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="580" y="280" width="280" height="160" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>
  <text x="720" y="336" text-anchor="middle" fill="#a5b4fc" font-size="19" font-family="system-ui, sans-serif" font-weight="bold">cmux</text>
  <text x="720" y="368" text-anchor="middle" fill="#a5b4fc" font-size="19" font-family="system-ui, sans-serif" font-weight="bold">notification core</text>
  <text x="720" y="404" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-family="system-ui, sans-serif">per-surface context routing</text>

  <!-- arrows to outputs -->
  <line x1="860" y1="310" x2="960" y2="195" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-b)"/>
  <line x1="860" y1="345" x2="960" y2="315" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-b)"/>
  <line x1="860" y1="380" x2="960" y2="435" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-b)"/>
  <line x1="860" y1="415" x2="960" y2="555" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-b)"/>

  <!-- Outputs column -->
  <rect x="980" y="140" width="240" height="110" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="1100" y="182" text-anchor="middle" fill="#22c55e" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">Notification ring</text>
  <text x="1100" y="212" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="13" font-family="system-ui, sans-serif">around the pane</text>

  <rect x="980" y="270" width="240" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="1100" y="312" text-anchor="middle" fill="#38bdf8" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">Unread badge</text>
  <text x="1100" y="342" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="13" font-family="system-ui, sans-serif">on the workspace tab</text>

  <rect x="980" y="400" width="240" height="110" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="1100" y="442" text-anchor="middle" fill="#a78bfa" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">Notification panel</text>
  <text x="1100" y="472" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="13" font-family="system-ui, sans-serif">pending items list</text>

  <rect x="980" y="530" width="240" height="110" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="1100" y="572" text-anchor="middle" fill="#f59e0b" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">Desktop alert</text>
  <text x="1100" y="602" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="13" font-family="system-ui, sans-serif">macOS notification</text>

  <!-- Footer -->
  <text x="640" y="684" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="15" font-family="system-ui, sans-serif">OSC 7501 program status (idle / working / blocked / done / error) drives the sidebar pill and the cmux-events stream</text>
</svg>
