<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="48" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">OpenFang Agent OS architecture</text>
  <text x="640" y="82" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">Chat channels &#8594; daemon (kernel + runtime) &#8594; LLM providers &#8594; autonomous Hands</text>

  <!-- Chat channels -->
  <rect x="240" y="110" width="800" height="86" rx="12" fill="#334155"/>
  <text x="640" y="146" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Chat channels &#8212; 40 adapters</text>
  <text x="640" y="176" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">Discord &#183; Telegram &#183; Slack &#183; WhatsApp &#183; 36 more</text>

  <line x1="640" y1="196" x2="640" y2="228" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Daemon -->
  <rect x="140" y="232" width="1000" height="170" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="640" y="262" text-anchor="middle" fill="#a5b4fc" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">OpenFang daemon (single Rust binary, ~32MB, ~40MB idle RAM)</text>

  <rect x="180" y="282" width="440" height="100" rx="10" fill="#4f46e5"/>
  <text x="400" y="316" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Kernel</text>
  <text x="400" y="344" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">orchestration &#183; RBAC &#183; scheduling</text>
  <text x="400" y="366" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">budget tracking</text>

  <rect x="660" y="282" width="440" height="100" rx="10" fill="#4f46e5"/>
  <text x="880" y="316" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Runtime</text>
  <text x="880" y="344" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">agent loop &#183; 53 tools &#183; WASM sandbox</text>
  <text x="880" y="366" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13" font-family="system-ui, sans-serif">MCP &#183; A2A</text>

  <line x1="640" y1="402" x2="640" y2="434" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- LLM providers -->
  <rect x="240" y="438" width="800" height="86" rx="12" fill="#334155"/>
  <text x="640" y="474" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">LLM providers &#8212; 51 built-in models</text>
  <text x="640" y="504" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">MiniMax M2.5 &#183; GLM-5 (Zhipu) &#183; Anthropic &#183; OpenRouter &#183; Ollama</text>

  <line x1="640" y1="524" x2="640" y2="556" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-g)"/>

  <!-- Hands -->
  <rect x="240" y="560" width="800" height="100" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="598" text-anchor="middle" fill="#86efac" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Hands &#8212; autonomous agents on schedules</text>
  <text x="640" y="630" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="ui-monospace, monospace">Researcher &#183; Clip &#183; Lead &#183; Collector &#183; Predictor &#183; Twitter &#183; Browser</text>
</svg>
