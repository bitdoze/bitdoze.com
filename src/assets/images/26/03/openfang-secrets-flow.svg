<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="48" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">OpenFang secrets flow</text>
  <text x="640" y="82" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">config.toml stores environment variable names, never the secrets themselves</text>

  <!-- config.toml -->
  <rect x="60" y="150" width="330" height="240" rx="12" fill="#334155"/>
  <text x="225" y="190" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">config.toml</text>
  <text x="225" y="228" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="ui-monospace, monospace">api_key_env = "MINIMAX_API_KEY"</text>
  <text x="225" y="256" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="ui-monospace, monospace">bot_token_env = "DISCORD_BOT_TOKEN"</text>
  <text x="225" y="300" text-anchor="middle" fill="#86efac" font-size="14" font-family="system-ui, sans-serif">holds variable NAMES only</text>
  <text x="225" y="330" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-family="system-ui, sans-serif">safe to back up, easy to diff</text>

  <line x1="390" y1="270" x2="468" y2="270" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Process environment -->
  <rect x="475" y="150" width="330" height="240" rx="12" fill="#334155"/>
  <text x="640" y="190" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Process environment</text>
  <text x="640" y="228" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="ui-monospace, monospace">MINIMAX_API_KEY=sk-&#8230;</text>
  <text x="640" y="256" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="ui-monospace, monospace">DISCORD_BOT_TOKEN=MTA&#8230;</text>
  <text x="640" y="300" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="system-ui, sans-serif">holds the actual VALUES</text>
  <text x="640" y="330" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-family="system-ui, sans-serif">systemd EnvironmentFile or shell export</text>

  <line x1="805" y1="270" x2="883" y2="270" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-g)"/>

  <!-- Daemon -->
  <rect x="890" y="150" width="330" height="240" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="1055" y="190" text-anchor="middle" fill="#a5b4fc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">OpenFang daemon</text>
  <text x="1055" y="228" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">reads *_env names from config,</text>
  <text x="1055" y="256" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" font-family="system-ui, sans-serif">resolves values from the environment</text>
  <text x="1055" y="300" text-anchor="middle" fill="#86efac" font-size="14" font-family="system-ui, sans-serif">Zeroizing&lt;String&gt; wipes keys</text>
  <text x="1055" y="330" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-family="system-ui, sans-serif">from RAM once they are no longer needed</text>

  <!-- Never box -->
  <rect x="300" y="470" width="680" height="150" rx="12" fill="#3b1d2e" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="514" text-anchor="middle" fill="#f87171" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Never do this in config.toml</text>
  <text x="640" y="552" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="15" font-family="ui-monospace, monospace">api_key = "sk-live-&#8230;" &#160;&#160;&#160; token = "MTA&#8230;"</text>
  <text x="640" y="588" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="13" font-family="system-ui, sans-serif">inline secrets leak through backups, git history, and loose file permissions</text>
</svg>
