<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="52" text-anchor="middle" fill="white" font-size="34" font-family="system-ui, sans-serif" font-weight="bold">cmux object hierarchy</text>
  <text x="640" y="86" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="system-ui, sans-serif">Window &#8594; Workspace (vertical tab) &#8594; Pane &#8594; Surface (terminal | browser)</text>

  <!-- Window -->
  <rect x="80" y="116" width="1120" height="520" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>
  <text x="640" y="152" text-anchor="middle" fill="#a5b4fc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">Window (the app window)</text>

  <!-- Workspace container -->
  <rect x="112" y="176" width="1056" height="424" rx="12" fill="#334155"/>
  <text x="640" y="208" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Workspace (main vertical tab in the sidebar)</text>

  <!-- Sidebar tabs -->
  <rect x="136" y="228" width="120" height="46" rx="8" fill="#6366f1"/>
  <text x="196" y="257" text-anchor="middle" fill="white" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">agent-a</text>
  <rect x="136" y="284" width="120" height="46" rx="8" fill="#475569"/>
  <text x="196" y="313" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="system-ui, sans-serif">agent-b</text>
  <rect x="136" y="340" width="120" height="46" rx="8" fill="#475569"/>
  <text x="196" y="369" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="system-ui, sans-serif">web-app</text>
  <text x="196" y="424" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="system-ui, sans-serif">vertical tabs</text>

  <!-- Pane 1 -->
  <rect x="292" y="228" width="416" height="340" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="262" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">Pane (split area)</text>

  <!-- Surface: terminal -->
  <rect x="316" y="282" width="368" height="262" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="316" text-anchor="middle" fill="#22c55e" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Surface: terminal</text>
  <text x="340" y="352" fill="#22c55e" font-size="14" font-family="ui-monospace, monospace">$ claude</text>
  <text x="340" y="382" fill="rgba(255,255,255,0.75)" font-size="13" font-family="ui-monospace, monospace">&gt; refactoring auth service...</text>
  <text x="340" y="412" fill="rgba(255,255,255,0.55)" font-size="13" font-family="ui-monospace, monospace">  waiting for approval</text>
  <rect x="336" y="436" width="10" height="10" rx="5" fill="#f59e0b"/>
  <text x="356" y="446" fill="#f59e0b" font-size="12" font-family="system-ui, sans-serif">notification ring (needs input)</text>

  <!-- Pane 2 -->
  <rect x="732" y="228" width="416" height="340" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="940" y="262" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">Pane (split area)</text>

  <!-- Surface: browser -->
  <rect x="756" y="282" width="368" height="262" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="940" y="316" text-anchor="middle" fill="#38bdf8" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Surface: browser</text>
  <rect x="780" y="336" width="320" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="794" y="356" fill="rgba(255,255,255,0.6)" font-size="12" font-family="ui-monospace, monospace">https://localhost:4321</text>
  <rect x="780" y="382" width="150" height="20" rx="4" fill="#475569"/>
  <rect x="780" y="412" width="230" height="20" rx="4" fill="#475569"/>
  <rect x="780" y="442" width="120" height="34" rx="6" fill="#22c55e"/>
  <text x="840" y="464" text-anchor="middle" fill="white" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Submit</text>
  <text x="940" y="514" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="12" font-family="system-ui, sans-serif">scriptable from the cmux CLI</text>

  <!-- Caption -->
  <text x="640" y="684" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="15" font-family="system-ui, sans-serif">Each surface is a terminal or a browser tab; panes split inside a workspace; workspaces are the vertical tabs</text>
</svg>
