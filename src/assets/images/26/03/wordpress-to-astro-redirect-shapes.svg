<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="340" fill="#f8fafc" rx="10"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Redirect shapes: when a blanket 301 works and when it does not</text>

  <!-- Case A -->
  <rect x="20" y="48" width="425" height="275" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="232" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Case A: slugs preserved</text>
  <text x="232" y="95" text-anchor="middle" font-size="10" fill="#166534">Same path shape &#8594; wildcard Single Redirect is enough</text>

  <!-- Old URLs -->
  <rect x="45" y="115" width="170" height="36" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="130" y="137" text-anchor="middle" font-size="10" fill="#166534">wpdoze.com/my-post/</text>
  <rect x="45" y="160" width="170" height="36" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="130" y="182" text-anchor="middle" font-size="10" fill="#166534">wpdoze.com/other-post/</text>

  <!-- Arrow -->
  <line x1="215" y1="155" x2="255" y2="155" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="235" y="148" text-anchor="middle" font-size="9" fill="#166534">301</text>

  <!-- New URLs -->
  <rect x="255" y="115" width="170" height="36" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="137" text-anchor="middle" font-size="10" fill="#166534">bitdoze.com/my-post/</text>
  <rect x="255" y="160" width="170" height="36" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="182" text-anchor="middle" font-size="10" fill="#166534">bitdoze.com/other-post/</text>

  <!-- Rule -->
  <rect x="45" y="218" width="380" height="36" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="235" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Rule: wpdoze.com/* &#8594; https://www.bitdoze.com/${http.request.uri.path}</text>
  <text x="235" y="278" text-anchor="middle" font-size="10" fill="#15803d">One wildcard rule covers every URL.</text>
  <text x="235" y="298" text-anchor="middle" font-size="10" fill="#15803d">Use Cloudflare Single Redirect (Rules &#8594; Redirect Rules).</text>

  <!-- Case B -->
  <rect x="475" y="48" width="425" height="275" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="687" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Case B: date permalinks &#8594; flat slugs</text>
  <text x="687" y="95" text-anchor="middle" font-size="10" fill="#991b1b">Path shapes differ &#8594; wildcard alone lands on 404s</text>

  <!-- Old URLs with date -->
  <rect x="500" y="115" width="185" height="36" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="592" y="137" text-anchor="middle" font-size="10" fill="#991b1b">wpdoze.com/2023/05/my-post/</text>
  <rect x="500" y="160" width="185" height="36" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="592" y="182" text-anchor="middle" font-size="10" fill="#991b1b">wpdoze.com/2022/11/other-post/</text>

  <!-- Arrow with X -->
  <line x1="685" y1="155" x2="720" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="702" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">&#10007;</text>

  <!-- Wrong result -->
  <rect x="720" y="115" width="165" height="36" rx="5" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="802" y="137" text-anchor="middle" font-size="10" fill="#991b1b">bitdoze.com/2023/05/my-post/</text>
  <rect x="720" y="160" width="165" height="36" rx="5" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="802" y="182" text-anchor="middle" font-size="10" fill="#991b1b">404 &#8212; page not found</text>

  <!-- Fix -->
  <rect x="500" y="218" width="385" height="36" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="692" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Fix: per-URL map &#8594; Cloudflare Bulk Redirects (CSV upload)</text>
  <text x="692" y="250" text-anchor="middle" font-size="9" fill="#991b1b">or a _redirects file on Cloudflare Pages</text>
  <text x="692" y="278" text-anchor="middle" font-size="10" fill="#b91c1c">Export old URLs from the WP XML, build a CSV mapping,</text>
  <text x="692" y="298" text-anchor="middle" font-size="10" fill="#b91c1c">and upload it. Test 5&#8211;10 real URLs before cutover.</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
