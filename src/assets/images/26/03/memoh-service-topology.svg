<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-l" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1a1a2e"/>

  <text x="640" y="46" text-anchor="middle" fill="white" font-size="30" font-family="system-ui, sans-serif" font-weight="bold">Memoh 1.0 service topology (Docker Compose)</text>
  <text x="640" y="78" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui, sans-serif">Startup gates: postgres + pgvector healthy &#8594; migrate exits 0 &#8594; server healthy &#8594; channel &#8594; web</text>
  <text x="640" y="100" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="13" font-family="system-ui, sans-serif">Every request enters at web :8082. Server and channel talk over internal RPC :9090/:9091, authenticated with MEMOH_INTERNAL_RPC_SHARED_SECRET.</text>

  <!-- postgres -->
  <rect x="40" y="150" width="220" height="130" rx="12" fill="#334155"/>
  <text x="150" y="185" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">postgres</text>
  <text x="150" y="212" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">postgres:18-alpine</text>
  <text x="150" y="234" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-family="ui-monospace, monospace">vol: postgres_data</text>
  <text x="150" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">pg_isready -U memoh</text>

  <!-- migrate -->
  <rect x="330" y="150" width="200" height="130" rx="12" fill="#334155"/>
  <text x="430" y="185" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">migrate</text>
  <text x="430" y="212" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">memohai/server:1.0.2</text>
  <text x="430" y="234" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-family="system-ui, sans-serif">one-shot: migrate up</text>
  <text x="430" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">restart: "no"</text>

  <!-- server (privileged) -->
  <rect x="600" y="120" width="280" height="190" rx="12" fill="#3b4252" stroke="#ef4444" stroke-width="2"/>
  <text x="740" y="155" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">server</text>
  <text x="740" y="182" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">memohai/server:1.0.2</text>
  <text x="740" y="204" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">privileged + pid:host</text>
  <text x="740" y="226" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-family="system-ui, sans-serif">embedded containerd + in-process agent</text>
  <text x="740" y="250" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">vols: containerd_data, memoh_data,</text>
  <text x="740" y="266" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">server_cni_state</text>
  <text x="740" y="290" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">ports: 8080, 1455, 30000/udp</text>

  <!-- channel -->
  <rect x="950" y="150" width="230" height="130" rx="12" fill="#334155"/>
  <text x="1065" y="185" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">channel</text>
  <text x="1065" y="212" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">memohai/server:1.0.2</text>
  <text x="1065" y="234" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10" font-family="ui-monospace, monospace">memoh-channel serve :8081</text>
  <text x="1065" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">webhooks + IM connectors</text>

  <!-- pgvector -->
  <rect x="40" y="390" width="220" height="130" rx="12" fill="#334155"/>
  <text x="150" y="425" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">pgvector</text>
  <text x="150" y="452" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">pgvector/pgvector:pg18</text>
  <text x="150" y="474" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-family="ui-monospace, monospace">db: memoh_vector</text>
  <text x="150" y="496" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">vol: pgvector_data</text>

  <!-- web -->
  <rect x="600" y="390" width="280" height="130" rx="12" fill="#334155"/>
  <text x="740" y="425" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">web</text>
  <text x="740" y="452" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-family="ui-monospace, monospace">memohai/web:1.0.2</text>
  <text x="740" y="474" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-family="system-ui, sans-serif">:8082 &#8212; the only port to publish</text>
  <text x="740" y="496" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">2 upstreams: server + channel</text>

  <!-- arrows -->
  <line x1="260" y1="215" x2="322" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="291" y="203" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">healthy</text>

  <line x1="530" y1="215" x2="592" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="561" y="203" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">exits 0</text>

  <line x1="260" y1="455" x2="596" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="375" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">pgvector healthy</text>

  <line x1="880" y1="195" x2="942" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="911" y="183" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">healthy</text>

  <line x1="880" y1="255" x2="942" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-l)" marker-start="url(#arrow-r)"/>
  <text x="915" y="335" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">RPC 9090/9091</text>
  <text x="915" y="350" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="ui-monospace, monospace">+ shared secret</text>

  <line x1="740" y1="310" x2="740" y2="382" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="752" y="352" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">healthy</text>

  <path d="M1065,280 L1065,460 L888,460" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="975" y="448" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui, sans-serif">healthy</text>

  <!-- ports note -->
  <rect x="40" y="545" width="1140" height="32" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="610" y="566" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-monospace, monospace">Ports: publish only :8082 (web) &#183; server maps :8080, :1455, :30000/udp (display) &#183; never publish RPC :9090/:9091 &#183; connect-it :8421</text>

  <!-- optional profiles -->
  <text x="60" y="600" fill="rgba(255,255,255,0.6)" font-size="12" font-family="system-ui, sans-serif">Optional Compose profiles</text>

  <rect x="40" y="612" width="540" height="86" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="644" text-anchor="middle" fill="white" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">webhook-tunnel &#183; --profile webhook-tunnel</text>
  <text x="310" y="670" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11" font-family="system-ui, sans-serif">cloudflared quick tunnel &#8212; Telegram webhooks without a public IP</text>

  <rect x="620" y="612" width="540" height="86" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="890" y="644" text-anchor="middle" fill="white" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">connect-it &#183; --profile connectors</text>
  <text x="890" y="670" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11" font-family="system-ui, sans-serif">ghcr.io/felinics/connect-it:0.3.1 &#8212; OAuth connectors (GitHub, Notion) on :8421</text>
</svg>
