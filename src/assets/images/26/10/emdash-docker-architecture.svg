<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="EmDash Docker architecture: browser through Cloudflare and Caddy to a Docker host running the app container and Postgres container, media on Bunny S3 or local uploads volume">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">EmDash on Docker: the livingandglow.com stack</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748B">Two containers on one VPS: Node SSR app + Postgres 18 · media on Bunny S3 · Caddy on a private docker network</text>

  <!-- Request path row -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="110" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  </g>
  <text x="180" y="145" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Browser</text>
  <text x="180" y="170" text-anchor="middle" font-size="13" fill="#64748B">readers + /_emdash/admin</text>

  <line x1="300" y1="152" x2="478" y2="152" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadow)">
    <rect x="480" y="110" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="600" y="145" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Cloudflare</text>
  <text x="600" y="170" text-anchor="middle" font-size="13" fill="#64748B">DNS + proxy, TLS at the edge</text>

  <line x1="720" y1="152" x2="898" y2="152" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadow)">
    <rect x="900" y="110" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <text x="1020" y="145" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Caddy</text>
  <text x="1020" y="170" text-anchor="middle" font-size="13" fill="#64748B">reverse proxy on 'web' network</text>

  <line x1="1020" y1="194" x2="1020" y2="235" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Docker host -->
  <rect x="60" y="235" width="1080" height="215" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="80" y="262" font-size="14" font-weight="600" fill="#64748B">DOCKER HOST — VPS · 8 vCPU AMD EPYC · 16 GB RAM</text>

  <g filter="url(#cardShadow)">
    <rect x="85" y="278" width="630" height="150" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="400" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">app — container: livingandglow</text>
  <text x="400" y="332" text-anchor="middle" font-size="13" fill="#475569">node:22-alpine → node dist/server/entry.mjs, port 4321</text>
  <text x="400" y="353" text-anchor="middle" font-size="13" fill="#475569">Astro SSR + /_emdash/admin + REST API</text>
  <text x="400" y="374" text-anchor="middle" font-size="13" fill="#475569">scheduler runs in-process (publish, tasks, backups)</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#94A3B8">no published port — reachable only through Caddy</text>

  <line x1="715" y1="353" x2="743" y2="353" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="353" x2="717" y2="353" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="730" y="344" text-anchor="middle" font-size="11" fill="#64748B">5432</text>

  <g filter="url(#cardShadow)">
    <rect x="745" y="278" width="370" height="150" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="930" y="308" text-anchor="middle" font-size="17" font-weight="700" fill="#064E3B">db — postgres:18-alpine</text>
  <text x="930" y="332" text-anchor="middle" font-size="13" fill="#475569">./data/postgres → /var/lib/postgresql</text>
  <text x="930" y="353" text-anchor="middle" font-size="13" fill="#475569">depends_on: service_healthy (pg_isready)</text>
  <text x="930" y="374" text-anchor="middle" font-size="13" fill="#475569">PG* env pool + DATABASE_URL migrations</text>
  <text x="930" y="398" text-anchor="middle" font-size="12" fill="#94A3B8">internal 'default' network only</text>

  <!-- Media + secrets row -->
  <line x1="300" y1="428" x2="230" y2="478" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="428" x2="630" y2="478" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadow)">
    <rect x="60" y="478" width="340" height="118" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="230" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#7C2D12">Media: Bunny S3 (production)</text>
  <text x="230" y="531" text-anchor="middle" font-size="13" fill="#475569">s3() adapter, six S3_* env vars</text>
  <text x="230" y="551" text-anchor="middle" font-size="13" fill="#475569">pull zone serves media on b-cdn.net</text>
  <text x="230" y="572" text-anchor="middle" font-size="12" fill="#94A3B8">media requests never touch Node</text>

  <g filter="url(#cardShadow)">
    <rect x="460" y="478" width="340" height="118" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="630" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Media: local() fallback</text>
  <text x="630" y="531" text-anchor="middle" font-size="13" fill="#475569">./data/uploads bind mount</text>
  <text x="630" y="551" text-anchor="middle" font-size="13" fill="#475569">served via /_emdash/api/media/file</text>
  <text x="630" y="572" text-anchor="middle" font-size="12" fill="#94A3B8">default when S3_* is unset</text>

  <g filter="url(#cardShadow)">
    <rect x="860" y="478" width="280" height="118" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <text x="1000" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">Runtime secrets</text>
  <text x="1000" y="531" text-anchor="middle" font-size="13" fill="#475569">env_file: .env (not in image)</text>
  <text x="1000" y="551" text-anchor="middle" font-size="13" fill="#475569">EMDASH_ENCRYPTION_KEY</text>
  <text x="1000" y="572" text-anchor="middle" font-size="12" fill="#94A3B8">encrypts plugin settings at rest</text>

  <!-- Footer -->
  <rect x="60" y="618" width="1080" height="42" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="600" y="645" text-anchor="middle" font-size="14" font-weight="600" fill="#3730A3">One command: docker compose up -d --build · migrations run on first request · a stopped app means a stopped scheduler</text>
</svg>
