<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="Dokploy compose update paths decision diagram">
  <title>Dokploy compose update paths</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dokploy compose update paths</text>

  <!-- decision node -->
  <rect x="280" y="60" width="320" height="56" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="440" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">What tags does your compose file use?</text>
  <text x="440" y="104" text-anchor="middle" font-size="12" fill="#475569">Check the image: lines in your compose file</text>

  <!-- connectors to branches -->
  <line x1="380" y1="116" x2="230" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="116" x2="650" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- left branch label -->
  <rect x="110" y="150" width="240" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">latest / mutable tags</text>

  <!-- right branch label -->
  <rect x="530" y="150" width="240" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">pinned / exact tags</text>

  <!-- left lane: three methods -->
  <line x1="230" y1="186" x2="230" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="216" width="320" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="242" font-size="14" font-weight="700" fill="#1e3a8a">Method 1 (recommended)</text>
  <text x="90" y="264" font-size="13" fill="#0f172a">Advanced → "Pull latest images on deploy"</text>
  <text x="90" y="284" font-size="13" fill="#0f172a">then General → Rebuild</text>

  <line x1="230" y1="304" x2="230" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="330" width="320" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="356" font-size="14" font-weight="700" fill="#334155">Method 2 (fallback)</text>
  <text x="90" y="378" font-size="13" fill="#0f172a">SSH → docker compose pull → Rebuild</text>

  <line x1="230" y1="402" x2="230" y2="426" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="428" width="320" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="454" font-size="14" font-weight="700" fill="#334155">Method 3 (automation)</text>
  <text x="90" y="476" font-size="13" fill="#0f172a">Dokploy Schedules, CLI/API,</text>
  <text x="90" y="496" font-size="13" fill="#0f172a">or Tugtainer (Watchtower is archived)</text>

  <!-- right lane: pinned -->
  <line x1="650" y1="186" x2="650" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="246" width="300" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="520" y="274" font-size="14" font-weight="700" fill="#14532d">Option B</text>
  <text x="520" y="298" font-size="13" fill="#0f172a">Edit the image tag in the Raw</text>
  <text x="520" y="318" font-size="13" fill="#0f172a">editor → Save → Rebuild</text>
  <text x="520" y="340" font-size="12" fill="#475569">Rollback = revert the tag, Save, Rebuild</text>

  <line x1="650" y1="356" x2="650" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="416" width="300" height="72" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="520" y="444" font-size="13" font-weight="600" fill="#713f12">Optional hardening</text>
  <text x="520" y="466" font-size="13" fill="#0f172a">Digest pin critical services</text>
  <text x="520" y="484" font-size="12" fill="#475569">image: nginx@sha256:... for exact rollback</text>

  <!-- footer note -->
  <text x="440" y="544" text-anchor="middle" font-size="11" fill="#64748b">Rebuild = compose.redeploy (no source download). Deploy = full deploy (re-downloads source).</text>
</svg>
