<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="EmDash on Cloudflare Workers architecture: browser to edge cache to Worker with D1, R2, KV, Images, Email and cron bindings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">EmDash on Cloudflare Workers: bindings map</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#64748B">Workers compute + D1 (DB) + R2 (MEDIA) + KV (CACHE) + Images + Email Sending + cron</text>

  <!-- Browser -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="130" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  </g>
  <text x="165" y="168" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Browser</text>
  <text x="165" y="194" text-anchor="middle" font-size="13" fill="#64748B">readers + /_emdash/admin</text>

  <!-- Edge -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="130" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="445" y="163" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Cloudflare edge</text>
  <text x="445" y="187" text-anchor="middle" font-size="13" fill="#64748B">Workers Cache (routeRules)</text>
  <text x="445" y="207" text-anchor="middle" font-size="13" fill="#64748B">cache hits skip the Worker</text>

  <!-- Worker -->
  <g filter="url(#cardShadow)">
    <rect x="630" y="110" width="300" height="130" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
  </g>
  <text x="780" y="144" text-anchor="middle" font-size="19" font-weight="700" fill="#312E81">Worker (src/worker.ts)</text>
  <text x="780" y="172" text-anchor="middle" font-size="13" fill="#475569">Astro SSR + admin panel + REST API</text>
  <text x="780" y="194" text-anchor="middle" font-size="13" fill="#475569">createScheduledHandler() for cron</text>
  <text x="780" y="216" text-anchor="middle" font-size="13" fill="#475569">PluginBridge (sandboxed plugins, paid)</text>

  <line x1="260" y1="175" x2="330" y2="175" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="175" x2="630" y2="175" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cron trigger -->
  <g filter="url(#cardShadow)">
    <rect x="990" y="130" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <text x="1065" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Cron trigger</text>
  <text x="1065" y="189" text-anchor="middle" font-size="12" fill="#64748B">"* * * * *" default</text>
  <text x="1065" y="207" text-anchor="middle" font-size="12" fill="#64748B">publish + backups</text>
  <line x1="990" y1="175" x2="930" y2="175" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Binding cards -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="330" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="190" y="368" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A8A">D1 database</text>
  <text x="190" y="394" text-anchor="middle" font-size="13" fill="#475569">binding: DB</text>
  <text x="190" y="416" text-anchor="middle" font-size="13" fill="#475569">content, settings, JSON backups meta</text>
  <text x="190" y="436" text-anchor="middle" font-size="12" fill="#94A3B8">500 MB/DB on Free</text>

  <g filter="url(#cardShadow)">
    <rect x="350" y="330" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="470" y="368" text-anchor="middle" font-size="17" font-weight="600" fill="#064E3B">R2 bucket</text>
  <text x="470" y="394" text-anchor="middle" font-size="13" fill="#475569">binding: MEDIA</text>
  <text x="470" y="416" text-anchor="middle" font-size="13" fill="#475569">media + backups/ prefix</text>
  <text x="470" y="436" text-anchor="middle" font-size="12" fill="#94A3B8">10 GB free</text>

  <g filter="url(#cardShadow)">
    <rect x="630" y="330" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="750" y="368" text-anchor="middle" font-size="17" font-weight="600" fill="#78350F">KV namespace</text>
  <text x="750" y="394" text-anchor="middle" font-size="13" fill="#475569">binding: CACHE (optional)</text>
  <text x="750" y="416" text-anchor="middle" font-size="13" fill="#475569">object cache, cuts D1 reads</text>
  <text x="750" y="436" text-anchor="middle" font-size="12" fill="#94A3B8">1,000 writes/day on Free</text>

  <g filter="url(#cardShadow)">
    <rect x="910" y="330" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#BE185D" stroke-width="2"/>
  </g>
  <text x="1025" y="366" text-anchor="middle" font-size="17" font-weight="600" fill="#831843">Images + Email</text>
  <text x="1025" y="392" text-anchor="middle" font-size="13" fill="#475569">IMAGES binding (auto-added)</text>
  <text x="1025" y="414" text-anchor="middle" font-size="13" fill="#475569">send_email: EMAIL (magic links)</text>
  <text x="1025" y="436" text-anchor="middle" font-size="12" fill="#94A3B8">5,000 transforms/mo free</text>

  <!-- arrows down -->
  <line x1="700" y1="240" x2="220" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="240" x2="480" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="820" y1="240" x2="750" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="880" y1="240" x2="1010" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- footer note -->
  <rect x="70" y="500" width="1070" height="120" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="605" y="536" text-anchor="middle" font-size="15" font-weight="600" fill="#3730A3">Free tier path: strip the LOADER binding and sandboxRunner</text>
  <text x="605" y="564" text-anchor="middle" font-size="14" fill="#4338CA">DB + MEDIA + cron + Images is the full CMS at $0/month. LOADER (Dynamic Workers) is Workers Paid, $5/month.</text>
  <text x="605" y="592" text-anchor="middle" font-size="13" fill="#6366F1">Verify binding names in wrangler.jsonc match d1({ binding: "DB" }) and r2({ binding: "MEDIA" }) exactly.</text>
</svg>
