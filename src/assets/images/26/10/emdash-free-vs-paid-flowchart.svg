<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Free versus paid decision flowchart for EmDash on Cloudflare Workers: sandboxed plugins decide between Workers Free and Workers Paid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Free vs paid: one question decides it</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#64748B">Dynamic Workers (Worker Loader) is open beta on Workers Paid only. Everything else fits the Free plan.</text>

  <!-- question -->
  <polygon points="600,110 850,215 600,320 350,215" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" filter="url(#cardShadow)"/>
  <text x="600" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#78350F">Need sandboxed or</text>
  <text x="600" y="224" text-anchor="middle" font-size="18" font-weight="700" fill="#78350F">marketplace plugins?</text>

  <!-- NO branch -->
  <line x1="430" y1="285" x2="330" y2="380" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="352" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">no</text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="380" width="420" height="200" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="300" y="422" text-anchor="middle" font-size="21" font-weight="700" fill="#14532D">Workers Free: $0/month</text>
  <text x="300" y="456" text-anchor="middle" font-size="14.5" fill="#166534">Strip worker_loaders + sandboxRunner</text>
  <text x="300" y="482" text-anchor="middle" font-size="14.5" fill="#166534">Keep DB (D1), MEDIA (R2), cron, Images</text>
  <text x="300" y="508" text-anchor="middle" font-size="14.5" fill="#166534">Native config plugins still work in-process</text>
  <text x="300" y="542" text-anchor="middle" font-size="13" fill="#15803D">Limits: 100k req/day, 10 ms CPU, 500 MB/D1, 5k transforms/mo</text>

  <!-- YES branch -->
  <line x1="770" y1="285" x2="870" y2="380" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="848" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">yes</text>

  <g filter="url(#cardShadow)">
    <rect x="690" y="380" width="420" height="200" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="900" y="422" text-anchor="middle" font-size="21" font-weight="700" fill="#7F1D1D">Workers Paid: $5/month</text>
  <text x="900" y="456" text-anchor="middle" font-size="14.5" fill="#991B1B">Keep LOADER binding + sandboxRunner</text>
  <text x="900" y="482" text-anchor="middle" font-size="14.5" fill="#991B1B">Unlocks registry / marketplace installs</text>
  <text x="900" y="508" text-anchor="middle" font-size="14.5" fill="#991B1B">Also: 10 GB D1, 30-day Time Travel, 30 s CPU</text>
  <text x="900" y="542" text-anchor="middle" font-size="13" fill="#B91C1C">Sandboxed plugins are D1-only (plugin bridge)</text>

  <text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#64748B">Default for a solo content site: Free with the LOADER stripped. Move to Paid only when a plugin needs the sandbox.</text>
</svg>
