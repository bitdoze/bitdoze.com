<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Request path and caching flow for EmDash on Cloudflare Workers: cache hit versus cache miss, Worker, D1 round trips and Targeted Placement">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Request path: Workers Cache in front of the Worker</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#64748B">routeRules set maxAge / swr. A cache hit never invokes the Worker or touches D1.</text>

  <!-- request -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="150" width="180" height="90" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  </g>
  <text x="150" y="188" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">GET /blog/post</text>
  <text x="150" y="212" text-anchor="middle" font-size="13" fill="#64748B">reader or editor</text>

  <line x1="240" y1="195" x2="310" y2="195" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- decision -->
  <polygon points="420,130 560,195 420,260 280,195" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="420" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#78350F">Fresh in</text>
  <text x="420" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#78350F">Workers Cache?</text>

  <!-- yes path -->
  <g filter="url(#cardShadow)">
    <rect x="640" y="110" width="230" height="86" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="755" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#14532D">Yes: serve from edge</text>
  <text x="755" y="172" text-anchor="middle" font-size="12.5" fill="#166534">no Worker, no D1, no CPU time</text>
  <line x1="560" y1="175" x2="640" y2="155" stroke="#16A34A" stroke-width="2" marker-end="url(#arr)"/>
  <text x="585" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#15803D">yes</text>

  <!-- no path -->
  <line x1="420" y1="260" x2="420" y2="330" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="442" y="300" font-size="13" font-weight="600" fill="#B91C1C">no (miss, or route is no-store)</text>

  <!-- Worker -->
  <g filter="url(#cardShadow)">
    <rect x="280" y="330" width="280" height="100" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
  </g>
  <text x="420" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#312E81">Worker runs (SSR)</text>
  <text x="420" y="394" text-anchor="middle" font-size="13" fill="#475569">10 ms CPU limit on Free per call</text>
  <text x="420" y="414" text-anchor="middle" font-size="12" fill="#94A3B8">CPU excludes waiting on D1/KV I/O</text>

  <!-- KV -->
  <g filter="url(#cardShadow)">
    <rect x="640" y="330" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="740" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#78350F">KV object cache</text>
  <text x="740" y="392" text-anchor="middle" font-size="12.5" fill="#475569">hit: skip D1 query</text>
  <text x="740" y="412" text-anchor="middle" font-size="12" fill="#94A3B8">1,000 writes/day on Free</text>
  <line x1="560" y1="380" x2="640" y2="380" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- D1 -->
  <g filter="url(#cardShadow)">
    <rect x="910" y="330" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1025" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#1E3A8A">D1 round trips</text>
  <text x="1025" y="390" text-anchor="middle" font-size="12.5" fill="#475569">several per SSR request</text>
  <text x="1025" y="412" text-anchor="middle" font-size="12" fill="#94A3B8">50 queries/invocation on Free</text>
  <line x1="840" y1="380" x2="910" y2="380" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- placement -->
  <rect x="280" y="470" width="860" height="110" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="710" y="506" text-anchor="middle" font-size="15" font-weight="600" fill="#3730A3">Targeted Placement: pin the Worker near the D1 primary</text>
  <text x="710" y="534" text-anchor="middle" font-size="13.5" fill="#4338CA">Each D1 round trip pays the Worker-to-primary RTT. Placement removes that latency multiplier.</text>
  <text x="710" y="560" text-anchor="middle" font-size="12.5" fill="#6366F1">Verify with the cf-placement response header. Check response Cache-Control: explicit headers beat heuristic caching.</text>

  <!-- response loop -->
  <line x1="280" y1="400" x2="150" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="388" text-anchor="middle" font-size="12" fill="#64748B">response + Cache-Control</text>
</svg>
