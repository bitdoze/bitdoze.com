<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="oha benchmark results: Docker container serving ~200 requests per second with 100-238ms p50 latency, versus Workers at 349 req/s with 42ms p50; container CPU peaked at 2.2 cores for the app and 1.4 cores for Postgres, RAM 408 and 88 MiB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">oha load test: Docker origin vs Workers</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748B">livingandglow.com = app + Postgres containers on a VPS · emdashhq.com = Workers Paid + edge cache · homepage GET</text>

  <!-- Left panel: throughput -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="95" width="545" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="80" y="125" font-size="15" font-weight="700" fill="#0F172A">Requests / second (sustained, 20-25 s)</text>

  <text x="205" y="156" text-anchor="end" font-size="11" fill="#475569">emdashhq.com (Workers)</text>
  <rect x="210" y="140" width="322.5" height="24" rx="4" fill="#F97316"/>
  <text x="541" y="157" font-size="12" font-weight="700" fill="#9A3412">348.7</text>

  <text x="205" y="198" text-anchor="end" font-size="11" fill="#475569">container, direct c=50</text>
  <rect x="210" y="182" width="185.3" height="24" rx="4" fill="#2563EB"/>
  <text x="403" y="199" font-size="12" font-weight="700" fill="#1D4ED8">200.3</text>

  <text x="205" y="240" text-anchor="end" font-size="11" fill="#475569">container, direct c=20</text>
  <rect x="210" y="224" width="179.2" height="24" rx="4" fill="#2563EB"/>
  <text x="397" y="241" font-size="12" font-weight="700" fill="#1D4ED8">193.7</text>

  <text x="205" y="282" text-anchor="end" font-size="11" fill="#475569">livingandglow.com public</text>
  <rect x="210" y="266" width="135.7" height="24" rx="4" fill="#0EA5E9"/>
  <text x="354" y="283" font-size="12" font-weight="700" fill="#0369A1">146.7</text>

  <text x="80" y="330" font-size="11" fill="#94A3B8">0 errors across 14,824 requests · all HTTP 200</text>
  <text x="80" y="350" font-size="11" fill="#94A3B8">direct = Host header to the container, no CDN</text>

  <!-- Right panel: latency -->
  <g filter="url(#cardShadow)">
    <rect x="640" y="95" width="545" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="665" y="125" font-size="15" font-weight="700" fill="#0F172A">Latency, ms (p50 / p95)</text>
  <rect x="900" y="115" width="12" height="12" rx="2" fill="#2563EB"/>
  <text x="918" y="125" font-size="11" fill="#475569">p50</text>
  <rect x="950" y="115" width="12" height="12" rx="2" fill="#94A3B8"/>
  <text x="968" y="125" font-size="11" fill="#475569">p95</text>

  <text x="785" y="174" text-anchor="end" font-size="11" fill="#475569">emdashhq.com</text>
  <rect x="795" y="160" width="42" height="14" rx="3" fill="#2563EB"/>
  <text x="843" y="171" font-size="11" fill="#1D4ED8">42</text>
  <rect x="795" y="178" width="51" height="14" rx="3" fill="#94A3B8"/>
  <text x="852" y="189" font-size="11" fill="#475569">51</text>

  <text x="785" y="220" text-anchor="end" font-size="11" fill="#475569">livingandglow.com</text>
  <rect x="795" y="206" width="95" height="14" rx="3" fill="#2563EB"/>
  <text x="896" y="217" font-size="11" fill="#1D4ED8">95</text>
  <rect x="795" y="224" width="138" height="14" rx="3" fill="#94A3B8"/>
  <text x="939" y="235" font-size="11" fill="#475569">138</text>

  <text x="785" y="266" text-anchor="end" font-size="11" fill="#475569">container c=20</text>
  <rect x="795" y="252" width="100" height="14" rx="3" fill="#2563EB"/>
  <text x="901" y="263" font-size="11" fill="#1D4ED8">100</text>
  <rect x="795" y="270" width="134" height="14" rx="3" fill="#94A3B8"/>
  <text x="935" y="281" font-size="11" fill="#475569">134</text>

  <text x="785" y="312" text-anchor="end" font-size="11" fill="#475569">container c=50</text>
  <rect x="795" y="298" width="238" height="14" rx="3" fill="#2563EB"/>
  <text x="1039" y="309" font-size="11" fill="#1D4ED8">238</text>
  <rect x="795" y="316" width="315" height="14" rx="3" fill="#94A3B8"/>
  <text x="1116" y="327" font-size="11" fill="#475569">315</text>

  <text x="665" y="352" font-size="11" fill="#94A3B8">ms, lower is better · the Workers number is edge cache, not faster SSR</text>

  <!-- Container resource stat cards -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="395" width="255" height="115" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="182.5" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">App CPU peak</text>
  <text x="182.5" y="465" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">2.2 cores</text>
  <text x="182.5" y="490" text-anchor="middle" font-size="12" fill="#94A3B8">223% of one vCPU · docker stats</text>

  <g filter="url(#cardShadow)">
    <rect x="325" y="395" width="255" height="115" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  </g>
  <text x="452.5" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">App RAM under load</text>
  <text x="452.5" y="465" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">408 MiB</text>
  <text x="452.5" y="490" text-anchor="middle" font-size="12" fill="#94A3B8">105 MiB idle</text>

  <g filter="url(#cardShadow)">
    <rect x="595" y="395" width="255" height="115" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="722.5" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Postgres CPU peak</text>
  <text x="722.5" y="465" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">1.4 cores</text>
  <text x="722.5" y="490" text-anchor="middle" font-size="12" fill="#94A3B8">140% of one vCPU</text>

  <g filter="url(#cardShadow)">
    <rect x="865" y="395" width="255" height="115" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="992.5" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Postgres RAM</text>
  <text x="992.5" y="465" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">88 MiB</text>
  <text x="992.5" y="490" text-anchor="middle" font-size="12" fill="#94A3B8">34 MiB idle</text>

  <!-- Footer -->
  <rect x="55" y="535" width="1130" height="70" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="600" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#3730A3">The wall is Node, not Postgres: c=50 moved throughput 194 → 200 req/s while p50 tripled (100 → 238 ms)</text>
  <text x="600" y="590" text-anchor="middle" font-size="13" fill="#4338CA">Sizing: 2 vCPU + 1 GB is comfortable. A CDN cache rule for anonymous HTML multiplies the read ceiling.</text>
</svg>
