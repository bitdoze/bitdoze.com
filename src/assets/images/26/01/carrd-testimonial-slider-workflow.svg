<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <marker id="arrowSlate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1000" height="4" fill="#4F46E5"/>

  <text x="500" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#0F172A">How a Carrd testimonial slider goes from embed to live page</text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Paste code, publish, verify on the live URL. The builder never previews embeds.</text>

  <!-- Box 1: Builder -->
  <rect x="30" y="120" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="30" y="120" width="200" height="30" rx="10" fill="#4F46E5"/>
  <rect x="30" y="140" width="200" height="10" fill="#4F46E5"/>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. Builder</text>
  <text x="130" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Click + → Add Element</text>
  <text x="130" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Choose Embed</text>

  <!-- Box 2: Embed -->
  <rect x="280" y="120" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="280" y="120" width="200" height="30" rx="10" fill="#4F46E5"/>
  <rect x="280" y="140" width="200" height="10" fill="#4F46E5"/>
  <text x="380" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. Embed element</text>
  <text x="380" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Type: Code</text>
  <text x="380" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Style: Inline · paste HTML/CSS/JS</text>

  <!-- Box 3: Publish -->
  <rect x="530" y="120" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="530" y="120" width="200" height="30" rx="10" fill="#4F46E5"/>
  <rect x="530" y="140" width="200" height="10" fill="#4F46E5"/>
  <text x="630" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. Publish</text>
  <text x="630" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Publish Changes</text>
  <text x="630" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">No way around this step</text>

  <!-- Box 4: Live -->
  <rect x="780" y="120" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <rect x="780" y="120" width="190" height="30" rx="10" fill="#059669"/>
  <rect x="780" y="140" width="190" height="10" fill="#059669"/>
  <text x="875" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4. Live site</text>
  <text x="875" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Slider appears</text>
  <text x="875" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Hard-refresh to verify</text>

  <!-- Arrows between boxes -->
  <line x1="232" y1="170" x2="276" y2="170" stroke="#64748B" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="482" y1="170" x2="526" y2="170" stroke="#64748B" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="732" y1="170" x2="776" y2="170" stroke="#64748B" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Warning callout under the publish arrow (builder renders nothing) -->
  <line x1="504" y1="220" x2="504" y2="252" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <polygon points="504,228 496,244 512,244" fill="#D97706" transform="rotate(180 504 236)"/>
  <rect x="360" y="256" width="290" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="505" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309">The builder renders nothing. That is normal.</text>
  <text x="505" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309">Embed output only exists on the published page,</text>
  <text x="505" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309">so always verify against the live URL.</text>
</svg>
