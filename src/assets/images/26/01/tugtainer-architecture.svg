<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="apprGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="url(#bg)"/>
  <rect width="1000" height="660" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Tugtainer architecture</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">primary instance · socket proxy · remote agents · Apprise alerts</text>

  <!-- Browser -->
  <rect x="210" y="62" width="170" height="36" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="295" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Browser (admin)</text>
  <line x1="295" y1="98" x2="295" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="307" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">HTTPS</text>

  <!-- Primary host -->
  <rect x="180" y="130" width="420" height="430" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="200" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Primary host</text>

  <rect x="220" y="166" width="340" height="62" rx="10" fill="url(#tugGrad)"/>
  <text x="390" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">tugtainer</text>
  <text x="390" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C7D2FE">web UI :9412 · scheduler · API</text>

  <rect x="220" y="314" width="340" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="390" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">socket-proxy</text>
  <text x="390" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">least-privilege Docker API</text>

  <rect x="220" y="458" width="340" height="64" rx="10" fill="url(#engineGrad)"/>
  <text x="390" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Docker Engine</text>
  <text x="390" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A7F3D0">your containers</text>

  <line x1="390" y1="228" x2="390" y2="308" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="402" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">DOCKER_HOST tcp://socket-proxy:2375</text>
  <line x1="390" y1="370" x2="390" y2="452" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="402" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">docker.sock (read-only)</text>

  <!-- Remote host -->
  <rect x="640" y="130" width="330" height="430" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="660" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Remote host</text>

  <rect x="672" y="166" width="266" height="62" rx="10" fill="url(#agentGrad)"/>
  <text x="805" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">tugtainer-agent</text>
  <text x="805" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A5F3FC">agent API :9413</text>

  <rect x="672" y="314" width="266" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="805" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">socket-proxy</text>
  <text x="805" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">least-privilege Docker API</text>

  <rect x="672" y="458" width="266" height="64" rx="10" fill="url(#engineGrad)"/>
  <text x="805" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Docker Engine</text>
  <text x="805" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A7F3D0">remote containers</text>

  <line x1="805" y1="228" x2="805" y2="308" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="817" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">DOCKER_HOST tcp://socket-proxy:2375</text>
  <line x1="805" y1="370" x2="805" y2="452" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="817" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">docker.sock (ro)</text>

  <!-- Primary -> Agent -->
  <line x1="560" y1="197" x2="666" y2="197" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="613" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#4338CA">AGENT_SECRET</text>
  <text x="613" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">allow-listed IPs</text>

  <!-- Apprise fan-out -->
  <polyline points="220,215 140,215 140,616 194,616" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text transform="rotate(-90 126 420)" x="126" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7C3AED">notifications · Apprise</text>

  <rect x="200" y="594" width="150" height="44" rx="10" fill="url(#apprGrad)"/>
  <text x="275" y="613" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Apprise</text>
  <text x="275" y="630" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#DDD6FE">templated alerts</text>

  <line x1="352" y1="610" x2="376" y2="606" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="352" y1="614" x2="502" y2="614" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="352" y1="618" x2="638" y2="622" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="352" y1="622" x2="754" y2="630" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="380" y="594" width="112" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="436" y="614" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Discord</text>
  <rect x="506" y="596" width="122" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="567" y="616" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Telegram</text>
  <rect x="642" y="602" width="104" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="694" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Slack</text>
  <rect x="758" y="608" width="142" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="829" y="628" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">80+ services</text>
</svg>
