<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="880" height="600" fill="#ffffff"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">How Carrd resolves #hash links</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">Resolution order verified in published Carrd site JS, September 2026</text>

  <!-- start -->
  <rect x="240" y="80" width="320" height="48" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Visitor clicks a #hash link, e.g. #signup</text>

  <line x1="400" y1="128" x2="400" y2="156" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision 1 -->
  <rect x="160" y="160" width="480" height="62" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="400" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">1. Matches a Scroll Point? [data-scroll-id="signup"]</text>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="#64748b">checked first in the hashchange handler</text>

  <line x1="640" y1="191" x2="688" y2="191" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="664" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">yes</text>

  <!-- outcome 1 -->
  <rect x="692" y="160" width="176" height="62" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="780" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Smooth-scroll to</text>
  <text x="780" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">the Scroll Point</text>
  <text x="780" y="216" text-anchor="middle" font-size="10" fill="#15803d">native, free, animated</text>

  <line x1="400" y1="222" x2="400" y2="262" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="248" font-size="12" font-weight="600" fill="#0f172a">no</text>

  <!-- decision 2 -->
  <rect x="160" y="266" width="480" height="62" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="400" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">2. Matches a Section? #signup-section</text>
  <text x="400" y="314" text-anchor="middle" font-size="11" fill="#64748b">Carrd appends -section to the element id</text>

  <line x1="640" y1="297" x2="688" y2="297" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="664" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">yes</text>

  <!-- outcome 2 -->
  <rect x="692" y="266" width="176" height="62" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="780" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Switch section</text>
  <text x="780" y="309" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">with a fade</text>
  <text x="780" y="322" text-anchor="middle" font-size="10" fill="#15803d">show/hide, no scroll animation</text>

  <line x1="400" y1="328" x2="400" y2="368" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="354" font-size="12" font-weight="600" fill="#0f172a">no</text>

  <!-- outcome 3 -->
  <rect x="240" y="372" width="320" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="400" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">3. Nothing happens</text>

  <!-- note box -->
  <rect x="80" y="452" width="720" height="112" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="482" font-size="13" font-weight="700" fill="#92400e">Quirk: clicking a Section link while that section is already active</text>
  <text x="100" y="504" font-size="12" fill="#78350f">Carrd falls back to scrollTo(0, 0) - an instant jump to top, not a smooth scroll.</text>
  <text x="100" y="528" font-size="12" fill="#78350f">Clicking the same link twice rewrites the hash to re-fire the handler, so a custom</text>
  <text x="100" y="548" font-size="12" fill="#78350f">scroll script listening on hashchange can stack a second animation on top.</text>
</svg>
