<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="url(#bg)"/>
  <rect width="1000" height="760" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Tugtainer update flow</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">per host · dependency-aware · automatic rollback on failed healthchecks</text>

  <!-- Start -->
  <rect x="430" y="66" width="220" height="36" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="89" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Scheduled or manual run</text>
  <line x1="540" y1="102" x2="540" y2="122" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Check digest -->
  <rect x="350" y="126" width="380" height="44" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Compare image digest with registry</text>
  <line x1="540" y1="170" x2="540" y2="190" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Decision 1 -->
  <polygon points="540,194 650,240 540,286 430,240" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="540" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400E">New digest?</text>

  <!-- No branch -->
  <line x1="650" y1="240" x2="704" y2="240" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="670" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">no</text>
  <rect x="708" y="214" width="260" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="838" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">not_available</text>
  <text x="838" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">available(notified) after the first alert</text>

  <!-- Yes -->
  <line x1="540" y1="286" x2="540" y2="306" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="552" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">yes</text>

  <!-- Delay -->
  <rect x="350" y="310" width="380" height="48" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Delay buffer · DELAY_UPDATE_FOR</text>
  <text x="540" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#C7D2FE">waits until the new digest stops changing</text>
  <text x="330" y="338" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">manual updates ignore the delay</text>
  <line x1="540" y1="358" x2="540" y2="378" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Pull -->
  <rect x="350" y="382" width="380" height="44" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="409" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Pull the new image</text>
  <line x1="540" y1="426" x2="540" y2="446" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Stop -->
  <rect x="330" y="450" width="420" height="48" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="472" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Stop affected containers</text>
  <text x="540" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#C7D2FE">most dependent first, stopped once</text>
  <text x="770" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">affected = containers that depend</text>
  <text x="770" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">on an updated one</text>
  <line x1="540" y1="498" x2="540" y2="518" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Recreate -->
  <rect x="330" y="522" width="420" height="48" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="544" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Recreate and start</text>
  <text x="540" y="562" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#C7D2FE">reverse order, dependencies first</text>
  <line x1="540" y1="570" x2="540" y2="590" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Healthcheck wait -->
  <rect x="350" y="594" width="380" height="44" rx="10" fill="url(#stepGrad)"/>
  <text x="540" y="621" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Wait for the healthcheck</text>
  <line x1="540" y1="638" x2="540" y2="658" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Decision 2 -->
  <polygon points="540,662 646,706 540,750 434,706" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="540" y="711" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400E">Healthy?</text>

  <!-- Yes: notify updated -->
  <line x1="646" y1="706" x2="724" y2="706" stroke="#047857" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="678" y="696" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">yes</text>
  <rect x="728" y="680" width="240" height="52" rx="10" fill="url(#okGrad)"/>
  <text x="848" y="702" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Notify: updated</text>
  <text x="848" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A7F3D0">new image is live</text>

  <!-- No: rollback -->
  <line x1="434" y1="706" x2="356" y2="706" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="390" y="696" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C">no</text>
  <rect x="112" y="680" width="240" height="52" rx="10" fill="url(#badGrad)"/>
  <text x="232" y="702" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Roll back to previous image</text>
  <text x="232" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FECACA">notify: rolled_back</text>
</svg>
