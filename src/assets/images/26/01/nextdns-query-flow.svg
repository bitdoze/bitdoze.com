<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect width="1000" height="560" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">How NextDNS handles a DNS query</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">encrypted hop · blocklist and security checks · block or forward</text>

  <!-- Devices -->
  <rect x="40" y="210" width="180" height="150" rx="14" fill="#ffffff" fill-opacity="0.7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="130" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155">Your devices</text>
  <text x="130" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">phone · laptop</text>
  <text x="130" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">smart TV · IoT</text>
  <text x="130" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">anything that resolves DNS</text>

  <!-- Arrow devices -> NextDNS -->
  <line x1="220" y1="285" x2="298" y2="285" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="259" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">DoH / DoT</text>
  <text x="259" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">encrypted query</text>

  <!-- NextDNS container -->
  <rect x="300" y="110" width="380" height="350" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="320" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Cloud DNS protection</text>

  <rect x="320" y="150" width="340" height="58" rx="10" fill="url(#dnsGrad)"/>
  <text x="490" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">NextDNS resolver</text>
  <text x="490" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C7D2FE">dns.nextdns.io · your config ID</text>

  <rect x="320" y="228" width="340" height="48" rx="8" fill="#F8FAFC" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="490" y="257" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Blocklists: ads · trackers · malware</text>

  <rect x="320" y="288" width="340" height="48" rx="8" fill="#F8FAFC" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="490" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Threat intel feeds · Safe Browsing</text>

  <rect x="320" y="348" width="340" height="48" rx="8" fill="#F8FAFC" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="490" y="377" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Security checks: rebinding · IDN · DGA</text>

  <text x="490" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">allow → forward · block → empty answer</text>

  <!-- Arrow NextDNS -> Blocked -->
  <line x1="680" y1="235" x2="756" y2="188" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="742" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#DC2626">blocked</text>

  <!-- Blocked box -->
  <rect x="760" y="130" width="200" height="100" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="860" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C">Blocked</text>
  <text x="860" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7F1D1D">0.0.0.0 / NXDOMAIN</text>
  <text x="860" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">ad · tracker · malware</text>

  <!-- Arrow NextDNS -> Upstream -->
  <line x1="680" y1="385" x2="756" y2="418" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="742" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#059669">forwarded</text>

  <!-- Upstream box -->
  <rect x="760" y="355" width="200" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="860" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#047857">Upstream resolver</text>
  <text x="860" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46">real answer returned</text>
  <text x="860" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">allowed domains only</text>

  <!-- Footer note -->
  <text x="500" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Your ISP sees only the encrypted hop to NextDNS, not the sites you visit</text>
</svg>
