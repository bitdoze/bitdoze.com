<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ocTunnelTitle ocTunnelDesc">
  <title id="ocTunnelTitle">Access the OpenClaw Control UI through an SSH tunnel</title>
  <desc id="ocTunnelDesc">Your browser reaches the Control UI at http://127.0.0.1:18789 through an SSH tunnel to the VPS. The gateway listens on loopback only. Opening port 18789 to the internet is crossed out and must never be done. The cloud firewall should allow TCP 22 only.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="52" font-size="29" font-weight="800" fill="#0F172A">Reach the Control UI without opening ports</text>
    <text x="600" y="82" font-size="15" fill="#64748B">Gateway port 18789 stays on loopback. Everything goes through the SSH tunnel.</text>
  </g>

  <!-- your laptop -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="55" y="235" width="250" height="150" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="180" y="278" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">Your browser</text>
    <text x="180" y="310" font-size="13" fill="#64748B" text-anchor="middle">http://127.0.0.1:18789</text>
    <text x="180" y="336" font-size="12.5" fill="#64748B" text-anchor="middle">Control UI / dashboard</text>
    <text x="180" y="362" font-size="12" fill="#4338CA" text-anchor="middle">laptop or phone browser</text>
  </g>

  <!-- ssh tunnel -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="380" y="255" width="300" height="110" rx="26" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="530" y="298" font-size="16" font-weight="800" fill="#312E81" text-anchor="middle">SSH tunnel</text>
    <text x="530" y="328" font-size="12" fill="#64748B" text-anchor="middle">ssh -N -L 18789:127.0.0.1:18789</text>
    <text x="530" y="348" font-size="12" fill="#64748B" text-anchor="middle">root@YOUR_SERVER_IP</text>
  </g>

  <!-- VPS -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="760" y="150" width="385" height="330" rx="20" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="952" y="188" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">your VPS (cloud firewall: TCP 22 only)</text>

    <rect x="800" y="215" width="305" height="115" rx="16" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <text x="952" y="255" font-size="17" font-weight="800" fill="#14532D" text-anchor="middle">OpenClaw Gateway</text>
    <text x="952" y="285" font-size="13" fill="#64748B" text-anchor="middle">127.0.0.1:18789 (loopback only)</text>
    <text x="952" y="308" font-size="12" fill="#166534" text-anchor="middle">Control UI served here</text>

    <!-- crossed-out public exposure -->
    <rect x="800" y="365" width="305" height="85" rx="16" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="952" y="400" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">0.0.0.0:18789 public</text>
    <text x="952" y="428" font-size="12.5" fill="#B91C1C" text-anchor="middle">never do this</text>
    <line x1="825" y1="375" x2="1080" y2="440" stroke="#DC2626" stroke-width="4"/>
    <line x1="1080" y1="375" x2="825" y2="440" stroke="#DC2626" stroke-width="4"/>
  </g>

  <!-- arrows -->
  <g>
    <line x1="307" y1="310" x2="372" y2="310" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arw2)"/>
    <line x1="682" y1="310" x2="792" y2="290" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arw2)"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="340" y="292" fill="#4338CA">local</text>
    <text x="737" y="270" fill="#4338CA">encrypted</text>
    <text x="530" y="420" fill="#64748B">or use Tailscale instead of the tunnel</text>
  </g>
</svg>
