<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="url(#bg)"/>
  <rect width="1000" height="640" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Where your popup code lives</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Embed: Type Code · Style Hidden, Body End — modal renders in the browser top layer</text>

  <!-- Page DOM outline -->
  <rect x="80" y="80" width="480" height="500" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="100" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">Carrd page DOM</text>

  <!-- head -->
  <rect x="110" y="124" width="420" height="54" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="128" y="146" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#475569">&lt;head&gt;</text>
  <text x="128" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Hidden placement option (works, but parser moves markup to body)</text>

  <!-- body top -->
  <rect x="110" y="196" width="420" height="46" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="128" y="218" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#475569">body top</text>
  <text x="128" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Hidden placement option</text>

  <!-- carrd content -->
  <rect x="110" y="260" width="420" height="120" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="312" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Carrd sections &amp; content</text>
  <text x="320" y="334" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">text · images · buttons · forms</text>

  <!-- body end embed (highlighted) -->
  <rect x="110" y="404" width="420" height="86" rx="8" fill="url(#embedGrad)"/>
  <text x="128" y="430" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF">body end — Embed (Type: Code, Hidden)</text>
  <text x="128" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0E7FF">&lt;style&gt; + &lt;dialog&gt;/popover markup + &lt;script&gt;</text>
  <text x="128" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0E7FF">Deterministic order: markup before script, no parser tricks</text>

  <text x="110" y="524" font-family="ui-monospace, monospace" font-size="12" fill="#64748B">&lt;/body&gt;</text>
  <text x="110" y="546" font-family="ui-monospace, monospace" font-size="12" fill="#64748B">&lt;/html&gt;</text>

  <!-- Arrow to top layer -->
  <path d="M 540 447 C 620 447, 640 360, 700 340" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="640" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#047857">showModal() / popovertarget</text>

  <!-- Top layer panel -->
  <rect x="620" y="80" width="300" height="250" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="770" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">Browser top layer</text>

  <!-- dimmed page behind -->
  <rect x="650" y="126" width="240" height="120" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="770" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">page content (dimmed by backdrop)</text>
  <text x="770" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">z-index: 9999 not needed here</text>

  <!-- modal card -->
  <rect x="690" y="150" width="160" height="88" rx="10" fill="url(#modalGrad)"/>
  <text x="770" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">popup modal</text>
  <text x="770" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D1FAE5">above everything</text>

  <text x="770" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Escape · focus trap · scroll lock</text>
  <text x="770" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">come free with &lt;dialog&gt; / popover</text>

  <!-- Legend -->
  <rect x="620" y="360" width="300" height="180" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="640" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Why Body End?</text>
  <text x="640" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">1. Markup lands before the script that</text>
  <text x="656" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">queries it — no race conditions</text>
  <text x="640" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">2. No HTML parser force-move out of</text>
  <text x="656" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">&lt;head&gt; into &lt;body&gt;</text>
  <text x="640" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">3. Documented Carrd placement</text>
</svg>
