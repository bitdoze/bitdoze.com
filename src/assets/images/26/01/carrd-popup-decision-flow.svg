<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="nocodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>
  <rect width="1000" height="620" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Which popup path do you need?</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Start here before pasting any custom code into Carrd</text>

  <!-- Start -->
  <rect x="360" y="80" width="280" height="56" rx="28" fill="url(#codeGrad)"/>
  <text x="500" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Need a popup on Carrd?</text>

  <line x1="500" y1="136" x2="500" y2="170" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Decision 1 -->
  <polygon points="500,175 680,235 500,295 320,235" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="500" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Just need a signup</text>
  <text x="500" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">or confirmation moment?</text>

  <!-- Yes branch (left) -->
  <line x1="320" y1="235" x2="230" y2="235" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="268" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857">yes</text>

  <!-- No branch (down) -->
  <line x1="500" y1="295" x2="500" y2="345" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="520" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">no — need timed, click, or exit triggers</text>

  <!-- No-code box -->
  <rect x="60" y="185" width="200" height="170" rx="12" fill="url(#nocodeGrad)"/>
  <text x="160" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Skip custom code</text>
  <text x="80" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5">• Carrd Section overlay</text>
  <text x="80" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5">• Native Signup Form</text>
  <text x="96" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A7F3D0">(20 ESP integrations)</text>
  <text x="80" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5">• Third-party widget</text>
  <text x="96" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A7F3D0">(heavier JS, freemium)</text>

  <!-- Decision 2 / options -->
  <rect x="300" y="355" width="400" height="200" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="500" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">Use the copy-paste options in this guide</text>

  <rect x="330" y="405" width="340" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="348" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3730A3">Option 1 — Timed email capture (&lt;dialog&gt;)</text>

  <rect x="330" y="455" width="340" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="348" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3730A3">Option 2 — Click-triggered (Popover API)</text>

  <rect x="330" y="505" width="340" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="348" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3730A3">Option 3 — Exit intent (+ mobile scroll)</text>

  <!-- Side note -->
  <rect x="750" y="355" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="770" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Before you paste</text>
  <text x="770" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Pro Standard $19/yr+</text>
  <text x="770" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• One option per page</text>
  <text x="770" y="471" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Rename IDs if combining</text>
  <text x="770" y="499" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Test the published URL</text>
  <text x="770" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Cap: once per session</text>
</svg>
