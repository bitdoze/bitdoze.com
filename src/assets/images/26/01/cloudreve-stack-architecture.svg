<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="crGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="btGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>
  <rect width="1000" height="620" fill="url(#grid)"/>

  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Cloudreve stack behind Cloudflare Tunnel</text>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">web traffic via tunnel · BitTorrent on 6888 opens directly · data in named volumes</text>

  <!-- Browser -->
  <rect x="60" y="90" width="160" height="40" rx="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="140" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Browser / WebDAV</text>
  <line x1="140" y1="130" x2="140" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="152" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">HTTPS</text>

  <!-- Cloudflare edge -->
  <rect x="40" y="180" width="200" height="80" rx="12" fill="url(#cfGrad)"/>
  <text x="140" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Cloudflare edge</text>
  <text x="140" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FDE68A">100 MB per request (free)</text>

  <!-- Tunnel -->
  <line x1="140" y1="260" x2="140" y2="310" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="152" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">cloudflared (outbound)</text>

  <!-- cloudflared box -->
  <rect x="40" y="310" width="200" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="140" y="334" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">cloudflared</text>
  <text x="140" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">tunnel container</text>

  <!-- Host box -->
  <rect x="320" y="80" width="420" height="470" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="340" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Docker host (VPS or home server)</text>

  <!-- cloudreve -->
  <rect x="360" y="130" width="340" height="70" rx="10" fill="url(#crGrad)"/>
  <text x="530" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">cloudreve-backend</text>
  <text x="530" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C7D2FE">:5212 web · Aria2 RPC on loopback:6800</text>

  <!-- arrow tunnel to cloudreve -->
  <line x1="240" y1="338" x2="360" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="250" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">http://cloudreve-backend:5212</text>

  <!-- postgres -->
  <rect x="360" y="280" width="160" height="64" rx="10" fill="url(#dbGrad)"/>
  <text x="440" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">postgresql</text>
  <text x="440" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A7F3D0">:5432 · database_postgres</text>

  <!-- redis -->
  <rect x="540" y="280" width="160" height="64" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">redis</text>
  <text x="620" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">:6379 · redis_data</text>

  <line x1="460" y1="200" x2="440" y2="274" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="600" y1="200" x2="620" y2="274" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- backend volume -->
  <rect x="360" y="400" width="340" height="60" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="530" y="424" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3730A3">backend_data volume</text>
  <text x="530" y="444" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6366F1">/cloudreve/data — conf.ini, uploads, thumbs, temp</text>
  <line x1="530" y1="200" x2="530" y2="394" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- BT path -->
  <rect x="800" y="310" width="160" height="56" rx="10" fill="url(#btGrad)"/>
  <text x="880" y="334" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">BitTorrent peers</text>
  <text x="880" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FECACA">port 6888 tcp/udp</text>

  <line x1="760" y1="180" x2="820" y2="310" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="770" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#DC2626">opened on host firewall</text>
  <text x="770" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#DC2626">(not through the tunnel)</text>

  <!-- caption -->
  <text x="500" y="585" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Web and WebDAV traffic stays inside the tunnel. Only Aria2 torrent traffic needs an open port.</text>
</svg>
