<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="500" fill="#ffffff"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">scroll-padding-top with a sticky header</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">Reserve space so anchored content is not hidden behind the fixed header</text>

  <!-- viewport -->
  <rect x="170" y="80" width="540" height="370" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>

  <!-- sticky header -->
  <rect x="172" y="82" width="536" height="78" fill="#4f46e5"/>
  <text x="440" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">sticky header</text>
  <text x="440" y="140" text-anchor="middle" font-size="12" fill="#c7d2fe">position: fixed - floats over the page (80px tall here)</text>

  <!-- reserved gap -->
  <rect x="172" y="160" width="536" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">scroll-padding-top: 80px</text>
  <text x="440" y="217" text-anchor="middle" font-size="12" fill="#78350f">reserved gap - the scroll stops here instead of under the header</text>

  <!-- target section -->
  <rect x="172" y="240" width="536" height="208" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="440" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">target section (Scroll Point or fragment target)</text>
  <text x="440" y="315" text-anchor="middle" font-size="12" fill="#475569">Section heading lands right below the header,</text>
  <text x="440" y="335" text-anchor="middle" font-size="12" fill="#475569">so the content visitors came for stays visible.</text>

  <!-- dimension line -->
  <line x1="130" y1="82" x2="130" y2="160" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="122" y1="82" x2="138" y2="82" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="122" y1="160" x2="138" y2="160" stroke="#0f172a" stroke-width="1.5"/>
  <text x="112" y="126" text-anchor="end" font-size="12" fill="#0f172a">80px</text>

  <!-- caption -->
  <text x="440" y="478" text-anchor="middle" font-size="11" fill="#64748b">scroll-padding-top applies to fragment navigation and scrollIntoView. Programmatic scrollTo with explicit coordinates needs its own offset.</text>
</svg>
