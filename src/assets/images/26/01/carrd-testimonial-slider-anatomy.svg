<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <marker id="arrowIndigoA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
    <marker id="arrowAmberA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1000" height="4" fill="#4F46E5"/>

  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Anatomy of the copy-paste testimonial slider</text>
  <text x="500" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Where to add slides and dots (Option 1: clean minimal slider)</text>

  <!-- Wrapper -->
  <rect x="30" y="90" width="560" height="350" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="30" y="90" width="560" height="34" rx="12" fill="#4F46E5"/>
  <rect x="30" y="112" width="560" height="12" fill="#4F46E5"/>
  <text x="50" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#FFFFFF">.testimonial-slider  (wrapper)</text>

  <!-- Container -->
  <rect x="55" y="145" width="510" height="160" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="72" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#3730A3">.testimonial-container</text>

  <!-- Track -->
  <rect x="80" y="182" width="460" height="108" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="96" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#3730A3">.testimonial-track</text>

  <!-- Slides -->
  <rect x="96" y="214" width="132" height="62" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="162" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">.testimonial-slide</text>
  <text x="162" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">slide 1</text>

  <rect x="244" y="214" width="132" height="62" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">.testimonial-slide</text>
  <text x="310" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">slide 2</text>

  <rect x="392" y="214" width="132" height="62" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="458" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#92400E">.testimonial-slide</text>
  <text x="458" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B45309">slide N</text>

  <!-- Dots -->
  <rect x="55" y="330" width="510" height="88" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="72" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#3730A3">.testimonial-dots</text>

  <circle cx="240" cy="386" r="10" fill="#4F46E5"/>
  <circle cx="280" cy="386" r="10" fill="#C7D2FE" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="320" cy="386" r="10" fill="#C7D2FE" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="366" cy="386" r="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="240" y="412" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B">.testimonial-dot × one per slide</text>

  <!-- Callout: add slide -->
  <line x1="526" y1="245" x2="620" y2="245" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmberA)"/>
  <rect x="630" y="196" width="340" height="98" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="650" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B45309">Add one slide div here</text>
  <text x="650" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400E">Copy a whole</text>
  <text x="650" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#92400E">&lt;div class="testimonial-slide"&gt;</text>
  <text x="650" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400E">block and paste it after the last slide.</text>

  <!-- Callout: add matching dot -->
  <line x1="568" y1="386" x2="620" y2="386" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmberA)"/>
  <rect x="630" y="338" width="340" height="98" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="650" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B45309">Add one matching dot here</text>
  <text x="650" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400E">One button per slide (Option 1 only), or</text>
  <text x="650" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400E">the new slide has no dot and cannot be</text>
  <text x="650" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400E">reached by clicking.</text>
</svg>
