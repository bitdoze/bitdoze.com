<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ocArchTitle ocArchDesc">
  <title id="ocArchTitle">OpenClaw architecture: chat apps to gateway to LLM to tools</title>
  <desc id="ocArchDesc">Messages flow from Telegram, WhatsApp, Slack or Discord into the OpenClaw Gateway running on your VPS or Mac Mini. The gateway calls an LLM provider (Anthropic, OpenAI, Gemini or a local model) and runs tools and skills on your server. Only the model calls leave your machine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arwGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="52" font-size="29" font-weight="800" fill="#0F172A">How OpenClaw is wired</text>
    <text x="600" y="82" font-size="15" fill="#64748B">Messages come in from your chat app. Only the model calls leave your machine.</text>
  </g>

  <!-- your-server boundary -->
  <rect x="408" y="128" width="384" height="472" rx="22" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="158" font-size="13" font-weight="700" fill="#4338CA">your VPS or Mac Mini</text>
  </g>

  <!-- left: chat apps -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="55" y="230" width="255" height="140" rx="18" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="182" y="272" font-size="18" font-weight="800" fill="#BE185D" text-anchor="middle">Chat apps</text>
    <text x="182" y="302" font-size="13.5" fill="#64748B" text-anchor="middle">Telegram · WhatsApp</text>
    <text x="182" y="324" font-size="13.5" fill="#64748B" text-anchor="middle">Slack · Discord</text>
    <text x="182" y="350" font-size="12" fill="#9D174D" text-anchor="middle">you, from your phone</text>
  </g>

  <!-- center: gateway -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="455" y="200" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <rect x="455" y="200" width="290" height="6" rx="3" fill="url(#accent)"/>
    <text x="600" y="248" font-size="19" font-weight="800" fill="#312E81" text-anchor="middle">OpenClaw Gateway</text>
    <text x="600" y="278" font-size="13.5" fill="#64748B" text-anchor="middle">runs 24/7 as a background service</text>
    <text x="600" y="302" font-size="13.5" fill="#64748B" text-anchor="middle">memory · pairing · automations</text>
    <text x="600" y="330" font-size="12" fill="#4338CA" text-anchor="middle">~/.openclaw/openclaw.json</text>
  </g>

  <!-- right: LLM -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="890" y="230" width="255" height="140" rx="18" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="1017" y="272" font-size="18" font-weight="800" fill="#0E7490" text-anchor="middle">LLM provider</text>
    <text x="1017" y="302" font-size="13.5" fill="#64748B" text-anchor="middle">Anthropic · OpenAI</text>
    <text x="1017" y="324" font-size="13.5" fill="#64748B" text-anchor="middle">Gemini · local (Ollama)</text>
    <text x="1017" y="350" font-size="12" fill="#0E7490" text-anchor="middle">the only call that leaves</text>
  </g>

  <!-- bottom: tools -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="455" y="455" width="290" height="115" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="600" y="497" font-size="17" font-weight="800" fill="#312E81" text-anchor="middle">Tools &amp; Skills</text>
    <text x="600" y="525" font-size="13" fill="#64748B" text-anchor="middle">files · scripts · web search</text>
    <text x="600" y="547" font-size="13" fill="#64748B" text-anchor="middle">calendar · ClawHub skills</text>
  </g>

  <!-- arrows -->
  <g>
    <line x1="312" y1="300" x2="447" y2="285" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arw)"/>
    <line x1="753" y1="285" x2="882" y2="300" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arw)"/>
    <line x1="600" y1="352" x2="600" y2="447" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arw)"/>
    <path d="M882 320 Q 760 340 753 310" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    <text x="360" y="230" fill="#4338CA">messages in</text>
    <text x="820" y="230" fill="#4338CA">model calls</text>
    <text x="615" y="405" fill="#4338CA">runs on your box</text>
    <text x="800" y="360" fill="#64748B">response comes back</text>
  </g>
</svg>
