<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="Old manual web-search.ts patch flow versus new official DuckDuckGo plugin install flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="840" height="440" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">DuckDuckGo search in OpenClaw: old way vs new way</text>

  <text x="215" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Feb 2026: manual patch</text>
  <rect x="55" y="100" width="320" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="215" y="133" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d">Edit web-search.ts by hand</text>
  <line x1="215" y1="156" x2="215" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="186" width="320" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="215" y="219" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d">Add parser and curl call</text>
  <line x1="215" y1="242" x2="215" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="272" width="320" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="215" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d">npm run build, restart gateway</text>
  <line x1="215" y1="328" x2="215" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="358" width="320" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="215" y="391" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f1d1d">Maintain it on every upgrade</text>

  <text x="625" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Now: official plugin</text>
  <rect x="465" y="100" width="320" height="68" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="625" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#064e3b">openclaw plugins install</text>
  <text x="625" y="150" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#064e3b">@openclaw/duckduckgo-plugin</text>
  <line x1="625" y1="168" x2="625" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="465" y="198" width="320" height="56" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="625" y="231" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#064e3b">openclaw configure --section web</text>
  <line x1="625" y1="254" x2="625" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="465" y="284" width="320" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="625" y="311" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#064e3b">Done: parsing, caching and</text>
  <text x="625" y="331" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#064e3b">error handling included</text>
</svg>
