<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="340" fill="#0f172a" rx="12"/>
  <text x="360" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">OpenClaw two-stage failover chain</text>

  <!-- Request -->
  <rect x="20" y="130" width="100" height="50" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="160" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Request</text>

  <!-- Arrow to primary -->
  <line x1="120" y1="155" x2="168" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Primary model -->
  <rect x="170" y="125" width="130" height="60" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="235" y="150" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">Primary model</text>
  <text x="235" y="170" text-anchor="middle" fill="#dbeafe" font-size="11">zai/glm-5.3</text>

  <!-- OK? branch -->
  <line x1="300" y1="155" x2="348" y2="155" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="324" y="145" text-anchor="middle" fill="#34d399" font-size="10">OK?</text>

  <!-- Success -->
  <rect x="350" y="130" width="90" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="160" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Done</text>

  <!-- Fail arrow down to stage 1 -->
  <line x1="235" y1="185" x2="235" y2="225" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrY)"/>
  <text x="255" y="210" fill="#f59e0b" font-size="10">fail</text>

  <!-- Stage 1: Auth rotation -->
  <rect x="140" y="228" width="190" height="50" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="235" y="250" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Stage 1: Auth-profile rotation</text>
  <text x="235" y="268" text-anchor="middle" fill="#fde68a" font-size="10">try alternate API keys</text>

  <!-- OK? from stage 1 -->
  <line x1="330" y1="253" x2="380" y2="253" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="355" y="243" text-anchor="middle" fill="#34d399" font-size="10">OK?</text>
  <line x1="380" y1="253" x2="395" y2="180" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Fail arrow to stage 2 -->
  <line x1="235" y1="278" x2="235" y2="305" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="255" y="297" fill="#f87171" font-size="10">fail</text>

  <!-- Stage 2: Fallbacks chain -->
  <rect x="100" y="305" width="270" height="0" rx="0" fill="none"/>
  <!-- Actually let me redo the layout - bottom row -->
  <!-- Stage 2 -->
  <rect x="460" y="125" width="150" height="60" rx="8" fill="#3b1f4e" stroke="#c084fc" stroke-width="1.5"/>
  <text x="535" y="150" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="600">Stage 2: Fallbacks</text>
  <text x="535" y="170" text-anchor="middle" fill="#e9d5ff" font-size="10">minimax/MiniMax-M3...</text>

  <!-- Arrow from auth fail to fallbacks -->
  <polyline points="235,278 235,310 535,310 535,185" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrP)"/>

  <!-- OK? from fallbacks -->
  <line x1="610" y1="155" x2="650" y2="155" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="630" y="145" text-anchor="middle" fill="#34d399" font-size="10">OK?</text>
  <rect x="652" y="130" width="56" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="160" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Done</text>

  <!-- Same-model recovery note -->
  <rect x="420" y="240" width="280" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="560" y="262" text-anchor="middle" fill="#cbd5e1" font-size="11">Bounded same-model recovery:</text>
  <text x="560" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">preserves partial work before failing over</text>

  <!-- Dashed line from fallbacks to recovery -->
  <line x1="535" y1="185" x2="535" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- TPM gate note -->
  <rect x="20" y="240" width="280" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="160" y="262" text-anchor="middle" fill="#cbd5e1" font-size="11">Per-model TPM admission gates</text>
  <text x="160" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">interactive traffic prioritized over background</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34d399"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f87171"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c084fc"/>
    </marker>
  </defs>
</svg>
