<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="380" fill="#0f172a" rx="12"/>
  <text x="360" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Which OpenClaw model, when</text>

  <!-- Decision node -->
  <rect x="250" y="55" width="220" height="44" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">What kind of work?</text>

  <!-- Arrows from decision -->
  <line x1="300" y1="99" x2="150" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="99" x2="360" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="99" x2="570" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="205" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">chat / utility</text>
  <text x="360" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">hard coding / research</text>
  <text x="515" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">rare marathon job</text>

  <!-- Budget tier -->
  <rect x="30" y="155" width="240" height="100" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Budget / utility tier</text>
  <text x="150" y="202" text-anchor="middle" fill="#d1fae5" font-size="12">GLM-5.3-Flash</text>
  <text x="150" y="220" text-anchor="middle" fill="#d1fae5" font-size="12">MiniMax M3.1 Flash</text>
  <text x="150" y="242" text-anchor="middle" fill="#6ee7b7" font-size="11">$0.15/M in, 1M ctx</text>

  <!-- Primary tier -->
  <rect x="240" y="155" width="240" height="100" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="360" y="180" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">Primary hard-path tier</text>
  <text x="360" y="202" text-anchor="middle" fill="#dbeafe" font-size="12">GLM-5.3</text>
  <text x="360" y="222" text-anchor="middle" fill="#93c5fd" font-size="11">$1.40/M in, $4.40/M out</text>
  <text x="360" y="242" text-anchor="middle" fill="#60a5fa" font-size="11">1M ctx, reasoning always on</text>

  <!-- Peak tier -->
  <rect x="450" y="155" width="240" height="100" rx="8" fill="#3b1f4e" stroke="#c084fc" stroke-width="1.5"/>
  <text x="570" y="180" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="700">Peak / per-agent tier</text>
  <text x="570" y="202" text-anchor="middle" fill="#e9d5ff" font-size="12">Kimi K3.1 Pro</text>
  <text x="570" y="222" text-anchor="middle" fill="#d8b4fe" font-size="11">~$2/M in, ~$10/M out</text>
  <text x="570" y="242" text-anchor="middle" fill="#c084fc" font-size="11">verify pricing on Kimi docs</text>

  <!-- Bottom note -->
  <rect x="80" y="290" width="560" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="360" y="312" text-anchor="middle" fill="#cbd5e1" font-size="12">Default: GLM-5.3 primary + MiniMax M3.1-Flash in fallbacks + utilityModel.</text>
  <text x="360" y="330" text-anchor="middle" fill="#94a3b8" font-size="11">Pin Kimi K3.1 Pro to specific agents only. Route utility noise at a Flash model.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>
</svg>
