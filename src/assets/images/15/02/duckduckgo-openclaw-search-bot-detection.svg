<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-label="DuckDuckGo HTML endpoint behavior: a VPS datacenter IP receives a bot-challenge page while a residential IP receives organic results">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="840" height="340" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">DuckDuckGo HTML endpoint: same request, different answers</text>

  <text x="140" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">VPS / datacenter IP</text>
  <rect x="40" y="102" width="200" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="140" y="136" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">GET /html/?q=...</text>
  <line x1="240" y1="131" x2="308" y2="131" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="315" y="102" width="210" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="420" y="127" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">html.duckduckgo.com</text>
  <text x="420" y="147" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">/html/</text>
  <line x1="525" y1="131" x2="583" y2="131" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="590" y="102" width="210" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="695" y="127" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">HTTP 202 challenge</text>
  <text x="695" y="147" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b">0 results, CAPTCHA form</text>

  <text x="140" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Home / residential IP</text>
  <rect x="40" y="232" width="200" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="140" y="266" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">GET /html/?q=...</text>
  <line x1="240" y1="261" x2="308" y2="261" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="315" y="232" width="210" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="420" y="257" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">html.duckduckgo.com</text>
  <text x="420" y="277" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#334155">/html/</text>
  <line x1="525" y1="261" x2="583" y2="261" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="590" y="232" width="210" height="58" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="695" y="257" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Organic results</text>
  <text x="695" y="277" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#065f46">titles, URLs, snippets</text>
</svg>
