<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="cpxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>

  <text x="600" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0F172A">
    Cumulative 2026 price damage: <tspan fill="#DC2626">launch (Oct 2025) to June 15, 2026</tspan>
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569">
    EU list prices, excl. VAT and IPv4. Cost-optimized (CX/CAX) rose 70-84%. Regular and Dedicated (CPX/CCX) rose 178-259%.
  </text>

  <!-- axis ticks -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    <text x="300" y="98" text-anchor="middle">0%</text>
    <text x="450" y="98" text-anchor="middle">50%</text>
    <text x="600" y="98" text-anchor="middle">100%</text>
    <text x="750" y="98" text-anchor="middle">150%</text>
    <text x="900" y="98" text-anchor="middle">200%</text>
    <text x="1050" y="98" text-anchor="middle">250%</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 5">
    <line x1="300" y1="104" x2="300" y2="530"/>
    <line x1="450" y1="104" x2="450" y2="530"/>
    <line x1="600" y1="104" x2="600" y2="530"/>
    <line x1="750" y1="104" x2="750" y2="530"/>
    <line x1="900" y1="104" x2="900" y2="530"/>
    <line x1="1050" y1="104" x2="1050" y2="530"/>
  </g>

  <!-- row labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#0F172A">
    <text x="56" y="134">CX23</text>
    <text x="56" y="188">CX33</text>
    <text x="56" y="242">CAX11</text>
    <text x="56" y="296">CAX21</text>
    <text x="56" y="350">CPX22</text>
    <text x="56" y="404">CPX42</text>
    <text x="56" y="458">CCX13</text>
    <text x="56" y="512">CCX53</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">
    <text x="130" y="134">2/4GB/40GB</text>
    <text x="130" y="188">4/8GB/80GB</text>
    <text x="130" y="242">2/4GB/40GB</text>
    <text x="130" y="296">4/8GB/80GB</text>
    <text x="130" y="350">2/4GB/80GB</text>
    <text x="130" y="404">8/16GB/320GB</text>
    <text x="130" y="458">2/8GB/80GB</text>
    <text x="130" y="512">32/128GB/600GB</text>
  </g>

  <!-- bars: cost-optimized -->
  <g filter="url(#shadow)">
    <rect x="300" y="112" width="252" height="34" rx="8" fill="url(#cxGrad)"/>
    <rect x="300" y="166" width="210" height="34" rx="8" fill="url(#cxGrad)"/>
    <rect x="300" y="220" width="246" height="34" rx="8" fill="url(#cxGrad)"/>
    <rect x="300" y="274" width="225" height="34" rx="8" fill="url(#cxGrad)"/>
    <!-- bars: regular / dedicated -->
    <rect x="300" y="328" width="675" height="34" rx="8" fill="url(#cpxGrad)"/>
    <rect x="300" y="382" width="771" height="34" rx="8" fill="url(#cpxGrad)"/>
    <rect x="300" y="436" width="777" height="34" rx="8" fill="url(#cpxGrad)"/>
    <rect x="300" y="490" width="534" height="34" rx="8" fill="url(#cpxGrad)"/>
  </g>

  <!-- value labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">
    <text x="564" y="135">+84%</text>
    <text x="522" y="189">+70%</text>
    <text x="558" y="243">+82%</text>
    <text x="537" y="297">+75%</text>
    <text x="987" y="351">+225%</text>
    <text x="1083" y="405">+257%</text>
    <text x="1089" y="459">+259%</text>
    <text x="846" y="513">+178%</text>
  </g>

  <!-- separator -->
  <line x1="56" y1="312" x2="1144" y2="312" stroke="#CBD5E1" stroke-width="1"/>

  <!-- legend -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">
    <rect x="56" y="552" width="16" height="16" rx="4" fill="url(#cxGrad)"/>
    <text x="80" y="565">Cost-Optimized (CX / CAX) — EU only, currently unorderable</text>
    <rect x="520" y="552" width="16" height="16" rx="4" fill="url(#cpxGrad)"/>
    <text x="544" y="565">Regular / Dedicated (CPX / CCX) — orderable at the new prices</text>
  </g>

  <text x="600" y="602" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    Source: Hetzner price-adjustment documentation GE-D9256 (June 15, 2026) and the October 16, 2025 launch announcement.
  </text>
</svg>
