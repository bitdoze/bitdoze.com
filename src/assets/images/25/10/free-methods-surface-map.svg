<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
    Which free surface for <tspan fill="#4F46E5">which job</tspan>
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Pick by workflow first, then stack the other free tiers around it</text>

  <!-- Card 1: Terminal -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <rect width="208" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="208" height="44" rx="16" fill="url(#termGrad)"/>
    <rect y="22" width="208" height="22" fill="url(#termGrad)"/>
    <text x="104" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Terminal</text>
    <rect x="24" y="68" width="160" height="72" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
    <text x="104" y="100" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#0891B2">$ droid</text>
    <text x="104" y="122" text-anchor="middle" font-family="monospace" font-size="11" fill="#0E7490">/limits</text>
    <text x="104" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Droid CLI</text>
    <text x="104" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Free trial credits</text>
    <text x="104" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">+ Droid Core fallback</text>
    <text x="104" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Agents on your machine</text>
    <text x="104" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">or a VPS</text>
  </g>

  <!-- Card 2: IDE -->
  <g transform="translate(268, 120)" filter="url(#shadow)">
    <rect width="208" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="208" height="44" rx="16" fill="url(#ideGrad)"/>
    <rect y="22" width="208" height="22" fill="url(#ideGrad)"/>
    <text x="104" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">IDE</text>
    <rect x="24" y="68" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="36" y="82" width="70" height="8" rx="4" fill="#059669"/>
    <rect x="36" y="98" width="120" height="8" rx="4" fill="#A7F3D0"/>
    <rect x="36" y="114" width="90" height="8" rx="4" fill="#A7F3D0"/>
    <text x="104" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Devin Desktop</text>
    <text x="104" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">$0 plan (ex-Windsurf)</text>
    <text x="104" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Unlimited Tab + inline</text>
    <text x="104" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Full-stack projects</text>
    <text x="104" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">multi-file refactors</text>
  </g>

  <!-- Card 3: Agentic -->
  <g transform="translate(496, 120)" filter="url(#shadow)">
    <rect width="208" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="208" height="44" rx="16" fill="url(#agentGrad)"/>
    <rect y="22" width="208" height="22" fill="url(#agentGrad)"/>
    <text x="104" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Agentic + browser</text>
    <rect x="24" y="68" width="160" height="72" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <rect x="38" y="82" width="132" height="12" rx="3" fill="#FECACA"/>
    <rect x="38" y="100" width="90" height="8" rx="3" fill="#FCA5A5"/>
    <rect x="38" y="114" width="110" height="8" rx="3" fill="#FECACA"/>
    <text x="104" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Antigravity</text>
    <text x="104" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">$0 Individuals plan</text>
    <text x="104" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Weekly quota</text>
    <text x="104" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Agents that verify work</text>
    <text x="104" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">in a real browser</text>
  </g>

  <!-- Card 4: GitHub -->
  <g transform="translate(724, 120)" filter="url(#shadow)">
    <rect width="208" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="208" height="44" rx="16" fill="url(#gitGrad)"/>
    <rect y="22" width="208" height="22" fill="url(#gitGrad)"/>
    <text x="104" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">GitHub workflow</text>
    <rect x="24" y="68" width="160" height="72" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <circle cx="60" cy="104" r="14" fill="#4F46E5"/>
    <line x1="74" y1="104" x2="148" y2="104" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="148" cy="104" r="8" fill="#A5B4FC"/>
    <text x="104" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">GitHub Copilot</text>
    <text x="104" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Free tier on AI Credits</text>
    <text x="104" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">2,000 completions/mo</text>
    <text x="104" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Issues to PRs, CLI,</text>
    <text x="104" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">multi-IDE support</text>
  </g>

  <!-- Card 5: Raw API -->
  <g transform="translate(952, 120)" filter="url(#shadow)">
    <rect width="208" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="208" height="44" rx="16" fill="url(#apiGrad)"/>
    <rect y="22" width="208" height="22" fill="url(#apiGrad)"/>
    <text x="104" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Raw API</text>
    <rect x="24" y="68" width="160" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="104" y="98" text-anchor="middle" font-family="monospace" font-size="11" fill="#7C3AED">POST /v1/chat</text>
    <text x="104" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#A78BFA">key quota: $10</text>
    <text x="104" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">AgentRouter</text>
    <text x="104" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Experimental credits</text>
    <text x="104" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Sandbox only</text>
    <text x="104" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Experiments, smoke tests,</text>
    <text x="104" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">never production</text>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A">
    Stack them: one for each surface. Trust runs left to right, except the last card.
  </text>
  <text x="600" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">
    AgentRouter is experiment-only until you can audit it. The other four are official vendor free tiers.
  </text>
</svg>
