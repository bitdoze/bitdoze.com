<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="startGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="yesGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="600" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0F172A">
    CX23 order decision tree: <tspan fill="#4F46E5">what to do when the plan is out of stock</tspan>
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569">
    Availability fluctuates. A price in the API is not an offer. Only an enabled Create button in the Console is.
  </text>

  <!-- start -->
  <g filter="url(#shadow)">
    <rect x="360" y="96" width="480" height="56" rx="12" fill="url(#startGrad)"/>
  </g>
  <text x="600" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
    I need a 2 vCPU / 4 GB VPS in the EU
  </text>

  <line x1="600" y1="152" x2="600" y2="188" stroke="#64748B" stroke-width="2"/>
  <polygon points="600,196 592,182 608,182" fill="#64748B"/>

  <!-- check -->
  <g filter="url(#shadow)">
    <rect x="340" y="196" width="520" height="56" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  </g>
  <text x="600" y="231" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A">
    Hetzner Console → Cloud plans → Cost-Optimized. Is Create enabled?
  </text>

  <line x1="600" y1="252" x2="600" y2="288" stroke="#64748B" stroke-width="2"/>
  <polygon points="600,296 592,282 608,282" fill="#64748B"/>

  <!-- decision -->
  <g filter="url(#shadow)">
    <rect x="380" y="296" width="440" height="60" rx="12" fill="#0F172A"/>
  </g>
  <text x="600" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
    Is CX23 / CAX11 orderable today?
  </text>

  <!-- branch lines -->
  <path d="M600,356 V388 H250 V416" fill="none" stroke="#059669" stroke-width="2.5"/>
  <polygon points="250,424 242,410 258,410" fill="#059669"/>
  <path d="M600,356 V388 H910 V416" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <polygon points="910,424 902,410 918,410" fill="#DC2626"/>

  <text x="330" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669">YES</text>
  <text x="790" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#DC2626">NO</text>

  <!-- YES box -->
  <g filter="url(#shadow)">
    <rect x="60" y="424" width="380" height="180" rx="12" fill="url(#yesGrad)"/>
  </g>
  <text x="250" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
    Order CX23 now
  </text>
  <text x="250" y="492" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ECFDF5">
    €5.49 + €0.50 IPv4 = €5.99 / month
  </text>
  <text x="250" y="522" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5">
    Cheapest 2 vCPU / 4 GB in the EU.
  </text>
  <text x="250" y="546" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5">
    About 3.6x cheaper than DigitalOcean.
  </text>
  <text x="250" y="576" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#A7F3D0">
    Date-stamp the check. Stock moves week to week.
  </text>

  <!-- NO boxes -->
  <g filter="url(#shadow)">
    <rect x="640" y="424" width="500" height="84" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="640" y="524" width="500" height="84" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <rect x="640" y="624" width="500" height="84" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  </g>

  <text x="664" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Option A — wait and recheck</text>
  <text x="664" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Capacity notice since about June 26, 2026.</text>
  <text x="664" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Existing CX/CAX servers keep running. Nothing to migrate.</text>

  <text x="664" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Option B — fall back to CPX22</text>
  <text x="664" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">€19.49 + IPv4 = €19.99 / month (+€14 vs CX23).</text>
  <text x="664" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Same RAM, double the disk. Roughly DigitalOcean pricing.</text>

  <text x="664" y="654" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Option C — compare outside Hetzner</text>
  <text x="664" y="678" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">netcup, OVHcloud, Hostinger VPS.</text>
  <text x="664" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Check term length, renewal pricing, and IPv4 surcharges.</text>

  <text x="600" y="738" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    Checks: Hetzner Console, September 2 and October 13, 2026. All eight CX/CAX plans showed a disabled Create button.
  </text>
</svg>
