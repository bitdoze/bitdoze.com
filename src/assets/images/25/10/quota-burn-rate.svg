<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="haikuGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sonnetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="opusGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="fableGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
    Why free pools drain fast: <tspan fill="#4F46E5">model credit multipliers</tspan>
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Same prompt, very different credit cost. Example multipliers from Factory Standard Credits (Oct 2026)</text>

  <!-- Pool tank -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="220" height="420" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="110" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Free credit pool</text>
    <rect x="45" y="60" width="130" height="300" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="52" y="80" width="116" height="273" rx="8" fill="url(#poolGrad)"/>
    <text x="110" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">100%</text>
    <text x="110" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E0E7FF">at signup</text>
    <text x="110" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">One shared pool for every model</text>
  </g>

  <!-- Arrow -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="300" y1="320" x2="352" y2="320"/>
    <polygon points="352,310 372,320 352,330" fill="#64748B" stroke="none"/>
  </g>
  <text x="336" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">burned by</text>

  <!-- Row 1: Haiku -->
  <g transform="translate(390, 110)">
    <rect width="740" height="68" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Claude Haiku 5.5</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Boilerplate, edits, quick questions</text>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="#E2E8F0"/>
    <rect x="270" y="24" width="24" height="20" rx="10" fill="url(#haikuGrad)"/>
    <text x="630" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669">0.04x</text>
    <text x="700" y="39" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">pool lasts</text>
  </g>

  <!-- Row 2: Flash -->
  <g transform="translate(390, 192)">
    <rect width="740" height="68" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Gemini 3.8 Flash / GLM-5.3</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Droid Core fallback class, chat, drafts</text>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="#E2E8F0"/>
    <rect x="270" y="24" width="72" height="20" rx="10" fill="url(#flashGrad)"/>
    <text x="630" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0891B2">0.3x</text>
  </g>

  <!-- Row 3: Sonnet -->
  <g transform="translate(390, 274)">
    <rect width="740" height="68" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Claude Sonnet 5.5</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Daily coding workhorse, real refactors</text>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="#E2E8F0"/>
    <rect x="270" y="24" width="192" height="20" rx="10" fill="url(#sonnetGrad)"/>
    <text x="630" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4F46E5">0.8x</text>
  </g>

  <!-- Row 4: Opus -->
  <g transform="translate(390, 356)">
    <rect width="740" height="68" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Claude Opus 5.5 / GPT-6 Astra</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Hard architecture decisions, deep reasoning</text>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="#E2E8F0"/>
    <rect x="270" y="24" width="384" height="20" rx="10" fill="url(#opusGrad)"/>
    <text x="670" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309">1.6-4x</text>
  </g>

  <!-- Row 5: Fable -->
  <g transform="translate(390, 438)">
    <rect width="740" height="68" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Claude Fable 5.1 / Mythos 5.1</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Top shelf. Also 30-day data retention on Mythos-class</text>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="#E2E8F0"/>
    <rect x="270" y="24" width="340" height="20" rx="10" fill="url(#fableGrad)"/>
    <text x="630" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C">4x</text>
    <text x="700" y="39" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">pool gone fast</text>
  </g>

  <text x="600" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A">
    One Fable-class prompt burns the shared pool about <tspan fill="#B91C1C">50x faster</tspan> than Haiku and <tspan fill="#B91C1C">5x faster</tspan> than Sonnet.
  </text>
  <text x="600" y="598" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">
    Rule: edit and draft on the cheap models. Escalate only for the hard decision.
  </text>
</svg>
