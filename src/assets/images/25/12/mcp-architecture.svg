<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="MCP architecture: an AI host runs an MCP client that connects over JSON-RPC to an MCP server, which calls tools and data such as web search, databases, local files, and external APIs">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- AI host -->
  <rect x="16" y="40" width="192" height="180" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">AI host</text>
  <text x="112" y="92" text-anchor="middle" font-size="12" fill="#475569">Claude Desktop</text>
  <text x="112" y="110" text-anchor="middle" font-size="12" fill="#475569">Cursor</text>
  <text x="112" y="128" text-anchor="middle" font-size="12" fill="#475569">VS Code</text>
  <text x="112" y="146" text-anchor="middle" font-size="12" fill="#475569">Windsurf</text>
  <rect x="36" y="164" width="152" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">MCP client</text>

  <!-- host -> server -->
  <line x1="212" y1="130" x2="280" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="114" text-anchor="middle" font-size="11" fill="#475569">JSON-RPC</text>

  <!-- MCP server -->
  <rect x="286" y="88" width="140" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="356" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">MCP server</text>
  <text x="356" y="136" text-anchor="middle" font-size="12" fill="#475569">Context7 &#183; GitHub</text>
  <text x="356" y="154" text-anchor="middle" font-size="12" fill="#64748b">Docker container</text>

  <!-- server -> tools -->
  <line x1="430" y1="130" x2="498" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="114" text-anchor="middle" font-size="11" fill="#475569">tool calls</text>

  <!-- tools and data -->
  <rect x="504" y="40" width="180" height="180" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="594" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Tools &amp; data</text>
  <text x="594" y="94" text-anchor="middle" font-size="12" fill="#475569">web search</text>
  <text x="594" y="112" text-anchor="middle" font-size="12" fill="#475569">databases</text>
  <text x="594" y="130" text-anchor="middle" font-size="12" fill="#475569">local files</text>
  <text x="594" y="148" text-anchor="middle" font-size="12" fill="#475569">external APIs</text>

  <!-- caption -->
  <text x="350" y="254" text-anchor="middle" font-size="12" fill="#64748b">One MCP server works with every MCP-compatible host - build once, use everywhere</text>
</svg>
