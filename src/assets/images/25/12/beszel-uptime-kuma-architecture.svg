<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="url(#archBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ================= INTERNAL ZONE ================= -->
  <rect x="20" y="30" width="420" height="440" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5" rx="14"/>
  <text x="230" y="58" text-anchor="middle" fill="#334155" font-family="Arial" font-size="15" font-weight="bold">Your Dokploy server (private)</text>

  <!-- Beszel Hub container -->
  <g transform="translate(45, 80)">
    <rect width="190" height="120" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="170" height="100" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="150" height="30" fill="#3b82f6" rx="6"/>
    <text x="95" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Beszel Hub</text>
    <text x="95" y="68" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">monitor.yourdomain.com</text>
    <text x="95" y="83" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">port 8090 (Traefik/HTTPS)</text>
    <text x="95" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">APP_URL - CHECK_UPDATES</text>
  </g>

  <!-- Beszel Agent container -->
  <g transform="translate(45, 240)">
    <rect width="190" height="120" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="170" height="100" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="150" height="30" fill="#10b981" rx="6"/>
    <text x="95" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Beszel Agent</text>
    <text x="95" y="68" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">network_mode: host</text>
    <text x="95" y="83" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">LISTEN 45876</text>
    <text x="95" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">docker.sock (read-only)</text>
  </g>

  <!-- Agent -> Hub metrics arrow -->
  <line x1="140" y1="240" x2="140" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="150" y="226" fill="#047857" font-family="Arial" font-size="10" font-weight="bold">metrics</text>

  <!-- Apps containers -->
  <g transform="translate(45, 395)">
    <rect width="190" height="60" fill="#334155" rx="10"/>
    <text x="95" y="25" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="12" font-weight="bold">Your app containers</text>
    <text x="95" y="43" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">web - api - db</text>
  </g>

  <!-- Agent watches docker.sock -->
  <line x1="240" y1="310" x2="240" y2="392" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="250" y="355" fill="#475569" font-family="Arial" font-size="10">per-container stats</text>

  <!-- ================= EXTERNAL ZONE ================= -->
  <rect x="480" y="30" width="360" height="440" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 5" rx="14"/>
  <text x="660" y="58" text-anchor="middle" fill="#1e40af" font-family="Arial" font-size="15" font-weight="bold">Public internet (outside)</text>

  <!-- Uptime Kuma -->
  <g transform="translate(570, 80)">
    <rect width="180" height="120" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="160" height="100" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="140" height="30" fill="#f59e0b" rx="6"/>
    <text x="90" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Uptime Kuma</text>
    <text x="90" y="68" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">status.yourdomain.com</text>
    <text x="90" y="83" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">port 3001 (HTTPS)</text>
    <text x="90" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">HTTP(s) - DNS - TCP - Push</text>
  </g>

  <!-- Public endpoints -->
  <g transform="translate(555, 240)">
    <rect width="210" height="120" fill="#ffffff" stroke="#93c5fd" stroke-width="2" rx="10"/>
    <text x="105" y="25" text-anchor="middle" fill="#1e40af" font-family="Arial" font-size="12" font-weight="bold">Checked endpoints</text>
    <text x="105" y="48" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10">https://yourdomain.com</text>
    <text x="105" y="66" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10">https://api.yourdomain.com/health</text>
    <text x="105" y="84" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10">DNS A records - TCP ports</text>
    <text x="105" y="102" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10">SSL certificate expiry</text>
  </g>

  <!-- Kuma probes endpoints -->
  <line x1="660" y1="200" x2="660" y2="236" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="670" y="222" fill="#475569" font-family="Arial" font-size="10" font-weight="bold">probes</text>

  <!-- Apps exposed to internet -->
  <line x1="240" y1="425" x2="590" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="370" y="400" fill="#475569" font-family="Arial" font-size="10">published ports 80/443</text>

  <!-- ================= ALERT PATH ================= -->
  <!-- Brevo SMTP -->
  <g transform="translate(280, 490)">
    <rect width="300" height="50" fill="#0f172a" rx="10"/>
    <rect x="8" y="8" width="284" height="34" fill="#1e293b" rx="6"/>
    <rect x="18" y="15" width="110" height="20" fill="#ef4444" rx="4"/>
    <text x="73" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold">Brevo SMTP</text>
    <text x="195" y="29" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="10">smtp-relay.brevo.com:587</text>
  </g>

  <!-- Hub -> Brevo -->
  <path d="M 150 204 L 150 470 L 276 505" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <!-- Kuma -> Brevo -->
  <path d="M 700 204 L 700 470 L 584 505" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="710" y="460" fill="#dc2626" font-family="Arial" font-size="10" font-weight="bold">alerts</text>

  <!-- Dead man's switch dashed line: Hub -> Kuma push monitor -->
  <path d="M 235 130 C 420 90, 480 90, 566 122" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="345" y="80" width="200" height="34" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" rx="8"/>
  <text x="445" y="94" text-anchor="middle" fill="#6d28d9" font-family="Arial" font-size="10" font-weight="bold">dead man's switch</text>
  <text x="445" y="107" text-anchor="middle" fill="#6d28d9" font-family="Arial" font-size="9">HEARTBEAT_URL push, every 60s</text>

  <!-- Email out -->
  <line x1="430" y1="540" x2="430" y2="548" stroke="#dc2626" stroke-width="0" />
  <text x="430" y="552" text-anchor="middle" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">Email / Discord / Telegram to you</text>
</svg>
