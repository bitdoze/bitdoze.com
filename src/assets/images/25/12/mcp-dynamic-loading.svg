<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dynamic MCP loading: the agent starts with three meta-tools, calls mcp_find for GitHub, the MCP Gateway searches the catalog, and mcp_add loads GitHub tools for the session only">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- agent starts light -->
  <rect x="12" y="56" width="150" height="108" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="87" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Agent starts</text>
  <text x="87" y="98" text-anchor="middle" font-size="12" fill="#475569">3 meta-tools only</text>
  <text x="87" y="120" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">mcp_find</text>
  <text x="87" y="138" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">mcp_add</text>
  <text x="87" y="156" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">mcp_remove</text>

  <!-- find -->
  <line x1="166" y1="140" x2="290" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="228" y="112" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">mcp_find</text>
  <text x="228" y="128" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">("github")</text>

  <!-- gateway -->
  <rect x="296" y="100" width="130" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="361" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">MCP Gateway</text>
  <text x="361" y="156" text-anchor="middle" font-size="12" fill="#475569">searches catalog</text>

  <!-- add -->
  <line x1="430" y1="140" x2="554" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="492" y="126" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">mcp_add</text>

  <!-- tools loaded -->
  <rect x="560" y="56" width="128" height="108" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="624" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">GitHub tools</text>
  <text x="624" y="106" text-anchor="middle" font-size="12" fill="#475569">loaded for</text>
  <text x="624" y="124" text-anchor="middle" font-size="12" fill="#475569">this session</text>
  <text x="624" y="142" text-anchor="middle" font-size="12" fill="#64748b">then unloaded</text>

  <!-- contrast footer -->
  <text x="12" y="212" font-size="12.5" fill="#475569"><tspan font-weight="600" fill="#0f172a">Without a gateway:</tspan> every tool definition lands in the context window at startup</text>
  <text x="12" y="236" font-size="12.5" fill="#475569"><tspan font-weight="600" fill="#0f172a">With the gateway:</tspan> tools load only when the task needs them</text>
</svg>
