<svg viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="hArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="hArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="330" fill="url(#hbBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Box 1: Beszel Hub -->
  <g transform="translate(40, 110)">
    <rect width="200" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="180" height="80" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="160" height="28" fill="#3b82f6" rx="6"/>
    <text x="100" y="39" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Beszel Hub</text>
    <text x="100" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">HEARTBEAT_URL configured</text>
    <text x="100" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">runs on your Dokploy node</text>
  </g>

  <!-- Arrow 1: POST /api/push -->
  <line x1="240" y1="160" x2="330" y2="160" stroke="#475569" stroke-width="3" marker-end="url(#hArrow)"/>
  <text x="285" y="140" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10" font-weight="bold">POST every 60s</text>
  <text x="285" y="182" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="9">/api/push/&lt;token&gt;</text>

  <!-- Box 2: Kuma Push monitor -->
  <g transform="translate(335, 110)">
    <rect width="200" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="180" height="80" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="160" height="28" fill="#f59e0b" rx="6"/>
    <text x="100" y="39" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Kuma Push monitor</text>
    <text x="100" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">expects a ping every 60s</text>
    <text x="100" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">heartbeats show green</text>
  </g>

  <!-- Arrow 2: silence = alert -->
  <line x1="535" y1="160" x2="625" y2="160" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#hArrowRed)"/>
  <text x="580" y="140" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="10" font-weight="bold">silence = DOWN</text>
  <text x="580" y="182" text-anchor="middle" fill="#b91c1c" font-family="Arial" font-size="9">after interval x retries</text>

  <!-- Box 3: Alert -->
  <g transform="translate(630, 110)">
    <rect width="200" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="180" height="80" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="160" height="28" fill="#ef4444" rx="6"/>
    <text x="100" y="39" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Alert via Brevo</text>
    <text x="100" y="64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">"Beszel Push is DOWN"</text>
    <text x="100" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">hub dead - VPS dead - DNS broken</text>
  </g>

  <!-- Scenario strip -->
  <g transform="translate(40, 245)">
    <rect width="790" height="60" fill="#ffffff" stroke="#93c5fd" stroke-width="2" rx="10"/>
    <text x="20" y="25" fill="#1e40af" font-family="Arial" font-size="11" font-weight="bold">What it catches:</text>
    <text x="135" y="25" fill="#334155" font-family="Arial" font-size="11">Hub container crashes - the whole VPS dies - Dokploy/Traefik breaks - DNS stops resolving.</text>
    <text x="20" y="45" fill="#1e40af" font-family="Arial" font-size="11" font-weight="bold">Normal state:</text>
    <text x="135" y="45" fill="#334155" font-family="Arial" font-size="11">green heartbeat bars in Kuma. The moment pings stop, the monitor flips Down and pages you.</text>
  </g>

  <!-- Title -->
  <text x="430" y="60" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="16" font-weight="bold">Dead man's switch: Beszel hub reports in, silence triggers the alert</text>
  <text x="430" y="84" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">No third-party service needed - both tools are already in your stack</text>
</svg>
