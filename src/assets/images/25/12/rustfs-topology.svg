<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="tArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="url(#topoBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ================= START ================= -->
  <g transform="translate(280, 30)">
    <rect width="300" height="70" fill="#0f172a" rx="12"/>
    <text x="150" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Choose topology before first deploy</text>
    <text x="150" y="52" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="11">data size, growth, and availability needs</text>
  </g>

  <!-- Branch arrows -->
  <line x1="360" y1="100" x2="150" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#tArrow)"/>
  <text x="185" y="122" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">1 drive, no growth plans</text>

  <line x1="430" y1="100" x2="430" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#tArrow)"/>
  <text x="440" y="128" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">growth likely, one server</text>

  <line x1="500" y1="100" x2="710" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#tArrow)"/>
  <text x="560" y="122" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">multi-TB, multi-site, HA</text>

  <!-- ================= SNSD ================= -->
  <g transform="translate(30, 170)">
    <rect width="250" height="230" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="230" height="30" fill="#64748b" rx="6"/>
    <text x="125" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Single-node single-drive</text>
    <rect x="20" y="55" width="210" height="26" fill="#334155" rx="6"/>
    <text x="125" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="10" font-family="monospace">RUSTFS_VOLUMES=/data</text>
    <text x="125" y="105" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">One server, one volume.</text>
    <text x="125" y="121" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Simplest to run and back up.</text>
    <rect x="15" y="140" width="220" height="75" fill="#7f1d1d" rx="8"/>
    <text x="125" y="162" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="10" font-weight="bold">Locked in: cannot expand in place,</text>
    <text x="125" y="178" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="10" font-weight="bold">cannot join a pool later.</text>
    <text x="125" y="198" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="10">Growth = new deployment + migration.</text>
  </g>

  <!-- ================= MULTI-DRIVE ================= -->
  <g transform="translate(305, 170)">
    <rect width="250" height="230" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="230" height="30" fill="#2563eb" rx="6"/>
    <text x="125" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Single-node multi-drive</text>
    <rect x="20" y="55" width="210" height="26" fill="#334155" rx="6"/>
    <text x="125" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="10" font-family="monospace">RUSTFS_VOLUMES=/data/rustfs{0...3}</text>
    <text x="125" y="105" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Erasure coding across 4+ local</text>
    <text x="125" y="121" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">drives on one server.</text>
    <text x="125" y="145" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Survives drive loss, not server loss.</text>
    <text x="125" y="165" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Strict disk-topology checks apply.</text>
    <text x="125" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Prep drives first (LVM or raw disks).</text>
  </g>

  <!-- ================= MULTI-NODE ================= -->
  <g transform="translate(580, 170)">
    <rect width="250" height="230" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="230" height="30" fill="#059669" rx="6"/>
    <text x="125" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Multi-node distributed</text>
    <rect x="20" y="55" width="210" height="40" fill="#334155" rx="6"/>
    <text x="125" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="9" font-family="monospace">RUSTFS_VOLUMES=http://node{1...4}:9000</text>
    <text x="125" y="88" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="9" font-family="monospace">/data/rustfs{0...3}</text>
    <text x="125" y="118" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">4 nodes x 4 drives, host networking.</text>
    <text x="125" y="138" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">RUSTFS_RPC_SECRET required.</text>
    <text x="125" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">All nodes reachable on port 9000.</text>
    <text x="125" y="182" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Overkill for most solo operators.</text>
  </g>

  <!-- ================= BOTTOM NOTE ================= -->
  <rect x="30" y="440" width="800" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5" rx="8"/>
  <text x="430" y="468" text-anchor="middle" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">Rule of thumb: SNSD for throwaway and small backups workloads, multi-drive when growth is real,</text>
  <text x="430" y="488" text-anchor="middle" fill="#334155" font-family="Arial" font-size="11">multi-node when you genuinely need site-level redundancy. Single node + tested offsite backups is a</text>
  <text x="430" y="508" text-anchor="middle" fill="#334155" font-family="Arial" font-size="11">legitimate production choice.</text>
</svg>
