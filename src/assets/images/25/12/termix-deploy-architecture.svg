<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="termixArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="url(#termixBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="15" font-weight="bold">Termix deploy architecture</text>

  <!-- ================= BROWSER ================= -->
  <g transform="translate(25, 60)">
    <rect width="170" height="70" fill="#0f172a" rx="12"/>
    <text x="85" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Your browser</text>
    <text x="85" y="52" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">https://termix.example.com</text>
  </g>

  <!-- Browser -> Proxy -->
  <line x1="195" y1="95" x2="243" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#termixArrow)"/>
  <text x="220" y="86" text-anchor="middle" fill="#334155" font-family="Arial" font-size="9" font-weight="bold">HTTPS :443</text>

  <!-- ================= REVERSE PROXY ================= -->
  <g transform="translate(245, 60)">
    <rect width="190" height="70" fill="#0f172a" rx="12"/>
    <text x="95" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Reverse proxy</text>
    <text x="95" y="45" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Dokploy / Traefik / Caddy</text>
    <text x="95" y="61" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">WebSocket upgrade headers</text>
  </g>

  <!-- Proxy -> Stack -->
  <line x1="435" y1="95" x2="478" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#termixArrow)"/>
  <text x="457" y="86" text-anchor="middle" fill="#334155" font-family="Arial" font-size="9" font-weight="bold">:8080</text>

  <!-- ================= COMPOSE STACK ================= -->
  <g transform="translate(480, 40)">
    <rect width="355" height="330" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="335" height="28" fill="#2563eb" rx="6"/>
    <text x="177" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Docker network (internal only)</text>

    <!-- termix -->
    <rect x="15" y="55" width="325" height="80" fill="#334155" rx="8"/>
    <text x="177" y="80" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">termix</text>
    <text x="177" y="100" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">ghcr.io/lukegus/termix:2.8.0</text>
    <text x="177" y="120" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="9">PORT=8080 — web UI, API, WebSockets</text>

    <!-- guacd -->
    <rect x="15" y="160" width="325" height="70" fill="#334155" rx="8"/>
    <text x="177" y="184" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">guacd (remote desktop sidecar)</text>
    <text x="177" y="204" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">guacamole/guacd:1.6.0</text>
    <text x="177" y="221" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="9">port 4822 stays internal — never publish</text>

    <!-- volume -->
    <rect x="15" y="255" width="325" height="60" fill="#1e293b" rx="8"/>
    <text x="177" y="279" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11" font-weight="bold">termix-data volume → /app/data</text>
    <text x="177" y="299" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">SQLite DB, encryption keys, SSL certs, recordings</text>

    <!-- internal arrow termix -> guacd -->
    <line x1="177" y1="135" x2="177" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#termixArrow)"/>
    <text x="185" y="150" fill="#94a3b8" font-family="Arial" font-size="8">internal</text>
  </g>

  <!-- Stack -> SSH targets -->
  <line x1="700" y1="370" x2="700" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#termixArrow)"/>
  <text x="708" y="408" fill="#334155" font-family="Arial" font-size="10" font-weight="bold">SSH :22</text>

  <!-- guacd -> RDP/VNC targets -->
  <line x1="495" y1="195" x2="302" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#termixArrow)"/>
  <text x="352" y="340" text-anchor="end" fill="#334155" font-family="Arial" font-size="10" font-weight="bold">RDP / VNC / Telnet</text>
  <text x="352" y="355" text-anchor="end" fill="#334155" font-family="Arial" font-size="10">via guacd</text>

  <!-- ================= TARGETS ================= -->
  <g transform="translate(60, 440)">
    <rect width="355" height="80" fill="#0f172a" rx="12"/>
    <text x="177" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Desktops &amp; legacy gear</text>
    <text x="177" y="52" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Windows (RDP), macOS/Linux desktops (VNC),</text>
    <text x="177" y="68" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">network gear (Telnet)</text>
  </g>

  <g transform="translate(480, 440)">
    <rect width="355" height="80" fill="#0f172a" rx="12"/>
    <text x="177" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Your Linux servers</text>
    <text x="177" y="52" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">SSH :22 — terminal, files, stats, tunnels,</text>
    <text x="177" y="68" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Docker management, fleets</text>
  </g>

  <!-- Footer -->
  <text x="430" y="548" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Only the reverse proxy publishes a port (443). Termix and guacd talk over the internal Docker network.</text>
</svg>
