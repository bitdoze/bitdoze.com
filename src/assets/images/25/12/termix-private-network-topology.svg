<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termixNetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="netArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="url(#termixNetBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="15" font-weight="bold">Reaching a home lab from a public VPS</text>

  <!-- ================= PUBLIC VPS ================= -->
  <g transform="translate(25, 200)">
    <rect width="220" height="170" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="200" height="28" fill="#dc2626" rx="6"/>
    <text x="110" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Public VPS</text>
    <rect x="20" y="50" width="180" height="105" fill="#334155" rx="8"/>
    <text x="110" y="75" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Termix</text>
    <text x="110" y="97" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="9">runs OUTSIDE the lab, so a</text>
    <text x="110" y="113" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="9">lab outage never takes</text>
    <text x="110" y="129" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="9">down your management plane</text>
  </g>

  <!-- VPS -> methods -->
  <line x1="245" y1="255" x2="298" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>
  <line x1="245" y1="285" x2="298" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>
  <line x1="245" y1="315" x2="298" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>

  <!-- ================= METHOD 1: JUMP HOST ================= -->
  <g transform="translate(300, 80)">
    <rect width="260" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="240" height="26" fill="#2563eb" rx="6"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">1. Jump host (bastion)</text>
    <text x="130" y="58" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">SSH hop through a bastion server</text>
    <text x="130" y="74" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">configured per host in Host Manager</text>
  </g>

  <!-- ================= METHOD 2: MESH VPN ================= -->
  <g transform="translate(300, 240)">
    <rect width="260" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="240" height="26" fill="#059669" rx="6"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">2. Mesh VPN</text>
    <text x="130" y="58" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">native Tailscale / WireGuard integration</text>
    <text x="130" y="74" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">custom Headscale endpoint (2.7.0+)</text>
  </g>

  <!-- ================= METHOD 3: CLOUDFLARE TUNNEL ================= -->
  <g transform="translate(300, 400)">
    <rect width="260" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="240" height="26" fill="#7c3aed" rx="6"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">3. Cloudflare Tunnel</text>
    <text x="130" y="58" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">cloudflared on a home node, outbound only</text>
    <text x="130" y="74" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">SSH over tunnel (2.3.0+)</text>
  </g>

  <!-- methods -> home lab -->
  <line x1="560" y1="130" x2="613" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>
  <line x1="560" y1="290" x2="613" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>
  <line x1="560" y1="450" x2="613" y2="405" stroke="#475569" stroke-width="2" marker-end="url(#netArrow)"/>

  <!-- ================= HOME LAB ================= -->
  <g transform="translate(615, 55)">
    <rect width="220" height="430" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="200" height="28" fill="#64748b" rx="6"/>
    <text x="110" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold">Home lab (private network)</text>

    <rect x="20" y="50" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="80" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">Bastion / jump host</text>

    <rect x="20" y="110" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">Proxmox host</text>

    <rect x="20" y="170" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">NAS</text>

    <rect x="20" y="230" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="260" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">Raspberry Pi</text>

    <rect x="20" y="290" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="320" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">Windows PC (RDP)</text>

    <rect x="20" y="350" width="180" height="50" fill="#334155" rx="8"/>
    <text x="110" y="380" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="11">Linux servers (SSH)</text>
  </g>

  <!-- Footer -->
  <text x="430" y="545" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Paths 2 and 3 need zero inbound ports on the home firewall.</text>
</svg>
