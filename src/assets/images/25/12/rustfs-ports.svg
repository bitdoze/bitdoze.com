<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="portsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="pArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="pArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="500" fill="url(#portsBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ================= CLIENTS ================= -->
  <text x="125" y="48" text-anchor="middle" fill="#334155" font-family="Arial" font-size="14" font-weight="bold">Clients</text>

  <g transform="translate(30, 65)">
    <rect width="190" height="120" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="170" height="100" fill="#1e293b" rx="8"/>
    <text x="95" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">S3 clients / apps</text>
    <text x="95" y="60" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">mc - rc - AWS CLI</text>
    <text x="95" y="76" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">restic - rclone - your apps</text>
    <text x="95" y="98" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">S3 API calls, presigned URLs</text>
  </g>

  <g transform="translate(30, 250)">
    <rect width="190" height="100" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="170" height="80" fill="#1e293b" rx="8"/>
    <text x="95" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Browser</text>
    <text x="95" y="58" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">admin console users</text>
    <text x="95" y="76" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">buckets, users, objects</text>
  </g>

  <!-- ================= REVERSE PROXY ================= -->
  <g transform="translate(300, 130)">
    <rect width="220" height="180" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="200" height="160" fill="#1e293b" rx="8"/>
    <text x="110" y="38" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Reverse proxy</text>
    <text x="110" y="58" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="11">Traefik / Nginx / Caddy</text>
    <rect x="25" y="75" width="170" height="30" fill="#3b82f6" rx="6"/>
    <text x="110" y="94" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="10" font-weight="bold">s3.yourdomain.com :443</text>
    <rect x="25" y="115" width="170" height="30" fill="#10b981" rx="6"/>
    <text x="110" y="134" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="10" font-weight="bold">storage.yourdomain.com :443</text>
  </g>

  <!-- ================= RUSTFS ================= -->
  <g transform="translate(590, 60)">
    <rect width="240" height="330" fill="#0f172a" rx="12"/>
    <text x="120" y="32" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">RustFS container</text>

    <!-- Port 9000 -->
    <rect x="15" y="50" width="210" height="130" fill="#1e293b" rx="8"/>
    <rect x="25" y="60" width="190" height="28" fill="#3b82f6" rx="6"/>
    <text x="120" y="79" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Port 9000 : S3 API</text>
    <text x="120" y="106" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">S3 + admin API</text>
    <text x="120" y="122" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">/health, /health/ready</text>
    <text x="120" y="142" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">node RPC: /rustfs/rpc/, /rustfs/peer/</text>
    <text x="120" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">(multi-node traffic rides 9000 too)</text>

    <!-- Port 9001 -->
    <rect x="15" y="195" width="210" height="115" fill="#1e293b" rx="8"/>
    <rect x="25" y="205" width="190" height="28" fill="#10b981" rx="6"/>
    <text x="120" y="224" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Port 9001 : Web console</text>
    <text x="120" y="251" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">served under /rustfs/console/</text>
    <text x="120" y="270" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">buckets - users - objects</text>
    <text x="120" y="292" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">restrict or disable if not needed</text>
  </g>

  <!-- ================= ARROWS ================= -->
  <!-- S3 clients -> proxy -->
  <line x1="220" y1="125" x2="296" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pArrowBlue)"/>
  <text x="228" y="140" fill="#2563eb" font-family="Arial" font-size="10" font-weight="bold">S3 traffic</text>

  <!-- Browser -> proxy -->
  <line x1="220" y1="300" x2="296" y2="245" stroke="#059669" stroke-width="2.5" marker-end="url(#pArrowGreen)"/>
  <text x="228" y="290" fill="#047857" font-family="Arial" font-size="10" font-weight="bold">console</text>

  <!-- Proxy -> 9000 -->
  <line x1="520" y1="185" x2="586" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pArrowBlue)"/>
  <text x="528" y="148" fill="#2563eb" font-family="Arial" font-size="10" font-weight="bold">:9000</text>

  <!-- Proxy -> 9001 -->
  <line x1="520" y1="245" x2="586" y2="280" stroke="#059669" stroke-width="2.5" marker-end="url(#pArrowGreen)"/>
  <text x="530" y="280" fill="#047857" font-family="Arial" font-size="10" font-weight="bold">:9001</text>

  <!-- ================= FOOTNOTE ================= -->
  <rect x="30" y="420" width="800" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <text x="430" y="443" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="11" font-weight="bold">Multi-node deployments: node-to-node RPC shares port 9000 (no separate cluster port).</text>
  <text x="430" y="461" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="11">Every node must be able to reach every other node on 9000.</text>
</svg>
