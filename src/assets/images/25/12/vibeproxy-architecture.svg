<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="VibeProxy architecture diagram: AI coding tools such as Factory Droids, Amp Code, Zed, Codex CLI, and VS Code extensions send API requests over loopback to the VibeProxy menu bar app on localhost port 8317, which routes them through the bundled CLIProxyAPI backend on port 8318 to subscription providers including Claude Code, ChatGPT Codex, Gemini Antigravity, GitHub Copilot, Kimi, Qwen, and Z.AI GLM">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Coding tools -->
  <rect x="16" y="60" width="190" height="262" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="111" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">AI coding tools</text>
  <text x="111" y="116" text-anchor="middle" font-size="12" fill="#475569">Factory Droids</text>
  <text x="111" y="136" text-anchor="middle" font-size="12" fill="#475569">Amp Code</text>
  <text x="111" y="156" text-anchor="middle" font-size="12" fill="#475569">Zed</text>
  <text x="111" y="176" text-anchor="middle" font-size="12" fill="#475569">Codex CLI</text>
  <text x="111" y="196" text-anchor="middle" font-size="12" fill="#475569">VS Code extensions</text>
  <text x="111" y="216" text-anchor="middle" font-size="12" fill="#475569">any OpenAI-compatible app</text>
  <rect x="36" y="238" width="150" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="111" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">base_url:</text>
  <text x="111" y="282" text-anchor="middle" font-size="11" fill="#1d4ed8">localhost:8317/v1</text>

  <!-- tools -> VibeProxy -->
  <line x1="210" y1="180" x2="278" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="164" text-anchor="middle" font-size="11" fill="#475569">API calls</text>
  <text x="120" y="352" text-anchor="start" font-size="11" fill="#64748b">loopback only (127.0.0.1) by default since v1.8.313</text>
  <line x1="40" y1="336" x2="470" y2="336" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="255" y="352" text-anchor="middle" font-size="11" fill="#64748b">LAN toggle optional in Settings</text>

  <!-- VibeProxy -->
  <rect x="284" y="56" width="220" height="252" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="394" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">VibeProxy</text>
  <text x="394" y="106" text-anchor="middle" font-size="12" fill="#475569">macOS menu bar app (MIT)</text>

  <rect x="304" y="122" width="180" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="394" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Proxy :8317</text>
  <text x="394" y="166" text-anchor="middle" font-size="11" fill="#475569">OpenAI + Anthropic endpoints</text>

  <line x1="394" y1="182" x2="394" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="304" y="210" width="180" height="72" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="394" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">CLIProxyAPI :8318</text>
  <text x="394" y="254" text-anchor="middle" font-size="11" fill="#475569">OAuth, token refresh</text>
  <text x="394" y="270" text-anchor="middle" font-size="11" fill="#475569">multi-account round-robin</text>

  <!-- VibeProxy -> providers -->
  <line x1="508" y1="180" x2="576" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="542" y="164" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <!-- Providers -->
  <rect x="582" y="40" width="182" height="300" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="673" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Your subscriptions</text>
  <text x="673" y="100" text-anchor="middle" font-size="12" fill="#475569">Claude Code Pro/Max</text>
  <text x="673" y="124" text-anchor="middle" font-size="12" fill="#475569">ChatGPT Plus/Pro (Codex)</text>
  <text x="673" y="148" text-anchor="middle" font-size="12" fill="#475569">Gemini / Antigravity</text>
  <text x="673" y="172" text-anchor="middle" font-size="12" fill="#475569">GitHub Copilot</text>
  <text x="673" y="196" text-anchor="middle" font-size="12" fill="#475569">Kimi</text>
  <text x="673" y="220" text-anchor="middle" font-size="12" fill="#475569">Qwen</text>
  <text x="673" y="244" text-anchor="middle" font-size="12" fill="#475569">Z.AI GLM (API key)</text>
  <rect x="602" y="266" width="142" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="673" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">OAuth tokens in</text>
  <text x="673" y="306" text-anchor="middle" font-size="11" fill="#1d4ed8">~/.cli-proxy-api/ (0600)</text>

  <!-- caption -->
  <text x="390" y="388" text-anchor="middle" font-size="12" fill="#64748b">Tools point at localhost:8317 - VibeProxy spends your existing subscription quota instead of API credits</text>
</svg>
