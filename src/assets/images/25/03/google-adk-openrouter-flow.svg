<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="How Google ADK routes an OpenRouter model through the LiteLlm wrapper">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">How Google ADK routes an OpenRouter model through the LiteLlm wrapper</text>

  <rect x="20" y="90" width="160" height="86" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="100" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">ADK LlmAgent</text>
  <text x="100" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e3a8a">google-adk 2.x</text>

  <line x1="180" y1="133" x2="211" y2="133" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="215" y="90" width="160" height="86" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="295" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">LiteLlm wrapper</text>
  <text x="295" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e3a8a">google.adk.models.lite_llm</text>

  <line x1="375" y1="133" x2="406" y2="133" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="410" y="90" width="160" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="490" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4c1d95">LiteLLM</text>
  <text x="490" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4c1d95">openrouter/ provider</text>

  <line x1="570" y1="133" x2="601" y2="133" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="605" y="90" width="170" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="690" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">OpenRouter API</text>
  <text x="690" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#065f46">https://openrouter.ai/api/v1</text>

  <line x1="775" y1="133" x2="806" y2="133" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="810" y="90" width="130" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="875" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Model pool</text>
  <text x="875" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">462 models</text>

  <text x="295" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">model="openrouter/openai/gpt-5.6-luna"</text>

  <rect x="330" y="252" width="330" height="58" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="495" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">OPENROUTER_API_KEY (in .env)</text>
  <text x="495" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7c2d12">read automatically by LiteLLM, no api_key= kwarg needed</text>

  <line x1="495" y1="252" x2="495" y2="184" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>
</svg>
