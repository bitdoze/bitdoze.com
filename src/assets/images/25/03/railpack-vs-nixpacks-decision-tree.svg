<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="2026 decision tree for choosing between Railpack and Nixpacks">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">2026 decision tree: Railpack vs Nixpacks</text>

  <rect x="300" y="56" width="320" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="79" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Nixpacks is in maintenance mode</text>
  <text x="460" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b">last release v1.41.0, Oct 2025</text>

  <line x1="460" y1="110" x2="460" y2="138" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="320" y="142" width="280" height="46" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="460" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Where does this build run?</text>

  <line x1="460" y1="188" x2="460" y2="212" stroke="#374151" stroke-width="2"/>
  <line x1="160" y1="212" x2="760" y2="212" stroke="#374151" stroke-width="2"/>
  <line x1="160" y1="212" x2="160" y2="238" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="460" y1="212" x2="460" y2="238" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="760" y1="212" x2="760" y2="238" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="40" y="242" width="240" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">New project</text>

  <rect x="340" y="242" width="240" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="460" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Existing Nixpacks on</text>
  <text x="460" y="281" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Coolify / Dokploy</text>

  <rect x="640" y="242" width="240" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="760" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Railway</text>

  <line x1="160" y1="288" x2="160" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="460" y1="288" x2="460" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="760" y1="288" x2="760" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="30" y="318" width="260" height="112" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Use Railpack</text>
  <text x="160" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">or a hand-written Dockerfile</text>
  <text x="160" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">when you want full control.</text>
  <text x="160" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">Pin versions either way.</text>

  <rect x="330" y="318" width="260" height="112" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="460" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Keep it building today</text>
  <text x="460" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">Then plan the migration:</text>
  <text x="460" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">map NIXPACKS_* to RAILPACK_*,</text>
  <text x="460" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">verify with --show-plan.</text>

  <rect x="630" y="318" width="260" height="112" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="760" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Use Railpack</text>
  <text x="760" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">It is the only documented</text>
  <text x="760" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">builder on Railway.</text>
  <text x="760" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">No decision to make.</text>

  <text x="460" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Either way: pre-1.0 Railpack releases can break builds (v0.37.0, v0.38.0). Pin the version and re-pin deliberately.</text>
</svg>
