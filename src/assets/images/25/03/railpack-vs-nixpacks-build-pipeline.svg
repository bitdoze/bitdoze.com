<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Nixpacks builds a single Nix store layer while Railpack splits builds into cacheable BuildKit layers">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Build pipelines: one Nix store layer vs cacheable BuildKit layers</text>

  <rect x="30" y="56" width="410" height="390" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="235" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400e">Nixpacks (Nix)</text>

  <rect x="130" y="106" width="210" height="42" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="235" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78350f">Source code</text>

  <line x1="235" y1="148" x2="235" y2="174" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="115" y="180" width="240" height="42" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="235" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78350f">Nix resolves every dependency</text>

  <line x1="235" y1="222" x2="235" y2="248" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="95" y="254" width="280" height="72" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="235" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f">/nix/store</text>
  <text x="235" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78350f">one fat layer, cache invalidates</text>
  <text x="235" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78350f">as a whole</text>

  <line x1="235" y1="326" x2="235" y2="352" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="130" y="358" width="210" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="235" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f">Image</text>
  <text x="235" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78350f">larger, reproducible</text>

  <rect x="480" y="56" width="410" height="390" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="685" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e40af">Railpack (BuildKit + Mise)</text>

  <rect x="580" y="106" width="210" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Source code</text>

  <line x1="685" y1="148" x2="685" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="565" y="180" width="240" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Mise resolves tool versions</text>

  <line x1="685" y1="222" x2="685" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="555" y="246" width="260" height="30" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">deps layer (cached)</text>

  <rect x="555" y="282" width="260" height="30" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">build layer (cached)</text>

  <rect x="555" y="318" width="260" height="30" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">runtime layer</text>

  <line x1="685" y1="348" x2="685" y2="352" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="580" y="358" width="210" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Image</text>
  <text x="685" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">smaller base, granular cache</text>

  <text x="460" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Railway launch post: base images measured 38% smaller for Node and 77% smaller for Python vs Nixpacks.</text>
</svg>
