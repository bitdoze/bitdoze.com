<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="720" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Thunderbolt 5 dock decision flow</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Start at the host chip, end at the budget. Prices verified 2026-10-17.</text>

  <!-- Start -->
  <rect x="330" y="80" width="260" height="50" rx="25" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="460" y="111" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">What host are you plugging in?</text>
  <line x1="460" y1="130" x2="460" y2="165" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,165 452,150 468,150" fill="#64748b"/>

  <!-- Q1 -->
  <rect x="250" y="165" width="420" height="58" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="460" y="190" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">1. Host chip decides display count</text>
  <text x="460" y="210" text-anchor="middle" fill="#bfdbfe" font-size="12">M4: 2 displays / cable. M5 Max: up to 4. Check before buying.</text>
  <line x1="460" y1="223" x2="460" y2="258" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,258 452,243 468,243" fill="#64748b"/>

  <!-- Q2 -->
  <rect x="250" y="258" width="420" height="58" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="460" y="283" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">2. Monitors: HDMI, DisplayPort, or USB-C?</text>
  <text x="460" y="303" text-anchor="middle" fill="#bfdbfe" font-size="12">HDMI monitors: Plugable TBT-UDH2, OWC Dual-HDMI, Keychron</text>
  <line x1="460" y1="316" x2="460" y2="351" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,351 452,336 468,336" fill="#64748b"/>

  <!-- Q3 -->
  <rect x="250" y="351" width="420" height="58" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="460" y="376" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">3. Need internal storage (M.2 / NVMe)?</text>
  <text x="460" y="396" text-anchor="middle" fill="#bfdbfe" font-size="12">UGREEN Maxidok, ASUS DC510, Razer, Orico, VectoTech, HyperDrive</text>
  <line x1="460" y1="409" x2="460" y2="444" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,444 452,429 468,429" fill="#64748b"/>

  <!-- Q4 -->
  <rect x="250" y="444" width="420" height="58" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="460" y="469" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">4. Ethernet: 2.5GbE or 10GbE?</text>
  <text x="460" y="489" text-anchor="middle" fill="#bfdbfe" font-size="12">10GbE only: CalDigit TS5 Plus, iVANKY FusionDock Ultra</text>
  <line x1="460" y1="502" x2="460" y2="537" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,537 452,522 468,522" fill="#64748b"/>

  <!-- Q5 -->
  <rect x="250" y="537" width="420" height="58" rx="8" fill="#3b2f63" stroke="#c4b5fd" stroke-width="2"/>
  <text x="460" y="562" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="600">5. Set the budget</text>
  <text x="460" y="582" text-anchor="middle" fill="#c4b5fd" font-size="12">Under $350: budget tier. $499.99: TS5 Plus. $649.99: FusionDock Ultra.</text>

  <!-- Outcomes -->
  <rect x="60" y="625" width="250" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="185" y="650" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">Safe default (under $350)</text>
  <text x="185" y="672" text-anchor="middle" fill="#99f6e4" font-size="12">OWC 11-Port $319.99 or</text>
  <text x="185" y="688" text-anchor="middle" fill="#99f6e4" font-size="12">Kensington SD5000T5 EQ $299.99</text>

  <rect x="335" y="625" width="250" height="65" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="460" y="650" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Port-count / 10GbE</text>
  <text x="460" y="672" text-anchor="middle" fill="#bfdbfe" font-size="12">CalDigit TS5 Plus $499.99</text>
  <text x="460" y="688" text-anchor="middle" fill="#bfdbfe" font-size="12">iVANKY Ultra $649.99</text>

  <rect x="610" y="625" width="250" height="65" rx="8" fill="#3b2f63" stroke="#c4b5fd" stroke-width="2"/>
  <text x="735" y="650" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="600">Specialty needs</text>
  <text x="735" y="672" text-anchor="middle" fill="#c4b5fd" font-size="12">HDMI: Plugable $349.95</text>
  <text x="735" y="688" text-anchor="middle" fill="#c4b5fd" font-size="12">M.2: UGREEN / ASUS / Razer</text>
</svg>
