<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="Decision flowchart for picking a 32 inch OLED monitor based on USB-C charging, room lighting, text workload and refresh rate">
  <defs>
    <linearGradient id="ttl2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sh2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <marker id="aGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="720" rx="16" fill="#F8FAFC"/>
  <rect width="960" height="720" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="480" y="38" text-anchor="middle" fill="url(#ttl2)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Four questions, one monitor</text>
  <text x="480" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Answer in order. The first "yes" usually decides the panel and the coating; the last one decides the refresh tier.</text>

  <!-- Start -->
  <g filter="url(#sh2)">
    <rect x="350" y="84" width="260" height="52" rx="26" fill="#4F46E5"/>
    <text x="480" y="116" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Buying a 32-inch OLED</text>
  </g>
  <line x1="480" y1="136" x2="480" y2="164" stroke="#64748B" stroke-width="2" marker-end="url(#aGray)"/>

  <!-- Q1 -->
  <g filter="url(#sh2)">
    <polygon points="480,166 640,216 480,266 320,216" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <text x="480" y="212" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Need laptop charging</text>
    <text x="480" y="230" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">over USB-C?</text>
  </g>
  <line x1="320" y1="216" x2="196" y2="216" stroke="#16A34A" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="256" y="208" text-anchor="middle" fill="#16A34A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Yes</text>
  <g filter="url(#sh2)">
    <rect x="40" y="176" width="156" height="82" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5"/>
    <text x="52" y="200" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">90W or 65W models</text>
    <text x="52" y="220" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">PG32UCDP (90W)</text>
    <text x="52" y="236" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">LG 32GS95UE (90W)</text>
    <text x="52" y="252" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">PGO32UFS (65W, budget)</text>
  </g>
  <line x1="480" y1="266" x2="480" y2="300" stroke="#DC2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="498" y="290" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">No</text>

  <!-- Q2 -->
  <g filter="url(#sh2)">
    <polygon points="480,302 640,352 480,402 320,352" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <text x="480" y="348" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Light hitting the screen</text>
    <text x="480" y="366" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">from a window or lamp?</text>
  </g>
  <line x1="640" y1="352" x2="764" y2="352" stroke="#16A34A" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="704" y="344" text-anchor="middle" fill="#16A34A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Yes</text>
  <g filter="url(#sh2)">
    <rect x="764" y="312" width="166" height="82" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5"/>
    <text x="776" y="336" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Matte / anti-glare</text>
    <text x="776" y="356" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">PG32UCDP (matte)</text>
    <text x="776" y="372" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">PGO32UFS (anti-glare)</text>
    <text x="776" y="388" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Trade: slightly softer text</text>
  </g>
  <line x1="480" y1="402" x2="480" y2="436" stroke="#DC2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="498" y="426" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">No</text>

  <!-- Q3 -->
  <g filter="url(#sh2)">
    <polygon points="480,438 640,488 480,538 320,488" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <text x="480" y="484" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">60% or more of your hours</text>
    <text x="480" y="502" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">in text-heavy apps?</text>
  </g>
  <line x1="320" y1="488" x2="196" y2="488" stroke="#16A34A" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="256" y="480" text-anchor="middle" fill="#16A34A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Yes</text>
  <g filter="url(#sh2)">
    <rect x="40" y="448" width="156" height="82" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="52" y="472" fill="#3730A3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">WOLED</text>
    <text x="52" y="492" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">XG32UCWG (glossy)</text>
    <text x="52" y="508" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">LG 32GS95UE</text>
    <text x="52" y="524" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Cleaner text edges</text>
  </g>
  <line x1="640" y1="488" x2="764" y2="488" stroke="#DC2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="704" y="480" text-anchor="middle" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">No</text>
  <g filter="url(#sh2)">
    <rect x="764" y="448" width="166" height="82" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
    <text x="776" y="472" fill="#155E75" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">QD-OLED</text>
    <text x="776" y="492" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">MSI MAG 321CUP</text>
    <text x="776" y="508" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">PG32UCDMR, Samsung G8</text>
    <text x="776" y="524" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">More HDR punch</text>
  </g>

  <!-- Final tier row -->
  <rect x="40" y="586" width="880" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="60" y="612" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Last question: can your GPU and cable actually drive 4K at 240Hz?</text>
  <text x="60" y="640" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Yes → 240Hz tier: PG32UCDP, PG32UCDMR, LG 32GS95UE, PGO32UFS, Samsung Odyssey OLED G8</text>
  <text x="60" y="662" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">No (DP 1.2 or HDMI 2.0 output) → 165Hz tier and save the money: XG32UCWG, MSI MAG 321CUP, GIGABYTE MO32U, INNOCN</text>
  <text x="60" y="684" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">240Hz needs HDMI 2.1 or DisplayPort 1.4 with DSC. Check the cable before you blame the panel.</text>
</svg>
