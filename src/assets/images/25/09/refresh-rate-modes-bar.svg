<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Bar chart of the highest usable refresh rate for nine 32 inch OLED monitors, colour coded by panel type">
  <defs>
    <linearGradient id="ttl4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="16" fill="#F8FAFC"/>
  <rect width="960" height="600" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="480" y="36" text-anchor="middle" fill="url(#ttl4)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Highest usable refresh rate per model</text>
  <text x="480" y="58" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Bars show the fastest mode the panel offers, at whatever resolution that mode runs. Spec-derived, not measured.</text>

  <!-- Axis -->
  <line x1="300" y1="92" x2="300" y2="520" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">
    <line x1="375" y1="92" x2="375" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="375" y="536" text-anchor="middle">60Hz</text>
    <line x1="506" y1="92" x2="506" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="506" y="536" text-anchor="middle">165Hz</text>
    <line x1="600" y1="92" x2="600" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="600" y="536" text-anchor="middle">240Hz</text>
    <line x1="712" y1="92" x2="712" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="712" y="536" text-anchor="middle">330Hz</text>
    <line x1="900" y1="92" x2="900" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="900" y="536" text-anchor="middle">480Hz</text>
  </g>

  <!-- Rows: label, bar -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <!-- ASRock PGO32UFS 480 FHD WOLED -->
    <text x="288" y="120" text-anchor="end" fill="#334155">ASRock PGO32UFS</text>
    <rect x="300" y="106" width="600" height="22" rx="4" fill="#4F46E5"/>
    <text x="892" y="122" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">480Hz FHD · 4K 240Hz</text>

    <!-- ASUS PG32UCDP 480 WOLED -->
    <text x="288" y="162" text-anchor="end" fill="#334155">ASUS PG32UCDP</text>
    <rect x="300" y="148" width="600" height="22" rx="4" fill="#4F46E5"/>
    <text x="892" y="164" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">480Hz FHD · 4K 240Hz</text>

    <!-- ASUS XG32UCWG 330 WOLED -->
    <text x="288" y="204" text-anchor="end" fill="#334155">ASUS XG32UCWG</text>
    <rect x="300" y="190" width="412" height="22" rx="4" fill="#4F46E5"/>
    <text x="704" y="206" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">330Hz FHD · 4K 165Hz</text>

    <!-- ASUS PG32UCDMR 240 QD-OLED -->
    <text x="288" y="246" text-anchor="end" fill="#334155">ASUS PG32UCDMR</text>
    <rect x="300" y="232" width="300" height="22" rx="4" fill="#06B6D4"/>
    <text x="592" y="248" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 240Hz</text>

    <!-- Samsung G8 240 QD-OLED -->
    <text x="288" y="288" text-anchor="end" fill="#334155">Samsung Odyssey OLED G8</text>
    <rect x="300" y="274" width="300" height="22" rx="4" fill="#06B6D4"/>
    <text x="592" y="290" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 240Hz</text>

    <!-- LG 32GS95UE 240 WOLED -->
    <text x="288" y="330" text-anchor="end" fill="#334155">LG 32GS95UE</text>
    <rect x="300" y="316" width="300" height="22" rx="4" fill="#4F46E5"/>
    <text x="592" y="332" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 240Hz · Dual-Hz FHD</text>

    <!-- MSI MAG 321CUP 165 QD-OLED -->
    <text x="288" y="372" text-anchor="end" fill="#334155">MSI MAG 321CUP</text>
    <rect x="300" y="358" width="206" height="22" rx="4" fill="#06B6D4"/>
    <text x="498" y="374" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 165Hz</text>

    <!-- GIGABYTE MO32U 165 QD-OLED -->
    <text x="288" y="414" text-anchor="end" fill="#334155">GIGABYTE MO32U</text>
    <rect x="300" y="400" width="206" height="22" rx="4" fill="#06B6D4"/>
    <text x="498" y="416" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 165Hz</text>

    <!-- INNOCN 165 WOLED -->
    <text x="288" y="456" text-anchor="end" fill="#334155">INNOCN 32"</text>
    <rect x="300" y="442" width="206" height="22" rx="4" fill="#4F46E5"/>
    <text x="498" y="458" text-anchor="end" fill="#FFFFFF" font-size="11" font-weight="700">4K 165Hz</text>
  </g>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <rect x="300" y="562" width="16" height="12" rx="3" fill="#4F46E5"/>
    <text x="324" y="573" fill="#334155">WOLED</text>
    <rect x="420" y="562" width="16" height="12" rx="3" fill="#06B6D4"/>
    <text x="444" y="573" fill="#334155">QD-OLED</text>
    <text x="620" y="573" fill="#64748B" font-size="11">All panels rated 0.03ms GTG. Peripheral latency matters more than the panel at this level.</text>
  </g>
</svg>
