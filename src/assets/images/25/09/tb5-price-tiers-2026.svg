<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Thunderbolt 5 dock price tiers, October 2026</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Verified against official product pages on 2026-10-17. Street prices move.</text>

  <!-- Budget tier -->
  <rect x="30" y="80" width="275" height="310" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="167" y="112" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">Budget: under $350</text>
  <text x="167" y="136" text-anchor="middle" fill="#99f6e4" font-size="12">The new default tier</text>
  <text x="50" y="170" fill="#e2e8f0" font-size="13">Kensington SD5000T5 EQ &#8212; $299.99</text>
  <text x="50" y="198" fill="#e2e8f0" font-size="13">OWC 11-Port TB5 &#8212; $319.99</text>
  <text x="50" y="226" fill="#e2e8f0" font-size="13">Anker Prime TB5 &#8212; ~$320 street</text>
  <text x="50" y="254" fill="#e2e8f0" font-size="13">OWC Dual-HDMI &#8212; $349 (Nov 2026)</text>
  <text x="50" y="282" fill="#e2e8f0" font-size="13">Keychron TB5 14-in-1 &#8212; $349.99</text>
  <text x="50" y="310" fill="#e2e8f0" font-size="13">Plugable TBT-UDH2 &#8212; $349.95</text>
  <text x="50" y="352" fill="#5eead4" font-size="12">140W PD + 2.5GbE is standard here</text>

  <!-- Mid tier -->
  <rect x="322" y="80" width="275" height="310" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="459" y="112" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="700">Mid: $350&#8211;500</text>
  <text x="459" y="136" text-anchor="middle" fill="#bfdbfe" font-size="12">Feature specialists</text>
  <text x="342" y="170" fill="#e2e8f0" font-size="13">Razer TB5 Chroma &#8212; ~$390</text>
  <text x="342" y="198" fill="#e2e8f0" font-size="13">ASUS DC510 &#8212; ~&#8364;420 / $460</text>
  <text x="342" y="226" fill="#e2e8f0" font-size="13">iVANKY Pro 3 &#8212; $299.99&#8211;379.99</text>
  <text x="342" y="270" fill="#93c5fd" font-size="12">Pay for the specialty:</text>
  <text x="342" y="292" fill="#bfdbfe" font-size="12">M.2 slot, dual card readers,</text>
  <text x="342" y="310" fill="#bfdbfe" font-size="12">180W PD, RGB, enterprise</text>
  <text x="342" y="352" fill="#93c5fd" font-size="12">Pro 3 dips under $350 on the VCD13 SKU</text>

  <!-- Premium tier -->
  <rect x="614" y="80" width="275" height="310" rx="10" fill="#3b2f63" stroke="#c4b5fd" stroke-width="2"/>
  <text x="751" y="112" text-anchor="middle" fill="#ddd6fe" font-size="17" font-weight="700">Premium: $499+</text>
  <text x="751" y="136" text-anchor="middle" fill="#c4b5fd" font-size="12">Port count and 10GbE</text>
  <text x="634" y="170" fill="#e2e8f0" font-size="13">CalDigit TS5 Plus &#8212; $499.99</text>
  <text x="634" y="198" fill="#e2e8f0" font-size="13">iVANKY FusionDock Ultra &#8212; $649.99</text>
  <text x="634" y="226" fill="#e2e8f0" font-size="13">Dell Pro SD25TB5 &#8212; enterprise</text>
  <text x="634" y="270" fill="#ddd6fe" font-size="12">TS5 Plus at $499.99 is the</text>
  <text x="634" y="292" fill="#c4b5fd" font-size="12">value disruptor: 20 ports,</text>
  <text x="634" y="310" fill="#c4b5fd" font-size="12">10GbE, 140W host charging</text>
  <text x="634" y="352" fill="#ddd6fe" font-size="12">Dell 300W PD applies to Dell hosts only</text>

  <text x="460" y="410" text-anchor="middle" fill="#64748b" font-size="11">bitdoze.com &#8212; prices verified 2026-10-17</text>
</svg>
