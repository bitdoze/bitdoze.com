<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Signal chain from GPU or laptop through cable standard to the monitor, showing which combinations reach 4K 60Hz, 165Hz and 240Hz">
  <defs>
    <linearGradient id="ttl3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sh3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <marker id="aCyan3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06B6D4"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="16" fill="#F8FAFC"/>
  <rect width="960" height="560" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="480" y="38" text-anchor="middle" fill="url(#ttl3)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">The signal chain decides your refresh rate</text>
  <text x="480" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Same monitor, three different results. Only the middle column changes.</text>

  <!-- Column headers -->
  <text x="120" y="100" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">SOURCE</text>
  <text x="400" y="100" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">CABLE + PORT</text>
  <text x="690" y="100" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">WHAT YOU GET</text>

  <!-- Source box spanning -->
  <g filter="url(#sh3)">
    <rect x="40" y="130" width="160" height="330" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="120" y="166" text-anchor="middle" fill="#3730A3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">GPU or laptop</text>
    <text x="120" y="196" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">HDMI 2.1 output</text>
    <text x="120" y="216" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">RTX 30 / RX 6000 and up</text>
    <text x="120" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">DP 1.4 with DSC</text>
    <text x="120" y="270" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">RTX 20 / RX 5000 and up</text>
    <text x="120" y="304" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11">USB-C Alt Mode</text>
    <text x="120" y="324" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">needs DSC + full-featured cable</text>
    <text x="120" y="382" text-anchor="middle" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Older outputs</text>
    <text x="120" y="402" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">HDMI 2.0 / DP 1.2</text>
    <text x="120" y="422" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">cap at 4K 60Hz</text>
  </g>

  <!-- Lane 1 -->
  <g filter="url(#sh3)">
    <rect x="240" y="130" width="320" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="400" y="162" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">HDMI 2.0 or DP 1.2</text>
    <text x="400" y="186" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">18Gbps HDMI / 17.3Gbps DP, no DSC</text>
    <text x="400" y="208" text-anchor="middle" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Common bundled cable</text>
  </g>
  <line x1="560" y1="178" x2="600" y2="178" stroke="#06B6D4" stroke-width="2" marker-end="url(#aCyan3)"/>
  <g filter="url(#sh3)">
    <rect x="610" y="130" width="310" height="96" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="765" y="166" text-anchor="middle" fill="#991B1B" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">4K 60Hz</text>
    <text x="765" y="192" text-anchor="middle" fill="#7F1D1D" font-family="system-ui, -apple-system, sans-serif" font-size="11">Every panel here is wasted at this rate</text>
    <text x="765" y="212" text-anchor="middle" fill="#7F1D1D" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fix the cable first, then the port</text>
  </g>

  <!-- Lane 2 -->
  <g filter="url(#sh3)">
    <rect x="240" y="242" width="320" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="400" y="274" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">HDMI 2.1 or DP 1.4 with DSC</text>
    <text x="400" y="298" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">48Gbps FRL / 25.9Gbps effective per stream</text>
    <text x="400" y="320" text-anchor="middle" fill="#16A34A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Keep passive runs short</text>
  </g>
  <line x1="560" y1="290" x2="600" y2="290" stroke="#06B6D4" stroke-width="2" marker-end="url(#aCyan3)"/>
  <g filter="url(#sh3)">
    <rect x="610" y="242" width="310" height="96" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="765" y="278" text-anchor="middle" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">4K 165Hz</text>
    <text x="765" y="304" text-anchor="middle" fill="#14532D" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fine for the whole budget tier</text>
    <text x="765" y="324" text-anchor="middle" fill="#14532D" font-family="system-ui, -apple-system, sans-serif" font-size="11">Dual-mode FHD also works here</text>
  </g>

  <!-- Lane 3 -->
  <g filter="url(#sh3)">
    <rect x="240" y="354" width="320" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="400" y="386" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">HDMI 2.1 or DP 1.4 with DSC</text>
    <text x="400" y="410" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">DSC on, and enabled in the driver or OSD</text>
    <text x="400" y="432" text-anchor="middle" fill="#16A34A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Certified 2m or shorter</text>
  </g>
  <line x1="560" y1="402" x2="600" y2="402" stroke="#06B6D4" stroke-width="2" marker-end="url(#aCyan3)"/>
  <g filter="url(#sh3)">
    <rect x="610" y="354" width="310" height="96" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="765" y="390" text-anchor="middle" fill="#155E75" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">4K 240Hz or FHD 480Hz</text>
    <text x="765" y="416" text-anchor="middle" fill="#0E7490" font-family="system-ui, -apple-system, sans-serif" font-size="11">Only if the GPU can push the frames</text>
    <text x="765" y="436" text-anchor="middle" fill="#0E7490" font-family="system-ui, -apple-system, sans-serif" font-size="11">480Hz mode is 1080p, not 4K</text>
  </g>

  <!-- Footer note -->
  <rect x="40" y="472" width="880" height="56" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="60" y="496" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">DSC = Display Stream Compression. It is lossless visually, but both ends have to support it.</text>
  <text x="60" y="516" fill="#78350F" font-family="system-ui, -apple-system, sans-serif" font-size="11">Order of checks: cable standard, cable length, monitor input, GPU output spec, firmware version.</text>
</svg>
