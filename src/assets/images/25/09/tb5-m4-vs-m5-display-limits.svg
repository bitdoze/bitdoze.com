<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="380" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">The M4 vs M5 display gotcha: one Thunderbolt 5 cable</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Display counts depend on the host chip, not only on the dock. Source: CalDigit TS5 Plus docs, 2026-10-17.</text>

  <!-- M4 side -->
  <rect x="40" y="85" width="400" height="240" rx="10" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" fill="#f9a8d4" font-size="18" font-weight="700">Apple M4 Pro / M4 Max</text>
  <text x="240" y="146" text-anchor="middle" fill="#fbcfe8" font-size="13">Single TB5 host connection</text>
  <text x="70" y="185" fill="#e2e8f0" font-size="14">Triple displays over one TB5 cable: NO</text>
  <text x="70" y="215" fill="#e2e8f0" font-size="14">Practical limit: 2 displays on one cable</text>
  <text x="70" y="245" fill="#e2e8f0" font-size="14">Third display: add a USB-C video path</text>
  <text x="70" y="275" fill="#e2e8f0" font-size="14">or a second host cable where supported</text>
  <text x="70" y="305" fill="#f9a8d4" font-size="12">Check this before blaming the dock</text>

  <!-- M5 side -->
  <rect x="480" y="85" width="400" height="240" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="680" y="118" text-anchor="middle" fill="#5eead4" font-size="18" font-weight="700">Apple M5 Max</text>
  <text x="680" y="146" text-anchor="middle" fill="#99f6e4" font-size="13">Single TB5 host connection</text>
  <text x="510" y="185" fill="#e2e8f0" font-size="14">Up to 4 monitors on one TB5 cable</text>
  <text x="510" y="215" fill="#e2e8f0" font-size="14">Downstream TB5 + USB-C video adapters</text>
  <text x="510" y="245" fill="#e2e8f0" font-size="14">Direct USB-C / TB monitors work too</text>
  <text x="510" y="275" fill="#e2e8f0" font-size="14">Documented for CalDigit TS5 Plus</text>
  <text x="510" y="305" fill="#5eead4" font-size="12">Kensington pages also cite M5 Pro/Max counts</text>

  <text x="460" y="355" text-anchor="middle" fill="#94a3b8" font-size="12">Same dock, different host chip, different display ceiling. Always verify the host GPU limits first.</text>
</svg>
