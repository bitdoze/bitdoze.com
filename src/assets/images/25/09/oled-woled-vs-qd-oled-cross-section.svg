<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="WOLED versus QD-OLED panel layer stacks and their effect on brightness and colour">
  <defs>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="downIndigo" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="16" fill="#F8FAFC"/>
  <rect width="960" height="560" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="480" y="38" text-anchor="middle" fill="url(#ttl)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">How each panel makes light</text>
  <text x="480" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Per-pixel emission either way. The layer between the emitter and your eye is what changes brightness and colour volume.</text>

  <!-- Column headings -->
  <text x="240" y="98" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">WOLED (white OLED)</text>
  <text x="720" y="98" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">QD-OLED (quantum dot)</text>

  <!-- WOLED stack -->
  <g filter="url(#sh)">
    <rect x="90" y="118" width="300" height="46" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="240" y="146" text-anchor="middle" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Front glass + coating</text>

    <rect x="90" y="170" width="300" height="56" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="240" y="194" text-anchor="middle" fill="#78350F" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Colour filter (RGB)</text>
    <text x="240" y="213" text-anchor="middle" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="11">absorbs part of the light</text>

    <rect x="90" y="232" width="300" height="56" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="240" y="256" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">White organic emitter</text>
    <text x="240" y="275" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11">white light, filtered to RGB</text>

    <rect x="90" y="294" width="300" height="46" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="240" y="322" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">TFT backplane</text>
  </g>

  <!-- QD-OLED stack -->
  <g filter="url(#sh)">
    <rect x="570" y="118" width="300" height="46" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="720" y="146" text-anchor="middle" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Front glass + coating</text>

    <rect x="570" y="170" width="300" height="56" rx="6" fill="#CFFAFE" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="720" y="194" text-anchor="middle" fill="#155E75" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Quantum dot conversion layer</text>
    <text x="720" y="213" text-anchor="middle" fill="#0E7490" font-family="system-ui, -apple-system, sans-serif" font-size="11">converts blue into red + green</text>

    <rect x="570" y="232" width="300" height="56" rx="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="720" y="256" text-anchor="middle" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Blue organic emitter</text>
    <text x="720" y="275" text-anchor="middle" fill="#1E40AF" font-family="system-ui, -apple-system, sans-serif" font-size="11">one emitter colour, converted up</text>

    <rect x="570" y="294" width="300" height="46" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="720" y="322" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">TFT backplane</text>
  </g>

  <!-- Emission arrows -->
  <line x1="240" y1="294" x2="240" y2="128" stroke="#F59E0B" stroke-width="3" marker-end="url(#up)"/>
  <text x="258" y="360" fill="#B45309" font-family="system-ui, -apple-system, sans-serif" font-size="12">some light lost in the filter</text>

  <line x1="720" y1="294" x2="720" y2="128" stroke="#F59E0B" stroke-width="3" marker-end="url(#up)"/>
  <text x="738" y="360" fill="#B45309" font-family="system-ui, -apple-system, sans-serif" font-size="12">less light lost in conversion</text>

  <!-- Consequence cards -->
  <g filter="url(#sh)">
    <rect x="90" y="386" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="110" y="414" fill="#4F46E5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">What you get</text>
    <text x="110" y="440" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Cleanest text edges</text>
    <text x="110" y="462" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Peak brightness around 450 nits</text>
    <text x="110" y="484" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Narrower colour volume in HDR</text>
    <text x="110" y="504" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Best for code, terminals, documents</text>
  </g>

  <g filter="url(#sh)">
    <rect x="570" y="386" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="590" y="414" fill="#0891B2" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">What you get</text>
    <text x="590" y="440" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Peak brightness 1000+ nits</text>
    <text x="590" y="462" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Wider colour volume in HDR</text>
    <text x="590" y="484" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Slight colour fringing on small text</text>
    <text x="590" y="504" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Best for HDR games and colour work</text>
  </g>
</svg>
