<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- panel divider -->
  <line x1="430" y1="16" x2="430" y2="392" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ============ LEFT: standalone ============ -->
  <text x="220" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Standalone mode (Option 3)</text>

  <rect x="100" y="62" width="240" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">One AI assistant</text>
  <text x="220" y="102" text-anchor="middle" font-size="11" fill="#475569">Cursor, Claude Code, editor</text>

  <line x1="220" y1="114" x2="220" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="100" y="164" width="240" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">cognee-mcp container</text>
  <text x="220" y="206" text-anchor="middle" font-size="11" fill="#475569">own embedded storage, no Postgres</text>

  <line x1="220" y1="222" x2="220" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <path d="M 155 280 a 65 11 0 0 0 130 0 v 36 a 65 11 0 0 1 -130 0 z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="220" cy="280" rx="65" ry="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="220" y="348" text-anchor="middle" font-size="12" fill="#475569">cognee-mcp-data volume</text>

  <text x="220" y="382" text-anchor="middle" font-size="12" fill="#64748b">Memory is per-instance. Simple, isolated,</text>
  <text x="220" y="398" text-anchor="middle" font-size="12" fill="#64748b">not shared between clients or machines.</text>

  <!-- ============ RIGHT: API mode ============ -->
  <text x="645" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">API mode (Options 1 and 2)</text>

  <rect x="466" y="62" width="180" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="556" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Many MCP clients</text>
  <text x="556" y="102" text-anchor="middle" font-size="11" fill="#475569">whole team, many sessions</text>

  <line x1="556" y1="114" x2="556" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="466" y="164" width="180" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="556" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">cognee-mcp</text>
  <text x="556" y="206" text-anchor="middle" font-size="11" fill="#475569">TRANSPORT_MODE=http</text>

  <line x1="646" y1="193" x2="688" y2="193" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="692" y="164" width="148" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="766" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">cognee API</text>
  <text x="766" y="206" text-anchor="middle" font-size="11" fill="#475569">:8000 + REST access</text>

  <line x1="766" y1="222" x2="766" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="640" y="270" width="200" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">PostgreSQL + pgvector</text>
  <text x="740" y="312" text-anchor="middle" font-size="11" fill="#475569">+ Kuzu graph files (volume)</text>

  <text x="645" y="382" text-anchor="middle" font-size="12" fill="#64748b">Shared storage behind one API.</text>
  <text x="645" y="398" text-anchor="middle" font-size="12" fill="#64748b">Team knowledge graphs, backups in one place.</text>
</svg>
