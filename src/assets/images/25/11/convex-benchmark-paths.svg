<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="530" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">The four request paths tested</text>

  <!-- Lane 1: No CDN -->
  <text x="20" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">1. No CDN</text>
  <text x="20" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">direct to origin</text>

  <rect x="165" y="89" width="110" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Client</text>

  <line x1="275" y1="115" x2="592" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="434" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">direct connection</text>

  <rect x="600" y="89" width="175" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="687" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">VPS: self-hosted</text>
  <text x="687" y="129" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Convex backend</text>

  <rect x="800" y="95" width="84" height="40" rx="20" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/>
  <text x="842" y="120" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444" text-anchor="middle">0.98s</text>

  <!-- Lane 2: Full CDN -->
  <text x="20" y="218" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">2. Full CDN</text>
  <text x="20" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">site + API at the edge</text>

  <rect x="165" y="199" width="110" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Client</text>

  <line x1="275" y1="225" x2="352" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="199" width="150" height="52" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="435" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle">Cloudflare edge</text>

  <line x1="510" y1="225" x2="592" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="199" width="175" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="687" y="222" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">VPS: self-hosted</text>
  <text x="687" y="239" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Convex backend</text>

  <rect x="800" y="205" width="84" height="40" rx="20" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
  <text x="842" y="230" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#22c55e" text-anchor="middle">0.16s</text>

  <!-- Lane 3: Site CDN only -->
  <text x="20" y="328" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">3. Site CDN only</text>
  <text x="20" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">API bypasses edge</text>

  <rect x="165" y="309" width="110" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Client</text>

  <line x1="275" y1="335" x2="352" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="309" width="150" height="52" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="435" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle">Cloudflare edge</text>

  <line x1="510" y1="335" x2="592" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 220 361 C 220 377 236 377 252 377 L 663 377 C 679 377 687 371 687 361" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="445" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Convex API direct</text>

  <rect x="600" y="309" width="175" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="687" y="332" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">VPS: self-hosted</text>
  <text x="687" y="349" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Convex backend</text>

  <rect x="800" y="315" width="84" height="40" rx="20" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="842" y="340" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f59e0b" text-anchor="middle">0.63s</text>

  <!-- Lane 4: Cloud free tier -->
  <text x="20" y="438" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">4. Cloud free tier</text>
  <text x="20" y="454" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">managed backend</text>

  <rect x="165" y="419" width="110" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Client</text>

  <line x1="275" y1="445" x2="352" y2="445" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="419" width="150" height="52" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="435" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle">Cloudflare edge</text>

  <line x1="510" y1="445" x2="592" y2="445" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">app + backend</text>

  <rect x="600" y="419" width="175" height="52" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="687" y="442" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Convex Cloud</text>
  <text x="687" y="459" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(managed free tier)</text>

  <rect x="800" y="425" width="84" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="842" y="450" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8b5cf6" text-anchor="middle">1.88s</text>

  <!-- Footnote -->
  <text x="450" y="507" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Measured with oha: 1,000 requests, 500 concurrent, 50 req/sec (November 2025 run)</text>
</svg>
