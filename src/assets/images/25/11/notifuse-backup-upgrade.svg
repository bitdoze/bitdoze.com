<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Backup and upgrade flow: dump every notifuse database and the data directory, copy offsite, pull a pinned image tag, let the app migrate the schema, then verify. Rollback means restoring the pre-upgrade dump because there is no down-migration.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 8; }
    .warn { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
    .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #0f172a; }
    .s { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #475569; }
    .wt { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #b91c1c; }
    .ws { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #7f1d1d; }
    .step { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1d4ed8; }
    .l { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#a2); }
    .lr { stroke: #b91c1c; stroke-width: 1.8; fill: none; marker-end: url(#a2r); }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="380" />

  <rect class="box" x="20" y="60" width="164" height="92" />
  <text class="step" x="34" y="84">1. DUMP</text>
  <text class="t" x="34" y="108">pg_dump every</text>
  <text class="t" x="34" y="127">notifuse_* database</text>
  <text class="s" x="34" y="146">plus the ./data mount</text>

  <rect class="box" x="208" y="60" width="164" height="92" />
  <text class="step" x="222" y="84">2. COPY OFF</text>
  <text class="t" x="222" y="108">S3-compatible</text>
  <text class="t" x="222" y="127">offsite storage</text>
  <text class="s" x="222" y="146">never same disk</text>

  <rect class="box" x="396" y="60" width="164" height="92" />
  <text class="step" x="410" y="84">3. PULL</text>
  <text class="t" x="410" y="108">pinned tag,</text>
  <text class="t" x="410" y="127">not latest</text>
  <text class="s" x="410" y="146">read release notes first</text>

  <rect class="box" x="584" y="60" width="164" height="92" />
  <text class="step" x="598" y="84">4. MIGRATE</text>
  <text class="t" x="598" y="108">app migrates</text>
  <text class="t" x="598" y="127">schema on start</text>
  <text class="s" x="598" y="146">watch compose logs</text>

  <rect class="box" x="772" y="60" width="164" height="92" />
  <text class="step" x="786" y="84">5. VERIFY</text>
  <text class="t" x="786" y="108">compose ps,</text>
  <text class="t" x="786" y="127">HTTPS, test send</text>
  <text class="s" x="786" y="146">login still works</text>

  <path class="l" d="M 184 106 L 206 106" />
  <path class="l" d="M 372 106 L 394 106" />
  <path class="l" d="M 560 106 L 582 106" />
  <path class="l" d="M 748 106 L 770 106" />

  <rect class="warn" x="208" y="216" width="548" height="130" />
  <text class="wt" x="230" y="248">Rollback = restore the dump you took in step 1</text>
  <text class="ws" x="230" y="274">There is no down-migration. An older image cannot un-migrate a database.</text>
  <text class="ws" x="230" y="296">Since v39.0 the app refuses to start when the database was migrated by a</text>
  <text class="ws" x="230" y="318">newer build, naming both versions. Roll back the data, then the image.</text>

  <path class="lr" d="M 666 152 C 666 186, 620 196, 560 214" />
</svg>
