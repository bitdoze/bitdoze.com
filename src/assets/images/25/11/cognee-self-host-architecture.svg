<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- defs -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- client -->
  <rect x="320" y="18" width="220" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Your client</text>
  <text x="430" y="61" text-anchor="middle" font-size="12" fill="#475569">app, curl, Cursor, Claude Code</text>

  <!-- reverse proxy -->
  <rect x="290" y="126" width="280" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Reverse proxy</text>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#475569">Traefik (Dokploy) or Nginx &#183; TLS on :443</text>

  <!-- client -> proxy -->
  <line x1="430" y1="74" x2="430" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="446" y="102" font-size="12" fill="#475569">HTTPS :443</text>

  <!-- cognee-network boundary -->
  <rect x="56" y="234" width="748" height="248" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="76" y="256" font-size="12" font-weight="600" fill="#64748b">cognee-network (Docker bridge)</text>
  <text x="784" y="256" text-anchor="end" font-size="12" fill="#94a3b8">dokploy-network joins via Dokploy deployments</text>

  <!-- cognee api -->
  <rect x="100" y="278" width="270" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="304" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">cognee</text>
  <text x="235" y="324" text-anchor="middle" font-size="12" fill="#475569">cognee/cognee &#183; port 8000</text>
  <text x="235" y="344" text-anchor="middle" font-size="12" fill="#475569">REST API + Swagger UI at /docs</text>

  <!-- cognee-mcp -->
  <rect x="490" y="278" width="270" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="625" y="304" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">cognee-mcp</text>
  <text x="625" y="324" text-anchor="middle" font-size="12" fill="#475569">cognee/cognee-mcp &#183; TRANSPORT_MODE=http</text>
  <text x="625" y="344" text-anchor="middle" font-size="12" fill="#475569">container :8000 &#8594; host :8001</text>

  <!-- proxy -> cognee -->
  <line x1="340" y1="190" x2="255" y2="274" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="222" font-size="12" fill="#475569">cognee.yourdomain.com</text>

  <!-- proxy -> mcp -->
  <line x1="520" y1="190" x2="605" y2="274" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="222" font-size="12" fill="#475569">mcp.yourdomain.com/mcp</text>

  <!-- mcp -> cognee -->
  <line x1="490" y1="322" x2="374" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="312" text-anchor="middle" font-size="12" fill="#475569">API_URL=http://cognee:8000</text>

  <!-- postgres -->
  <rect x="100" y="400" width="300" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="424" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">cognee-postgres</text>
  <text x="250" y="443" text-anchor="middle" font-size="12" fill="#475569">pgvector/pgvector:pg17 &#183; one DB for both</text>
  <text x="250" y="460" text-anchor="middle" font-size="11" fill="#64748b">DB_PROVIDER=postgres &#183; VECTOR_DB_PROVIDER=pgvector</text>

  <!-- cognee -> postgres -->
  <line x1="235" y1="366" x2="235" y2="396" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- volume (cylinder) -->
  <g>
    <path d="M 540 414 a 55 12 0 0 0 110 0 v 42 a 55 12 0 0 1 -110 0 z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="595" cy="414" rx="55" ry="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="700" y="432" font-size="13" font-weight="600" fill="#0f172a">cognee-data volume</text>
  <text x="700" y="450" font-size="11" fill="#64748b">Kuzu graph files</text>
  <text x="700" y="466" font-size="11" fill="#64748b">GRAPH_DATABASE_PROVIDER=kuzu</text>

  <!-- cognee -> volume -->
  <path d="M 370 344 C 450 380, 480 398, 536 414" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="430" y="392" font-size="12" fill="#475569">volume mount</text>

  <!-- footnote -->
  <text x="430" y="560" text-anchor="middle" font-size="12" fill="#64748b">MCP talks to the API over the Docker network. Both storage volumes are named, so data survives redeploys and container restarts.</text>
  <text x="430" y="580" text-anchor="middle" font-size="12" fill="#64748b">Only 80/443 need to be open to the public; Postgres and the API never publish host ports in the Dokploy setup.</text>
</svg>
