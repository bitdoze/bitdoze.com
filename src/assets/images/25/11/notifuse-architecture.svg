<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Notifuse architecture: reverse proxy and SMTP bridge feed the Notifuse API, which stores data in PostgreSQL 17 with one database per workspace, keeps images in an S3-compatible bucket, and sends mail through your own email provider.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 8; }
    .hub { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
    .db { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
    .store { fill: #fdf4ff; stroke: #a21caf; stroke-width: 1.5; rx: 8; }
    .esp { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; rx: 8; }
    .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
    .s { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #475569; }
    .lab { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1d4ed8; }
    .note { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #c2410c; }
    .l { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .ld { stroke: #15803d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .lo { stroke: #c2410c; stroke-width: 1.6; fill: none; marker-end: url(#arrowo); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrowo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="560" />

  <!-- reverse proxy -->
  <rect class="box" x="30" y="70" width="210" height="76" />
  <text class="t" x="48" y="100">Reverse proxy :443</text>
  <text class="s" x="48" y="122">Caddy / Traefik / Nginx</text>
  <text class="s" x="48" y="139">Let's Encrypt TLS</text>

  <!-- smtp bridge -->
  <rect class="box" x="30" y="330" width="210" height="76" />
  <text class="t" x="48" y="360">Legacy app / SaaS</text>
  <text class="s" x="48" y="382">Supabase Auth, Auth0, cron jobs</text>
  <text class="s" x="48" y="399">speaks SMTP only</text>

  <!-- hub -->
  <rect class="hub" x="370" y="180" width="220" height="110" />
  <text class="t" x="390" y="212">Notifuse API + console</text>
  <text class="s" x="390" y="234">Go backend, React console</text>
  <text class="s" x="390" y="252">:8080 standalone image</text>
  <text class="s" x="390" y="270">:8081 bundled compose</text>

  <!-- postgres -->
  <rect class="db" x="330" y="440" width="300" height="86" />
  <text class="t" x="350" y="470">PostgreSQL 17+</text>
  <text class="s" x="350" y="492">notifuse_system + one database</text>
  <text class="s" x="350" y="509">per workspace</text>

  <!-- s3 -->
  <rect class="store" x="720" y="70" width="210" height="76" />
  <text class="t" x="738" y="100">S3-compatible bucket</text>
  <text class="s" x="738" y="122">email images, attachments</text>
  <text class="s" x="738" y="139">optional but recommended</text>

  <!-- esp -->
  <rect class="esp" x="720" y="330" width="210" height="76" />
  <text class="t" x="738" y="360">Your ESP account</text>
  <text class="s" x="738" y="382">SES / Mailgun / Postmark</text>
  <text class="s" x="738" y="399">SendGrid / SparkPost / Mailjet</text>

  <!-- arrows -->
  <path class="l" d="M 240 122 C 300 122, 320 175, 368 195" />
  <text class="lab" x="252" y="112">HTTPS</text>

  <path class="l" d="M 240 368 C 300 368, 320 300, 368 275" />
  <text class="lab" x="248" y="358">SMTP :587 / :465</text>

  <path class="ld" d="M 480 290 L 480 438" />
  <text class="lab" x="424" y="330" fill="#15803d">SQL</text>

  <path class="l" d="M 590 215 C 660 215, 690 150, 718 122" />
  <text class="lab" x="620" y="200">file manager</text>

  <path class="lo" d="M 590 265 C 660 265, 690 340, 718 362" />
  <text class="note" x="600" y="312">you pay the ESP, not Notifuse</text>
  <text class="s" x="720" y="432">~$0.10 / 1,000 emails on Amazon SES</text>
  <text class="s" x="720" y="452">recipients' inboxes</text>
  <text class="s" x="720" y="472">home of your deliverability reputation</text>

  <!-- visitors note -->
  <text class="s" x="30" y="470">Visitors load /na.js from your own instance for</text>
  <text class="s" x="30" y="490">cookieless web analytics — same Postgres, no cookies.</text>
</svg>
