<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#F8FAFC"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="48" y="34" width="196" height="28" rx="14" fill="#DBEAFE"/>
  <text x="146" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">HERMES KANBAN v0.23</text>
  <text x="48" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Task Lifecycle &amp; Gateway Dispatcher Transitions</text>

  <!-- Main Row Nodes (y=170, h=76) -->
  <!-- triage -->
  <rect x="48" y="170" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="114" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0F172A">triage</text>
  <text x="114" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">scope / split</text>

  <!-- todo -->
  <rect x="224" y="170" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="290" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0F172A">todo</text>
  <text x="290" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">gated on parents</text>

  <!-- ready -->
  <rect x="404" y="170" width="144" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="476" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#1D4ED8">ready</text>
  <text x="476" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1E40AF">promoted by gw</text>

  <!-- running -->
  <rect x="596" y="170" width="156" height="76" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="674" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#FFFFFF">running</text>
  <text x="674" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#DBEAFE">worker claimed</text>

  <!-- done -->
  <rect x="816" y="170" width="144" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="888" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#065F46">done</text>
  <text x="888" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">unblocks children</text>

  <!-- archived -->
  <rect x="1012" y="170" width="140" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1082" y="203" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#334155">archived</text>
  <text x="1082" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">history kept</text>

  <!-- Main Row Arrows -->
  <line x1="180" y1="208" x2="220" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="356" y1="208" x2="400" y2="208" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="548" y1="208" x2="592" y2="208" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="752" y1="208" x2="812" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="208" x2="1008" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="782" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#334155">complete</text>

  <!-- Lower Branch Nodes (y=328, h=76) -->
  <!-- scheduled -->
  <rect x="224" y="328" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="304" y="359" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#334155">scheduled</text>
  <text x="304" y="381" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">waits for wake time</text>

  <!-- blocked -->
  <rect x="520" y="328" width="180" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="610" y="359" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#991B1B">blocked</text>
  <text x="610" y="381" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B91C1C">needs_input / gave_up</text>

  <!-- review -->
  <rect x="760" y="328" width="200" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="860" y="359" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#92400E">review</text>
  <text x="860" y="381" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309">reviewer profile / checks</text>

  <!-- Branch Arrows -->
  <!-- scheduled -> ready -->
  <path d="M 384 364 L 460 364 L 460 250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- running -> blocked -->
  <path d="M 646 246 L 646 324" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- blocked -> ready (unblock) -->
  <path d="M 520 350 L 492 350 L 492 250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="314" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569">unblock </text>
  <!-- running -> review -->
  <path d="M 712 246 L 712 292 L 820 292 L 820 324" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="768" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#92400E">request_review</text>
  <!-- review -> done -->
  <path d="M 888 328 L 888 250" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="294" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#065F46">approve</text>
  <!-- block loop -> triage note -->
  <text x="48" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Dispatcher ticks every 60s inside hermes gateway: promotes todo to ready, reclaims stale claims (900s TTL), and routes repeated block loops back to triage.</text>
</svg>
