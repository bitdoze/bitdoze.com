<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Mirage virtual terminal architecture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#F8FAFC"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="480" y="28" width="240" height="30" rx="15" fill="#DBEAFE"/>
  <text x="600" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">MIRAGE ARCHITECTURE</text>
  <text x="600" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" text-anchor="middle">Virtual Terminal for AI Agents</text>
  <text x="600" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="middle">In-process Rust bash parser dispatching to VFS mounts, virtual CLIs, and machines through a policy layer</text>

  <!-- Step 1: AI Agent -->
  <rect x="44" y="210" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="44" y="210" width="200" height="42" rx="12" fill="#0F172A"/>
  <rect x="44" y="240" width="200" height="12" fill="#0F172A"/>
  <text x="144" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI Agent</text>
  <text x="144" y="282" font-family="ui-monospace, monospace" font-size="13" fill="#1E293B" text-anchor="middle">ws.shell(...)</text>
  <text x="144" y="308" font-family="ui-monospace, monospace" font-size="13" fill="#1E293B" text-anchor="middle">mirage-bash -c</text>
  <text x="144" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Claude Code, Codex,</text>
  <text x="144" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">OpenCode, Agno, Mastra</text>
  <text x="144" y="382" font-family="ui-monospace, monospace" font-size="11" fill="#2563EB" text-anchor="middle">reads /VFS.md</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="244" y1="305" x2="294" y2="305" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Rust Parser -->
  <rect x="302" y="185" width="236" height="240" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="302" y="185" width="236" height="44" rx="12" fill="#2563EB"/>
  <rect x="302" y="216" width="236" height="13" fill="#2563EB"/>
  <text x="420" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rust Bash Parser (mirage-rs)</text>
  <text x="420" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">In-process execution</text>
  <text x="420" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">No host /bin/bash subprocesses</text>
  <rect x="322" y="294" width="196" height="54" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="420" y="316" font-family="ui-monospace, monospace" font-size="12" fill="#1E293B" text-anchor="middle">pipes | globs | &amp;&amp; ||</text>
  <text x="420" y="336" font-family="ui-monospace, monospace" font-size="12" fill="#2563EB" text-anchor="middle">jq  rg  awk  sed  tar</text>
  <text x="420" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Python (PyO3) &amp; TS (WASM)</text>
  <text x="420" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">2-layer cache (RAM / Redis)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="538" y1="305" x2="588" y2="305" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Policy Layer -->
  <rect x="596" y="165" width="184" height="280" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="614" y="182" width="148" height="28" rx="6" fill="#0F172A"/>
  <text x="688" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">POLICY LAYER</text>
  <text x="688" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">MountMode</text>
  <text x="688" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">READ by default</text>
  <line x1="620" y1="272" x2="756" y2="272" stroke="#E2E8F0" stroke-width="1"/>
  <text x="688" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Profiles &amp; Hooks</text>
  <text x="688" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">hide paths, deny cmds</text>
  <line x1="620" y1="328" x2="756" y2="328" stroke="#E2E8F0" stroke-width="1"/>
  <text x="688" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Network Egress</text>
  <text x="688" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">allow / deny domains</text>
  <line x1="620" y1="384" x2="756" y2="384" stroke="#E2E8F0" stroke-width="1"/>
  <text x="688" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Approval Door</text>
  <text x="688" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">allow / ask / deny</text>

  <!-- Arrows 3 -> Targets -->
  <path d="M 780 230 L 842 230" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 780 305 L 842 305" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 780 385 L 842 385" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Target 1: VFS Mounts -->
  <rect x="850" y="160" width="306" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="870" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Virtual Filesystem Mounts (VFS)</text>
  <text x="870" y="212" font-family="ui-monospace, monospace" font-size="12" fill="#2563EB">/s3  /docs  /slack  /github  /data</text>
  <text x="870" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Object storage, Drives, DB views, Chat, RAM</text>
  <text x="870" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Optional host mount: FUSE / FSKit / NFS</text>

  <!-- Target 2: Virtual CLIs -->
  <rect x="850" y="290" width="306" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="870" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Virtual CLIs (clis:)</text>
  <text x="870" y="342" font-family="ui-monospace, monospace" font-size="12" fill="#2563EB">git  gh  slack  office  linear  MCP</text>
  <text x="870" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">MCP servers wrapped as single CLIs (SKILL.md)</text>

  <!-- Target 3: Machines -->
  <rect x="850" y="402" width="306" height="88" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="870" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Machine Router</text>
  <text x="870" y="454" font-family="ui-monospace, monospace" font-size="12" fill="#2563EB">SSH  Docker  Kubernetes  monty/quickjs</text>
  <text x="870" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Run programs across remote or sandboxed hosts</text>

  <!-- Footer Strip -->
  <rect x="44" y="534" width="1112" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">One workspace tree · Portable tar/S3 snapshots · Multi-worker HTTP server (:8765) · Tested on Mirage v0.0.8</text>
</svg>
