<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Mirage policy layer and approval doors">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.25"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="490" y="26" width="220" height="30" rx="15" fill="#DBEAFE"/>
  <text x="600" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.2">MIRAGE POLICY LAYER</text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="800" fill="#0F172A" text-anchor="middle">Command, Path, and Network Policy Doors</text>
  <text x="600" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Stricter rule always wins; every decision flows to Allow, Approval Door, or Deny and is logged</text>

  <!-- Left: Session / Agent -->
  <rect x="44" y="210" width="210" height="175" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="44" y="210" width="210" height="40" rx="12" fill="#0F172A"/>
  <rect x="44" y="238" width="210" height="12" fill="#0F172A"/>
  <text x="149" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agent Session</text>
  <text x="149" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Profile: analyst</text>
  <text x="149" y="304" font-family="ui-monospace, monospace" font-size="12" fill="#475569" text-anchor="middle">cp /s3/a /data/b</text>
  <text x="149" y="328" font-family="ui-monospace, monospace" font-size="12" fill="#475569" text-anchor="middle">rm -rf /s3</text>
  <text x="149" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle">Dry-run: --explain</text>

  <!-- Arrows Session -> 3 Doors -->
  <path d="M 254 255 L 322 195" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 254 297 L 322 297" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 254 340 L 322 400" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Middle: Three Policy Doors -->
  <!-- Command Door -->
  <rect x="330" y="148" width="330" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">1. Command Door</text>
  <text x="350" y="200" font-family="ui-monospace, monospace" font-size="12" fill="#1D4ED8">allow: [ls, cat, grep] · ask: [cp, mv]</text>
  <text x="350" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">deny list + Python/JS pre_command policy scripts</text>

  <!-- Path Door -->
  <rect x="330" y="252" width="330" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">2. Path &amp; Mount Door</text>
  <text x="350" y="304" font-family="ui-monospace, monospace" font-size="12" fill="#1D4ED8">MountMode.READ default · paths.hide</text>
  <text x="350" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Hidden paths vanish from ls, grep, and VFS.md</text>

  <!-- Network Door -->
  <rect x="330" y="356" width="330" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">3. Network Egress Door</text>
  <text x="350" y="408" font-family="ui-monospace, monospace" font-size="12" fill="#1D4ED8">allowed_domains / denied_domains</text>
  <text x="350" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Refused hosts fail with EACCES; routes &amp; metadata block</text>

  <!-- Arrows Doors -> Outcomes -->
  <path d="M 660 194 L 742 194" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 660 298 L 742 298" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 660 402 L 742 402" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Right: Outcomes -->
  <!-- ALLOW -->
  <rect x="750" y="148" width="406" height="92" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <rect x="770" y="168" width="84" height="26" rx="6" fill="#16A34A"/>
  <text x="812" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALLOW</text>
  <text x="870" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#14532D">Execute in workspace</text>
  <text x="770" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#166534">Runs within resource limits (max_memory, walk_limit, capacity)</text>

  <!-- ASK / Approval Door -->
  <rect x="750" y="252" width="406" height="92" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <rect x="770" y="272" width="84" height="26" rx="6" fill="#D97706"/>
  <text x="812" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ASK</text>
  <text x="870" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#78350F">Pause at Approval Door</text>
  <text x="770" y="322" font-family="ui-monospace, monospace" font-size="12" fill="#92400E">ws.decisions.answer(id, Outcome.ALLOW, Scope.SESSION)</text>

  <!-- DENY -->
  <rect x="750" y="356" width="406" height="92" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <rect x="770" y="376" width="84" height="26" rx="6" fill="#DC2626"/>
  <text x="812" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">DENY</text>
  <text x="870" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7F1D1D">Refuse before execution</text>
  <text x="770" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#991B1B">Returns exit code 2 without throwing; inspect reason with --explain</text>

  <!-- Arrows down to Ledger -->
  <line x1="953" y1="448" x2="953" y2="494" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <line x1="495" y1="448" x2="495" y2="494" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <!-- Bottom: Decision Ledger -->
  <rect x="44" y="502" width="1112" height="64" rx="12" fill="#0F172A"/>
  <text x="600" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Decision Ledger (Queryable Audit Log)</text>
  <text x="600" y="551" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Records every command, path, and network evaluation with outcome, profile, and human approval scope</text>
</svg>
