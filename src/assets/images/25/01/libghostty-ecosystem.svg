<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>libghostty ecosystem</title>
  <desc>libghostty engine at the center with consumers around it: Ghostty GUI on macOS and Linux, cmux on macOS and iOS, SSH and Mosh clients, embedded terminals in OrbStack VS Code and Obsidian, platform ports for Windows Android and WebAssembly, and production tools Turborepo and bombadil</desc>
  <rect width="960" height="480" rx="16" fill="#0b1220"/>

  <g stroke="#3b4b63" stroke-width="2">
    <line x1="480" y1="240" x2="175" y2="105"/>
    <line x1="480" y1="240" x2="785" y2="105"/>
    <line x1="480" y1="240" x2="155" y2="240"/>
    <line x1="480" y1="240" x2="805" y2="240"/>
    <line x1="480" y1="240" x2="175" y2="375"/>
    <line x1="480" y1="240" x2="785" y2="375"/>
  </g>

  <rect x="355" y="192" width="250" height="96" rx="14" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
  <text x="480" y="230" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">libghostty</text>
  <text x="480" y="254" text-anchor="middle" fill="#dbeafe" font-size="12">Zig: VT parsing · fonts · rendering</text>
  <text x="480" y="272" text-anchor="middle" fill="#dbeafe" font-size="12">C ABI, embeddable anywhere</text>

  <rect x="55" y="72" width="240" height="66" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="99" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Ghostty GUI</text>
  <text x="175" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">macOS (Swift/AppKit) · Linux (GTK4)</text>

  <rect x="665" y="72" width="240" height="66" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="785" y="99" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">cmux</text>
  <text x="785" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">macOS + iOS beta · agent workspaces</text>

  <rect x="35" y="207" width="240" height="66" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="155" y="234" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">SSH / Mosh clients</text>
  <text x="155" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">Echo · Geistty · Spectty</text>

  <rect x="685" y="207" width="240" height="66" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="805" y="234" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Embedded terminals</text>
  <text x="805" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">OrbStack · VS Code · Obsidian</text>

  <rect x="55" y="342" width="240" height="66" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="369" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Platform ports</text>
  <text x="175" y="390" text-anchor="middle" fill="#94a3b8" font-size="11">Windows · Android · WebAssembly</text>

  <rect x="665" y="342" width="240" height="66" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="785" y="369" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Production users</text>
  <text x="785" y="390" text-anchor="middle" fill="#94a3b8" font-size="11">Turborepo (Vercel) · bombadil (Antithesis)</text>

  <text x="480" y="455" text-anchor="middle" fill="#64748b" font-size="12">One terminal engine, many frontends: config and rendering stay consistent across apps</text>
</svg>
