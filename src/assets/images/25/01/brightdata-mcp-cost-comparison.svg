<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="bd3Title bd3Desc">
  <title id="bd3Title">Cost comparison: BrightData MCP free tier vs traditional scraping</title>
  <desc id="bd3Desc">BrightData MCP's free tier covers 5,000 requests per month at no cost, covering every tool: roughly 500 requests for a content creator, 2,000 for market research, 5,000 for a small e-commerce operation, and 10,000-plus for a data-heavy operation at an estimated 100 to 500 dollars per month. A traditional scraping stack of residential proxies, servers and parser maintenance sits at 200 to 1,000 dollars per month once labour is counted.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="240" fill="url(#blobIndigo)"/>
  <circle cx="620" cy="670" r="260" fill="url(#blobCyan)"/>
  <circle cx="1080" cy="130" r="240" fill="url(#blobPink)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="28" font-weight="800" fill="#0F172A">What scraping actually costs</text>
    <text x="600" y="76" font-size="15" fill="#64748B">BrightData MCP free tier vs a traditional scraping stack</text>
  </g>

  <!-- BrightData card -->
  <rect x="60" y="120" width="500" height="350" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="88" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0E7490">BrightData MCP</text>
  <text x="88" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#0F172A">$0</text>
  <text x="212" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0E7490">free tier</text>
  <text x="212" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">5,000 requests / month, all tools</text>
  <line x1="88" y1="290" x2="532" y2="290" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="88" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">SCENARIOS</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <text x="88" y="344" fill="#0F172A">Content creator</text>
    <text x="360" y="344" text-anchor="end" font-size="12.5" fill="#64748B">~500 / mo</text>
    <text x="382" y="344" fill="#0E7490">covered by free tier</text>
    <line x1="88" y1="356" x2="532" y2="356" stroke="#F1F5F9" stroke-width="1.2"/>

    <text x="88" y="380" fill="#0F172A">Market research</text>
    <text x="360" y="380" text-anchor="end" font-size="12.5" fill="#64748B">~2,000 / mo</text>
    <text x="382" y="380" fill="#0E7490">still inside free tier</text>
    <line x1="88" y1="392" x2="532" y2="392" stroke="#F1F5F9" stroke-width="1.2"/>

    <text x="88" y="416" fill="#0F172A">Small e-commerce</text>
    <text x="360" y="416" text-anchor="end" font-size="12.5" fill="#64748B">~5,000 / mo</text>
    <text x="382" y="416" fill="#B45309">exactly at the line</text>
    <line x1="88" y1="428" x2="532" y2="428" stroke="#F1F5F9" stroke-width="1.2"/>

    <text x="88" y="452" fill="#0F172A">Data-heavy</text>
    <text x="360" y="452" text-anchor="end" font-size="12.5" fill="#64748B">10,000+</text>
    <text x="382" y="452" fill="#BE185D">$100-500 / mo</text>
  </g>

  <!-- traditional card -->
  <rect x="640" y="120" width="500" height="350" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="668" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#BE185D">Traditional scraping stack</text>
  <text x="668" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">residential proxies + servers + labour</text>
  <text x="668" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0F172A">$200-1,000</text>
  <text x="952" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#64748B">/mo</text>
  <line x1="668" y1="290" x2="1112" y2="290" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="668" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">COST DRIVERS</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <text x="668" y="346" fill="#0F172A">Residential proxy bandwidth</text>
    <text x="1112" y="346" text-anchor="end" font-size="12.5" fill="#64748B">metered per GB</text>
    <line x1="668" y1="358" x2="1112" y2="358" stroke="#F1F5F9" stroke-width="1.2"/>

    <text x="668" y="382" fill="#0F172A">Servers and queues</text>
    <text x="1112" y="382" text-anchor="end" font-size="12.5" fill="#64748B">you run and patch</text>
    <line x1="668" y1="394" x2="1112" y2="394" stroke="#F1F5F9" stroke-width="1.2"/>

    <text x="668" y="418" fill="#0F172A">Parser maintenance</text>
    <text x="1112" y="418" text-anchor="end" font-size="12.5" fill="#64748B">hours every month</text>
  </g>
  <text x="668" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#BE185D">An order of magnitude above free once labour counts</text>

  <!-- vs -->
  <circle cx="600" cy="295" r="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="600" y="303" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#64748B">vs</text>

  <rect x="200" y="504" width="800" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="600" y="532" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338CA">The free tier skips the infrastructure decision until data justifies paying for it</text>
  <text x="600" y="554" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Estimates, not quotes — proxy bandwidth, browser flows and labour all scale with volume</text>

  <text x="600" y="620" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">BrightData pricing as of 2026 · traditional stack cost ranges from operator reports</text>
</svg>
