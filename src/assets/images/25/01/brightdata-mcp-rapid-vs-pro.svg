<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="bd2Title bd2Desc">
  <title id="bd2Title">Base tools vs structured tools decision chart</title>
  <desc id="bd2Desc">A decision: if you need typed fields or browser automation, use the web_data collectors and scraping_browser tools for typed JSON and coverage of Amazon, LinkedIn, Instagram, Facebook, TikTok, Walmart, eBay and Zillow. Otherwise stay on the base tools: search, Markdown scraping, batch scraping and session stats. Every account gets all tools; the 5,000-requests-per-month free tier covers both.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="240" fill="url(#blobIndigo)"/>
  <circle cx="1090" cy="590" r="250" fill="url(#blobPink)"/>
  <circle cx="1050" cy="100" r="220" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="28" font-weight="800" fill="#0F172A">Base vs structured tools: pick by output</text>
    <text x="600" y="76" font-size="15" fill="#64748B">One free tier covers all of it — the tools differ, not the plan</text>
  </g>

  <!-- decision diamond -->
  <polygon points="600,108 780,158 600,208 420,158" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-weight="700" fill="#4338CA">
    <text x="600" y="152" font-size="13.5">Need typed fields or</text>
    <text x="600" y="172" font-size="13.5">browser automation?</text>
  </g>

  <!-- branches -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <path d="M420 158 H310 V300"/>
    <path d="M780 158 H890 V300"/>
  </g>
  <text x="352" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0E7490">No</text>
  <text x="848" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#BE185D">Yes</text>

  <!-- Rapid card -->
  <rect x="60" y="310" width="500" height="262" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="84" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0E7490">Base tools</text>
  <rect x="410" y="324" width="112" height="28" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
  <text x="466" y="343" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0E7490">cheapest calls</text>
  <text x="84" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Generic scraping and search · one request per call</text>
  <text x="84" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOOLS</text>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7490">
    <rect x="84" y="414" width="215" height="34" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
    <text x="191" y="436">search_engine</text>
    <rect x="311" y="414" width="215" height="34" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
    <text x="418" y="436">scrape_as_markdown</text>
    <rect x="84" y="456" width="215" height="34" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
    <text x="191" y="478">scrape_batch</text>
    <rect x="311" y="456" width="215" height="34" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
    <text x="418" y="478">session_stats</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">
    <text x="84" y="516"><tspan font-weight="700" fill="#0F172A">Output:</tspan> Markdown from a SERP or a page</text>
    <text x="84" y="544"><tspan font-weight="700" fill="#0F172A">Good for:</tspan> content research · competitor pages · URL → agent</text>
  </g>

  <!-- Pro card -->
  <rect x="640" y="310" width="500" height="262" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="664" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#BE185D">Structured + browser</text>
  <rect x="990" y="324" width="126" height="28" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
  <text x="1053" y="343" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#BE185D">same free tier</text>
  <text x="664" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748B">Typed collectors and browser flows, more requests per job</text>
  <text x="664" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOOLS</text>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="12" font-weight="600" fill="#BE185D">
    <rect x="664" y="414" width="215" height="34" rx="10" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
    <text x="771" y="436">web_data_* collectors</text>
    <rect x="891" y="414" width="215" height="34" rx="10" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
    <text x="998" y="436">scraping_browser_*</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">
    <text x="664" y="478"><tspan font-weight="700" fill="#0F172A">Coverage:</tspan> Amazon · LinkedIn · Instagram · Facebook</text>
    <text x="664" y="500">TikTok · Walmart · eBay · Zillow</text>
    <text x="664" y="528"><tspan font-weight="700" fill="#0F172A">Output:</tspan> typed JSON — price, rating, reviews, job title</text>
    <text x="664" y="556"><tspan font-weight="700" fill="#0F172A">Good for:</tspan> affiliate data · lead lists · price monitoring</text>
  </g>

  <text x="600" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">All tools on by default · the 5,000 req/mo free tier covers both — structured jobs just burn it faster</text>
  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">Illustrative tool mapping · check the current BrightData docs for the exact list</text>
</svg>
