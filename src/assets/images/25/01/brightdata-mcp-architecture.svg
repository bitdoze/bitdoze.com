<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="bd1Title bd1Desc">
  <title id="bd1Title">BrightData MCP request flow</title>
  <desc id="bd1Desc">AI clients including Claude Code, Cursor, Windsurf and Droid CLI connect to the BrightData MCP server over local stdio or the remote hosted endpoint. The server routes tool calls such as search_engine, scrape_as_markdown and the web_data collectors through BrightData's Web Unlocker, browser automation and structured collectors to targets such as Amazon, LinkedIn, Instagram and search engines. The result returns as clean Markdown or typed JSON.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="150" cy="110" r="240" fill="url(#blobIndigo)"/>
  <circle cx="600" cy="670" r="260" fill="url(#blobPink)"/>
  <circle cx="1080" cy="120" r="240" fill="url(#blobCyan)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.2"/>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="28" font-weight="800" fill="#0F172A">How a BrightData MCP request flows</text>
    <text x="600" y="76" font-size="15" fill="#64748B">One tool call in, clean Markdown or typed JSON out</text>
  </g>

  <!-- card shells -->
  <g fill="#FFFFFF" fill-opacity="0.9">
    <rect x="40" y="140" width="220" height="330" rx="18" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="300" y="140" width="240" height="330" rx="18" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="580" y="140" width="250" height="330" rx="18" stroke="#A5F3FC" stroke-width="1.5"/>
    <rect x="870" y="140" width="290" height="330" rx="18" stroke="#FBCFE8" stroke-width="1.5"/>
  </g>

  <!-- column 1: AI clients -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="58" y="174" font-size="15" font-weight="800" fill="#4338CA">1 · AI clients</text>
    <text x="58" y="192" font-size="11.5" fill="#64748B">already in your stack</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0F172A">
    <rect x="58" y="216" width="184" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="150" y="241">Claude Code</text>
    <rect x="58" y="268" width="184" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="150" y="293">Cursor</text>
    <rect x="58" y="320" width="184" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="150" y="345">Windsurf</text>
    <rect x="58" y="372" width="184" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="150" y="397">Droid CLI</text>
  </g>
  <text x="150" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">any MCP client works</text>

  <!-- column 2: MCP server -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="318" y="174" font-size="15" font-weight="800" fill="#4338CA">2 · MCP server</text>
    <text x="318" y="192" font-size="11.5" fill="#64748B">one install, two transports</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338CA">
    <rect x="318" y="210" width="98" height="36" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="367" y="233">local stdio</text>
    <rect x="424" y="210" width="98" height="36" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="473" y="233">remote hosted</text>
  </g>
  <text x="318" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOOLS</text>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="12" font-weight="600" fill="#4338CA">
    <rect x="318" y="284" width="204" height="30" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="420" y="304">search_engine</text>
    <rect x="318" y="322" width="204" height="30" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="420" y="342">scrape_as_markdown</text>
    <rect x="318" y="360" width="204" height="30" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="420" y="380">web_data_* collectors</text>
    <rect x="318" y="398" width="204" height="30" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="420" y="418">scraping_browser_*</text>
  </g>
  <text x="420" y="452" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">the agent picks the tool</text>

  <!-- column 3: BrightData network -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="598" y="174" font-size="15" font-weight="800" fill="#0E7490">3 · BrightData network</text>
    <text x="598" y="192" font-size="11.5" fill="#64748B">the part you don't run</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="598" y="212" width="214" height="72" rx="12" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="614" y="238" font-size="14" font-weight="800" fill="#0E7490">Web Unlocker</text>
    <text x="614" y="257" font-size="11.5" fill="#475569">proxy rotation · CAPTCHA</text>
    <text x="614" y="273" font-size="11.5" fill="#475569">anti-bot handled upstream</text>

    <rect x="598" y="296" width="214" height="72" rx="12" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="614" y="322" font-size="14" font-weight="800" fill="#0E7490">Browser automation</text>
    <text x="614" y="341" font-size="11.5" fill="#475569">click · type · scroll</text>
    <text x="614" y="357" font-size="11.5" fill="#475569">5-15 requests per flow</text>

    <rect x="598" y="380" width="214" height="72" rx="12" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="614" y="406" font-size="14" font-weight="800" fill="#0E7490">Structured collectors</text>
    <text x="614" y="425" font-size="11.5" fill="#475569">web_data_* parsers</text>
    <text x="614" y="441" font-size="11.5" fill="#475569">typed, stable fields</text>
  </g>

  <!-- column 4: targets -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="888" y="174" font-size="15" font-weight="800" fill="#BE185D">4 · Targets</text>
    <text x="888" y="192" font-size="11.5" fill="#64748B">sites and SERPs</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0F172A">
    <rect x="888" y="212" width="254" height="40" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="1015" y="237">Amazon</text>
    <rect x="888" y="264" width="254" height="40" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="1015" y="289">LinkedIn</text>
    <rect x="888" y="316" width="254" height="40" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="1015" y="341">Instagram</text>
    <rect x="888" y="368" width="254" height="40" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <text x="1015" y="393">Search engines</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-size="11.5" fill="#64748B">
    <text x="1015" y="432">+ Facebook · TikTok · Walmart · eBay</text>
    <text x="1015" y="450">+ Zillow · any page as Markdown</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <line x1="260" y1="305" x2="300" y2="305"/>
    <line x1="540" y1="305" x2="580" y2="305"/>
    <line x1="830" y1="305" x2="870" y2="305"/>
  </g>

  <!-- return path -->
  <path d="M1015 470 V 528 H 150 V 470" fill="none" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="600" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#4338CA">clean Markdown · typed JSON back to the model</text>

  <rect x="250" y="556" width="700" height="46" rx="14" fill="#EEF2FF" fill-opacity="0.9" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="600" y="584" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4338CA">Steps 3 and 4 are invisible: proxies, bot detection and parsers all run upstream</text>

  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Illustrative flow · one tool call may fan out to several upstream requests</text>
</svg>
