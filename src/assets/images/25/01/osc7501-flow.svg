<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>OSC 7501 program status flow</title>
  <desc>A coding agent reporting a blocked state through the PTY via OSC 7501, received by a terminal or agentic inbox such as Herdr, cmux, or Agent Deck</desc>
  <rect width="960" height="240" rx="16" fill="#0b1220"/>

  <rect x="40" y="70" width="250" height="100" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="165" y="106" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Coding agent</text>
  <text x="165" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">blocked: permission requested</text>
  <text x="165" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">Claude Code · Codex CLI · OpenCode</text>

  <line x1="295" y1="120" x2="355" y2="120" stroke="#3b4b63" stroke-width="2"/>
  <polygon points="355,114 367,120 355,126" fill="#3b4b63"/>
  <text x="331" y="104" text-anchor="middle" fill="#64748b" font-size="10">OSC 7501</text>

  <rect x="370" y="70" width="220" height="100" rx="12" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
  <text x="480" y="106" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">PTY escape sequence</text>
  <text x="480" y="130" text-anchor="middle" fill="#dbeafe" font-size="11">state=blocked:kind=permission</text>
  <text x="480" y="150" text-anchor="middle" fill="#dbeafe" font-size="11">traverses SSH and containers</text>

  <line x1="595" y1="120" x2="655" y2="120" stroke="#3b4b63" stroke-width="2"/>
  <polygon points="655,114 667,120 655,126" fill="#3b4b63"/>

  <rect x="670" y="70" width="250" height="100" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="795" y="106" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Terminal / agentic inbox</text>
  <text x="795" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">Herdr · cmux · Agent Deck</text>
  <text x="795" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">renders state however it wants</text>

  <text x="480" y="215" text-anchor="middle" fill="#64748b" font-size="12">No screen scraping, no per-app socket: the agent reports its own status through the terminal session</text>
</svg>
