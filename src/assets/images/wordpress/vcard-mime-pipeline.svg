<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">WordPress MIME validation for a .vcf upload (wp_check_filetype_and_ext)</text>

  <!-- Box A: upload -->
  <rect x="340" y="46" width="280" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Media upload: contact.vcf</text>

  <!-- Arrow A -> B -->
  <line x1="480" y1="92" x2="480" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box B: wp_check_filetype -->
  <rect x="250" y="122" width="460" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">wp_check_filetype(): extension &#8594; MIME map</text>
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#64748b">the upload_mimes filter runs here</text>

  <!-- Annotation: filter 1 -->
  <rect x="730" y="122" width="214" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="837" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Filter 1 (upload_mimes)</text>
  <text x="837" y="166" text-anchor="middle" font-size="12" fill="#1e3a8a">adds vcf / vcard &#8594; text/vcard</text>
  <line x1="728" y1="153" x2="712" y2="153" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Arrow B -> C -->
  <line x1="480" y1="184" x2="480" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box C: finfo -->
  <rect x="250" y="214" width="460" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">wp_check_filetype_and_ext(): finfo_file() reads the real file</text>
  <text x="480" y="262" text-anchor="middle" font-size="12" fill="#64748b">compares the real MIME type to the expected type</text>

  <!-- Drop + bus -->
  <line x1="480" y1="276" x2="480" y2="306" stroke="#475569" stroke-width="2"/>
  <line x1="125" y1="306" x2="833" y2="306" stroke="#475569" stroke-width="2"/>
  <line x1="125" y1="306" x2="125" y2="318" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="361" y1="306" x2="361" y2="318" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>
  <line x1="597" y1="306" x2="597" y2="318" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>
  <line x1="833" y1="306" x2="833" y2="318" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>

  <!-- Branch 1: text/vcard accepted -->
  <rect x="16" y="322" width="218" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="346" text-anchor="middle" font-size="11" fill="#166534">finfo reports:</text>
  <text x="125" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">text/vcard</text>
  <text x="125" y="386" text-anchor="middle" font-size="11" fill="#166534">exact match</text>
  <text x="125" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Accepted</text>

  <!-- Branch 2: text/x-vcard rejected -->
  <rect x="252" y="322" width="218" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="361" y="346" text-anchor="middle" font-size="11" fill="#991b1b">finfo reports:</text>
  <text x="361" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">text/x-vcard</text>
  <text x="361" y="386" text-anchor="middle" font-size="11" fill="#991b1b">legacy label, not an exact match</text>
  <text x="361" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Rejected</text>

  <!-- Branch 3: text/plain rejected -->
  <rect x="488" y="322" width="218" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="597" y="346" text-anchor="middle" font-size="11" fill="#991b1b">finfo reports:</text>
  <text x="597" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">text/plain</text>
  <text x="597" y="386" text-anchor="middle" font-size="11" fill="#991b1b">not in the text/plain allowlist</text>
  <text x="597" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Rejected</text>

  <!-- Branch 4: octet-stream rejected -->
  <rect x="724" y="322" width="218" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="833" y="346" text-anchor="middle" font-size="11" fill="#991b1b">finfo reports:</text>
  <text x="833" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">application/octet-stream</text>
  <text x="833" y="386" text-anchor="middle" font-size="11" fill="#991b1b">nonspecific type, text/* expected</text>
  <text x="833" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Rejected</text>

  <!-- Rescue arrows -->
  <line x1="361" y1="422" x2="424" y2="482" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="597" y1="422" x2="597" y2="482" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="833" y1="422" x2="770" y2="482" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="300" y="458" text-anchor="middle" font-size="12" fill="#1d4ed8">rescued by filter 2</text>

  <!-- Filter 2 rescue box -->
  <rect x="252" y="486" width="690" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="597" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Filter 2 (wp_check_filetype_and_ext) runs for .vcf / .vcard files only</text>
  <text x="597" y="534" text-anchor="middle" font-size="12" fill="#1e3a8a">allowlists text/x-vcard, text/plain, application/octet-stream &#8594; sets type = text/vcard</text>
  <text x="597" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Accepted</text>

  <!-- Caption -->
  <text x="480" y="598" text-anchor="middle" font-size="12" fill="#334155">Without filter 2, three of four real-MIME outcomes are rejected even when filter 1 is installed.</text>
  <text x="480" y="618" text-anchor="middle" font-size="12" fill="#334155">Core logic: wp_check_filetype_and_ext(), verified in WordPress 6.6 and 7.1.4 source.</text>
</svg>
