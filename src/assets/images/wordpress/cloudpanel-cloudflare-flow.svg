<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Cloudflare traffic flow with Allow traffic from Cloudflare only enabled">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Allow traffic from Cloudflare only: what the toggle does</text>

  <defs>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Visitor -->
  <rect x="50" y="170" width="130" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="197" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Visitor</text>
  <text x="115" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">browser or bot</text>

  <!-- Cloudflare WAF -->
  <rect x="300" y="100" width="230" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="415" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9a3412">Cloudflare WAF</text>
  <text x="415" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#9a3412">proxied DNS (orange cloud)</text>

  <!-- Origin server -->
  <rect x="660" y="90" width="200" height="180" rx="8" fill="#dbeafe" stroke="#4338ca" stroke-width="1.5"/>
  <text x="760" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Origin server</text>
  <text x="760" y="159" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">(CloudPanel)</text>
  <text x="760" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#3730a3">accepts Cloudflare</text>
  <text x="760" y="201" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#3730a3">IP ranges only</text>

  <!-- DNS-only (grey cloud) -->
  <rect x="300" y="262" width="230" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="415" y="291" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">DNS-only (grey cloud)</text>
  <text x="415" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">skips Cloudflare entirely</text>

  <!-- Allowed path: visitor -> WAF -->
  <line x1="182" y1="185" x2="294" y2="145" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="238" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">requests inspected</text>

  <!-- Allowed path: WAF -> origin -->
  <line x1="532" y1="140" x2="654" y2="140" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="593" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">clean traffic</text>

  <!-- Blocked path: visitor -> grey cloud -->
  <line x1="182" y1="218" x2="294" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="228" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">direct to origin IP</text>

  <!-- Blocked path: grey cloud -> origin (refused) -->
  <line x1="532" y1="297" x2="636" y2="270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="636" y1="258" x2="652" y2="274" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="652" y1="258" x2="636" y2="274" stroke="#dc2626" stroke-width="2.5"/>
  <text x="586" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b91c1c">refused: not a Cloudflare IP</text>

  <text x="450" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">With the toggle on, the grey-cloud path is refused at Nginx (Cloudflare IP allowlist). Proxied DNS is a hard prerequisite.</text>
</svg>
