<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Visitor -->
  <rect x="280" y="10" width="160" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="37" text-anchor="middle" fill="#1565c0" font-weight="600">Visitor request</text>

  <!-- Arrow down -->
  <line x1="360" y1="54" x2="360" y2="86" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cloudflare -->
  <rect x="240" y="88" width="240" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="360" y="110" text-anchor="middle" fill="#e65100" font-weight="600">Cloudflare edge cache</text>
  <text x="360" y="128" text-anchor="middle" fill="#bf360c" font-size="12">cf-cache-status header</text>

  <!-- HIT branch right from Cloudflare -->
  <line x1="480" y1="114" x2="600" y2="114" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="602" y="94" width="100" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="652" y="110" text-anchor="middle" fill="#2e7d32" font-weight="600" font-size="12">HIT</text>
  <text x="652" y="126" text-anchor="middle" fill="#2e7d32" font-size="11">serve from edge</text>

  <!-- MISS arrow down -->
  <line x1="360" y1="140" x2="360" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="162" fill="#c62828" font-size="12" font-weight="600">MISS</text>

  <!-- Varnish -->
  <rect x="240" y="174" width="240" height="52" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="360" y="196" text-anchor="middle" fill="#6a1b9a" font-weight="600">Varnish :6081</text>
  <text x="360" y="214" text-anchor="middle" fill="#4a148c" font-size="12">x-cache-age header</text>

  <!-- HIT branch right from Varnish -->
  <line x1="480" y1="200" x2="600" y2="200" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="602" y="180" width="100" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="652" y="196" text-anchor="middle" fill="#2e7d32" font-weight="600" font-size="12">HIT</text>
  <text x="652" y="212" text-anchor="middle" fill="#2e7d32" font-size="11">serve cached HTML</text>

  <!-- MISS arrow down -->
  <line x1="360" y1="226" x2="360" y2="258" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="248" fill="#c62828" font-size="12" font-weight="600">MISS</text>

  <!-- PHP-FPM -->
  <rect x="260" y="260" width="200" height="48" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="360" y="289" text-anchor="middle" fill="#283593" font-weight="600">PHP-FPM (WordPress)</text>

  <!-- Arrow to Redis -->
  <line x1="360" y1="308" x2="360" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="330" fill="#555" font-size="11">object / query reads</text>

  <!-- Redis -->
  <rect x="260" y="342" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="360" y="365" text-anchor="middle" fill="#b71c1c" font-weight="600">Redis object cache</text>
  <text x="360" y="381" text-anchor="middle" fill="#c62828" font-size="11">wp-content/object-cache.php</text>

  <!-- Arrow to MySQL -->
  <line x1="360" y1="390" x2="360" y2="422" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="412" fill="#555" font-size="11">cache miss only</text>

  <!-- MySQL -->
  <rect x="270" y="424" width="180" height="44" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="360" y="451" text-anchor="middle" fill="#00695c" font-weight="600">MariaDB / MySQL</text>

  <!-- Legend -->
  <rect x="20" y="470" width="16" height="12" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="42" y="481" fill="#555" font-size="12">Cache HIT — served without PHP</text>
  <rect x="280" y="470" width="16" height="12" rx="3" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="302" y="481" fill="#555" font-size="12">Cache MISS — falls through to next layer</text>

  <text x="360" y="510" text-anchor="middle" fill="#999" font-size="11">Three-layer WordPress caching request flow: Cloudflare, Varnish, Redis</text>
</svg>
