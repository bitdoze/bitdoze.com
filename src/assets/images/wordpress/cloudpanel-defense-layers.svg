<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" role="img" aria-label="Defense in layers diagram for CloudPanel hardening">
  <rect width="900" height="545" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Defense in layers: where each step plugs in</text>

  <!-- Layer 1: cloud firewall -->
  <rect x="40" y="64" width="820" height="440" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="58" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#3730a3">Cloud firewall / security groups</text>
  <text x="838" y="89" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6366f1">step 3</text>

  <!-- Layer 2: panel firewall -->
  <rect x="95" y="102" width="710" height="364" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="113" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#3730a3">Panel firewall: SSH 22 + admin 8443, your IP only</text>
  <text x="783" y="127" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6366f1">step 3</text>

  <!-- Layer 3: SSL + 2FA + Basic Auth -->
  <rect x="150" y="140" width="600" height="288" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="168" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1e40af">SSL + 2FA + Basic Auth (who gets in)</text>
  <text x="728" y="165" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6">steps 2, 3 &amp; 4</text>

  <!-- Layer 4: deny rules + WAF -->
  <rect x="205" y="178" width="490" height="212" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="223" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#155e75">Nginx deny rules + Cloudflare WAF (what gets served)</text>
  <text x="673" y="203" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0891b2">steps 8 &amp; 9</text>

  <!-- Layer 5: data core -->
  <rect x="260" y="216" width="380" height="136" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="272" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400e">Data: MySQL on localhost + tested backups</text>
  <text x="450" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">steps 5 &amp; 10</text>

  <!-- inward arrow -->
  <defs>
    <marker id="arrowIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="700" y1="440" x2="620" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowIn)"/>
  <text x="706" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">traffic flows inward: every layer catches</text>
  <text x="706" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">what the previous one misses</text>
</svg>
