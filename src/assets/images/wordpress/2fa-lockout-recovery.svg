<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Diagram showing the WordPress 2FA lockout recovery flow: try a backup code, ask another admin to reset, deactivate the plugin over WP-CLI or rename the plugin folder over SFTP, then re-enable and reconfigure">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Locked out? Recovery ladder, cheapest first</text>
  <text x="30" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Start here: you cannot log in because the 2FA device is gone</text>

  <defs>
    <marker id="arrowNext" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="30" y="98" width="190" height="148" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="46" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#065f46">1. Try a backup code</text>
  <text x="46" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857">Any unused code from the</text>
  <text x="46" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857">16-digit set you saved.</text>
  <text x="46" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857">Fastest fix, no waiting.</text>
  <text x="46" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#059669">do this first</text>

  <!-- Step 2 -->
  <rect x="255" y="98" width="190" height="148" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="271" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e40af">2. Ask another admin</text>
  <text x="271" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8">WP 2FA lets an admin reset</text>
  <text x="271" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8">your 2FA from the Users</text>
  <text x="271" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8">screen. You log in with the</text>
  <text x="271" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8">password and set up again.</text>

  <!-- Step 3 -->
  <rect x="480" y="98" width="190" height="148" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="496" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">3. Disable the plugin</text>
  <text x="496" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#b45309">wp plugin deactivate wp-2fa</text>
  <text x="496" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">over SSH (WP-CLI), or rename</text>
  <text x="496" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">wp-content/plugins/wp-2fa</text>
  <text x="496" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">over SFTP. Last resort.</text>

  <!-- Step 4 -->
  <rect x="705" y="98" width="165" height="148" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="721" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">4. Reconfigure</text>
  <text x="721" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Log in with the password,</text>
  <text x="721" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">restore the folder name,</text>
  <text x="721" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">set 2FA up again and</text>
  <text x="721" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">generate fresh backup</text>
  <text x="721" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">codes.</text>

  <!-- arrows -->
  <line x1="222" y1="172" x2="251" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowNext)"/>
  <line x1="447" y1="172" x2="476" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowNext)"/>
  <line x1="672" y1="172" x2="701" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowNext)"/>

  <!-- caption -->
  <text x="30" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Know how you will reach step 3 before you enforce 2FA on the only admin account.</text>
  <text x="30" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Steps 3 and 4 need filesystem access: keep SSH or SFTP working, and test it while you can still log in.</text>
</svg>
