<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Publish event -->
  <rect x="270" y="16" width="180" height="48" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="38" text-anchor="middle" fill="#1565c0" font-weight="600">Publish / update</text>
  <text x="360" y="54" text-anchor="middle" fill="#1565c0" font-size="12">post, page, product saved</text>

  <!-- Split arrows -->
  <line x1="310" y1="64" x2="200" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="64" x2="520" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CLP Varnish Cache -->
  <rect x="80" y="110" width="230" height="56" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="195" y="133" text-anchor="middle" fill="#6a1b9a" font-weight="600">CLP Varnish Cache plugin</text>
  <text x="195" y="152" text-anchor="middle" fill="#4a148c" font-size="12">owns Varnish purge</text>

  <!-- Super Page Cache -->
  <rect x="410" y="110" width="230" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="525" y="133" text-anchor="middle" fill="#e65100" font-weight="600">Super Page Cache plugin</text>
  <text x="525" y="152" text-anchor="middle" fill="#bf360c" font-size="12">owns Cloudflare purge</text>

  <!-- Arrows to targets -->
  <line x1="195" y1="166" x2="195" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="166" x2="525" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Varnish target -->
  <rect x="80" y="212" width="230" height="56" rx="8" fill="#fce4ec" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="195" y="235" text-anchor="middle" fill="#b71c1c" font-weight="600">PURGE X-Cache-Tags</text>
  <text x="195" y="254" text-anchor="middle" fill="#c62828" font-size="12">127.0.0.1:6081 (Varnish)</text>

  <!-- Cloudflare target -->
  <rect x="410" y="212" width="230" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="525" y="235" text-anchor="middle" fill="#2e7d32" font-weight="600">Cache Rules purge</text>
  <text x="525" y="254" text-anchor="middle" fill="#2e7d32" font-size="12">Cloudflare edge (API)</text>

  <!-- One purge owner rule -->
  <rect x="180" y="292" width="360" height="32" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="360" y="313" text-anchor="middle" fill="#e65100" font-size="13" font-weight="600">One purge owner per layer — don't let two plugins purge the same cache</text>
</svg>
