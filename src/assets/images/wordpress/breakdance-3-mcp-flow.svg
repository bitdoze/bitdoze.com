<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
  </defs>
  <!-- Box 1: AI Agent -->
  <rect x="10" y="35" width="160" height="110" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">AI Agent</text>
  <text x="90" y="92" text-anchor="middle" font-size="10.5" fill="#4338ca">Claude / Codex</text>
  <text x="90" y="107" text-anchor="middle" font-size="10.5" fill="#4338ca">ChatGPT / Cursor</text>
  <!-- Arrow 1 -->
  <line x1="172" y1="90" x2="203" y2="90" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 2: MCP Connection -->
  <rect x="205" y="35" width="160" height="110" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="285" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">MCP Connection</text>
  <text x="285" y="92" text-anchor="middle" font-size="10.5" fill="#4338ca">Agent Connector</text>
  <text x="285" y="107" text-anchor="middle" font-size="10.5" fill="#4338ca">Breakdance &gt; Settings</text>
  <!-- Arrow 2 -->
  <line x1="367" y1="90" x2="398" y2="90" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 3: Agent writes code -->
  <rect x="400" y="35" width="160" height="110" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Agent writes</text>
  <text x="480" y="92" text-anchor="middle" font-size="10.5" fill="#4338ca">HTML + CSS</text>
  <text x="480" y="107" text-anchor="middle" font-size="10.5" fill="#4338ca">Structure &amp; styles</text>
  <!-- Arrow 3 -->
  <line x1="562" y1="90" x2="593" y2="90" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 4: Breakdance converts -->
  <rect x="595" y="35" width="160" height="110" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="675" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">Breakdance converts</text>
  <text x="675" y="85" text-anchor="middle" font-size="10.5" fill="#4338ca">Elements + selectors</text>
  <text x="675" y="100" text-anchor="middle" font-size="10.5" fill="#4338ca">(Fundamentals category)</text>
  <!-- Arrow 4 -->
  <line x1="757" y1="90" x2="788" y2="90" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 5: Editable site -->
  <rect x="790" y="35" width="160" height="110" rx="10" fill="url(#boxGrad2)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="870" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Editable site</text>
  <text x="870" y="92" text-anchor="middle" font-size="10.5" fill="#166534">Breakpoints, variables,</text>
  <text x="870" y="107" text-anchor="middle" font-size="10.5" fill="#166534">fonts preserved</text>
</svg>
