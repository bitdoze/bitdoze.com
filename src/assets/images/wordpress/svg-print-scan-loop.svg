<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" font-family="system-ui, -apple-system, sans-serif">
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">The print &#8594; scan loop</text>

  <rect x="12" y="48" width="136" height="92" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">1. Print labels</text>
  <text x="80" y="100" text-anchor="middle" font-size="10" fill="#4b5563">Barcode Generator</text>
  <text x="80" y="116" text-anchor="middle" font-size="10" fill="#4b5563">(free plugin)</text>

  <line x1="148" y1="94" x2="178" y2="94" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="178,89 188,94 178,99" fill="#9ca3af"/>

  <rect x="188" y="48" width="136" height="92" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="256" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">2. Attach</text>
  <text x="256" y="100" text-anchor="middle" font-size="10" fill="#4b5563">Products, shelves,</text>
  <text x="256" y="116" text-anchor="middle" font-size="10" fill="#4b5563">packing slips</text>

  <line x1="324" y1="94" x2="354" y2="94" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="354,89 364,94 354,99" fill="#9ca3af"/>

  <rect x="364" y="48" width="136" height="92" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="432" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">3. Scan</text>
  <text x="432" y="100" text-anchor="middle" font-size="10" fill="#4b5563">Phone app or</text>
  <text x="432" y="116" text-anchor="middle" font-size="10" fill="#4b5563">USB / Bluetooth scanner</text>

  <line x1="500" y1="94" x2="530" y2="94" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="530,89 540,94 530,99" fill="#9ca3af"/>

  <rect x="540" y="48" width="112" height="92" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="596" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">4. Act</text>
  <text x="596" y="92" text-anchor="middle" font-size="9" fill="#4b5563">Find product</text>
  <text x="596" y="107" text-anchor="middle" font-size="9" fill="#4b5563">Update stock</text>
  <text x="596" y="122" text-anchor="middle" font-size="9" fill="#4b5563">Fulfill order</text>
</svg>
