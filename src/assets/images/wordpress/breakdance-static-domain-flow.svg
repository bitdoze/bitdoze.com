<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#ffedd5"/>
    </linearGradient>
  </defs>
  <!-- Box 1: Add domain -->
  <rect x="10" y="35" width="240" height="120" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">1. Add domain</text>
  <text x="130" y="92" text-anchor="middle" font-size="10.5" fill="#4338ca">Sevalla dashboard</text>
  <text x="130" y="109" text-anchor="middle" font-size="10.5" fill="#4338ca">Opens the DNS records sheet</text>
  <text x="130" y="126" text-anchor="middle" font-size="10.5" fill="#4338ca">Status: Verification</text>
  <!-- Arrow 1 -->
  <line x1="252" y1="95" x2="293" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 2: Verify -->
  <rect x="295" y="35" width="280" height="120" rx="10" fill="url(#boxGrad3)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="435" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">2. Verify (two TXT records)</text>
  <text x="435" y="86" text-anchor="middle" font-size="10.5" fill="#9a3412">_cf-custom-hostname.&lt;domain&gt;</text>
  <text x="435" y="103" text-anchor="middle" font-size="10.5" fill="#9a3412">_acme-challenge.&lt;domain&gt;</text>
  <text x="435" y="124" text-anchor="middle" font-size="10" fill="#9a3412">Keep the ACME record for SSL renewals</text>
  <text x="435" y="140" text-anchor="middle" font-size="10" fill="#9a3412">Timed out after 7 days if not verified</text>
  <!-- Arrow 2 -->
  <line x1="577" y1="95" x2="618" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 3: Point -->
  <rect x="620" y="35" width="280" height="120" rx="10" fill="url(#boxGrad3)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="760" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">3. Point the domain</text>
  <text x="760" y="86" text-anchor="middle" font-size="10.5" fill="#9a3412">Any DNS provider: A record to shown IP</text>
  <text x="760" y="103" text-anchor="middle" font-size="10.5" fill="#9a3412">Cloudflare DNS: CNAME to.sevalla.app</text>
  <text x="760" y="124" text-anchor="middle" font-size="10" fill="#9a3412">Delete conflicting A / AAAA / CNAME</text>
  <text x="760" y="140" text-anchor="middle" font-size="10" fill="#9a3412">Status: Pointing</text>
  <!-- Arrow 3 -->
  <line x1="902" y1="95" x2="943" y2="95" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 4: Active -->
  <rect x="945" y="35" width="240" height="120" rx="10" fill="url(#boxGrad2)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1065" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">4. Active</text>
  <text x="1065" y="92" text-anchor="middle" font-size="10.5" fill="#15803d">Free SSL issued and</text>
  <text x="1065" y="109" text-anchor="middle" font-size="10.5" fill="#15803d">renewed by Sevalla</text>
  <text x="1065" y="126" text-anchor="middle" font-size="10.5" fill="#15803d">HTTP 301 to HTTPS</text>
  <!-- Caption -->
  <text x="600" y="195" text-anchor="middle" font-size="11" fill="#6b7280">Sevalla re-checks DNS every 30 minutes (every 10 seconds while the DNS sheet is open) for up to 7 days.</text>
  <text x="600" y="215" text-anchor="middle" font-size="11" fill="#6b7280">Skip all of this at first: every static site gets a free &lt;name&gt;.sevalla.page subdomain.</text>
</svg>
