<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel 1 title -->
  <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">1. Group at root level → Position: Sticky available</text>

  <!-- Panel 1 editor content -->
  <rect x="30" y="50" width="250" height="290" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="76" font-size="11" fill="#64748b">post or page content (root)</text>

  <rect x="55" y="105" width="200" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Group block (root level)</text>

  <rect x="55" y="195" width="200" height="48" rx="6" fill="#e2e8f0"/>
  <text x="155" y="224" text-anchor="middle" font-size="12" fill="#475569">Paragraph</text>

  <rect x="55" y="260" width="200" height="48" rx="6" fill="#e2e8f0"/>
  <text x="155" y="289" text-anchor="middle" font-size="12" fill="#475569">Image</text>

  <!-- Panel 1 sidebar -->
  <rect x="295" y="50" width="145" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="310" y="78" font-size="12" font-weight="bold" fill="#0f172a">Block settings</text>
  <text x="310" y="118" font-size="12" fill="#0f172a">Position</text>
  <rect x="310" y="130" width="58" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="339" y="147" text-anchor="middle" font-size="11" fill="#475569">Default</text>
  <rect x="376" y="130" width="52" height="26" rx="5" fill="#2563eb"/>
  <text x="402" y="147" text-anchor="middle" font-size="11" fill="#ffffff">Sticky</text>
  <text x="310" y="190" font-size="11" fill="#15803d">Position control visible</text>

  <!-- Panel 2 title -->
  <text x="725" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">2. Group nested in another block → no Position control</text>

  <!-- Panel 2 editor content -->
  <rect x="525" y="50" width="250" height="290" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="76" font-size="11" fill="#64748b">post or page content (root)</text>

  <rect x="550" y="105" width="200" height="150" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="127" text-anchor="middle" font-size="11" fill="#475569">Columns / outer Group</text>

  <rect x="575" y="145" width="150" height="64" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">Group block (nested)</text>

  <!-- Panel 2 sidebar -->
  <rect x="790" y="50" width="145" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="805" y="78" font-size="12" font-weight="bold" fill="#0f172a">Block settings</text>
  <text x="805" y="118" font-size="12" fill="#94a3b8">Position</text>
  <text x="805" y="145" font-size="11" fill="#b91c1c">Position control hidden</text>
  <text x="805" y="163" font-size="11" fill="#b91c1c">(nested block)</text>

  <!-- Bottom caption -->
  <text x="480" y="382" text-anchor="middle" font-size="13" fill="#334155">Position → Sticky appears only on top-level Group-family blocks (Group, Row, Stack, Grid).</text>
</svg>
