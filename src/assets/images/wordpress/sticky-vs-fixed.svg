<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Panel 1 title -->
  <text x="245" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">1. Sticky block pins at the top while its parent is in view</text>

  <!-- Panel 1 parent container -->
  <rect x="70" y="50" width="350" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="85" y="76" font-size="13" fill="#64748b">parent container</text>

  <!-- Panel 1 sticky element -->
  <rect x="100" y="92" width="290" height="52" rx="8" fill="#2563eb"/>
  <text x="245" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">sticky block (top: 0)</text>

  <!-- Panel 1 content bars -->
  <rect x="100" y="166" width="290" height="36" rx="6" fill="#e2e8f0"/>
  <rect x="100" y="214" width="290" height="36" rx="6" fill="#e2e8f0"/>
  <rect x="100" y="262" width="290" height="36" rx="6" fill="#e2e8f0"/>
  <rect x="100" y="310" width="290" height="36" rx="6" fill="#e2e8f0"/>
  <text x="245" y="368" text-anchor="middle" font-size="12" fill="#64748b">content scrolls underneath</text>

  <!-- Panel 1 scroll arrow -->
  <line x1="438" y1="100" x2="438" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="438" y="214" text-anchor="middle" font-size="12" fill="#475569">scroll</text>

  <!-- Panel 2 title -->
  <text x="725" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">2. When the parent ends, the block leaves with it</text>

  <!-- Panel 2 parent container -->
  <rect x="555" y="50" width="350" height="210" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="570" y="76" font-size="13" fill="#64748b">parent container</text>

  <!-- Panel 2 content bars -->
  <rect x="585" y="92" width="290" height="36" rx="6" fill="#e2e8f0"/>
  <rect x="585" y="140" width="290" height="36" rx="6" fill="#e2e8f0"/>

  <!-- Panel 2 sticky element crossing the parent boundary -->
  <rect x="585" y="232" width="290" height="52" rx="8" fill="#2563eb"/>
  <text x="730" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">sticky block</text>

  <!-- Panel 2 exit arrow + caption -->
  <line x1="730" y1="292" x2="730" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="730" y="348" text-anchor="middle" font-size="13" fill="#475569">it scrolls away with the parent</text>

  <!-- Bottom caption -->
  <text x="480" y="412" text-anchor="middle" font-size="13" fill="#334155">position: sticky is constrained to its parent container. position: fixed would stay on screen.</text>
</svg>
