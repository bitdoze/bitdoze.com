<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" role="img" aria-label="SureCart headless architecture: the browser talks to WordPress for pages and blocks, while checkout, payments, subscriptions, tax, the customer portal and file delivery run in the SureCart cloud" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="20" y="95" width="210" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="140" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Browser / visitor</text>
  <text x="125" y="175" text-anchor="middle" font-size="13" fill="#475569">loads your pages</text>

  <!-- Browser -> WordPress -->
  <line x1="235" y1="160" x2="312" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="273" y="143" text-anchor="middle" font-size="12" fill="#64748b">page requests</text>

  <!-- WordPress -->
  <rect x="325" y="55" width="310" height="210" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">WordPress (your server)</text>
  <text x="480" y="140" text-anchor="middle" font-size="14" fill="#475569">frontend rendering, blocks, pages</text>
  <line x1="385" y1="165" x2="575" y2="165" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="195" text-anchor="middle" font-size="13" fill="#64748b">no order tables</text>
  <text x="480" y="222" text-anchor="middle" font-size="13" fill="#64748b">no payment logic</text>

  <!-- WordPress <-> SureCart -->
  <line x1="642" y1="135" x2="732" y2="135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="732" y1="205" x2="642" y2="205" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="687" y="118" text-anchor="middle" font-size="12" fill="#3b82f6">API / embed</text>

  <!-- SureCart cloud -->
  <rect x="745" y="35" width="255" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="872" y="78" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">SureCart cloud</text>
  <text x="872" y="115" text-anchor="middle" font-size="14" fill="#475569">checkout</text>
  <text x="872" y="142" text-anchor="middle" font-size="14" fill="#475569">payments</text>
  <text x="872" y="169" text-anchor="middle" font-size="14" fill="#475569">subscriptions</text>
  <text x="872" y="196" text-anchor="middle" font-size="14" fill="#475569">tax</text>
  <text x="872" y="223" text-anchor="middle" font-size="14" fill="#475569">customer portal</text>
  <text x="872" y="250" text-anchor="middle" font-size="14" fill="#475569">file delivery</text>
</svg>
