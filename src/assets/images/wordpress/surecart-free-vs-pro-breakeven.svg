<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="Chart comparing annual cost: the free Launch plan's 2.9% fee rises with revenue and crosses the Pro plan's flat 199 dollars per year at about 6,900 dollars of annual revenue" font-family="system-ui, -apple-system, sans-serif">
  <!-- grid -->
  <line x1="130" y1="50" x2="960" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="130" y1="140" x2="960" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="130" y1="230" x2="960" y2="230" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="130" y1="320" x2="960" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- vertical grid -->
  <line x1="296" y1="50" x2="296" y2="410" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="462" y1="50" x2="462" y2="410" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="628" y1="50" x2="628" y2="410" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="794" y1="50" x2="794" y2="410" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="130" y1="50" x2="130" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="410" x2="960" y2="410" stroke="#94a3b8" stroke-width="2"/>

  <!-- y tick labels -->
  <text x="118" y="415" text-anchor="end" font-size="13" fill="#64748b">$0</text>
  <text x="118" y="325" text-anchor="end" font-size="13" fill="#64748b">$200</text>
  <text x="118" y="235" text-anchor="end" font-size="13" fill="#64748b">$400</text>
  <text x="118" y="145" text-anchor="end" font-size="13" fill="#64748b">$600</text>
  <text x="118" y="55" text-anchor="end" font-size="13" fill="#64748b">$800</text>

  <!-- x tick labels -->
  <text x="130" y="435" text-anchor="middle" font-size="13" fill="#64748b">$0</text>
  <text x="296" y="435" text-anchor="middle" font-size="13" fill="#64748b">$5k</text>
  <text x="462" y="435" text-anchor="middle" font-size="13" fill="#64748b">$10k</text>
  <text x="628" y="435" text-anchor="middle" font-size="13" fill="#64748b">$15k</text>
  <text x="794" y="435" text-anchor="middle" font-size="13" fill="#64748b">$20k</text>
  <text x="960" y="435" text-anchor="middle" font-size="13" fill="#64748b">$25k</text>

  <!-- axis titles -->
  <text x="545" y="472" text-anchor="middle" font-size="15" fill="#475569">Annual revenue</text>
  <text x="42" y="230" text-anchor="middle" font-size="15" fill="#475569" transform="rotate(-90 42 230)">Annual cost to you</text>

  <!-- breakeven marker line -->
  <line x1="359" y1="320" x2="359" y2="410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Launch line: 2.9% of revenue -->
  <line x1="130" y1="410" x2="960" y2="83.75" stroke="#3b82f6" stroke-width="3.5"/>

  <!-- Pro line: flat $199/yr -->
  <line x1="130" y1="320.45" x2="960" y2="320.45" stroke="#10b981" stroke-width="3.5"/>

  <!-- crossing point -->
  <circle cx="359" cy="320.45" r="8" fill="#0f172a"/>
  <text x="374" y="292" font-size="15" font-weight="600" fill="#0f172a">breakeven ≈ $6,900/yr</text>
  <text x="359" y="435" text-anchor="middle" font-size="12" fill="#475569">≈$6,900</text>

  <!-- legend -->
  <line x1="160" y1="72" x2="205" y2="72" stroke="#3b82f6" stroke-width="3.5"/>
  <text x="215" y="77" font-size="14" fill="#334155">Launch (2.9% fee)</text>
  <line x1="160" y1="104" x2="205" y2="104" stroke="#10b981" stroke-width="3.5"/>
  <text x="215" y="109" font-size="14" fill="#334155">Pro ($199/yr, no fee)</text>
</svg>
