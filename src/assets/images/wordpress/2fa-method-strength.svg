<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Diagram ranking two-factor authentication methods by strength: passkeys and security keys strongest and phishing-resistant, TOTP authenticator app next, email one-time codes weakest and backup only">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">2FA method strength: what to use as primary</text>

  <!-- Row 1: passkeys -->
  <text x="60" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#065f46">Passkeys / hardware security keys</text>
  <text x="850" y="86" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">use as primary</text>
  <rect x="60" y="98" width="780" height="42" rx="8" fill="#059669"/>
  <text x="78" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#ffffff">Phishing-resistant: bound to your device and the real domain; unlock with biometrics or a PIN</text>

  <!-- Row 2: TOTP -->
  <text x="60" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e40af">TOTP authenticator app (2FAS, Aegis, Google Authenticator)</text>
  <text x="850" y="188" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">use as primary</text>
  <rect x="60" y="200" width="560" height="42" rx="8" fill="#2563eb"/>
  <text x="78" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#ffffff">Works offline; 30-second rotating codes; no delivery risk</text>

  <!-- Row 3: email -->
  <text x="60" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#92400e">Email one-time codes (HOTP)</text>
  <text x="850" y="290" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">backup only</text>
  <rect x="60" y="302" width="340" height="42" rx="8" fill="#d97706"/>
  <text x="78" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#ffffff">Spam filters, delays, mailbox takeover</text>

  <!-- caption -->
  <text x="60" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Use the strongest method your devices support as the primary factor.</text>
  <text x="60" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Keep email codes as a fallback, never as the only factor on an admin account.</text>
</svg>
