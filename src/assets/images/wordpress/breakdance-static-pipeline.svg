<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
  </defs>
  <!-- Box 1: WordPress + Breakdance -->
  <rect x="10" y="30" width="200" height="115" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">WordPress + Breakdance</text>
  <text x="110" y="84" text-anchor="middle" font-size="10.5" fill="#4338ca">Authoring site</text>
  <text x="110" y="101" text-anchor="middle" font-size="10.5" fill="#4338ca">Local or private VPS</text>
  <text x="110" y="118" text-anchor="middle" font-size="10.5" fill="#4338ca">(never serves the public)</text>
  <!-- Arrow 1 -->
  <line x1="212" y1="87" x2="253" y2="87" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 2: Simply Static -->
  <rect x="255" y="30" width="200" height="115" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="355" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Simply Static</text>
  <text x="355" y="84" text-anchor="middle" font-size="10.5" fill="#4338ca">Export HTML / CSS / JS</text>
  <text x="355" y="101" text-anchor="middle" font-size="10.5" fill="#4338ca">v3.8.x (free)</text>
  <text x="355" y="118" text-anchor="middle" font-size="10.5" fill="#4338ca">No PHP in output</text>
  <!-- Arrow 2 -->
  <line x1="457" y1="87" x2="498" y2="87" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 3: Git push -->
  <rect x="500" y="30" width="200" height="115" rx="10" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Git push</text>
  <text x="600" y="84" text-anchor="middle" font-size="10.5" fill="#4338ca">GitHub / GitLab</text>
  <text x="600" y="101" text-anchor="middle" font-size="10.5" fill="#4338ca">Bitbucket</text>
  <text x="600" y="118" text-anchor="middle" font-size="10.5" fill="#4338ca">Triggers auto-deploy</text>
  <!-- Arrow 3 -->
  <line x1="702" y1="87" x2="743" y2="87" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 4: Sevalla -->
  <rect x="745" y="30" width="200" height="115" rx="10" fill="url(#boxGrad2)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="845" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Sevalla static site</text>
  <text x="845" y="84" text-anchor="middle" font-size="10.5" fill="#15803d">Build site before</text>
  <text x="845" y="101" text-anchor="middle" font-size="10.5" fill="#15803d">publishing: OFF</text>
  <text x="845" y="118" text-anchor="middle" font-size="10.5" fill="#15803d">Publishes as-is</text>
  <!-- Arrow 4 -->
  <line x1="947" y1="87" x2="988" y2="87" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 5: Cloudflare edge -->
  <rect x="990" y="30" width="200" height="115" rx="10" fill="url(#boxGrad2)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1090" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Cloudflare edge</text>
  <text x="1090" y="84" text-anchor="middle" font-size="10.5" fill="#15803d">260+ PoPs</text>
  <text x="1090" y="101" text-anchor="middle" font-size="10.5" fill="#15803d">Free SSL</text>
  <text x="1090" y="118" text-anchor="middle" font-size="10.5" fill="#15803d">Global by default</text>
  <!-- Caption -->
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#6b7280">The authoring site never faces the public; only static files are served from the edge.</text>
  <text x="600" y="205" text-anchor="middle" font-size="11" fill="#6b7280">Deployments are atomic and the edge cache is purged automatically on each push.</text>
</svg>
