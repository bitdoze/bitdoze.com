<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <marker id="arrD" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,0 L3.5,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">What CloudPanel installs on your ARM VPS</text>

  <!-- Visitor -->
  <rect x="15" y="125" width="105" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="67" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#0c4a6e">Visitor</text>

  <!-- Arrow 1 -->
  <line x1="122" y1="152" x2="170" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cloudflare DNS -->
  <rect x="172" y="117" width="135" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="239" y="145" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">Cloudflare</text>
  <text x="239" y="163" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">DNS</text>

  <!-- Arrow 2 -->
  <line x1="309" y1="152" x2="357" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ARM VPS container -->
  <rect x="359" y="50" width="445" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="581" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#166534">ARM VPS &#8212; Ubuntu 24.04</text>

  <!-- Nginx -->
  <rect x="384" y="95" width="395" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="581" y="124" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1e40af">Nginx 1.30 &#8212; HTTP/3 + PageSpeed</text>

  <!-- Arrow down 1 -->
  <line x1="581" y1="145" x2="581" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)"/>

  <!-- PHP-FPM -->
  <rect x="384" y="168" width="395" height="48" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="581" y="197" text-anchor="middle" font-size="13.5" font-weight="500" fill="#5b21b6">PHP-FPM 8.4</text>

  <!-- Arrow down 2 -->
  <line x1="581" y1="218" x2="581" y2="239" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)"/>

  <!-- MariaDB -->
  <rect x="384" y="241" width="395" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="581" y="270" text-anchor="middle" font-size="13.5" font-weight="500" fill="#991b1b">MariaDB 11.8</text>

  <!-- Managed by CloudPanel banner -->
  <rect x="384" y="299" width="395" height="24" rx="5" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1"/>
  <text x="581" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">Managed by CloudPanel v2.5.4</text>
</svg>
