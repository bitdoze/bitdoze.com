<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="320" fill="#F8FAFC" rx="12" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="38" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700">Hetzner 2026 Cloud Price Adjustment &amp; ARM (CAX) Availability Timeline</text>

  <!-- Main horizontal timeline axis -->
  <line x1="80" y1="165" x2="880" y2="165" stroke="#94A3B8" stroke-width="3"/>

  <!-- Node 1: Feb 23, 2026 -->
  <circle cx="110" cy="165" r="8" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="110" y1="157" x2="110" y2="108" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="30" y="64" width="160" height="44" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="110" y="82" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="700">23 Feb 2026</text>
  <text x="110" y="99" text-anchor="middle" fill="#1E3A8A" font-size="11">Price hike announced</text>

  <!-- Node 2: Apr 1, 2026 -->
  <circle cx="290" cy="165" r="8" fill="#D97706" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="290" y1="173" x2="290" y2="212" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="200" y="212" width="180" height="48" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="290" y="231" text-anchor="middle" fill="#92400E" font-size="12" font-weight="700">1 Apr 2026: Wave 1</text>
  <text x="290" y="248" text-anchor="middle" fill="#78350F" font-size="11">~33% across existing &amp; new</text>

  <!-- Node 3: Jun 15, 2026 -->
  <circle cx="480" cy="165" r="8" fill="#DC2626" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="480" y1="157" x2="480" y2="108" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="375" y="56" width="210" height="52" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="480" y="74" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="700">15 Jun 2026: Wave 2</text>
  <text x="480" y="90" text-anchor="middle" fill="#7F1D1D" font-size="11">CPX +144-175% | CX/CAX +30-38%</text>
  <text x="480" y="103" text-anchor="middle" fill="#7F1D1D" font-size="10">(New orders &amp; rescales)</text>

  <!-- Node 4: Jun 26, 2026 -->
  <circle cx="650" cy="165" r="8" fill="#7C3AED" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="650" y1="173" x2="650" y2="212" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="560" y="212" width="180" height="48" rx="6" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="650" y="231" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="700">26 Jun 2026</text>
  <text x="650" y="248" text-anchor="middle" fill="#4C1D95" font-size="11">Cloud capacity notice posted</text>

  <!-- Node 5: Sep 2 - Oct 20, 2026 freeze bar -->
  <rect x="665" y="157" width="195" height="16" rx="8" fill="#EF4444" opacity="0.22" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="850" cy="165" r="8" fill="#DC2626" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="830" y1="157" x2="830" y2="108" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="720" y="60" width="210" height="48" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="825" y="79" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="700">Sep - 20 Oct 2026</text>
  <text x="825" y="96" text-anchor="middle" fill="#7F1D1D" font-size="11">CAX11-CAX41 unorderable</text>

  <!-- Footer note -->
  <text x="480" y="295" text-anchor="middle" fill="#475569" font-size="12">Existing CAX servers stay grandfathered unless rescaled; new ARM orders disabled during capacity freeze.</text>
</svg>
