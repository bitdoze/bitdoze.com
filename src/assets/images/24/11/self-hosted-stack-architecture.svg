<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Self-hosted stack reference architecture</text>

  <!-- Internet -->
  <rect x="30" y="120" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="95" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">Internet</text>
  <text x="95" y="170" text-anchor="middle" font-size="11" fill="#4b5563">users / staff</text>

  <!-- arrow -->
  <line x1="160" y1="155" x2="215" y2="155" stroke="#6b7280" stroke-width="2"/>
  <polygon points="215,155 205,150 205,160" fill="#6b7280"/>

  <!-- Reverse proxy -->
  <rect x="215" y="105" width="170" height="100" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Reverse proxy</text>
  <text x="300" y="157" text-anchor="middle" font-size="11" fill="#1e3a8a">TLS termination</text>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a">forward-auth SSO + MFA</text>
  <text x="300" y="193" text-anchor="middle" font-size="10" fill="#3b5bdb">Traefik / NPM / CloudPanel</text>

  <!-- arrow -->
  <line x1="385" y1="155" x2="440" y2="155" stroke="#6b7280" stroke-width="2"/>
  <polygon points="440,155 430,150 430,160" fill="#6b7280"/>

  <!-- App containers -->
  <rect x="440" y="105" width="170" height="100" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="525" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">App containers</text>
  <text x="525" y="157" text-anchor="middle" font-size="11" fill="#1e3a8a">Nextcloud, Zulip, n8n</text>
  <text x="525" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a">Gitea, Paperless-ngx, ...</text>
  <text x="525" y="193" text-anchor="middle" font-size="10" fill="#3b5bdb">pinned image tags</text>

  <!-- arrow -->
  <line x1="610" y1="155" x2="665" y2="155" stroke="#6b7280" stroke-width="2"/>
  <polygon points="665,155 655,150 655,160" fill="#6b7280"/>

  <!-- Data layer -->
  <rect x="665" y="105" width="170" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="750" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Data layer</text>
  <text x="750" y="157" text-anchor="middle" font-size="11" fill="#065f46">Postgres / MariaDB</text>
  <text x="750" y="175" text-anchor="middle" font-size="11" fill="#065f46">named volumes</text>
  <text x="750" y="193" text-anchor="middle" font-size="10" fill="#047857">nightly native dumps</text>

  <!-- arrow down to backups -->
  <line x1="750" y1="205" x2="750" y2="275" stroke="#059669" stroke-width="2"/>
  <polygon points="750,275 745,265 755,265" fill="#059669"/>

  <!-- Offsite backups -->
  <rect x="620" y="275" width="260" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="750" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Offsite backups</text>
  <text x="750" y="327" text-anchor="middle" font-size="11" fill="#9a3412">S3-compatible: Cloudflare R2 / Backblaze B2</text>
  <text x="750" y="345" text-anchor="middle" font-size="10" fill="#c2410c">test restores, not just backups</text>

  <!-- Monitoring -->
  <rect x="215" y="275" width="260" height="80" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="345" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Monitoring</text>
  <text x="345" y="327" text-anchor="middle" font-size="11" fill="#9d174d">Beszel + Uptime Kuma</text>
  <text x="345" y="345" text-anchor="middle" font-size="10" fill="#be185d">host health + service checks</text>

  <!-- monitoring arrows up -->
  <line x1="345" y1="275" x2="345" y2="215" stroke="#be185d" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="345,215 340,225 350,225" fill="#be185d"/>
  <line x1="405" y1="285" x2="525" y2="215" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="465" y1="295" x2="700" y2="215" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- firewall note -->
  <rect x="215" y="60" width="170" height="28" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="79" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">publish ports only via proxy</text>

  <!-- legend -->
  <rect x="30" y="395" width="900" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="480" y="417" text-anchor="middle" font-size="11" fill="#4b5563">Rule of thumb: nothing binds 0.0.0.0 except the reverse proxy. Databases stay on an internal Docker network.</text>
  <text x="480" y="435" text-anchor="middle" font-size="11" fill="#4b5563">Backups go off the box every night, and monitoring watches the watcher.</text>
</svg>
