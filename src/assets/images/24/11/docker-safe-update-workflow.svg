<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">Safe Docker update workflow</text>

  <!-- Step 1 -->
  <rect x="30" y="100" width="150" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="105" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">1. Backup</text>
  <text x="105" y="148" text-anchor="middle" font-size="10" fill="#9a3412">pg_dump / mysqldump</text>
  <text x="105" y="164" text-anchor="middle" font-size="10" fill="#9a3412">+ volume snapshot</text>

  <!-- arrow -->
  <line x1="180" y1="140" x2="228" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="228,140 218,135 218,145" fill="#6b7280"/>

  <!-- Step 2 -->
  <rect x="228" y="100" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="303" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2. Pull</text>
  <text x="303" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a">docker compose</text>
  <text x="303" y="166" text-anchor="middle" font-size="11" fill="#1e3a8a">pull</text>

  <!-- arrow -->
  <line x1="378" y1="140" x2="426" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="426,140 416,135 416,145" fill="#6b7280"/>

  <!-- Step 3 -->
  <rect x="426" y="100" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="501" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">3. Up</text>
  <text x="501" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a">docker compose</text>
  <text x="501" y="166" text-anchor="middle" font-size="11" fill="#1e3a8a">up -d</text>

  <!-- arrow -->
  <line x1="576" y1="140" x2="624" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="624,140 614,135 614,145" fill="#6b7280"/>

  <!-- Step 4 -->
  <rect x="624" y="100" width="150" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="699" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">4. Verify</text>
  <text x="699" y="148" text-anchor="middle" font-size="10" fill="#065f46">compose ps / logs</text>
  <text x="699" y="164" text-anchor="middle" font-size="10" fill="#065f46">one core flow works</text>

  <!-- arrow -->
  <line x1="774" y1="140" x2="822" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="822,140 812,135 812,145" fill="#6b7280"/>

  <!-- Step 5 -->
  <rect x="822" y="100" width="110" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="877" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">5. Prune</text>
  <text x="877" y="150" text-anchor="middle" font-size="10" fill="#4b5563">docker image</text>
  <text x="877" y="166" text-anchor="middle" font-size="10" fill="#4b5563">prune -f</text>

  <!-- Decision diamond under verify -->
  <polygon points="699,220 759,255 699,290 639,255" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="699" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Failed</text>
  <text x="699" y="267" text-anchor="middle" font-size="10" fill="#b91c1c">checks?</text>

  <!-- line verify -> diamond -->
  <line x1="699" y1="180" x2="699" y2="220" stroke="#dc2626" stroke-width="2"/>
  <polygon points="699,220 694,210 704,210" fill="#dc2626"/>

  <!-- rollback box -->
  <rect x="380" y="235" width="200" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Roll back</text>
  <text x="480" y="283" text-anchor="middle" font-size="10" fill="#b91c1c">previous pinned tag + up -d</text>
  <text x="480" y="299" text-anchor="middle" font-size="10" fill="#b91c1c">restore DB dump if schema changed</text>

  <!-- diamond -> rollback -->
  <line x1="639" y1="255" x2="580" y2="265" stroke="#dc2626" stroke-width="2"/>
  <polygon points="580,265 591,262 588,272" fill="#dc2626"/>

  <!-- rollback loops back to verify -->
  <line x1="480" y1="235" x2="480" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="480" y1="200" x2="699" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="560" y="192" text-anchor="middle" font-size="10" fill="#b91c1c">re-verify after rollback</text>

  <!-- footer note -->
  <rect x="30" y="330" width="902" height="34" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="480" y="352" text-anchor="middle" font-size="11" fill="#4b5563">Never blind-update databases: Postgres/MariaDB major versions need dump/restore, not just a new image tag.</text>
</svg>
