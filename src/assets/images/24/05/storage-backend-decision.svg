<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cmdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="legacyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="containerdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#0F172A">
    Docker overlay2 cleanup: <tspan fill="#4F46E5">which storage backend are you on?</tspan>
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Docker Engine 29 uses the containerd image store on fresh installs — the big directory may not be overlay2</text>

  <!-- Command box -->
  <g transform="translate(300, 110)" filter="url(#shadow)">
    <rect width="600" height="76" rx="14" fill="url(#cmdGrad)"/>
    <text x="300" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">STEP 0 — DETECT (read-only, safe to run)</text>
    <text x="300" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#F8FAFC">docker info -f '{{ .DriverStatus }}'</text>
  </g>

  <!-- Arrow down to decision -->
  <line x1="600" y1="186" x2="600" y2="236" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Decision box -->
  <g transform="translate(330, 240)" filter="url(#shadow)">
    <rect width="540" height="78" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="8" height="78" rx="4" fill="#7C3AED"/>
    <text x="290" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Does the output contain</text>
    <text x="290" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7C3AED">[[driver-type io.containerd.snapshotter.v1]]</text>
  </g>

  <!-- Branch lines -->
  <path d="M 520 318 L 520 360 L 300 360 L 300 400" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 318 L 680 360 L 900 360 L 900 400" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="330" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#64748B">NO</text>
  <text x="845" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#64748B">YES</text>

  <!-- LEFT: legacy overlay2 -->
  <g transform="translate(70, 404)" filter="url(#shadow)">
    <rect width="460" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="460" height="48" rx="16" fill="url(#legacyGrad)"/>
    <text x="230" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Legacy overlay2 store</text>
    <text x="28" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#0F172A">
      <tspan x="28" dy="0" font-weight="700">Watch this directory:</tspan>
      <tspan x="28" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="14.5" fill="#4F46E5">/var/lib/docker/overlay2</tspan>
      <tspan x="28" dy="34" font-weight="700">Measure with:</tspan>
      <tspan x="28" dy="26" font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#334155">du -sh /var/lib/docker/overlay2</tspan>
      <tspan x="28" dy="26" font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#334155">docker system df -v</tspan>
      <tspan x="28" dy="32" fill="#64748B" font-size="13.5">Then run the prune playbook below.</tspan>
    </text>
  </g>

  <!-- RIGHT: containerd store -->
  <g transform="translate(670, 404)" filter="url(#shadow)">
    <rect width="460" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="460" height="48" rx="16" fill="url(#containerdGrad)"/>
    <text x="230" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">containerd image store</text>
    <text x="28" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#0F172A">
      <tspan x="28" dy="0" font-weight="700">Watch this directory:</tspan>
      <tspan x="28" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="14.5" fill="#0891B2">/var/lib/containerd</tspan>
      <tspan x="28" dy="34" font-weight="700">Measure with:</tspan>
      <tspan x="28" dy="26" font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#334155">du -sh /var/lib/containerd</tspan>
      <tspan x="28" dy="26" font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#334155">docker system df -v</tspan>
      <tspan x="28" dy="32" fill="#B45309" font-size="13.5" font-weight="600">Caution: a hidden legacy store can</tspan>
      <tspan x="28" dy="18" fill="#B45309" font-size="13.5" font-weight="600">still sit in /var/lib/docker/overlay2</tspan>
    </text>
  </g>

  <!-- Bottom warning strip -->
  <g transform="translate(70, 654)">
    <rect width="1060" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="530" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#92400E" font-weight="600">Switching backends hides the other store's data on disk — prune commands on the active store will not reclaim it</text>
  </g>
</svg>
