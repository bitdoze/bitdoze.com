<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="headerDocker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="headerContainerd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="volGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg2)"/>

  <text x="600" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#0F172A">
    Where Docker disk space <tspan fill="#4F46E5">actually lives</tspan>
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Five places grow — only one of them is overlay2, and container logs are the usual surprise</text>

  <!-- /var/lib/docker group -->
  <g transform="translate(50, 110)" filter="url(#shadow2)">
    <rect width="760" height="460" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="760" height="52" rx="16" fill="url(#headerDocker)"/>
    <text x="380" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#F8FAFC" font-weight="700">/var/lib/docker</text>
  </g>

  <!-- overlay2 -->
  <g transform="translate(80, 190)" filter="url(#shadow2)">
    <rect width="330" height="160" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect width="330" height="8" rx="4" fill="url(#overlayGrad)"/>
    <text x="20" y="42" font-family="ui-monospace, Menlo, monospace" font-size="15.5" font-weight="700" fill="#3730A3">overlay2/</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155">
      <tspan x="20" dy="0">Image layers + container</tspan>
      <tspan x="20" dy="20">writable layers (upperdir)</tspan>
      <tspan x="20" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4338CA">du -sh /var/lib/docker/overlay2</tspan>
      <tspan x="20" dy="20" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4338CA">docker system df</tspan>
    </text>
  </g>

  <!-- containers -->
  <g transform="translate(440, 190)" filter="url(#shadow2)">
    <rect width="330" height="160" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect width="330" height="8" rx="4" fill="url(#logGrad)"/>
    <text x="20" y="42" font-family="ui-monospace, Menlo, monospace" font-size="15.5" font-weight="700" fill="#991B1B">containers/</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155">
      <tspan x="20" dy="0">json-file logs — unbounded</tspan>
      <tspan x="20" dy="20">by default (max-size = -1)</tspan>
      <tspan x="20" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#B91C1C">du -sh /var/lib/docker/containers/*</tspan>
      <tspan x="20" dy="20" fill="#B91C1C" font-size="12.5" font-weight="600">Often the real disk killer</tspan>
    </text>
  </g>

  <!-- volumes -->
  <g transform="translate(80, 375)" filter="url(#shadow2)">
    <rect width="330" height="160" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect width="330" height="8" rx="4" fill="url(#volGrad)"/>
    <text x="20" y="42" font-family="ui-monospace, Menlo, monospace" font-size="15.5" font-weight="700" fill="#065F46">volumes/</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155">
      <tspan x="20" dy="0">Named + anonymous volumes.</tspan>
      <tspan x="20" dy="20">Holds real app data (DBs)</tspan>
      <tspan x="20" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#047857">docker system df -v</tspan>
      <tspan x="20" dy="20" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#047857">docker volume ls</tspan>
    </text>
  </g>

  <!-- buildkit -->
  <g transform="translate(440, 375)" filter="url(#shadow2)">
    <rect width="330" height="160" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <rect width="330" height="8" rx="4" fill="url(#cacheGrad)"/>
    <text x="20" y="42" font-family="ui-monospace, Menlo, monospace" font-size="15.5" font-weight="700" fill="#92400E">buildkit/</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155">
      <tspan x="20" dy="0">BuildKit cache — grows on</tspan>
      <tspan x="20" dy="20">every build on CI runners</tspan>
      <tspan x="20" dy="28" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#B45309">docker builder prune</tspan>
      <tspan x="20" dy="20" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#B45309">docker system df</tspan>
    </text>
  </g>

  <!-- /var/lib/containerd group -->
  <g transform="translate(850, 110)" filter="url(#shadow2)">
    <rect width="300" height="460" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="300" height="52" rx="16" fill="url(#headerContainerd)"/>
    <text x="150" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#FFFFFF" font-weight="700">/var/lib/containerd</text>
  </g>

  <g transform="translate(880, 190)" filter="url(#shadow2)">
    <rect width="240" height="345" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="20" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#155E75">containerd image store</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155">
      <tspan x="20" dy="0">Content store keeps both:</tspan>
      <tspan x="20" dy="24" font-weight="600">1. compressed blobs</tspan>
      <tspan x="20" dy="20" font-weight="600">2. unpacked snapshots</tspan>
      <tspan x="20" dy="32" fill="#64748B">Same images cost more disk</tspan>
      <tspan x="20" dy="18" fill="#64748B">than the legacy store</tspan>
      <tspan x="20" dy="32" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#0E7490">du -sh /var/lib/containerd</tspan>
      <tspan x="20" dy="20" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#0E7490">docker system df</tspan>
      <tspan x="20" dy="36" fill="#B45309" font-size="12.5" font-weight="600">Default on Docker Engine 29</tspan>
      <tspan x="20" dy="18" fill="#B45309" font-size="12.5" font-weight="600">fresh installs (not upgrades)</tspan>
    </text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748B">Never delete inside these directories by hand — use docker system df to see the category, then the matching prune command</text>
</svg>
