<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" role="img" aria-label="tmux hierarchy diagram: one session containing three windows, with the active window split into three panes">
  <rect width="920" height="580" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">tmux hierarchy: session &#8594; windows &#8594; panes</text>

  <!-- Session container -->
  <rect x="36" y="58" width="848" height="440" rx="12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <rect x="56" y="74" width="200" height="34" rx="6" fill="#1d4ed8"/>
  <text x="156" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Session: dev</text>
  <text x="274" y="96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#334155">Ctrl+b d detach  ·  Ctrl+b s switch  ·  tmux attach -t dev</text>

  <!-- Window 0 (active) -->
  <rect x="56" y="128" width="540" height="292" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="56" y="128" width="540" height="34" rx="8" fill="#1d4ed8"/>
  <rect x="56" y="152" width="540" height="10" fill="#1d4ed8"/>
  <text x="76" y="151" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Window 0: bash (active)</text>

  <!-- Panes inside window 0 -->
  <rect x="72" y="180" width="250" height="222" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="88" y="204" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0c4a6e">pane 0</text>
  <text x="88" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#0c4a6e">$ npm run dev</text>

  <rect x="338" y="180" width="242" height="104" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="354" y="204" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#78350f">pane 1</text>
  <text x="354" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#78350f">$ tail -f app.log</text>

  <rect x="338" y="300" width="242" height="102" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="354" y="324" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14532d">pane 2</text>
  <text x="354" y="348" font-family="ui-monospace, monospace" font-size="12" fill="#14532d">$ psql -d app</text>

  <!-- Window 1 -->
  <rect x="616" y="128" width="248" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="616" y="128" width="248" height="30" rx="8" fill="#64748b"/>
  <rect x="616" y="148" width="248" height="10" fill="#64748b"/>
  <text x="632" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Window 1: logs</text>
  <text x="632" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#334155">1 pane</text>

  <!-- Window 2 -->
  <rect x="616" y="228" width="248" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="616" y="228" width="248" height="30" rx="8" fill="#64748b"/>
  <rect x="616" y="248" width="248" height="10" fill="#64748b"/>
  <text x="632" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Window 2: ssh</text>
  <text x="632" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#334155">1 pane</text>

  <!-- Pane-layer caption inside session -->
  <text x="76" y="456" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Panes: Ctrl+b % split left/right  ·  Ctrl+b " split top/bottom  ·  Ctrl+b o or arrow keys move  ·  Ctrl+b x close</text>

  <!-- Window- and session-layer captions -->
  <text x="36" y="532" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#334155">Windows: Ctrl+b c new  ·  Ctrl+b n / Ctrl+b p next and previous  ·  Ctrl+b 0-9 jump  ·  Ctrl+b w list  ·  Ctrl+b , rename  ·  Ctrl+b &amp; close</text>
  <text x="36" y="558" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#334155">Sessions: tmux new -s dev  ·  tmux ls  ·  tmux attach -t dev  ·  Ctrl+b d detach  ·  tmux kill-session -t dev</text>
</svg>
