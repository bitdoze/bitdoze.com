<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="dcstitle dcsdesc">
  <title id="dcstitle">Docker Compose secrets vs Docker Swarm secrets</title>
  <desc id="dcsdesc">Plain Compose bind-mounts a host file to /run/secrets without adding encryption. Swarm stores secrets encrypted in the Raft log, distributes them encrypted between nodes, and mounts them per service.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- Left panel: plain Docker Compose -->
  <rect x="20" y="16" width="430" height="388" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="235" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Plain Docker Compose</text>
  <text x="235" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">docker compose up</text>

  <rect x="60" y="96" width="350" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">./secrets/db_password.txt</text>
  <text x="235" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">a regular file on the host</text>

  <line x1="235" y1="152" x2="235" y2="194" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="247" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3b82f6">bind mount</text>

  <rect x="60" y="200" width="350" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">/run/secrets/db_password</text>
  <text x="235" y="241" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">same bytes, mounted into the container</text>

  <rect x="60" y="292" width="350" height="80" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="235" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">No encryption added</text>
  <text x="235" y="341" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">Host filesystem, permissions, and</text>
  <text x="235" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">backups are the security model</text>

  <!-- Right panel: Docker Swarm -->
  <rect x="470" y="16" width="430" height="388" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Docker Swarm</text>
  <text x="685" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">docker stack deploy</text>

  <rect x="510" y="88" width="350" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">docker secret create my_db_password</text>

  <line x1="685" y1="134" x2="685" y2="156" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="510" y="160" width="350" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">Encrypted in the Raft log (managers)</text>

  <line x1="685" y1="206" x2="685" y2="228" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="510" y="232" width="350" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">Encrypted distribution between nodes (mTLS)</text>

  <line x1="685" y1="278" x2="685" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="510" y="304" width="350" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">tmpfs mount at /run/secrets/ in the task</text>

  <text x="685" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Encrypted at rest and in transit, service-scoped</text>
</svg>
