<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="eolArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="300" fill="url(#eolBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="42" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="18" font-weight="bold">Flowise end-of-life timeline (2026)</text>

  <!-- Timeline base line -->
  <line x1="110" y1="150" x2="750" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#eolArrow)"/>

  <!-- Stop 1: Jul 29 -->
  <g transform="translate(150, 150)">
    <circle r="14" fill="#3b82f6" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-95" y="-108" width="190" height="72" fill="#0f172a" rx="10"/>
    <text x="0" y="-84" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="11" font-weight="bold">Jul 29, 2026</text>
    <text x="0" y="-64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="11" font-weight="bold">Code freeze</text>
    <text x="0" y="-48" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">flowise@3.1.4 is the final release</text>
    <line x1="0" y1="-36" x2="0" y2="-14" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Stop 2: Aug 13 -->
  <g transform="translate(430, 150)">
    <circle r="14" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-95" y="-108" width="190" height="72" fill="#0f172a" rx="10"/>
    <text x="0" y="-84" text-anchor="middle" fill="#fcd34d" font-family="Arial" font-size="11" font-weight="bold">Aug 13, 2026</text>
    <text x="0" y="-64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="11" font-weight="bold">Repo archived</text>
    <text x="0" y="-48" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">GitHub read-only, npm/Docker deprecated</text>
    <line x1="0" y1="-36" x2="0" y2="-14" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Stop 3: Aug 31 -->
  <g transform="translate(710, 150)">
    <circle r="14" fill="#dc2626" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-95" y="-108" width="190" height="72" fill="#0f172a" rx="10"/>
    <text x="0" y="-84" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="11" font-weight="bold">Aug 31, 2026</text>
    <text x="0" y="-64" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="11" font-weight="bold">End of life</text>
    <text x="0" y="-48" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">No security patches, team gone</text>
    <line x1="0" y1="-36" x2="0" y2="-14" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Footer note -->
  <rect x="150" y="196" width="560" height="58" fill="#1e293b" rx="10"/>
  <text x="430" y="220" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="11" font-weight="bold">What still works after Aug 31, 2026:</text>
  <text x="430" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">Docker images and npm packages remain pullable (as of Oct 2026) — but the code is frozen forever.</text>
</svg>
