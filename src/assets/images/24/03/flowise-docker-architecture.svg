<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="url(#archBg2)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="40" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17" font-weight="bold">FlowiseAI Docker Compose stack (pinned 3.1.4)</text>

  <!-- Cloudflare Tunnel -->
  <g transform="translate(300, 62)">
    <rect width="260" height="64" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="240" height="44" fill="#f97316" rx="8"/>
    <text x="130" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Cloudflare Tunnel</text>
    <text x="130" y="47" text-anchor="middle" fill="#ffedd5" font-family="Arial" font-size="10">HTTPS → flowise.yourdomain.com</text>
  </g>

  <!-- Arrow: tunnel -> flowise -->
  <line x1="430" y1="126" x2="430" y2="172" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue2)"/>
  <text x="442" y="154" fill="#1d4ed8" font-family="Arial" font-size="10" font-weight="bold">port 5023</text>

  <!-- Compose boundary -->
  <rect x="40" y="180" width="780" height="330" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5" rx="14"/>
  <text x="430" y="205" text-anchor="middle" fill="#334155" font-family="Arial" font-size="14" font-weight="bold">docker-compose.yml</text>

  <!-- flowise container -->
  <g transform="translate(80, 230)">
    <rect width="300" height="150" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="280" height="130" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="260" height="30" fill="#3b82f6" rx="6"/>
    <text x="150" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">flowise — flowiseai/flowise:3.1.4</text>
    <text x="150" y="72" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">FINAL release — pin it, do not use :latest</text>
    <text x="150" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">healthcheck: curl /api/v1/ping</text>
    <text x="150" y="112" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="10">volume: ./flowiseai → /home/node/.flowise</text>
    <text x="150" y="130" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">non-root node user (uid 1000) — holds SECRETKEY_PATH</text>
  </g>

  <!-- flowise-db container -->
  <g transform="translate(500, 230)">
    <rect width="280" height="150" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="260" height="130" fill="#1e293b" rx="8"/>
    <rect x="20" y="20" width="240" height="30" fill="#059669" rx="6"/>
    <text x="140" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">flowise-db — postgres:17-alpine</text>
    <text x="140" y="72" text-anchor="middle" fill="#f1f5f9" font-family="Arial" font-size="10">healthcheck: pg_isready (gates startup)</text>
    <text x="140" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">stores users, chats, encrypted credentials</text>
    <text x="140" y="112" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="10">volume: ./flowise-db-data → /var/lib/postgresql/data</text>
    <text x="140" y="130" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">do not bump the Postgres major on an existing volume</text>
  </g>

  <!-- Arrow: flowise -> db (depends_on) -->
  <line x1="380" y1="290" x2="500" y2="290" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen2)"/>
  <text x="440" y="280" text-anchor="middle" fill="#047857" font-family="Arial" font-size="9" font-weight="bold">depends_on:</text>
  <text x="440" y="292" text-anchor="middle" fill="#047857" font-family="Arial" font-size="9" font-weight="bold">service_healthy</text>

  <!-- flowise-db-backup -->
  <g transform="translate(80, 415)">
    <rect width="300" height="75" fill="#0f172a" rx="12"/>
    <rect x="10" y="10" width="280" height="55" fill="#1e293b" rx="8"/>
    <rect x="20" y="18" width="260" height="22" fill="#d97706" rx="6"/>
    <text x="150" y="33" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold">flowise-db-backup (optional) — tiredofit/db-backup</text>
    <text x="150" y="56" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="10">pg_dump on a timer → ./backups (GZ + SHA1)</text>
  </g>

  <!-- Arrow: backup -> db -->
  <line x1="230" y1="415" x2="560" y2="380" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber2)"/>
  <text x="360" y="382" text-anchor="middle" fill="#b45309" font-family="Arial" font-size="9" font-weight="bold">dumps on interval</text>

  <!-- Backup rule box -->
  <rect x="500" y="415" width="280" height="75" fill="#7f1d1d" rx="10"/>
  <text x="640" y="440" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="11" font-weight="bold">Back up BOTH paths</text>
  <text x="640" y="460" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="9">pg_dump alone leaves API keys undecryptable —</text>
  <text x="640" y="475" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="9">the encryption key lives in the .flowise volume.</text>
</svg>
