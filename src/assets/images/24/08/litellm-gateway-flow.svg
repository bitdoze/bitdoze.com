<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="gwTitle gwDesc">
  <title id="gwTitle">LiteLLM gateway request flow</title>
  <desc id="gwDesc">Clients and agents send OpenAI-format requests to Traefik over TLS, Traefik forwards to the LiteLLM container on port 4000, and LiteLLM routes to OpenAI, Anthropic, or local Ollama. An optional Postgres container stores virtual keys, budgets and spend data.</desc>

  <defs>
    <linearGradient id="gwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="gwAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="gwArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <filter id="gwShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#gwBg)"/>
  <rect width="1200" height="8" fill="url(#gwAccent)"/>

  <text x="600" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#0F172A">LiteLLM gateway request flow</text>
  <text x="600" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">One OpenAI-format endpoint on :4000 in front of every LLM provider you use</text>

  <!-- clients -->
  <g filter="url(#gwShadow)">
    <rect x="60" y="170" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  </g>
  <text x="180" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Clients</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16.5" fill="#475569" text-anchor="middle">
    <text x="180" y="252">Apps &amp; scripts</text>
    <text x="180" y="280">Coding agents</text>
    <text x="180" y="308">Open WebUI</text>
  </g>

  <!-- arrow: clients -> traefik -->
  <line x1="300" y1="255" x2="388" y2="255" stroke="#6366F1" stroke-width="3" marker-end="url(#gwArrow)"/>
  <text x="344" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#4F46E5">HTTPS</text>

  <!-- traefik -->
  <g filter="url(#gwShadow)">
    <rect x="395" y="170" width="230" height="170" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  </g>
  <text x="510" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Traefik</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16.5" fill="#475569" text-anchor="middle">
    <text x="510" y="252">TLS &amp; routing</text>
    <text x="510" y="280">traefik-net</text>
    <text x="510" y="308">Port 4000</text>
  </g>

  <!-- arrow: traefik -> litellm -->
  <line x1="625" y1="255" x2="713" y2="255" stroke="#6366F1" stroke-width="3" marker-end="url(#gwArrow)"/>
  <text x="669" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#4F46E5">:4000</text>

  <!-- litellm -->
  <g filter="url(#gwShadow)">
    <rect x="720" y="150" width="280" height="210" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  </g>
  <text x="860" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0F172A">LiteLLM</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16.5" fill="#475569" text-anchor="middle">
    <text x="860" y="236">Unified OpenAI-format API</text>
    <text x="860" y="264">Master key + virtual keys</text>
    <text x="860" y="292">litellm_config.yaml</text>
    <text x="860" y="320">Spend tracking &amp; fallbacks</text>
  </g>

  <!-- providers -->
  <g filter="url(#gwShadow)">
    <rect x="60" y="470" width="240" height="130" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="395" y="470" width="230" height="130" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="720" y="470" width="280" height="130" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="180" y="515">OpenAI</text>
    <text x="510" y="515">Anthropic</text>
    <text x="860" y="515">Ollama (local)</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15.5" fill="#475569" text-anchor="middle">
    <text x="180" y="548">openai/gpt-5.6-terra</text>
    <text x="510" y="548">anthropic/claude-sonnet-5</text>
    <text x="860" y="548">ollama/llama3</text>
  </g>

  <!-- arrows: litellm -> providers -->
  <line x1="800" y1="360" x2="220" y2="462" stroke="#6366F1" stroke-width="2.5" marker-end="url(#gwArrow)" opacity="0.85"/>
  <line x1="860" y1="360" x2="540" y2="462" stroke="#6366F1" stroke-width="2.5" marker-end="url(#gwArrow)" opacity="0.85"/>
  <line x1="920" y1="360" x2="900" y2="462" stroke="#6366F1" stroke-width="2.5" marker-end="url(#gwArrow)" opacity="0.85"/>

  <!-- optional postgres -->
  <g>
    <rect x="1040" y="150" width="120" height="210" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <text x="1100" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#64748B">Postgres</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748B" text-anchor="middle">
    <text x="1100" y="268">optional</text>
    <text x="1100" y="290">virtual keys</text>
    <text x="1100" y="312">budgets</text>
    <text x="1100" y="334">spend logs</text>
  </g>
  <line x1="1000" y1="200" x2="1032" y2="200" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- legend -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">
    <text x="60" y="645">Solid arrows: request path. Dashed Postgres node: add for the Admin UI, virtual keys and spend tracking.</text>
  </g>
</svg>
