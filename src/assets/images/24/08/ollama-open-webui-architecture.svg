<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="traefikGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="webuiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.2"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4F46E5"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0891B2"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F172A">
    Ollama + Open WebUI on <tspan fill="url(#traefikGrad)">Docker Compose</tspan>
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B" font-weight="400">Two app containers, one shared network, no published ports</text>

  <!-- Browser -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">YOUR BROWSER</text>
    <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">HTTPS</text>
  </g>

  <!-- Browser -> Traefik -->
  <line x1="215" y1="325" x2="285" y2="325" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

  <!-- Traefik -->
  <g transform="translate(295, 255)">
    <rect x="0" y="0" width="185" height="140" rx="10" fill="url(#traefikGrad)" filter="url(#shadow)"/>
    <text x="92" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">TRAEFIK</text>
    <text x="92" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0E7FF">Reverse proxy</text>
    <text x="92" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0E7FF">entrypoint :443</text>
    <text x="92" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C7D2FE">joins traefik-net</text>
  </g>

  <!-- traefik-net group -->
  <rect x="545" y="130" width="595" height="465" rx="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" stroke-dasharray="8 6" opacity="0.95"/>
  <rect x="700" y="112" width="285" height="36" rx="18" fill="url(#traefikGrad)" opacity="0.95"/>
  <text x="842" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">traefik-net (external)</text>

  <!-- Traefik -> Open WebUI -->
  <line x1="485" y1="300" x2="625" y2="300" stroke="#0891B2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="555" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0891B2">Host rule</text>

  <!-- Open WebUI box -->
  <g transform="translate(635, 215)">
    <rect x="0" y="0" width="420" height="130" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="420" height="34" rx="10" fill="url(#webuiGrad)"/>
    <rect x="0" y="24" width="420" height="10" fill="url(#webuiGrad)"/>
    <text x="210" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">OPEN WEBUI CONTAINER</text>
    <text x="210" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">listens on internal port 8080</text>
    <text x="210" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">volume ./open-webui-local &#8594; /app/backend/data</text>
    <text x="210" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">chats, users, settings, webui.db</text>
  </g>

  <!-- no published ports badge on Open WebUI -->
  <rect x="1065" y="228" width="66" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="1098" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B91C1C">NO PORTS</text>

  <!-- Open WebUI -> Ollama -->
  <line x1="845" y1="350" x2="845" y2="420" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="860" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F766E">OLLAMA_BASE_URL http://ollama:11434</text>

  <!-- Ollama box -->
  <g transform="translate(635, 425)">
    <rect x="0" y="0" width="420" height="130" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="420" height="34" rx="10" fill="url(#ollamaGrad)"/>
    <rect x="0" y="24" width="420" height="10" fill="url(#ollamaGrad)"/>
    <text x="210" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">OLLAMA CONTAINER</text>
    <text x="210" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">listens on internal port 11434</text>
    <text x="210" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">volume ./ollama-local &#8594; /root/.ollama</text>
    <text x="210" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">model blobs (multi-GB each)</text>
  </g>

  <!-- no published ports badge on Ollama -->
  <rect x="1065" y="438" width="66" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="1098" y="453" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B91C1C">NO PORTS</text>

  <!-- Bottom note -->
  <text x="600" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">
    Only Traefik publishes a port (443). Both app containers are reachable solely on <tspan font-weight="700" fill="#4F46E5">traefik-net</tspan>.
  </text>
</svg>
