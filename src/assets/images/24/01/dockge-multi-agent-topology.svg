<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="url(#bg2)" stroke="#cbd5e1" stroke-width="2"/>

  <text x="450" y="36" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">Dockge multi-agent topology</text>

  <!-- Browser -->
  <g transform="translate(350, 55)">
    <rect width="200" height="70" fill="#ffffff" stroke="#475569" stroke-width="2" rx="12"/>
    <text x="100" y="30" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">Your browser</text>
    <text x="100" y="52" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">talks to the primary only</text>
  </g>
  <line x1="450" y1="125" x2="450" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="465" y="155" text-anchor="start" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="11">HTTPS + WebSocket :5001</text>

  <!-- Primary -->
  <g transform="translate(300, 175)">
    <rect width="300" height="110" fill="#0f172a" rx="14"/>
    <rect x="12" y="12" width="276" height="86" fill="#1e293b" rx="10"/>
    <rect x="30" y="26" width="240" height="32" fill="#3b82f6" rx="8"/>
    <text x="150" y="47" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">Primary Dockge (host A)</text>
    <text x="150" y="80" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="11">local stacks + agent connections &#183; :5001</text>
  </g>

  <!-- Lines to agents -->
  <line x1="380" y1="285" x2="200" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <line x1="520" y1="285" x2="700" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="255" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">agent link</text>
  <text x="645" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">agent link</text>

  <!-- Agent B -->
  <g transform="translate(70, 360)">
    <rect width="260" height="130" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
    <text x="130" y="30" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">Dockge agent (host B)</text>
    <text x="130" y="58" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">/var/run/docker.sock</text>
    <text x="130" y="78" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">its own /opt/stacks</text>
    <text x="130" y="104" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10">keep the agent port off the public</text>
    <text x="130" y="118" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10">internet &#8212; reachable by the primary</text>
  </g>

  <!-- Agent C -->
  <g transform="translate(570, 360)">
    <rect width="260" height="130" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
    <text x="130" y="30" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">Dockge agent (host C)</text>
    <text x="130" y="58" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">/var/run/docker.sock</text>
    <text x="130" y="78" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">its own /opt/stacks</text>
    <text x="130" y="104" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10">same image tag as the primary</text>
    <text x="130" y="118" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10">louislam/dockge:1</text>
  </g>

  <!-- Caption -->
  <text x="450" y="535" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">The primary proxies every action to the agents. Agents do not need their own public DNS or TLS.</text>
</svg>
