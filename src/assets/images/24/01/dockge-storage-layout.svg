<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">Where Dockge stores everything</text>

  <!-- Dockge container (center) -->
  <g transform="translate(315, 120)">
    <rect width="270" height="130" fill="#0f172a" rx="14"/>
    <rect x="12" y="12" width="246" height="106" fill="#1e293b" rx="10"/>
    <rect x="28" y="28" width="214" height="34" fill="#3b82f6" rx="8"/>
    <text x="135" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">dockge (louislam/dockge:1)</text>
    <text x="135" y="86" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="12">Web UI :5001 &#183; compose runner</text>
  </g>

  <!-- Left: docker.sock -->
  <g transform="translate(50, 130)">
    <rect width="200" height="110" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="12"/>
    <text x="100" y="32" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">/var/run/docker.sock</text>
    <text x="100" y="58" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11">host Docker socket</text>
    <text x="100" y="80" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11">root-equivalent access</text>
    <text x="100" y="98" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="10">to the whole host</text>
  </g>
  <line x1="250" y1="185" x2="315" y2="185" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="282" y="174" text-anchor="middle" fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="10">mount</text>

  <!-- Right: data dir -->
  <g transform="translate(650, 130)">
    <rect width="200" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="12"/>
    <text x="100" y="30" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">./data &#8594; /app/data</text>
    <text x="100" y="54" text-anchor="middle" fill="#064e3b" font-family="Arial, Helvetica, sans-serif" font-size="11">SQLite DB: users,</text>
    <text x="100" y="72" text-anchor="middle" fill="#064e3b" font-family="Arial, Helvetica, sans-serif" font-size="11">settings, agent list</text>
    <text x="100" y="96" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">back this up</text>
  </g>
  <line x1="585" y1="185" x2="650" y2="185" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="617" y="174" text-anchor="middle" fill="#059669" font-family="Arial, Helvetica, sans-serif" font-size="10">volume</text>

  <!-- Bottom: stacks dir -->
  <g transform="translate(315, 330)">
    <rect width="270" height="115" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
    <text x="135" y="32" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">/opt/stacks &#8594; /opt/stacks</text>
    <text x="135" y="58" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">one subdirectory per stack:</text>
    <text x="135" y="76" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="11">compose.yaml + .env</text>
    <text x="135" y="100" text-anchor="middle" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">back this up</text>
  </g>
  <line x1="450" y1="250" x2="450" y2="330" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="462" y="295" text-anchor="start" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="10">volume</text>

  <!-- Caption -->
  <text x="450" y="495" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Containers and images are disposable. Back up both data dirs &#8212; the SQLite DB and the stacks directory.</text>
  <text x="450" y="518" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">Paths must match on both sides of each volume mount.</text>
</svg>
