<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="zoxTitle zoxDesc">
  <title id="zoxTitle">How zoxide works</title>
  <desc id="zoxDesc">Four-step diagram: the shell hook records every directory you visit, zoxide stores a frecency score in db.zo, the z and zi commands query that score, and the shell jumps to the best match.</desc>

  <defs>
    <linearGradient id="zoxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="zoxAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="zoxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <filter id="zoxShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#zoxBg)"/>
  <rect width="1200" height="8" fill="url(#zoxAccent)"/>

  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">How zoxide works</text>
  <text x="600" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">Every cd teaches it something. Every z jump uses the scores it learned.</text>

  <!-- Row 1 -->
  <g filter="url(#zoxShadow)">
    <rect x="80" y="150" width="480" height="180" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="640" y="150" width="480" height="180" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="80" y="415" width="480" height="180" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="640" y="415" width="480" height="180" rx="14" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="2"/>
  </g>

  <!-- badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="110" y="172" width="44" height="34" rx="8" fill="#4F46E5"/>
    <text x="132" y="195">1</text>
    <rect x="670" y="172" width="44" height="34" rx="8" fill="#4F46E5"/>
    <text x="692" y="195">2</text>
    <rect x="110" y="437" width="44" height="34" rx="8" fill="#0891B2"/>
    <text x="132" y="460">3</text>
    <rect x="670" y="437" width="44" height="34" rx="8" fill="#0891B2"/>
    <text x="692" y="460">4</text>
  </g>

  <!-- step titles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A">
    <text x="175" y="196">Shell hook</text>
    <text x="735" y="196">db.zo database</text>
    <text x="175" y="461">z / zi query</text>
    <text x="735" y="461">Jump</text>
  </g>

  <!-- step bodies -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#334155">
    <text x="110" y="245">zoxide init adds a hook to your shell.</text>
    <text x="110" y="273">Each directory you enter is recorded,</text>
    <text x="110" y="301">usually on every prompt.</text>

    <text x="670" y="245">Every path gets a frecency score:</text>
    <text x="670" y="273">frequency x recency. Default location</text>
    <text x="670" y="301">on Linux: ~/.local/share/zoxide/db.zo</text>

    <text x="110" y="510">z &lt;keyword&gt; jumps to the best score.</text>
    <text x="110" y="538">zi opens fzf so you can pick a match</text>
    <text x="110" y="566">interactively when the guess is wrong.</text>

    <text x="670" y="510">The shell lands in the winning</text>
    <text x="670" y="538">directory. Exact paths still work</text>
    <text x="670" y="566">like plain cd.</text>
  </g>

  <!-- arrows: 1 -> 2 (right), 2 -> 3 (down-left wrap), 3 -> 4 (right) -->
  <g stroke="#6366F1" stroke-width="3" fill="none" marker-end="url(#zoxArrow)">
    <line x1="575" y1="240" x2="625" y2="240"/>
    <path d="M 880 330 L 880 375 L 320 375 L 320 405" marker-end="url(#zoxArrow)"/>
    <line x1="575" y1="505" x2="625" y2="505"/>
  </g>
</svg>
