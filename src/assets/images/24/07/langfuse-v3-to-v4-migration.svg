<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="backupGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="imgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cutGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <text x="600" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
    <tspan fill="#4F46E5">Langfuse v3 → v4</tspan> migration timeline
  </text>
  <text x="600" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Pause anytime before cutover — once you cut over, rollback needs a schema rewind or a restore</text>

  <!-- Stage 0: Backup -->
  <g transform="translate(45, 130)" filter="url(#shadow)">
    <rect width="245" height="185" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="245" height="44" rx="16" fill="url(#backupGrad)"/>
    <rect y="22" width="245" height="22" fill="url(#backupGrad)"/>
    <text x="122" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">0. Full backup</text>
    <text x="122" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Postgres + ClickHouse</text>
    <text x="122" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">+ MinIO + .env</text>
    <text x="122" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#DC2626" font-weight="700">Mandatory</text>
    <text x="122" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">v3 image rollback after</text>
    <text x="122" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">step 2 is not possible</text>
  </g>

  <!-- Stage 1: ClickHouse -->
  <g transform="translate(335, 130)" filter="url(#shadow)">
    <rect width="245" height="185" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="245" height="44" rx="16" fill="url(#chGrad)"/>
    <rect y="22" width="245" height="22" fill="url(#chGrad)"/>
    <text x="122" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1. ClickHouse ≥ 25.12</text>
    <text x="122" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Bump the ClickHouse image</text>
    <text x="122" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">while still running v3</text>
    <text x="122" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B45309" font-weight="700">Safe to pause here</text>
    <text x="122" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">v3 works with current</text>
    <text x="122" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">ClickHouse (26.4 rec.)</text>
  </g>

  <!-- Stage 2: Images :4 -->
  <g transform="translate(625, 130)" filter="url(#shadow)">
    <rect width="245" height="185" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="245" height="44" rx="16" fill="url(#imgGrad)"/>
    <rect y="22" width="245" height="22" fill="url(#imgGrad)"/>
    <text x="122" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2. Server images :4</text>
    <text x="122" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Migrations run on startup;</text>
    <text x="122" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">historic backfill in background</text>
    <text x="122" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4F46E5" font-weight="700">Plan ~3× ClickHouse disk</text>
    <text x="122" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Backfill is resumable,</text>
    <text x="122" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">runs newest-first</text>
  </g>

  <!-- Stage 3: Cutover -->
  <g transform="translate(915, 130)" filter="url(#shadow)">
    <rect width="245" height="185" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="245" height="44" rx="16" fill="url(#cutGrad)"/>
    <rect y="22" width="245" height="22" fill="url(#cutGrad)"/>
    <text x="122" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3. Cutover</text>
    <text x="122" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Upgrade SDKs: Python ≥ 4.7.0,</text>
    <text x="122" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">JS/TS ≥ 5.4.0 for direct write</text>
    <text x="122" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#DC2626" font-weight="700">Point of no return</text>
    <text x="122" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Old clients rejected after</text>
    <text x="122" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">cutover completes</text>
  </g>

  <!-- Arrows -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="292" y1="222" x2="327" y2="222" marker-end="url(#arrow)"/>
    <line x1="582" y1="222" x2="617" y2="222" marker-end="url(#arrow)"/>
    <line x1="872" y1="222" x2="907" y2="222" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom markers -->
  <text x="167" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#DC2626" font-weight="700">Back up before continuing</text>
  <text x="747" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4F46E5" font-weight="700">Safe to pause before step 3</text>
  <text x="1037" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#DC2626" font-weight="700">Rollback = restore backup</text>
</svg>
