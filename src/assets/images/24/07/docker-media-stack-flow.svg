<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="prowlarrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="arrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="dlGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="playerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bazarrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="seerrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="absGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)"/>

  <text x="500" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A">
    Docker <tspan fill="#4F46E5">media stack</tspan> in 2026
  </text>
  <text x="500" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Prowlarr configures indexers once — *arr apps grab releases — downloads land on disk — Jellyfin or Plex plays the library</text>

  <!-- Prowlarr -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="210" height="110" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="210" height="38" rx="16" fill="url(#prowlarrGrad)"/>
    <rect y="18" width="210" height="20" fill="url(#prowlarrGrad)"/>
    <text x="105" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Prowlarr</text>
    <text x="105" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Indexers configured once</text>
    <text x="105" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">linuxserver/prowlarr</text>
  </g>

  <!-- Sonarr / Radarr -->
  <g transform="translate(310, 100)" filter="url(#shadow)">
    <rect width="230" height="110" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="230" height="38" rx="16" fill="url(#arrGrad)"/>
    <rect y="18" width="230" height="20" fill="url(#arrGrad)"/>
    <text x="115" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Sonarr / Radarr</text>
    <text x="115" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">TV + movies: grab releases</text>
    <text x="115" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">linuxserver/sonarr · linuxserver/radarr</text>
  </g>

  <!-- Downloaders -->
  <g transform="translate(620, 100)" filter="url(#shadow)">
    <rect width="300" height="110" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="300" height="38" rx="16" fill="url(#dlGrad)"/>
    <rect y="18" width="300" height="20" fill="url(#dlGrad)"/>
    <text x="150" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">qBittorrent + Gluetun / SABnzbd</text>
    <text x="150" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Torrents exit via VPN — or Usenet</text>
    <text x="150" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">network_mode: service:gluetun</text>
  </g>

  <!-- Arrows row 1 -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="252" y1="155" x2="302" y2="155" marker-end="url(#arrow)"/>
    <line x1="542" y1="155" x2="612" y2="155" marker-end="url(#arrow)"/>
    <path d="M 425 212 L 425 268" marker-end="url(#arrow)"/>
    <path d="M 770 212 L 770 245 L 560 245 L 560 268" marker-end="url(#arrow)"/>
  </g>
  <text x="277" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">indexers</text>
  <text x="577" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">releases</text>
  <text x="445" y="242" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">library on disk</text>

  <!-- Jellyfin / Plex -->
  <g transform="translate(315, 270)" filter="url(#shadow)">
    <rect width="270" height="110" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="270" height="38" rx="16" fill="url(#playerGrad)"/>
    <rect y="18" width="270" height="20" fill="url(#playerGrad)"/>
    <text x="135" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Jellyfin / Plex</text>
    <text x="135" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Play the library (Jellyfin: free remote)</text>
    <text x="135" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">jellyfin/jellyfin · linuxserver/plex</text>
  </g>

  <!-- Side inputs -->
  <g transform="translate(60, 420)" filter="url(#shadow)">
    <rect width="180" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="180" height="32" rx="14" fill="url(#bazarrGrad)"/>
    <rect y="16" width="180" height="16" fill="url(#bazarrGrad)"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Bazarr</text>
    <text x="90" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Subtitles for *arr</text>
  </g>

  <g transform="translate(280, 420)" filter="url(#shadow)">
    <rect width="190" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="190" height="32" rx="14" fill="url(#seerrGrad)"/>
    <rect y="16" width="190" height="16" fill="url(#seerrGrad)"/>
    <text x="95" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Jellyseerr</text>
    <text x="95" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Family requests (Overseerr archived)</text>
  </g>

  <g transform="translate(510, 420)" filter="url(#shadow)">
    <rect width="200" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="200" height="32" rx="14" fill="url(#absGrad)"/>
    <rect y="16" width="200" height="16" fill="url(#absGrad)"/>
    <text x="100" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Audiobookshelf</text>
    <text x="100" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Audiobooks + podcasts</text>
  </g>

  <g transform="translate(750, 420)" filter="url(#shadow)">
    <rect width="190" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="190" height="32" rx="14" fill="url(#navGrad)"/>
    <rect y="16" width="190" height="16" fill="url(#navGrad)"/>
    <text x="95" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Navidrome</text>
    <text x="95" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Music (Subsonic apps)</text>
  </g>

  <!-- Arrows up into the player -->
  <g stroke="#64748B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 150 418 L 150 395 L 360 395 L 360 386" marker-end="url(#arrowUp)"/>
    <path d="M 375 418 L 375 386" marker-end="url(#arrowUp)"/>
    <path d="M 610 418 L 610 395 L 520 395 L 520 386" marker-end="url(#arrowUp)"/>
    <path d="M 845 418 L 845 395 L 560 395 L 560 386" marker-end="url(#arrowUp)"/>
  </g>
</svg>
