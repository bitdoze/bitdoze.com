<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="minioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>

  <text x="600" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
    <tspan fill="#4F46E5">Langfuse v4</tspan> self-hosted architecture
  </text>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748B">Identical to v3: web, worker, PostgreSQL, ClickHouse, Redis, S3/MinIO — no new components</text>

  <!-- Your apps -->
  <g transform="translate(50, 130)" filter="url(#shadow)">
    <rect width="210" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="210" height="40" rx="16" fill="url(#appGrad)"/>
    <rect y="20" width="210" height="20" fill="url(#appGrad)"/>
    <text x="105" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Your AI apps</text>
    <text x="105" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">LLM SDKs, LangChain,</text>
    <text x="105" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">LiteLLM, Flowise, agents</text>
    <text x="105" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">OTEL / HTTP ingestion</text>
  </g>

  <!-- langfuse-web -->
  <g transform="translate(360, 130)" filter="url(#shadow)">
    <rect width="260" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="260" height="40" rx="16" fill="url(#webGrad)"/>
    <rect y="20" width="260" height="20" fill="url(#webGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">langfuse-web :5061</text>
    <text x="130" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">UI + public APIs</text>
    <text x="130" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">ingest endpoint, auth</text>
    <text x="130" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">image: langfuse/langfuse:4</text>
  </g>

  <!-- langfuse-worker -->
  <g transform="translate(720, 130)" filter="url(#shadow)">
    <rect width="260" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="260" height="40" rx="16" fill="url(#workerGrad)"/>
    <rect y="20" width="260" height="20" fill="url(#workerGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">langfuse-worker :3030</text>
    <text x="130" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Async event processing</text>
    <text x="130" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">background jobs, backfill</text>
    <text x="130" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">image: langfuse/langfuse-worker:4</text>
  </g>

  <!-- Arrows: apps -> web -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="262" y1="190" x2="352" y2="190" marker-end="url(#arrow)"/>
  </g>
  <text x="307" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">traces</text>

  <!-- Arrow: web -> worker (via queue label) -->
  <g stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="622" y1="175" x2="712" y2="175" marker-end="url(#arrow)"/>
  </g>
  <text x="667" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">queue</text>

  <!-- Bottom row -->
  <!-- PostgreSQL -->
  <g transform="translate(50, 420)" filter="url(#shadow)">
    <rect width="240" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="240" height="40" rx="16" fill="url(#pgGrad)"/>
    <rect y="20" width="240" height="20" fill="url(#pgGrad)"/>
    <text x="120" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">PostgreSQL 17</text>
    <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Users, orgs, projects,</text>
    <text x="120" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">prompts, API keys</text>
    <text x="120" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">./langfuse-db</text>
  </g>

  <!-- Redis -->
  <g transform="translate(335, 420)" filter="url(#shadow)">
    <rect width="240" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="240" height="40" rx="16" fill="url(#redisGrad)"/>
    <rect y="20" width="240" height="20" fill="url(#redisGrad)"/>
    <text x="120" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Redis 7</text>
    <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Ingest queue + cache</text>
    <text x="120" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">rebuildable, non-critical</text>
    <text x="120" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">langfuse_redis_data</text>
  </g>

  <!-- ClickHouse -->
  <g transform="translate(620, 420)" filter="url(#shadow)">
    <rect width="240" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="240" height="40" rx="16" fill="url(#chGrad)"/>
    <rect y="20" width="240" height="20" fill="url(#chGrad)"/>
    <text x="120" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">ClickHouse 25.12</text>
    <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">events_full + events_core</text>
    <text x="120" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">traces = root observations</text>
    <text x="120" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">./langfuse-clickhouse</text>
  </g>

  <!-- MinIO -->
  <g transform="translate(905, 420)" filter="url(#shadow)">
    <rect width="240" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="240" height="40" rx="16" fill="url(#minioGrad)"/>
    <rect y="20" width="240" height="20" fill="url(#minioGrad)"/>
    <text x="120" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">MinIO (S3)</text>
    <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Event payloads (events/)</text>
    <text x="120" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Media blobs (media/)</text>
    <text x="120" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">./langfuse-minio</text>
  </g>

  <!-- Arrows web/worker down to data stores -->
  <g stroke="#64748B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="420" y1="252" x2="175" y2="412" marker-end="url(#arrow)"/>
    <line x1="470" y1="252" x2="440" y2="412" marker-end="url(#arrow)"/>
    <line x1="800" y1="252" x2="730" y2="412" marker-end="url(#arrow)"/>
    <line x1="900" y1="252" x2="1010" y2="412" marker-end="url(#arrow)"/>
    <line x1="760" y1="252" x2="500" y2="412" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>
  <text x="255" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">config</text>
  <text x="430" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">enqueue</text>
  <text x="620" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">dequeue</text>
  <text x="780" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">write events</text>
  <text x="985" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">upload blobs</text>

  <text x="600" y="615" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Ingest: SDKs POST events → Redis queue → worker batches into ClickHouse + S3</text>
</svg>
